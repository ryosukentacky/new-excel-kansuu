ight:700;line-height:1.7}fieldset label{display:block;padding:10px 8px;line-height:1.6;border-radius:8px}fieldset label:hover{background:#edf4fb}.feedback{padding:12px;line-height:1.8;background:#edf4fb;border-radius:8px}.correct{background:#e4f6ec;color:#16583d}.incorrect{background:#fff0e6;color:#7a4519}.footer{color:#5e758e;font-size:.85rem;line-height:1.8;margin-top:22px}.dark{background:#101d2c;color:#e4edf8}.dark .panel,.dark button,.dark select,.dark input,.dark .sim-controls>label{background:#1e3046;color:#e4edf8;border-color:#425b75}.dark .section-box,.dark pre,.dark code,.dark .source-static,.dark th{background:#223b54;color:#e4edf8}.dark #reading h2{color:#9ed4fa}.dark output{background:#184b3d;color:#c1f0dc}.dark .muted,.dark .note,.dark .footer{color:#afc4d8}.dark fieldset label:hover{background:#2b435d}.dark .source-static svg text{fill:#264968}@media(max-width:600px){header{padding:22px 14px}h1{font-size:1.4rem}main{padding:14px 10px 45px}.panel{padding:17px 13px}.card-top{flex-wrap:wrap}#word{font-size:1.45rem}.toolbar>input{flex-basis:100%;min-width:0}.toolbar select{max-width:100%}.actions{justify-content:start}#tabs button{min-width:60px}.section-box{padding:14px}.sim-controls>label{min-width:0;flex-basis:100%}th,td{padding:7px 9px}.source-static{padding:10px}}</style></head><body><header><div><h1>Excel関数｜原本収録カード</h1><p>10項目の解説・各3問・操作教材。A/B/C/Dで理解を深めます。</p></div></header><main><div class="toolbar"><input id="search" type="search" placeholder="関数名・説明を検索" aria-label="カード検索"><select id="category" aria-label="カテゴリ"><option value="">全カテゴリ</option><option>検索・参照</option><option>条件分岐</option><option>条件付き集計</option><option>エラー処理</option><option>件数集計</option><option>文字列</option></select><select id="filter" aria-label="学習フィルター"><option value="all">すべて</option><option value="fav">お気に入り</option><option value="todo">未学習</option><option value="wrong">間違えた問題</option></select><button id="theme">夜間表示</button></div><p id="count" class="muted"></p><div class="navigation"><button id="prev">← 前</button><input id="position" type="range" min="1" max="10" value="1" aria-label="カード選択"><span id="position-label"></span><button id="next">次 →</button></div><article class="panel"><div class="card-top"><div><span id="category-label"></span><h2 id="word"></h2></div><div class="actions"><button id="fav">☆ お気に入り</button><button id="done">□ 学習済みにする</button></div></div><div id="tabs" aria-label="表示区分"></div><section id="reading"></section><section id="simulator" class="section-box" hidden></section><section id="quiz" class="section-box"><h2>理解確認｜3問</h2><div id="questions"></div><p id="score"></p><button id="retry">再挑戦</button></section></article><p class="footer">情報源：添付された「VLOOKUP関数解説（2026-10-27）」の最初の10解説。書き出し原文も収録しています。操作教材と補助図解はWeb用に実装したものです。原本の書き出し段階で欠けた数式・画像の完全復元を保証するものではありません。</p></main><script id="source-data" type="application/json">[{"name":"VLOOKUP","original":"\u003cp># ① VLOOKUP関数（ブイルックアップ関数）\u003c/p>\u003cp>&lt;text color=\"secondary\" size=\"sm\"&gt;Excel関数｜検索・参照&lt;/text&gt;\u003c/p>\u003cp>## A｜要点：何をする関数？\u003c/p>\u003cp>「先輩、VLOOKUP関数はExcelで非常によく使う関数です。特に、商品コードや社員番号から必要な情報を探すときに便利なんですよ。」\u003c/p>\u003cp>**VLOOKUP関数とは、表の左端の列から指定した値を探し、同じ行にある別の列の情報を取り出す関数です。**\u003c/p>\u003cp>例えば、商品コード「102」を入力するだけで、商品名や価格を自動表示できます。\u003c/p>\u003cp>&lt;box border radius=\"lg\" padding={3} gap={2}&gt;\u003cbr>  &lt;text color=\"secondary\" weight=\"medium\" size=\"xs\"&gt;商品マスタ&lt;/text&gt;\u003cbr>  | A列：商品コード | B列：商品名 | C列：価格 |\u003cbr>  |---|---|---|\u003cbr>  | 101 | りんご | 150円 |\u003cbr>  | **102** | **みかん** | **100円** |\u003cbr>  | 103 | ぶどう | 300円 |\u003c/p>\u003cp>  &lt;row align=\"center\" justify=\"center\" gap={2}&gt;\u003cbr>    &lt;box background=\"surface-secondary\" radius=\"md\" padding={2} flex=\"1\" align=\"center\" gap={1}&gt;\u003cbr>      &lt;text color=\"secondary\" size=\"xs\"&gt;検索する値&lt;/text&gt;\u003cbr>      **102**\u003cbr>    &lt;/box&gt;\u003cbr>    &lt;icon name=\"arrow-right\" color=\"success\" size=\"lg\"/&gt;\u003cbr>    &lt;box background=\"rgba(22,163,74,0.09)\" radius=\"md\" padding={2} flex=\"1\" align=\"center\" gap={1}&gt;\u003cbr>      &lt;text color=\"secondary\" size=\"xs\"&gt;取得した結果&lt;/text&gt;\u003cbr>      &lt;title color=\"success\" size=\"lg\"&gt;みかん&lt;/title&gt;\u003cbr>    &lt;/box&gt;\u003cbr>  &lt;/row&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>「つまり、先輩が商品コードだけ入力すれば、Excelが対応する商品名を探してくれるんです。」\u003c/p>\u003cp>## B｜詳しい解説：どういう仕組み？\u003c/p>\u003cp>基本の書き方はこちらです。\u003c/p>\u003cp>「4つの引数がありますけど、順番に意味を理解すれば難しくありません。」\u003c/p>\u003cp>| 引数 | 意味 |\u003cbr>|---|---|\u003cbr>| 検索値 | 何を探す？ |\u003cbr>| 範囲 | どの表から探す？ |\u003cbr>| 列番号 | 左から何列目の情報を取る？ |\u003cbr>| 検索方法 | 完全一致か近似一致か？ |\u003c/p>\u003cp>例えば、\u003c/p>\u003cp>この式では、次の順番で処理されます。\u003c/p>\u003cp>&lt;box gap={1} align=\"center\"&gt;\u003cbr>  &lt;box border radius=\"md\" padding={3} width=\"100%\" align=\"center\" gap={1}&gt;\u003cbr>    **① 検索値：102**\u003c/p>\u003cp>    &lt;text size=\"sm\"&gt;商品コード102を探します。&lt;/text&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;icon name=\"arrow-down\" color=\"tertiary\"/&gt;\u003cbr>  &lt;box border radius=\"md\" padding={3} width=\"100%\" align=\"center\" gap={1}&gt;\u003cbr>    **② 範囲：A2:C4**\u003c/p>\u003cp>    &lt;text size=\"sm\"&gt;この範囲の一番左のA列を検索します。&lt;/text&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;icon name=\"arrow-down\" color=\"tertiary\"/&gt;\u003cbr>  &lt;box border radius=\"md\" padding={3} width=\"100%\" align=\"center\" gap={1}&gt;\u003cbr>    **③ 列番号：2**\u003c/p>\u003cp>    &lt;text size=\"sm\"&gt;見つかった行の左から2列目、B列を取り出します。&lt;/text&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;icon name=\"arrow-down\" color=\"tertiary\"/&gt;\u003cbr>  &lt;box background=\"rgba(22,163,74,0.07)\" border={{size:1,color:\"success\"}} radius=\"md\" padding={3} width=\"100%\" align=\"center\" gap={1}&gt;\u003cbr>    **④ FALSE：完全一致**\u003c/p>\u003cp>    &lt;text size=\"sm\"&gt;102と完全に一致する行だけを採用します。&lt;/text&gt;\u003cbr>    &lt;title color=\"success\" size=\"lg\"&gt;結果：みかん&lt;/title&gt;\u003cbr>  &lt;/box&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>「ここで先輩、注意してほしいことが3つあります。」\u003c/p>\u003cp>- VLOOKUPは指定範囲の**一番左の列**を検索します。\u003cbr>- 列番号はExcel全体の列番号ではなく、指定範囲の左端から数えます。\u003cbr>- `FALSE`は完全一致、`TRUE`は近似一致です。通常の商品コードや社員番号の検索には`FALSE`を使います。\u003c/p>\u003cp>なお、検索方法を省略すると近似一致になるため、意図しない結果を避けるには`FALSE`を明示するのが基本です。\u003c/p>\u003cp>## C｜イメージ理解：辞書を引く感覚\u003c/p>\u003cp>「先輩、VLOOKUPは辞書のようなものだと思ってください。」\u003c/p>\u003cp>辞書で言葉を探すとき、まず見出し語を探して、その横にある意味を読みますよね。\u003c/p>\u003cp>VLOOKUPも同じです。\u003c/p>\u003cp>**商品コードを探す → その行を見つける → 横にある商品名を読む**\u003c/p>\u003cp>「ただし、普通の辞書と違って、VLOOKUPは検索範囲の左端から探すという制約があります。ここを忘れないでくださいね。」\u003c/p>\u003cp>## D｜具体例：実際に操作してみましょう\u003c/p>\u003cp>次の表を使って、VLOOKUP関数を試してみましょう。\u003c/p>\u003cp>{@body const items=[{id:\"101\",name:\"りんご\",price:150},{id:\"102\",name:\"みかん\",price:100},{id:\"103\",name:\"ぶどう\",price:300}]}\u003cbr>{@body const [code,setCode]=DIL.useState(\"102\")}\u003cbr>{@body const [col,setCol]=DIL.useState(\"2\")}\u003cbr>{@body const found=items.find(x=&gt;x.id===code)}\u003cbr>{@body const result=found?(col===\"2\"?found.name:found.price+\"円\"):\"#N/A\"}\u003cbr>&lt;box border radius=\"xl\" padding={3} gap={3}&gt;\u003cbr>  &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>    **VLOOKUP練習シミュレーター**\u003cbr>    &lt;badge color=\"secondary\"&gt;操作できます&lt;/badge&gt;\u003cbr>  &lt;/row&gt;\u003cbr>  &lt;text color=\"secondary\" size=\"xs\"&gt;Excelの表 A1:C4&lt;/text&gt;\u003cbr>  &lt;table&gt;\u003cbr>    &lt;table-row&gt;&lt;table-cell width=\"12%\"&gt; &lt;/table-cell&gt;&lt;table-cell&gt;A&lt;/table-cell&gt;&lt;table-cell&gt;B&lt;/table-cell&gt;&lt;table-cell&gt;C&lt;/table-cell&gt;&lt;/table-row&gt;\u003cbr>    &lt;table-row&gt;&lt;table-cell&gt;1&lt;/table-cell&gt;&lt;table-cell&gt;商品コード&lt;/table-cell&gt;&lt;table-cell&gt;商品名&lt;/table-cell&gt;&lt;table-cell&gt;価格&lt;/table-cell&gt;&lt;/table-row&gt;\u003cbr>    {#each items as it,i}\u003cbr>      &lt;table-row&gt;\u003cbr>        &lt;table-cell&gt;{i+2}&lt;/table-cell&gt;\u003cbr>        &lt;table-cell&gt;&lt;text color={it.id===code?\"success\":\"default\"} weight={it.id===code?\"semibold\":\"normal\"}&gt;{it.id}&lt;/text&gt;&lt;/table-cell&gt;\u003cbr>        &lt;table-cell&gt;{it.name}&lt;/table-cell&gt;\u003cbr>        &lt;table-cell&gt;{it.price}&lt;/table-cell&gt;\u003cbr>      &lt;/table-row&gt;\u003cbr>    {/each}\u003cbr>  &lt;/table&gt;\u003cbr>  &lt;text weight=\"medium\" size=\"sm\"&gt;① 検索する商品コードを選択&lt;/text&gt;\u003cbr>  &lt;radio-group direction=\"row\" value={code} onChange={setCode}&gt;\u003cbr>    &lt;radio value=\"101\"&gt;101&lt;/radio&gt;\u003cbr>    &lt;radio value=\"102\"&gt;102&lt;/radio&gt;\u003cbr>    &lt;radio value=\"103\"&gt;103&lt;/radio&gt;\u003cbr>    &lt;radio value=\"999\"&gt;999&lt;/radio&gt;\u003cbr>  &lt;/radio-group&gt;\u003cbr>  &lt;text weight=\"medium\" size=\"sm\"&gt;② 取り出す列を選択&lt;/text&gt;\u003cbr>  &lt;radio-group direction=\"col\" value={col} onChange={setCol}&gt;\u003cbr>    &lt;radio value=\"2\"&gt;2列目：商品名&lt;/radio&gt;\u003cbr>    &lt;radio value=\"3\"&gt;3列目：価格&lt;/radio&gt;\u003cbr>  &lt;/radio-group&gt;\u003cbr>  &lt;box background=\"surface-secondary\" radius=\"lg\" padding={3} gap={2}&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"xs\"&gt;入力される数式&lt;/text&gt;\u003cbr>    &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>      &lt;text weight=\"medium\" size=\"sm\"&gt;{\"=VLOOKUP(\"+code+\",A2:C4,\"+col+\",FALSE)\"}&lt;/text&gt;\u003cbr>      &lt;button size=\"xs\" variant=\"outline\" color=\"secondary\" onClick={()=&gt;GenUI.copy(\"=VLOOKUP(\"+code+\",A2:C4,\"+col+\",FALSE)\")}&gt;&lt;icon name=\"copy\" size=\"xs\"/&gt; コピー&lt;/button&gt;\u003cbr>    &lt;/row&gt;\u003cbr>    &lt;divider color=\"subtle\"/&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"xs\"&gt;計算結果&lt;/text&gt;\u003cbr>    &lt;title size=\"xl\" color={found?\"success\":\"danger\"}&gt;{result}&lt;/title&gt;\u003cbr>    &lt;caption&gt;{found?\"商品コード\"+code+\"の行から\"+(col===\"2\"?\"商品名\":\"価格\")+\"を取り出しました。\":\"999に一致する商品コードがないため、#N/Aになります。\"}&lt;/caption&gt;\u003cbr>  &lt;/box&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>「先輩、商品コードを101や103に変えてみてください。取り出す列を3にすれば、商品名ではなく価格が表示されます。」\u003c/p>\u003cp>### 実務で重要：絶対参照\u003c/p>\u003cp>大量の行にVLOOKUPをコピーするときは、検索範囲を固定することが大切です。\u003c/p>\u003cp>`$A$2:$C$4`と書けば、数式を下にコピーしても検索範囲がずれません。\u003c/p>\u003cp>## 理解確認：3問\u003c/p>\u003cp>{@body const qs=[{q:\"VLOOKUP関数が検索するのはどこ？\",opts:[\"指定範囲の一番左の列\",\"指定範囲の一番右の列\",\"すべての列を同時に検索\"],a:0,exp:\"検索値は指定範囲の左端列で探します。取り出す情報はその右側の列から選びます。\"},{q:\"列番号を3にしたら何が取り出される？\",opts:[\"ExcelのC列に固定される\",\"指定範囲の左から3列目\",\"3行目の値\"],a:1,exp:\"列番号は指定した範囲の左端を1として数えます。範囲がB:Dなら3はD列です。\"},{q:\"商品コードを完全一致で探すには？\",opts:[\"TRUE\",\"省略する\",\"FALSE\"],a:2,exp:\"FALSEは完全一致です。TRUEや省略では近似一致となり、並び順によって想定外の結果になることがあります。\"}]}\u003cbr>{@body const [answers,setAnswers]=DIL.useState({})}\u003cbr>&lt;box border radius=\"lg\" padding={3} gap={3}&gt;\u003cbr>  {#each qs as q,i}\u003cbr>    &lt;box key={i} gap={2}&gt;\u003cbr>      **Q{i+1}. {q.q}**\u003cbr>      &lt;radio-group direction=\"col\" value={answers[i]===undefined?\"\":String(answers[i])} onChange={v=&gt;setAnswers(p=&gt;({...p,[i]:Number(v)}))}&gt;\u003cbr>        {#each q.opts as opt,j}\u003cbr>          &lt;radio value={String(j)}&gt;{opt}&lt;/radio&gt;\u003cbr>        {/each}\u003cbr>      &lt;/radio-group&gt;\u003cbr>      {#if answers[i]!==undefined}\u003cbr>        &lt;box background=\"surface-secondary\" padding={2} radius=\"md\" gap={1}&gt;\u003cbr>          &lt;row align=\"center\" gap={2}&gt;\u003cbr>            &lt;icon name={answers[i]===q.a?\"check-circle\":\"x-circle\"} color={answers[i]===q.a?\"success\":\"danger\"}/&gt;\u003cbr>            **{answers[i]===q.a?\"正解です！\":\"もう一度確認しましょう。\"}**\u003cbr>          &lt;/row&gt;\u003cbr>          &lt;text size=\"sm\"&gt;正解：{q.opts[q.a]}。{q.exp}&lt;/text&gt;\u003cbr>        &lt;/box&gt;\u003cbr>      {/if}\u003cbr>    &lt;/box&gt;\u003cbr>    {#if i!==2}&lt;divider color=\"subtle\"/&gt;{/if}\u003cbr>  {/each}\u003cbr>  &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"sm\"&gt;正解数：{qs.filter((q,i)=&gt;answers[i]===q.a).length} / 3&lt;/text&gt;\u003cbr>    &lt;button size=\"sm\" variant=\"outline\" color=\"secondary\" onClick={()=&gt;setAnswers({})}&gt;再挑戦&lt;/button&gt;\u003cbr>  &lt;/row&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>## 30秒復習\u003c/p>\u003cp>「最後に、先輩。これだけは覚えてください。」\u003c/p>\u003cp>1. **何の関数？** 表から対応する情報を探して取り出す関数。\u003cbr>2. **どこを探す？** 指定範囲の一番左の列。\u003cbr>3. **どう取り出す？** 同じ行の指定した列番号から。\u003cbr>4. **完全一致は？** `FALSE`。\u003cbr>5. **範囲の固定は？** `$A$2:$C$4`のように絶対参照を使う。\u003cbr>6. **よくある間違いは？** 左端以外の列を検索しようとすることや、列番号の数え間違い。\u003c/p>\u003cp>## 一文記憶\u003c/p>\u003cp>**VLOOKUPは「左端で探して、同じ行の右側から取り出す」関数。**\u003c/p>\u003cp>「先輩、VLOOKUPは数式を丸暗記するよりも、**何を探す → どこで探す → 何列目を取る → 完全一致か**という4つの順番で理解することが大切なんです。これが分かれば、仕事で使うときも迷いにくくなりますよ。」\u003c/p>","originalText":"# ① VLOOKUP関数（ブイルックアップ関数）\u003ctext color=\"secondary\" size=\"sm\">Excel関数｜検索・参照\u003c/text>## A｜要点：何をする関数？「先輩、VLOOKUP関数はExcelで非常によく使う関数です。特に、商品コードや社員番号から必要な情報を探すときに便利なんですよ。」**VLOOKUP関数とは、表の左端の列から指定した値を探し、同じ行にある別の列の情報を取り出す関数です。**例えば、商品コード「102」を入力するだけで、商品名や価格を自動表示できます。\u003cbox border radius=\"lg\" padding={3} gap={2}>  \u003ctext color=\"secondary\" weight=\"medium\" size=\"xs\">商品マスタ\u003c/text>  | A列：商品コード | B列：商品名 | C列：価格 |  |---|---|---|  | 101 | りんご | 150円 |  | **102** | **みかん** | **100円** |  | 103 | ぶどう | 300円 |  \u003crow align=\"center\" justify=\"center\" gap={2}>    \u003cbox background=\"surface-secondary\" radius=\"md\" padding={2} flex=\"1\" align=\"center\" gap={1}>      \u003ctext color=\"secondary\" size=\"xs\">検索する値\u003c/text>      **102**    \u003c/box>    \u003cicon name=\"arrow-right\" color=\"success\" size=\"lg\"/>    \u003cbox background=\"rgba(22,163,74,0.09)\" radius=\"md\" padding={2} flex=\"1\" align=\"center\" gap={1}>      \u003ctext color=\"secondary\" size=\"xs\">取得した結果\u003c/text>      \u003ctitle color=\"success\" size=\"lg\">みかん\u003c/title>    \u003c/box>  \u003c/row>\u003c/box>「つまり、先輩が商品コードだけ入力すれば、Excelが対応する商品名を探してくれるんです。」## B｜詳しい解説：どういう仕組み？基本の書き方はこちらです。「4つの引数がありますけど、順番に意味を理解すれば難しくありません。」| 引数 | 意味 ||---|---|| 検索値 | 何を探す？ || 範囲 | どの表から探す？ || 列番号 | 左から何列目の情報を取る？ || 検索方法 | 完全一致か近似一致か？ |例えば、この式では、次の順番で処理されます。\u003cbox gap={1} align=\"center\">  \u003cbox border radius=\"md\" padding={3} width=\"100%\" align=\"center\" gap={1}>    **① 検索値：102**    \u003ctext size=\"sm\">商品コード102を探します。\u003c/text>  \u003c/box>  \u003cicon name=\"arrow-down\" color=\"tertiary\"/>  \u003cbox border radius=\"md\" padding={3} width=\"100%\" align=\"center\" gap={1}>    **② 範囲：A2:C4**    \u003ctext size=\"sm\">この範囲の一番左のA列を検索します。\u003c/text>  \u003c/box>  \u003cicon name=\"arrow-down\" color=\"tertiary\"/>  \u003cbox border radius=\"md\" padding={3} width=\"100%\" align=\"center\" gap={1}>    **③ 列番号：2**    \u003ctext size=\"sm\">見つかった行の左から2列目、B列を取り出します。\u003c/text>  \u003c/box>  \u003cicon name=\"arrow-down\" color=\"tertiary\"/>  \u003cbox background=\"rgba(22,163,74,0.07)\" border={{size:1,color:\"success\"}} radius=\"md\" padding={3} width=\"100%\" align=\"center\" gap={1}>    **④ FALSE：完全一致**    \u003ctext size=\"sm\">102と完全に一致する行だけを採用します。\u003c/text>    \u003ctitle color=\"success\" size=\"lg\">結果：みかん\u003c/title>  \u003c/box>\u003c/box>「ここで先輩、注意してほしいことが3つあります。」- VLOOKUPは指定範囲の**一番左の列**を検索します。- 列番号はExcel全体の列番号ではなく、指定範囲の左端から数えます。- `FALSE`は完全一致、`TRUE`は近似一致です。通常の商品コードや社員番号の検索には`FALSE`を使います。なお、検索方法を省略すると近似一致になるため、意図しない結果を避けるには`FALSE`を明示するのが基本です。## C｜イメージ理解：辞書を引く感覚「先輩、VLOOKUPは辞書のようなものだと思ってください。」辞書で言葉を探すとき、まず見出し語を探して、その横にある意味を読みますよね。VLOOKUPも同じです。**商品コードを探す → その行を見つける → 横にある商品名を読む**「ただし、普通の辞書と違って、VLOOKUPは検索範囲の左端から探すという制約があります。ここを忘れないでくださいね。」## D｜具体例：実際に操作してみましょう次の表を使って、VLOOKUP関数を試してみましょう。{@body const items=[{id:\"101\",name:\"りんご\",price:150},{id:\"102\",name:\"みかん\",price:100},{id:\"103\",name:\"ぶどう\",price:300}]}{@body const [code,setCode]=DIL.useState(\"102\")}{@body const [col,setCol]=DIL.useState(\"2\")}{@body const found=items.find(x=>x.id===code)}{@body const result=found?(col===\"2\"?found.name:found.price+\"円\"):\"#N/A\"}\u003cbox border radius=\"xl\" padding={3} gap={3}>  \u003crow align=\"center\" justify=\"between\">    **VLOOKUP練習シミュレーター**    \u003cbadge color=\"secondary\">操作できます\u003c/badge>  \u003c/row>  \u003ctext color=\"secondary\" size=\"xs\">Excelの表 A1:C4\u003c/text>  \u003ctable>    \u003ctable-row>\u003ctable-cell width=\"12%\"> \u003c/table-cell>\u003ctable-cell>A\u003c/table-cell>\u003ctable-cell>B\u003c/table-cell>\u003ctable-cell>C\u003c/table-cell>\u003c/table-row>    \u003ctable-row>\u003ctable-cell>1\u003c/table-cell>\u003ctable-cell>商品コード\u003c/table-cell>\u003ctable-cell>商品名\u003c/table-cell>\u003ctable-cell>価格\u003c/table-cell>\u003c/table-row>    {#each items as it,i}      \u003ctable-row>        \u003ctable-cell>{i+2}\u003c/table-cell>        \u003ctable-cell>\u003ctext color={it.id===code?\"success\":\"default\"} weight={it.id===code?\"semibold\":\"normal\"}>{it.id}\u003c/text>\u003c/table-cell>        \u003ctable-cell>{it.name}\u003c/table-cell>        \u003ctable-cell>{it.price}\u003c/table-cell>      \u003c/table-row>    {/each}  \u003c/table>  \u003ctext weight=\"medium\" size=\"sm\">① 検索する商品コードを選択\u003c/text>  \u003cradio-group direction=\"row\" value={code} onChange={setCode}>    \u003cradio value=\"101\">101\u003c/radio>    \u003cradio value=\"102\">102\u003c/radio>    \u003cradio value=\"103\">103\u003c/radio>    \u003cradio value=\"999\">999\u003c/radio>  \u003c/radio-group>  \u003ctext weight=\"medium\" size=\"sm\">② 取り出す列を選択\u003c/text>  \u003cradio-group direction=\"col\" value={col} onChange={setCol}>    \u003cradio value=\"2\">2列目：商品名\u003c/radio>    \u003cradio value=\"3\">3列目：価格\u003c/radio>  \u003c/radio-group>  \u003cbox background=\"surface-secondary\" radius=\"lg\" padding={3} gap={2}>    \u003ctext color=\"secondary\" size=\"xs\">入力される数式\u003c/text>    \u003crow align=\"center\" justify=\"between\">      \u003ctext weight=\"medium\" size=\"sm\">{\"=VLOOKUP(\"+code+\",A2:C4,\"+col+\",FALSE)\"}\u003c/text>      \u003cbutton size=\"xs\" variant=\"outline\" color=\"secondary\" onClick={()=>GenUI.copy(\"=VLOOKUP(\"+code+\",A2:C4,\"+col+\",FALSE)\")}>\u003cicon name=\"copy\" size=\"xs\"/> コピー\u003c/button>    \u003c/row>    \u003cdivider color=\"subtle\"/>    \u003ctext color=\"secondary\" size=\"xs\">計算結果\u003c/text>    \u003ctitle size=\"xl\" color={found?\"success\":\"danger\"}>{result}\u003c/title>    \u003ccaption>{found?\"商品コード\"+code+\"の行から\"+(col===\"2\"?\"商品名\":\"価格\")+\"を取り出しました。\":\"999に一致する商品コードがないため、#N/Aになります。\"}\u003c/caption>  \u003c/box>\u003c/box>「先輩、商品コードを101や103に変えてみてください。取り出す列を3にすれば、商品名ではなく価格が表示されます。」### 実務で重要：絶対参照大量の行にVLOOKUPをコピーするときは、検索範囲を固定することが大切です。`$A$2:$C$4`と書けば、数式を下にコピーしても検索範囲がずれません。## 理解確認：3問{@body const qs=[{q:\"VLOOKUP関数が検索するのはどこ？\",opts:[\"指定範囲の一番左の列\",\"指定範囲の一番右の列\",\"すべての列を同時に検索\"],a:0,exp:\"検索値は指定範囲の左端列で探します。取り出す情報はその右側の列から選びます。\"},{q:\"列番号を3にしたら何が取り出される？\",opts:[\"ExcelのC列に固定される\",\"指定範囲の左から3列目\",\"3行目の値\"],a:1,exp:\"列番号は指定した範囲の左端を1として数えます。範囲がB:Dなら3はD列です。\"},{q:\"商品コードを完全一致で探すには？\",opts:[\"TRUE\",\"省略する\",\"FALSE\"],a:2,exp:\"FALSEは完全一致です。TRUEや省略では近似一致となり、並び順によって想定外の結果になることがあります。\"}]}{@body const [answers,setAnswers]=DIL.useState({})}\u003cbox border radius=\"lg\" padding={3} gap={3}>  {#each qs as q,i}    \u003cbox key={i} gap={2}>      **Q{i+1}. {q.q}**      \u003cradio-group direction=\"col\" value={answers[i]===undefined?\"\":String(answers[i])} onChange={v=>setAnswers(p=>({...p,[i]:Number(v)}))}>        {#each q.opts as opt,j}          \u003cradio value={String(j)}>{opt}\u003c/radio>        {/each}      \u003c/radio-group>      {#if answers[i]!==undefined}        \u003cbox background=\"surface-secondary\" padding={2} radius=\"md\" gap={1}>          \u003crow align=\"center\" gap={2}>            \u003cicon name={answers[i]===q.a?\"check-circle\":\"x-circle\"} color={answers[i]===q.a?\"success\":\"danger\"}/>            **{answers[i]===q.a?\"正解です！\":\"もう一度確認しましょう。\"}**          \u003c/row>          \u003ctext size=\"sm\">正解：{q.opts[q.a]}。{q.exp}\u003c/text>        \u003c/box>      {/if}    \u003c/box>    {#if i!==2}\u003cdivider color=\"subtle\"/>{/if}  {/each}  \u003crow align=\"center\" justify=\"between\">    \u003ctext color=\"secondary\" size=\"sm\">正解数：{qs.filter((q,i)=>answers[i]===q.a).length} / 3\u003c/text>    \u003cbutton size=\"sm\" variant=\"outline\" color=\"secondary\" onClick={()=>setAnswers({})}>再挑戦\u003c/button>  \u003c/row>\u003c/box>## 30秒復習「最後に、先輩。これだけは覚えてください。」1. **何の関数？** 表から対応する情報を探して取り出す関数。2. **どこを探す？** 指定範囲の一番左の列。3. **どう取り出す？** 同じ行の指定した列番号から。4. **完全一致は？** `FALSE`。5. **範囲の固定は？** `$A$2:$C$4`のように絶対参照を使う。6. **よくある間違いは？** 左端以外の列を検索しようとすることや、列番号の数え間違い。## 一文記憶**VLOOKUPは「左端で探して、同じ行の右側から取り出す」関数。**「先輩、VLOOKUPは数式を丸暗記するよりも、**何を探す → どこで探す → 何列目を取る → 完全一致か**という4つの順番で理解することが大切なんです。これが分かれば、仕事で使うときも迷いにくくなりますよ。」","sections":{"A":"\u003ch1>① VLOOKUP関数（ブイルックアップ関数）\u003c/h1>\n\u003cp class=\"muted\">Excel関数｜検索・参照\u003c/p>\u003ch2>A｜要点：何をする関数？\u003c/h2>\u003cp>「先輩、VLOOKUP関数はExcelで非常によく使う関数です。特に、商品コードや社員番号から必要な情報を探すときに便利なんですよ。」\u003c/p>\n\u003cp>\u003cstrong>VLOOKUP関数とは、表の左端の列から指定した値を探し、同じ行にある別の列の情報を取り出す関数です。\u003c/strong>\u003c/p>\n\u003cp>例えば、商品コード「102」を入力するだけで、商品名や価格を自動表示できます。\u003c/p>\n\u003cdiv class=\"source-static\">\u003cdiv>\n  \u003cspan>商品マスタ\u003c/span>\n  | A列：商品コード | B列：商品名 | C列：価格 |\n  |---|---|---|\n  | 101 | りんご | 150円 |\n  | \u003cstrong>102\u003c/strong> | \u003cstrong>みかん\u003c/strong> | \u003cstrong>100円\u003c/strong> |\n  | 103 | ぶどう | 300円 |\n\u003cdiv>\n    \u003cdiv>\n      \u003cspan>検索する値\u003c/span>\n      \u003cstrong>102\u003c/strong>\n    \u003c/div>\n     → \n    \u003cdiv>\n      \u003cspan>取得した結果\u003c/span>\n      \u003cstrong>みかん\u003c/strong>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003c/div>\u003cp>「つまり、先輩が商品コードだけ入力すれば、Excelが対応する商品名を探してくれるんです。」\u003c/p>\n","B":"\u003ch2>B｜詳しい解説：どういう仕組み？\u003c/h2>\u003cp>基本の書き方はこちらです。\u003c/p>\n\u003cp>「4つの引数がありますけど、順番に意味を理解すれば難しくありません。」\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>引数\u003c/th>\n\u003cth>意味\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>検索値\u003c/td>\n\u003ctd>何を探す？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>範囲\u003c/td>\n\u003ctd>どの表から探す？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>列番号\u003c/td>\n\u003ctd>左から何列目の情報を取る？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>検索方法\u003c/td>\n\u003ctd>完全一致か近似一致か？\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>例えば、\u003c/p>\n\u003cp>この式では、次の順番で処理されます。\u003c/p>\n\u003cdiv class=\"source-static\">\u003cdiv>\n  \u003cdiv>\n    \u003cstrong>① 検索値：102\u003c/strong>\n\u003cspan>商品コード102を探します。\u003c/span>\n  \u003c/div>\n   → \n  \u003cdiv>\n    \u003cstrong>② 範囲：A2:C4\u003c/strong>\n\u003cspan>この範囲の一番左のA列を検索します。\u003c/span>\n  \u003c/div>\n   → \n  \u003cdiv>\n    \u003cstrong>③ 列番号：2\u003c/strong>\n\u003cspan>見つかった行の左から2列目、B列を取り出します。\u003c/span>\n  \u003c/div>\n   → \n  \u003cdiv>\n    \u003cstrong>④ FALSE：完全一致\u003c/strong>\n\u003cspan>102と完全に一致する行だけを採用します。\u003c/span>\n    \u003cstrong>結果：みかん\u003c/strong>\n  \u003c/div>\n\u003c/div>\n\u003c/div>\u003cp>「ここで先輩、注意してほしいことが3つあります。」\u003c/p>\n\u003cul>\n\u003cli>VLOOKUPは指定範囲の\u003cstrong>一番左の列\u003c/strong>を検索します。\u003c/li>\n\u003cli>列番号はExcel全体の列番号ではなく、指定範囲の左端から数えます。\u003c/li>\n\u003cli>\u003ccode>FALSE\u003c/code>は完全一致、\u003ccode>TRUE\u003c/code>は近似一致です。通常の商品コードや社員番号の検索には\u003ccode>FALSE\u003c/code>を使います。\u003c/li>\n\u003c/ul>\n\u003cp>なお、検索方法を省略すると近似一致になるため、意図しない結果を避けるには\u003ccode>FALSE\u003c/code>を明示するのが基本です。\u003c/p>\n","C":"\u003ch2>C｜イメージ理解：辞書を引く感覚\u003c/h2>\u003cp>「先輩、VLOOKUPは辞書のようなものだと思ってください。」\u003c/p>\n\u003cp>辞書で言葉を探すとき、まず見出し語を探して、その横にある意味を読みますよね。\u003c/p>\n\u003cp>VLOOKUPも同じです。\u003c/p>\n\u003cp>\u003cstrong>商品コードを探す → その行を見つける → 横にある商品名を読む\u003c/strong>\u003c/p>\n\u003cp>「ただし、普通の辞書と違って、VLOOKUPは検索範囲の左端から探すという制約があります。ここを忘れないでくださいね。」\u003c/p>\n","D":"\u003ch2>D｜具体例：実際に操作してみましょう\u003c/h2>\u003cp>次の表を使って、VLOOKUP関数を試してみましょう。\u003c/p>\n\u003cp>「先輩、商品コードを101や103に変えてみてください。取り出す列を3にすれば、商品名ではなく価格が表示されます。」\u003c/p>\n\u003ch3>実務で重要：絶対参照\u003c/h3>\n\u003cp>大量の行にVLOOKUPをコピーするときは、検索範囲を固定することが大切です。\u003c/p>\n\u003cp>\u003ccode>$A$2:$C$4\u003c/code>と書けば、数式を下にコピーしても検索範囲がずれません。\u003c/p>\n","その他":"\u003ch2>理解確認：3問\u003c/h2>\u003ch2>30秒復習\u003c/h2>\u003cp>「最後に、先輩。これだけは覚えてください。」\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>何の関数？\u003c/strong> 表から対応する情報を探して取り出す関数。\u003c/li>\n\u003cli>\u003cstrong>どこを探す？\u003c/strong> 指定範囲の一番左の列。\u003c/li>\n\u003cli>\u003cstrong>どう取り出す？\u003c/strong> 同じ行の指定した列番号から。\u003c/li>\n\u003cli>\u003cstrong>完全一致は？\u003c/strong> \u003ccode>FALSE\u003c/code>。\u003c/li>\n\u003cli>\u003cstrong>範囲の固定は？\u003c/strong> \u003ccode>$A$2:$C$4\u003c/code>のように絶対参照を使う。\u003c/li>\n\u003cli>\u003cstrong>よくある間違いは？\u003c/strong> 左端以外の列を検索しようとすることや、列番号の数え間違い。\u003c/li>\n\u003c/ol>\n\u003ch2>一文記憶\u003c/h2>\u003cp>\u003cstrong>VLOOKUPは「左端で探して、同じ行の右側から取り出す」関数。\u003c/strong>\u003c/p>\n\u003cp>「先輩、VLOOKUPは数式を丸暗記するよりも、\u003cstrong>何を探す → どこで探す → 何列目を取る → 完全一致か\u003c/strong>という4つの順番で理解することが大切なんです。これが分かれば、仕事で使うときも迷いにくくなりますよ。」\u003c/p>\n"},"prose":["# ① VLOOKUP関数（ブイルックアップ関数）","Excel関数｜検索・参照","## A｜要点：何をする関数？","「先輩、VLOOKUP関数はExcelで非常によく使う関数です。特に、商品コードや社員番号から必要な情報を探すときに便利なんですよ。」","**VLOOKUP関数とは、表の左端の列から指定した値を探し、同じ行にある別の列の情報を取り出す関数です。**","例えば、商品コード「102」を入力するだけで、商品名や価格を自動表示できます。","「つまり、先輩が商品コードだけ入力すれば、Excelが対応する商品名を探してくれるんです。」","## B｜詳しい解説：どういう仕組み？","基本の書き方はこちらです。","「4つの引数がありますけど、順番に意味を理解すれば難しくありません。」","| 引数 | 意味 |\n|---|---|\n| 検索値 | 何を探す？ |\n| 範囲 | どの表から探す？ |\n| 列番号 | 左から何列目の情報を取る？ |\n| 検索方法 | 完全一致か近似一致か？ |","例えば、","この式では、次の順番で処理されます。","「ここで先輩、注意してほしいことが3つあります。」","- VLOOKUPは指定範囲の**一番左の列**を検索します。\n- 列番号はExcel全体の列番号ではなく、指定範囲の左端から数えます。\n- `FALSE`は完全一致、`TRUE`は近似一致です。通常の商品コードや社員番号の検索には`FALSE`を使います。","なお、検索方法を省略すると近似一致になるため、意図しない結果を避けるには`FALSE`を明示するのが基本です。","## C｜イメージ理解：辞書を引く感覚","「先輩、VLOOKUPは辞書のようなものだと思ってください。」","辞書で言葉を探すとき、まず見出し語を探して、その横にある意味を読みますよね。","VLOOKUPも同じです。","**商品コードを探す → その行を見つける → 横にある商品名を読む**","「ただし、普通の辞書と違って、VLOOKUPは検索範囲の左端から探すという制約があります。ここを忘れないでくださいね。」","## D｜具体例：実際に操作してみましょう","次の表を使って、VLOOKUP関数を試してみましょう。","「先輩、商品コードを101や103に変えてみてください。取り出す列を3にすれば、商品名ではなく価格が表示されます。」","### 実務で重要：絶対参照","大量の行にVLOOKUPをコピーするときは、検索範囲を固定することが大切です。","`$A$2:$C$4`と書けば、数式を下にコピーしても検索範囲がずれません。","## 理解確認：3問","## 30秒復習","「最後に、先輩。これだけは覚えてください。」","1. **何の関数？** 表から対応する情報を探して取り出す関数。\n2. **どこを探す？** 指定範囲の一番左の列。\n3. **どう取り出す？** 同じ行の指定した列番号から。\n4. **完全一致は？** `FALSE`。\n5. **範囲の固定は？** `$A$2:$C$4`のように絶対参照を使う。\n6. **よくある間違いは？** 左端以外の列を検索しようとすることや、列番号の数え間違い。","## 一文記憶","**VLOOKUPは「左端で探して、同じ行の右側から取り出す」関数。**","「先輩、VLOOKUPは数式を丸暗記するよりも、**何を探す → どこで探す → 何列目を取る → 完全一致か**という4つの順番で理解することが大切なんです。これが分かれば、仕事で使うときも迷いにくくなりますよ。」"],"quizzes":[{"q":"VLOOKUP関数が検索するのはどこ？","options":["指定範囲の一番左の列","指定範囲の一番右の列","すべての列を同時に検索"],"correct":0,"explain":"検索値は指定範囲の左端列で探します。取り出す情報はその右側の列から選びます。"},{"q":"列番号を3にしたら何が取り出される？","options":["ExcelのC列に固定される","指定範囲の左から3列目","3行目の値"],"correct":1,"explain":"列番号は指定した範囲の左端を1として数えます。範囲がB:Dなら3はD列です。"},{"q":"商品コードを完全一致で探すには？","options":["TRUE","省略する","FALSE"],"correct":2,"explain":"FALSEは完全一致です。TRUEや省略では近似一致となり、並び順によって想定外の結果になることがあります。"}]},{"name":"XLOOKUP","original":"\u003cp># ② XLOOKUP関数（エックスルックアップ関数）\u003c/p>\u003cp>&lt;text color=\"secondary\" size=\"sm\"&gt;Excel関数｜検索・参照｜VLOOKUPとの比較&lt;/text&gt;\u003c/p>\u003cp>## A｜要点：XLOOKUPとは？\u003c/p>\u003cp>「先輩、さっきVLOOKUP関数を勉強しましたよね。今回は、その不便なところを改善した**XLOOKUP関数**です。」\u003c/p>\u003cp>「一言でいうと、**表の中から指定した値を探して、それに対応する別の値を取り出す関数**なんです。」\u003c/p>\u003cp>VLOOKUPとの最大の違いは、**検索する列と、結果を取り出す列を自由に指定できること**です。\u003c/p>\u003cp>&lt;box border radius=\"lg\" padding={3} gap={3}&gt;\u003cbr>  **例えば、商品コードから商品名を探す場合**\u003c/p>\u003cp>  | A列：商品コード | B列：商品名 | C列：価格 |\u003cbr>  |---|---|---|\u003cbr>  | 101 | りんご | 150円 |\u003cbr>  | **102** | **みかん** | **100円** |\u003cbr>  | 103 | ぶどう | 300円 |\u003c/p>\u003cp>  &lt;grid columns={2} gap={2}&gt;\u003cbr>    &lt;grid-item&gt;\u003cbr>      &lt;box background=\"surface-secondary\" radius=\"md\" padding={3} align=\"center\" gap={1}&gt;\u003cbr>        &lt;text color=\"secondary\" size=\"xs\"&gt;検索値&lt;/text&gt;\u003cbr>        &lt;title size=\"xl\"&gt;102&lt;/title&gt;\u003cbr>        &lt;caption&gt;商品コード&lt;/caption&gt;\u003cbr>      &lt;/box&gt;\u003cbr>    &lt;/grid-item&gt;\u003cbr>    &lt;grid-item&gt;\u003cbr>      &lt;box background=\"rgba(22,163,74,0.08)\" radius=\"md\" padding={3} align=\"center\" gap={1}&gt;\u003cbr>        &lt;text color=\"secondary\" size=\"xs\"&gt;検索結果&lt;/text&gt;\u003cbr>        &lt;title size=\"xl\" color=\"success\"&gt;みかん&lt;/title&gt;\u003cbr>        &lt;caption&gt;商品名&lt;/caption&gt;\u003cbr>      &lt;/box&gt;\u003cbr>    &lt;/grid-item&gt;\u003cbr>  &lt;/grid&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>「ここまではVLOOKUPと同じです。でも、XLOOKUPなら商品名から商品コードを探すこともできるんですよ。」\u003c/p>\u003cp>## B｜詳しい解説：仕組みと使い方\u003c/p>\u003cp>### 1. 基本の書き方\u003c/p>\u003cp>「まずは、この3つを覚えましょう。」\u003c/p>\u003cp>| 引数 | 意味 |\u003cbr>|---|---|\u003cbr>| 検索値 | 何を探すか |\u003cbr>| 検索範囲 | どこから探すか |\u003cbr>| 戻り範囲 | どこの値を取り出すか |\u003c/p>\u003cp>先ほどの商品表を使うと、こうなります。\u003c/p>\u003cp>&lt;box gap={1} align=\"center\"&gt;\u003cbr>  &lt;box border radius=\"md\" padding={3} width=\"100%\" gap={1} align=\"center\"&gt;\u003cbr>    **① 検索値：102**\u003c/p>\u003cp>    &lt;text size=\"sm\"&gt;商品コード102を探す&lt;/text&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;icon name=\"arrow-down\" color=\"tertiary\"/&gt;\u003cbr>  &lt;box border radius=\"md\" padding={3} width=\"100%\" gap={1} align=\"center\"&gt;\u003cbr>    **② 検索範囲：A2:A4**\u003c/p>\u003cp>    &lt;text size=\"sm\"&gt;A列から102を見つける&lt;/text&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;icon name=\"arrow-down\" color=\"tertiary\"/&gt;\u003cbr>  &lt;box border radius=\"md\" padding={3} width=\"100%\" gap={1} align=\"center\"&gt;\u003cbr>    **③ 戻り範囲：B2:B4**\u003c/p>\u003cp>    &lt;text size=\"sm\"&gt;同じ位置にあるB列の値を取得&lt;/text&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;icon name=\"arrow-down\" color=\"tertiary\"/&gt;\u003cbr>  &lt;box background=\"rgba(22,163,74,0.08)\" border={{size:1,color:\"success\"}} radius=\"md\" padding={3} width=\"100%\" align=\"center\" gap={1}&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"xs\"&gt;検索結果&lt;/text&gt;\u003cbr>    &lt;title color=\"success\" size=\"xl\"&gt;みかん&lt;/title&gt;\u003cbr>  &lt;/box&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>「VLOOKUPでは『表の何列目を取るか』を数字で指定しました。でもXLOOKUPでは、**取り出したいセル範囲を直接指定する**んです。」\u003c/p>\u003cp>### 2. VLOOKUPとの違い\u003c/p>\u003cp>| 比較 | VLOOKUP | XLOOKUP |\u003cbr>|---|---|---|\u003cbr>| 左方向の検索 | 原則不可 | 可能 |\u003cbr>| 完全一致 | FALSEを指定 | 標準で完全一致 |\u003cbr>| 列番号 | 必要 | 不要 |\u003cbr>| 見つからない場合 | #N/A | 任意の文字を指定可能 |\u003cbr>| 複数列の取得 | 基本は1列ずつ | 一度に複数列可能 |\u003c/p>\u003cp>「特に重要なのは、XLOOKUPでは**検索範囲と戻り範囲を独立して指定できる**ことです。」\u003c/p>\u003cp>### 3. 見つからない場合の設定\u003c/p>\u003cp>XLOOKUPには省略可能な引数もあります。\u003c/p>\u003cp>例えば、\u003c/p>\u003cp>商品コード999が存在しなければ「該当なし」と表示します。\u003c/p>\u003cp>「VLOOKUPでは通常、IFERRORなどと組み合わせる必要がありましたが、XLOOKUPなら関数の中で指定できます。」\u003c/p>\u003cp>なお、XLOOKUPの標準は完全一致です。一致モードを変えれば近似一致やワイルドカード検索もできます。\u003c/p>\u003cp>## C｜イメージ理解：検索と取り出しを別々に考える\u003c/p>\u003cp>「先輩、ここは図で考えましょう。」\u003c/p>\u003cp>&lt;box border radius=\"lg\" padding={3} gap={2}&gt;\u003cbr>  **XLOOKUPの基本イメージ**\u003c/p>\u003cp>  &lt;svg viewBox=\"0 0 340 195\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"&gt;\u003cbr>    &lt;rect x=\"10\" y=\"10\" width=\"145\" height=\"170\" rx=\"9\" fill=\"#2563eb\" fillOpacity=\".09\" stroke=\"#2563eb\" strokeWidth=\"1.5\"/&gt;\u003cbr>    &lt;rect x=\"185\" y=\"10\" width=\"145\" height=\"170\" rx=\"9\" fill=\"#16a34a\" fillOpacity=\".09\" stroke=\"#16a34a\" strokeWidth=\"1.5\"/&gt;\u003cbr>    &lt;g fontSize=\"13\" textAnchor=\"middle\" fill=\"currentColor\"&gt;\u003cbr>      &lt;text x=\"82\" y=\"32\" fontWeight=\"bold\"&gt;検索範囲 A列&lt;/text&gt;\u003cbr>      &lt;text x=\"257\" y=\"32\" fontWeight=\"bold\"&gt;戻り範囲 B列&lt;/text&gt;\u003cbr>      &lt;text x=\"82\" y=\"65\"&gt;101&lt;/text&gt;&lt;text x=\"257\" y=\"65\"&gt;りんご&lt;/text&gt;\u003cbr>      &lt;text x=\"82\" y=\"110\" fontWeight=\"bold\"&gt;102&lt;/text&gt;&lt;text x=\"257\" y=\"110\" fontWeight=\"bold\"&gt;みかん&lt;/text&gt;\u003cbr>      &lt;text x=\"82\" y=\"155\"&gt;103&lt;/text&gt;&lt;text x=\"257\" y=\"155\"&gt;ぶどう&lt;/text&gt;\u003cbr>    &lt;/g&gt;\u003cbr>    &lt;rect x=\"19\" y=\"88\" width=\"127\" height=\"37\" rx=\"6\" fill=\"#2563eb\" fillOpacity=\".17\" stroke=\"#2563eb\" strokeWidth=\"1.5\"/&gt;\u003cbr>    &lt;rect x=\"194\" y=\"88\" width=\"127\" height=\"37\" rx=\"6\" fill=\"#16a34a\" fillOpacity=\".17\" stroke=\"#16a34a\" strokeWidth=\"1.5\"/&gt;\u003cbr>    &lt;path d=\"M150 106 H185\" stroke=\"#16a34a\" strokeWidth=\"2.5\"/&gt;\u003cbr>    &lt;path d=\"M178 100 L185 106 L178 112\" stroke=\"#16a34a\" strokeWidth=\"2.5\" fill=\"none\"/&gt;\u003cbr>  &lt;/svg&gt;\u003cbr>  &lt;caption&gt;検索範囲で102を見つけ、その位置に対応する戻り範囲の「みかん」を取得します。&lt;/caption&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>「ここで大切なのは、Excelが単に右隣のセルを見ているわけではないことです。」\u003c/p>\u003cp>「検索範囲で見つけた位置と、戻り範囲の位置を対応させているんです。だから戻り範囲が左側にあっても構いません。」\u003c/p>\u003cp>## D｜具体例：実際に操作して理解する\u003c/p>\u003cp>「では先輩、商品コードから商品名を調べたり、逆に商品名から商品コードを調べたりしてみましょう。」\u003c/p>\u003cp>{@body const data=[{code:\"101\",name:\"りんご\",price:\"150円\"},{code:\"102\",name:\"みかん\",price:\"100円\"},{code:\"103\",name:\"ぶどう\",price:\"300円\"}]}\u003cbr>{@body const [mode,setMode]=DIL.useState(\"code\")}\u003cbr>{@body const [query,setQuery]=DIL.useState(\"102\")}\u003cbr>{@body const [target,setTarget]=DIL.useState(\"name\")}\u003cbr>{@body const [notFound,setNotFound]=DIL.useState(true)}\u003cbr>{@body const options=mode===\"code\"?data.map(x=&gt;({value:x.code,label:x.code})):data.map(x=&gt;({value:x.name,label:x.name}))}\u003cbr>{@body const selected=data.find(x=&gt;x[mode]===query)}\u003cbr>{@body const answer=selected?selected[target]:(notFound?\"該当なし\":\"#N/A\")}\u003cbr>{@body const ranges={code:\"A2:A4\",name:\"B2:B4\",price:\"C2:C4\"}}\u003cbr>{@body const formula=\"=XLOOKUP(\"+(/^\\d+$/.test(query)?query:'\"'+query+'\"')+\",\"+ranges[mode]+\",\"+ranges[target]+(notFound?',\"該当なし\"':\"\")+\")\"}\u003cbr>&lt;box border radius=\"xl\" padding={3} gap={3}&gt;\u003cbr>  &lt;row justify=\"between\" align=\"center\"&gt;\u003cbr>    **XLOOKUP練習シミュレーター**\u003cbr>    &lt;badge&gt;操作可能&lt;/badge&gt;\u003cbr>  &lt;/row&gt;\u003cbr>  &lt;table&gt;\u003cbr>    &lt;table-row&gt;&lt;table-cell width=\"10%\"&gt; &lt;/table-cell&gt;&lt;table-cell&gt;A&lt;/table-cell&gt;&lt;table-cell&gt;B&lt;/table-cell&gt;&lt;table-cell&gt;C&lt;/table-cell&gt;&lt;/table-row&gt;\u003cbr>    &lt;table-row&gt;&lt;table-cell&gt;1&lt;/table-cell&gt;&lt;table-cell&gt;商品コード&lt;/table-cell&gt;&lt;table-cell&gt;商品名&lt;/table-cell&gt;&lt;table-cell&gt;価格&lt;/table-cell&gt;&lt;/table-row&gt;\u003cbr>    {#each data as x,i}\u003cbr>      &lt;table-row&gt;\u003cbr>        &lt;table-cell&gt;{i+2}&lt;/table-cell&gt;\u003cbr>        &lt;table-cell&gt;{x.code}&lt;/table-cell&gt;\u003cbr>        &lt;table-cell&gt;{x.name}&lt;/table-cell&gt;\u003cbr>        &lt;table-cell&gt;{x.price}&lt;/table-cell&gt;\u003cbr>      &lt;/table-row&gt;\u003cbr>    {/each}\u003cbr>  &lt;/table&gt;\u003cbr>  &lt;box gap={1}&gt;\u003cbr>    &lt;label&gt;① 何を使って検索する？&lt;/label&gt;\u003cbr>    &lt;radio-group direction=\"col\" value={mode} onChange={v=&gt;{setMode(v);setTarget(v===\"code\"?\"name\":\"code\");setQuery(v===\"code\"?\"102\":\"みかん\")}}&gt;\u003cbr>      &lt;radio value=\"code\"&gt;商品コードから検索&lt;/radio&gt;\u003cbr>      &lt;radio value=\"name\"&gt;商品名から検索（左方向）&lt;/radio&gt;\u003cbr>    &lt;/radio-group&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;box gap={1}&gt;\u003cbr>    &lt;label&gt;② 検索する値&lt;/label&gt;\u003cbr>    &lt;input value={query} onChange={setQuery} placeholder=\"検索する値を入力\"/&gt;\u003cbr>    &lt;row gap={1} wrap=\"wrap\"&gt;\u003cbr>      {#each options as op}\u003cbr>        &lt;button size=\"xs\" color=\"secondary\" variant={query===op.value?\"solid\":\"outline\"} onClick={()=&gt;setQuery(op.value)}&gt;{op.label}&lt;/button&gt;\u003cbr>      {/each}\u003cbr>      &lt;button size=\"xs\" color=\"secondary\" variant=\"outline\" onClick={()=&gt;setQuery(\"999\")}&gt;存在しない値&lt;/button&gt;\u003cbr>    &lt;/row&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;box gap={1}&gt;\u003cbr>    &lt;label&gt;③ 何を取り出す？&lt;/label&gt;\u003cbr>    &lt;radio-group direction=\"col\" value={target} onChange={setTarget}&gt;\u003cbr>      {#if mode!==\"code\"}&lt;radio value=\"code\"&gt;商品コード（A列）&lt;/radio&gt;{/if}\u003cbr>      {#if mode!==\"name\"}&lt;radio value=\"name\"&gt;商品名（B列）&lt;/radio&gt;{/if}\u003cbr>      &lt;radio value=\"price\"&gt;価格（C列）&lt;/radio&gt;\u003cbr>    &lt;/radio-group&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;checkbox checked={notFound} onChange={setNotFound} lineThrough={false}&gt;見つからない場合は「該当なし」と表示する&lt;/checkbox&gt;\u003cbr>  &lt;box background=\"surface-secondary\" padding={3} radius=\"lg\" gap={2}&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"xs\"&gt;作成された数式&lt;/text&gt;\u003cbr>    &lt;text weight=\"medium\" size=\"sm\"&gt;{formula}&lt;/text&gt;\u003cbr>    &lt;row justify=\"end\"&gt;\u003cbr>      &lt;button size=\"xs\" color=\"secondary\" variant=\"outline\" onClick={()=&gt;GenUI.copy(formula)}&gt;&lt;icon name=\"copy\" size=\"xs\"/&gt; 数式をコピー&lt;/button&gt;\u003cbr>    &lt;/row&gt;\u003cbr>    &lt;divider color=\"subtle\"/&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"xs\"&gt;検索結果&lt;/text&gt;\u003cbr>    &lt;title size=\"xl\" color={selected?\"success\":\"danger\"}&gt;{answer}&lt;/title&gt;\u003cbr>    &lt;caption&gt;{selected?\"検索範囲で一致した位置から、対応する戻り範囲の値を取得しました。\":\"一致する値が見つかりませんでした。\"}&lt;/caption&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;caption&gt;※ この練習では商品コードを数値として扱います。実際のExcelでは、検索値と検索範囲のデータ型にも注意してください。&lt;/caption&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>「特に『商品名から検索』を選んでください。B列で商品名を探して、左側のA列にある商品コードを取り出せますよね。これがVLOOKUPとの大きな違いです。」\u003c/p>\u003cp>### 実務での使い方\u003c/p>\u003cp>例えば、銀行明細に記載された取引先コードから、別シートにある取引先名を表示する場合です。\u003c/p>\u003cp>「この式なら、A2の取引先コードをマスタのA列で探し、対応するB列の取引先名を表示できます。登録されていなければ『未登録』になります。」\u003c/p>\u003cp>「ただし、同じコードが複数存在する場合は、標準では最初に見つかったものが返ります。重複のあるデータでは注意してくださいね。」\u003c/p>\u003cp>## 理解確認：3問\u003c/p>\u003cp>{@body const qs=[{q:\"XLOOKUPで、検索範囲より左側の列から値を取り出すことはできますか？\",opts:[\"できない\",\"できる\",\"完全一致の場合だけできない\"],correct:1,explain:\"検索範囲と戻り範囲を独立して指定するので、左方向にも検索できます。\"},{q:\"XLOOKUPの標準の一致方法はどれですか？\",opts:[\"完全一致\",\"近似一致\",\"部分一致\"],correct:0,explain:\"標準は完全一致です。VLOOKUPのようにFALSEを毎回指定する必要はありません。\"},{q:\"=XLOOKUP(102,A2:A4,C2:C4) の戻り値は？\",opts:[\"みかん\",\"102\",\"100円\"],correct:2,explain:\"A列で102を見つけ、その位置に対応するC列の価格100円を取り出します。\"}]}\u003cbr>{@body const [ans,setAns]=DIL.useState({})}\u003cbr>&lt;box border radius=\"lg\" padding={3} gap={3}&gt;\u003cbr>  {#each qs as q,i}\u003cbr>    &lt;box key={i} gap={2}&gt;\u003cbr>      **Q{i+1}. {q.q}**\u003cbr>      &lt;radio-group direction=\"col\" value={ans[i]===undefined?\"\":String(ans[i])} onChange={v=&gt;setAns(p=&gt;({...p,[i]:Number(v)}))}&gt;\u003cbr>        {#each q.opts as opt,j}\u003cbr>          &lt;radio value={String(j)}&gt;{opt}&lt;/radio&gt;\u003cbr>        {/each}\u003cbr>      &lt;/radio-group&gt;\u003cbr>      {#if ans[i]!==undefined}\u003cbr>        &lt;box background=\"surface-secondary\" radius=\"md\" padding={2} gap={1}&gt;\u003cbr>          &lt;row align=\"center\" gap={2}&gt;\u003cbr>            &lt;icon name={ans[i]===q.correct?\"check-circle\":\"x-circle\"} color={ans[i]===q.correct?\"success\":\"danger\"}/&gt;\u003cbr>            **{ans[i]===q.correct?\"正解です！\":\"不正解です\"}**\u003cbr>          &lt;/row&gt;\u003cbr>          &lt;text size=\"sm\"&gt;正解：{q.opts[q.correct]}。{q.explain}&lt;/text&gt;\u003cbr>        &lt;/box&gt;\u003cbr>      {/if}\u003cbr>    &lt;/box&gt;\u003cbr>    {#if i&lt;2}&lt;divider color=\"subtle\"/&gt;{/if}\u003cbr>  {/each}\u003cbr>  &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"sm\"&gt;正解数：{qs.filter((q,i)=&gt;ans[i]===q.correct).length} / 3&lt;/text&gt;\u003cbr>    &lt;button color=\"secondary\" variant=\"outline\" size=\"sm\" onClick={()=&gt;setAns({})}&gt;再挑戦&lt;/button&gt;\u003cbr>  &lt;/row&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>## 30秒復習\u003c/p>\u003cp>「先輩、最後に6つだけ確認します。」\u003c/p>\u003cp>1. **何の関数？** 指定した値を検索して、対応する値を取り出す関数。\u003cbr>2. **一番重要なのは？** 検索範囲と戻り範囲を自由に指定できること。\u003cbr>3. **なぜ便利？** VLOOKUPのように列番号を数える必要がないから。\u003cbr>4. **検索の流れは？** 検索値 → 検索範囲 → 戻り範囲。\u003cbr>5. **具体例は？** 商品コード102から「みかん」を取得。\u003cbr>6. **間違えやすいところは？** 検索範囲と戻り範囲の大きさを対応させること。検索値のデータ型や重複にも注意。\u003c/p>\u003cp>## 一文記憶\u003c/p>\u003cp>**XLOOKUPは「探す場所」と「取り出す場所」を別々に指定できる検索関数。**\u003c/p>\u003cp>「先輩、VLOOKUPは『表の左端から探して、右側の何列目を取るか』でしたよね。一方、XLOOKUPは『この範囲から探して、あの範囲から取る』です。この違いが頭に入れば、使い分けはかなり簡単になります。」\u003c/p>\u003cp>「ちなみに、XLOOKUPはMicrosoft 365やExcel 2021以降などで利用できますが、Excel 2019以前では基本的に使えません。職場のExcelのバージョンも確認しておきましょう。」\u003c/p>","originalText":"# ② XLOOKUP関数（エックスルックアップ関数）\u003ctext color=\"secondary\" size=\"sm\">Excel関数｜検索・参照｜VLOOKUPとの比較\u003c/text>## A｜要点：XLOOKUPとは？「先輩、さっきVLOOKUP関数を勉強しましたよね。今回は、その不便なところを改善した**XLOOKUP関数**です。」「一言でいうと、**表の中から指定した値を探して、それに対応する別の値を取り出す関数**なんです。」VLOOKUPとの最大の違いは、**検索する列と、結果を取り出す列を自由に指定できること**です。\u003cbox border radius=\"lg\" padding={3} gap={3}>  **例えば、商品コードから商品名を探す場合**  | A列：商品コード | B列：商品名 | C列：価格 |  |---|---|---|  | 101 | りんご | 150円 |  | **102** | **みかん** | **100円** |  | 103 | ぶどう | 300円 |  \u003cgrid columns={2} gap={2}>    \u003cgrid-item>      \u003cbox background=\"surface-secondary\" radius=\"md\" padding={3} align=\"center\" gap={1}>        \u003ctext color=\"secondary\" size=\"xs\">検索値\u003c/text>        \u003ctitle size=\"xl\">102\u003c/title>        \u003ccaption>商品コード\u003c/caption>      \u003c/box>    \u003c/grid-item>    \u003cgrid-item>      \u003cbox background=\"rgba(22,163,74,0.08)\" radius=\"md\" padding={3} align=\"center\" gap={1}>        \u003ctext color=\"secondary\" size=\"xs\">検索結果\u003c/text>        \u003ctitle size=\"xl\" color=\"success\">みかん\u003c/title>        \u003ccaption>商品名\u003c/caption>      \u003c/box>    \u003c/grid-item>  \u003c/grid>\u003c/box>「ここまではVLOOKUPと同じです。でも、XLOOKUPなら商品名から商品コードを探すこともできるんですよ。」## B｜詳しい解説：仕組みと使い方### 1. 基本の書き方「まずは、この3つを覚えましょう。」| 引数 | 意味 ||---|---|| 検索値 | 何を探すか || 検索範囲 | どこから探すか || 戻り範囲 | どこの値を取り出すか |先ほどの商品表を使うと、こうなります。\u003cbox gap={1} align=\"center\">  \u003cbox border radius=\"md\" padding={3} width=\"100%\" gap={1} align=\"center\">    **① 検索値：102**    \u003ctext size=\"sm\">商品コード102を探す\u003c/text>  \u003c/box>  \u003cicon name=\"arrow-down\" color=\"tertiary\"/>  \u003cbox border radius=\"md\" padding={3} width=\"100%\" gap={1} align=\"center\">    **② 検索範囲：A2:A4**    \u003ctext size=\"sm\">A列から102を見つける\u003c/text>  \u003c/box>  \u003cicon name=\"arrow-down\" color=\"tertiary\"/>  \u003cbox border radius=\"md\" padding={3} width=\"100%\" gap={1} align=\"center\">    **③ 戻り範囲：B2:B4**    \u003ctext size=\"sm\">同じ位置にあるB列の値を取得\u003c/text>  \u003c/box>  \u003cicon name=\"arrow-down\" color=\"tertiary\"/>  \u003cbox background=\"rgba(22,163,74,0.08)\" border={{size:1,color:\"success\"}} radius=\"md\" padding={3} width=\"100%\" align=\"center\" gap={1}>    \u003ctext color=\"secondary\" size=\"xs\">検索結果\u003c/text>    \u003ctitle color=\"success\" size=\"xl\">みかん\u003c/title>  \u003c/box>\u003c/box>「VLOOKUPでは『表の何列目を取るか』を数字で指定しました。でもXLOOKUPでは、**取り出したいセル範囲を直接指定する**んです。」### 2. VLOOKUPとの違い| 比較 | VLOOKUP | XLOOKUP ||---|---|---|| 左方向の検索 | 原則不可 | 可能 || 完全一致 | FALSEを指定 | 標準で完全一致 || 列番号 | 必要 | 不要 || 見つからない場合 | #N/A | 任意の文字を指定可能 || 複数列の取得 | 基本は1列ずつ | 一度に複数列可能 |「特に重要なのは、XLOOKUPでは**検索範囲と戻り範囲を独立して指定できる**ことです。」### 3. 見つからない場合の設定XLOOKUPには省略可能な引数もあります。例えば、商品コード999が存在しなければ「該当なし」と表示します。「VLOOKUPでは通常、IFERRORなどと組み合わせる必要がありましたが、XLOOKUPなら関数の中で指定できます。」なお、XLOOKUPの標準は完全一致です。一致モードを変えれば近似一致やワイルドカード検索もできます。## C｜イメージ理解：検索と取り出しを別々に考える「先輩、ここは図で考えましょう。」\u003cbox border radius=\"lg\" padding={3} gap={2}>  **XLOOKUPの基本イメージ**  \u003csvg viewBox=\"0 0 340 195\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\">    \u003crect x=\"10\" y=\"10\" width=\"145\" height=\"170\" rx=\"9\" fill=\"#2563eb\" fillOpacity=\".09\" stroke=\"#2563eb\" strokeWidth=\"1.5\"/>    \u003crect x=\"185\" y=\"10\" width=\"145\" height=\"170\" rx=\"9\" fill=\"#16a34a\" fillOpacity=\".09\" stroke=\"#16a34a\" strokeWidth=\"1.5\"/>    \u003cg fontSize=\"13\" textAnchor=\"middle\" fill=\"currentColor\">      \u003ctext x=\"82\" y=\"32\" fontWeight=\"bold\">検索範囲 A列\u003c/text>      \u003ctext x=\"257\" y=\"32\" fontWeight=\"bold\">戻り範囲 B列\u003c/text>      \u003ctext x=\"82\" y=\"65\">101\u003c/text>\u003ctext x=\"257\" y=\"65\">りんご\u003c/text>      \u003ctext x=\"82\" y=\"110\" fontWeight=\"bold\">102\u003c/text>\u003ctext x=\"257\" y=\"110\" fontWeight=\"bold\">みかん\u003c/text>      \u003ctext x=\"82\" y=\"155\">103\u003c/text>\u003ctext x=\"257\" y=\"155\">ぶどう\u003c/text>    \u003c/g>    \u003crect x=\"19\" y=\"88\" width=\"127\" height=\"37\" rx=\"6\" fill=\"#2563eb\" fillOpacity=\".17\" stroke=\"#2563eb\" strokeWidth=\"1.5\"/>    \u003crect x=\"194\" y=\"88\" width=\"127\" height=\"37\" rx=\"6\" fill=\"#16a34a\" fillOpacity=\".17\" stroke=\"#16a34a\" strokeWidth=\"1.5\"/>    \u003cpath d=\"M150 106 H185\" stroke=\"#16a34a\" strokeWidth=\"2.5\"/>    \u003cpath d=\"M178 100 L185 106 L178 112\" stroke=\"#16a34a\" strokeWidth=\"2.5\" fill=\"none\"/>  \u003c/svg>  \u003ccaption>検索範囲で102を見つけ、その位置に対応する戻り範囲の「みかん」を取得します。\u003c/caption>\u003c/box>「ここで大切なのは、Excelが単に右隣のセルを見ているわけではないことです。」「検索範囲で見つけた位置と、戻り範囲の位置を対応させているんです。だから戻り範囲が左側にあっても構いません。」## D｜具体例：実際に操作して理解する「では先輩、商品コードから商品名を調べたり、逆に商品名から商品コードを調べたりしてみましょう。」{@body const data=[{code:\"101\",name:\"りんご\",price:\"150円\"},{code:\"102\",name:\"みかん\",price:\"100円\"},{code:\"103\",name:\"ぶどう\",price:\"300円\"}]}{@body const [mode,setMode]=DIL.useState(\"code\")}{@body const [query,setQuery]=DIL.useState(\"102\")}{@body const [target,setTarget]=DIL.useState(\"name\")}{@body const [notFound,setNotFound]=DIL.useState(true)}{@body const options=mode===\"code\"?data.map(x=>({value:x.code,label:x.code})):data.map(x=>({value:x.name,label:x.name}))}{@body const selected=data.find(x=>x[mode]===query)}{@body const answer=selected?selected[target]:(notFound?\"該当なし\":\"#N/A\")}{@body const ranges={code:\"A2:A4\",name:\"B2:B4\",price:\"C2:C4\"}}{@body const formula=\"=XLOOKUP(\"+(/^\\d+$/.test(query)?query:'\"'+query+'\"')+\",\"+ranges[mode]+\",\"+ranges[target]+(notFound?',\"該当なし\"':\"\")+\")\"}\u003cbox border radius=\"xl\" padding={3} gap={3}>  \u003crow justify=\"between\" align=\"center\">    **XLOOKUP練習シミュレーター**    \u003cbadge>操作可能\u003c/badge>  \u003c/row>  \u003ctable>    \u003ctable-row>\u003ctable-cell width=\"10%\"> \u003c/table-cell>\u003ctable-cell>A\u003c/table-cell>\u003ctable-cell>B\u003c/table-cell>\u003ctable-cell>C\u003c/table-cell>\u003c/table-row>    \u003ctable-row>\u003ctable-cell>1\u003c/table-cell>\u003ctable-cell>商品コード\u003c/table-cell>\u003ctable-cell>商品名\u003c/table-cell>\u003ctable-cell>価格\u003c/table-cell>\u003c/table-row>    {#each data as x,i}      \u003ctable-row>        \u003ctable-cell>{i+2}\u003c/table-cell>        \u003ctable-cell>{x.code}\u003c/table-cell>        \u003ctable-cell>{x.name}\u003c/table-cell>        \u003ctable-cell>{x.price}\u003c/table-cell>      \u003c/table-row>    {/each}  \u003c/table>  \u003cbox gap={1}>    \u003clabel>① 何を使って検索する？\u003c/label>    \u003cradio-group direction=\"col\" value={mode} onChange={v=>{setMode(v);setTarget(v===\"code\"?\"name\":\"code\");setQuery(v===\"code\"?\"102\":\"みかん\")}}>      \u003cradio value=\"code\">商品コードから検索\u003c/radio>      \u003cradio value=\"name\">商品名から検索（左方向）\u003c/radio>    \u003c/radio-group>  \u003c/box>  \u003cbox gap={1}>    \u003clabel>② 検索する値\u003c/label>    \u003cinput value={query} onChange={setQuery} placeholder=\"検索する値を入力\"/>    \u003crow gap={1} wrap=\"wrap\">      {#each options as op}        \u003cbutton size=\"xs\" color=\"secondary\" variant={query===op.value?\"solid\":\"outline\"} onClick={()=>setQuery(op.value)}>{op.label}\u003c/button>      {/each}      \u003cbutton size=\"xs\" color=\"secondary\" variant=\"outline\" onClick={()=>setQuery(\"999\")}>存在しない値\u003c/button>    \u003c/row>  \u003c/box>  \u003cbox gap={1}>    \u003clabel>③ 何を取り出す？\u003c/label>    \u003cradio-group direction=\"col\" value={target} onChange={setTarget}>      {#if mode!==\"code\"}\u003cradio value=\"code\">商品コード（A列）\u003c/radio>{/if}      {#if mode!==\"name\"}\u003cradio value=\"name\">商品名（B列）\u003c/radio>{/if}      \u003cradio value=\"price\">価格（C列）\u003c/radio>    \u003c/radio-group>  \u003c/box>  \u003ccheckbox checked={notFound} onChange={setNotFound} lineThrough={false}>見つからない場合は「該当なし」と表示する\u003c/checkbox>  \u003cbox background=\"surface-secondary\" padding={3} radius=\"lg\" gap={2}>    \u003ctext color=\"secondary\" size=\"xs\">作成された数式\u003c/text>    \u003ctext weight=\"medium\" size=\"sm\">{formula}\u003c/text>    \u003crow justify=\"end\">      \u003cbutton size=\"xs\" color=\"secondary\" variant=\"outline\" onClick={()=>GenUI.copy(formula)}>\u003cicon name=\"copy\" size=\"xs\"/> 数式をコピー\u003c/button>    \u003c/row>    \u003cdivider color=\"subtle\"/>    \u003ctext color=\"secondary\" size=\"xs\">検索結果\u003c/text>    \u003ctitle size=\"xl\" color={selected?\"success\":\"danger\"}>{answer}\u003c/title>    \u003ccaption>{selected?\"検索範囲で一致した位置から、対応する戻り範囲の値を取得しました。\":\"一致する値が見つかりませんでした。\"}\u003c/caption>  \u003c/box>  \u003ccaption>※ この練習では商品コードを数値として扱います。実際のExcelでは、検索値と検索範囲のデータ型にも注意してください。\u003c/caption>\u003c/box>「特に『商品名から検索』を選んでください。B列で商品名を探して、左側のA列にある商品コードを取り出せますよね。これがVLOOKUPとの大きな違いです。」### 実務での使い方例えば、銀行明細に記載された取引先コードから、別シートにある取引先名を表示する場合です。「この式なら、A2の取引先コードをマスタのA列で探し、対応するB列の取引先名を表示できます。登録されていなければ『未登録』になります。」「ただし、同じコードが複数存在する場合は、標準では最初に見つかったものが返ります。重複のあるデータでは注意してくださいね。」## 理解確認：3問{@body const qs=[{q:\"XLOOKUPで、検索範囲より左側の列から値を取り出すことはできますか？\",opts:[\"できない\",\"できる\",\"完全一致の場合だけできない\"],correct:1,explain:\"検索範囲と戻り範囲を独立して指定するので、左方向にも検索できます。\"},{q:\"XLOOKUPの標準の一致方法はどれですか？\",opts:[\"完全一致\",\"近似一致\",\"部分一致\"],correct:0,explain:\"標準は完全一致です。VLOOKUPのようにFALSEを毎回指定する必要はありません。\"},{q:\"=XLOOKUP(102,A2:A4,C2:C4) の戻り値は？\",opts:[\"みかん\",\"102\",\"100円\"],correct:2,explain:\"A列で102を見つけ、その位置に対応するC列の価格100円を取り出します。\"}]}{@body const [ans,setAns]=DIL.useState({})}\u003cbox border radius=\"lg\" padding={3} gap={3}>  {#each qs as q,i}    \u003cbox key={i} gap={2}>      **Q{i+1}. {q.q}**      \u003cradio-group direction=\"col\" value={ans[i]===undefined?\"\":String(ans[i])} onChange={v=>setAns(p=>({...p,[i]:Number(v)}))}>        {#each q.opts as opt,j}          \u003cradio value={String(j)}>{opt}\u003c/radio>        {/each}      \u003c/radio-group>      {#if ans[i]!==undefined}        \u003cbox background=\"surface-secondary\" radius=\"md\" padding={2} gap={1}>          \u003crow align=\"center\" gap={2}>            \u003cicon name={ans[i]===q.correct?\"check-circle\":\"x-circle\"} color={ans[i]===q.correct?\"success\":\"danger\"}/>            **{ans[i]===q.correct?\"正解です！\":\"不正解です\"}**          \u003c/row>          \u003ctext size=\"sm\">正解：{q.opts[q.correct]}。{q.explain}\u003c/text>        \u003c/box>      {/if}    \u003c/box>    {#if i\u003c2}\u003cdivider color=\"subtle\"/>{/if}  {/each}  \u003crow align=\"center\" justify=\"between\">    \u003ctext color=\"secondary\" size=\"sm\">正解数：{qs.filter((q,i)=>ans[i]===q.correct).length} / 3\u003c/text>    \u003cbutton color=\"secondary\" variant=\"outline\" size=\"sm\" onClick={()=>setAns({})}>再挑戦\u003c/button>  \u003c/row>\u003c/box>## 30秒復習「先輩、最後に6つだけ確認します。」1. **何の関数？** 指定した値を検索して、対応する値を取り出す関数。2. **一番重要なのは？** 検索範囲と戻り範囲を自由に指定できること。3. **なぜ便利？** VLOOKUPのように列番号を数える必要がないから。4. **検索の流れは？** 検索値 → 検索範囲 → 戻り範囲。5. **具体例は？** 商品コード102から「みかん」を取得。6. **間違えやすいところは？** 検索範囲と戻り範囲の大きさを対応させること。検索値のデータ型や重複にも注意。## 一文記憶**XLOOKUPは「探す場所」と「取り出す場所」を別々に指定できる検索関数。**「先輩、VLOOKUPは『表の左端から探して、右側の何列目を取るか』でしたよね。一方、XLOOKUPは『この範囲から探して、あの範囲から取る』です。この違いが頭に入れば、使い分けはかなり簡単になります。」「ちなみに、XLOOKUPはMicrosoft 365やExcel 2021以降などで利用できますが、Excel 2019以前では基本的に使えません。職場のExcelのバージョンも確認しておきましょう。」","sections":{"A":"\u003ch1>② XLOOKUP関数（エックスルックアップ関数）\u003c/h1>\n\u003cp class=\"muted\">Excel関数｜検索・参照｜VLOOKUPとの比較\u003c/p>\u003ch2>A｜要点：XLOOKUPとは？\u003c/h2>\u003cp>「先輩、さっきVLOOKUP関数を勉強しましたよね。今回は、その不便なところを改善した\u003cstrong>XLOOKUP関数\u003c/strong>です。」\u003c/p>\n\u003cp>「一言でいうと、\u003cstrong>表の中から指定した値を探して、それに対応する別の値を取り出す関数\u003c/strong>なんです。」\u003c/p>\n\u003cp>VLOOKUPとの最大の違いは、\u003cstrong>検索する列と、結果を取り出す列を自由に指定できること\u003c/strong>です。\u003c/p>\n\u003cdiv class=\"source-static\">\u003cdiv>\n  \u003cstrong>例えば、商品コードから商品名を探す場合\u003c/strong>\n\u003c/div>\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>A列：商品コード\u003c/th>\n\u003cth>B列：商品名\u003c/th>\n\u003cth>C列：価格\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>101\u003c/td>\n\u003ctd>りんご\u003c/td>\n\u003ctd>150円\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>102\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>みかん\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>100円\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>103\u003c/td>\n\u003ctd>ぶどう\u003c/td>\n\u003ctd>300円\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cdiv class=\"source-static\">\u003cdiv>\n    \u003cdiv>\n      \u003cdiv>\n        \u003cspan>検索値\u003c/span>\n        \u003cstrong>102\u003c/strong>\n        \u003csmall>商品コード\u003c/small>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv>\n      \u003cdiv>\n        \u003cspan>検索結果\u003c/span>\n        \u003cstrong>みかん\u003c/strong>\n        \u003csmall>商品名\u003c/small>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003c/div>\u003cp>「ここまではVLOOKUPと同じです。でも、XLOOKUPなら商品名から商品コードを探すこともできるんですよ。」\u003c/p>\n","B":"\u003ch2>B｜詳しい解説：仕組みと使い方\u003c/h2>\u003ch3>1. 基本の書き方\u003c/h3>\n\u003cp>「まずは、この3つを覚えましょう。」\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>引数\u003c/th>\n\u003cth>意味\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>検索値\u003c/td>\n\u003ctd>何を探すか\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>検索範囲\u003c/td>\n\u003ctd>どこから探すか\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>戻り範囲\u003c/td>\n\u003ctd>どこの値を取り出すか\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>先ほどの商品表を使うと、こうなります。\u003c/p>\n\u003cdiv class=\"source-static\">\u003cdiv>\n  \u003cdiv>\n    \u003cstrong>① 検索値：102\u003c/strong>\n\u003cspan>商品コード102を探す\u003c/span>\n  \u003c/div>\n   → \n  \u003cdiv>\n    \u003cstrong>② 検索範囲：A2:A4\u003c/strong>\n\u003cspan>A列から102を見つける\u003c/span>\n  \u003c/div>\n   → \n  \u003cdiv>\n    \u003cstrong>③ 戻り範囲：B2:B4\u003c/strong>\n\u003cspan>同じ位置にあるB列の値を取得\u003c/span>\n  \u003c/div>\n   → \n  \u003cdiv>\n    \u003cspan>検索結果\u003c/span>\n    \u003cstrong>みかん\u003c/strong>\n  \u003c/div>\n\u003c/div>\n\u003c/div>\u003cp>「VLOOKUPでは『表の何列目を取るか』を数字で指定しました。でもXLOOKUPでは、\u003cstrong>取り出したいセル範囲を直接指定する\u003c/strong>んです。」\u003c/p>\n\u003ch3>2. VLOOKUPとの違い\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>比較\u003c/th>\n\u003cth>VLOOKUP\u003c/th>\n\u003cth>XLOOKUP\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>左方向の検索\u003c/td>\n\u003ctd>原則不可\u003c/td>\n\u003ctd>可能\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>完全一致\u003c/td>\n\u003ctd>FALSEを指定\u003c/td>\n\u003ctd>標準で完全一致\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>列番号\u003c/td>\n\u003ctd>必要\u003c/td>\n\u003ctd>不要\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>見つからない場合\u003c/td>\n\u003ctd>#N/A\u003c/td>\n\u003ctd>任意の文字を指定可能\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>複数列の取得\u003c/td>\n\u003ctd>基本は1列ずつ\u003c/td>\n\u003ctd>一度に複数列可能\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>「特に重要なのは、XLOOKUPでは\u003cstrong>検索範囲と戻り範囲を独立して指定できる\u003c/strong>ことです。」\u003c/p>\n\u003ch3>3. 見つからない場合の設定\u003c/h3>\n\u003cp>XLOOKUPには省略可能な引数もあります。\u003c/p>\n\u003cp>例えば、\u003c/p>\n\u003cp>商品コード999が存在しなければ「該当なし」と表示します。\u003c/p>\n\u003cp>「VLOOKUPでは通常、IFERRORなどと組み合わせる必要がありましたが、XLOOKUPなら関数の中で指定できます。」\u003c/p>\n\u003cp>なお、XLOOKUPの標準は完全一致です。一致モードを変えれば近似一致やワイルドカード検索もできます。\u003c/p>\n","C":"\u003ch2>C｜イメージ理解：検索と取り出しを別々に考える\u003c/h2>\u003cp>「先輩、ここは図で考えましょう。」\u003c/p>\n\u003cdiv class=\"source-static\">\u003cdiv>\n  \u003cstrong>XLOOKUPの基本イメージ\u003c/strong>\n\u003csvg viewBox=\"0 0 340 195\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\">\n    \u003crect x=\"10\" y=\"10\" width=\"145\" height=\"170\" rx=\"9\" fill=\"#2563eb\" fill-opacity=\".09\" stroke=\"#2563eb\" stroke-width=\"1.5\"/>\n    \u003crect x=\"185\" y=\"10\" width=\"145\" height=\"170\" rx=\"9\" fill=\"#16a34a\" fill-opacity=\".09\" stroke=\"#16a34a\" stroke-width=\"1.5\"/>\n    \u003cg font-size=\"13\" text-anchor=\"middle\" fill=\"currentColor\">\n      \u003ctext x=\"82\" y=\"32\" font-weight=\"bold\">検索範囲 A列\u003c/text>\n      \u003ctext x=\"257\" y=\"32\" font-weight=\"bold\">戻り範囲 B列\u003c/text>\n      \u003ctext x=\"82\" y=\"65\">101\u003c/text>\u003ctext x=\"257\" y=\"65\">りんご\u003c/text>\n      \u003ctext x=\"82\" y=\"110\" font-weight=\"bold\">102\u003c/text>\u003ctext x=\"257\" y=\"110\" font-weight=\"bold\">みかん\u003c/text>\n      \u003ctext x=\"82\" y=\"155\">103\u003c/text>\u003ctext x=\"257\" y=\"155\">ぶどう\u003c/text>\n    \u003c/g>\n    \u003crect x=\"19\" y=\"88\" width=\"127\" height=\"37\" rx=\"6\" fill=\"#2563eb\" fill-opacity=\".17\" stroke=\"#2563eb\" stroke-width=\"1.5\"/>\n    \u003crect x=\"194\" y=\"88\" width=\"127\" height=\"37\" rx=\"6\" fill=\"#16a34a\" fill-opacity=\".17\" stroke=\"#16a34a\" stroke-width=\"1.5\"/>\n    \u003cpath d=\"M150 106 H185\" stroke=\"#16a34a\" stroke-width=\"2.5\"/>\n    \u003cpath d=\"M178 100 L185 106 L178 112\" stroke=\"#16a34a\" stroke-width=\"2.5\" fill=\"none\"/>\n  \u003c/svg>\n  \u003csmall>検索範囲で102を見つけ、その位置に対応する戻り範囲の「みかん」を取得します。\u003c/small>\n\u003c/div>\n\u003c/div>\u003cp>「ここで大切なのは、Excelが単に右隣のセルを見ているわけではないことです。」\u003c/p>\n\u003cp>「検索範囲で見つけた位置と、戻り範囲の位置を対応させているんです。だから戻り範囲が左側にあっても構いません。」\u003c/p>\n","D":"\u003ch2>D｜具体例：実際に操作して理解する\u003c/h2>\u003cp>「では先輩、商品コードから商品名を調べたり、逆に商品名から商品コードを調べたりしてみましょう。」\u003c/p>\n\u003cp>「特に『商品名から検索』を選んでください。B列で商品名を探して、左側のA列にある商品コードを取り出せますよね。これがVLOOKUPとの大きな違いです。」\u003c/p>\n\u003ch3>実務での使い方\u003c/h3>\n\u003cp>例えば、銀行明細に記載された取引先コードから、別シートにある取引先名を表示する場合です。\u003c/p>\n\u003cp>「この式なら、A2の取引先コードをマスタのA列で探し、対応するB列の取引先名を表示できます。登録されていなければ『未登録』になります。」\u003c/p>\n\u003cp>「ただし、同じコードが複数存在する場合は、標準では最初に見つかったものが返ります。重複のあるデータでは注意してくださいね。」\u003c/p>\n","その他":"\u003ch2>理解確認：3問\u003c/h2>\u003ch2>30秒復習\u003c/h2>\u003cp>「先輩、最後に6つだけ確認します。」\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>何の関数？\u003c/strong> 指定した値を検索して、対応する値を取り出す関数。\u003c/li>\n\u003cli>\u003cstrong>一番重要なのは？\u003c/strong> 検索範囲と戻り範囲を自由に指定できること。\u003c/li>\n\u003cli>\u003cstrong>なぜ便利？\u003c/strong> VLOOKUPのように列番号を数える必要がないから。\u003c/li>\n\u003cli>\u003cstrong>検索の流れは？\u003c/strong> 検索値 → 検索範囲 → 戻り範囲。\u003c/li>\n\u003cli>\u003cstrong>具体例は？\u003c/strong> 商品コード102から「みかん」を取得。\u003c/li>\n\u003cli>\u003cstrong>間違えやすいところは？\u003c/strong> 検索範囲と戻り範囲の大きさを対応させること。検索値のデータ型や重複にも注意。\u003c/li>\n\u003c/ol>\n\u003ch2>一文記憶\u003c/h2>\u003cp>\u003cstrong>XLOOKUPは「探す場所」と「取り出す場所」を別々に指定できる検索関数。\u003c/strong>\u003c/p>\n\u003cp>「先輩、VLOOKUPは『表の左端から探して、右側の何列目を取るか』でしたよね。一方、XLOOKUPは『この範囲から探して、あの範囲から取る』です。この違いが頭に入れば、使い分けはかなり簡単になります。」\u003c/p>\n\u003cp>「ちなみに、XLOOKUPはMicrosoft 365やExcel 2021以降などで利用できますが、Excel 2019以前では基本的に使えません。職場のExcelのバージョンも確認しておきましょう。」\u003c/p>\n"},"prose":["# ② XLOOKUP関数（エックスルックアップ関数）","Excel関数｜検索・参照｜VLOOKUPとの比較","## A｜要点：XLOOKUPとは？","「先輩、さっきVLOOKUP関数を勉強しましたよね。今回は、その不便なところを改善した**XLOOKUP関数**です。」","「一言でいうと、**表の中から指定した値を探して、それに対応する別の値を取り出す関数**なんです。」","VLOOKUPとの最大の違いは、**検索する列と、結果を取り出す列を自由に指定できること**です。","| A列：商品コード | B列：商品名 | C列：価格 |\n  |---|---|---|\n  | 101 | りんご | 150円 |\n  | **102** | **みかん** | **100円** |\n  | 103 | ぶどう | 300円 |","「ここまではVLOOKUPと同じです。でも、XLOOKUPなら商品名から商品コードを探すこともできるんですよ。」","## B｜詳しい解説：仕組みと使い方","### 1. 基本の書き方","「まずは、この3つを覚えましょう。」","| 引数 | 意味 |\n|---|---|\n| 検索値 | 何を探すか |\n| 検索範囲 | どこから探すか |\n| 戻り範囲 | どこの値を取り出すか |","先ほどの商品表を使うと、こうなります。","「VLOOKUPでは『表の何列目を取るか』を数字で指定しました。でもXLOOKUPでは、**取り出したいセル範囲を直接指定する**んです。」","### 2. VLOOKUPとの違い","| 比較 | VLOOKUP | XLOOKUP |\n|---|---|---|\n| 左方向の検索 | 原則不可 | 可能 |\n| 完全一致 | FALSEを指定 | 標準で完全一致 |\n| 列番号 | 必要 | 不要 |\n| 見つからない場合 | #N/A | 任意の文字を指定可能 |\n| 複数列の取得 | 基本は1列ずつ | 一度に複数列可能 |","「特に重要なのは、XLOOKUPでは**検索範囲と戻り範囲を独立して指定できる**ことです。」","### 3. 見つからない場合の設定","XLOOKUPには省略可能な引数もあります。","例えば、","商品コード999が存在しなければ「該当なし」と表示します。","「VLOOKUPでは通常、IFERRORなどと組み合わせる必要がありましたが、XLOOKUPなら関数の中で指定できます。」","なお、XLOOKUPの標準は完全一致です。一致モードを変えれば近似一致やワイルドカード検索もできます。","## C｜イメージ理解：検索と取り出しを別々に考える","「先輩、ここは図で考えましょう。」","「ここで大切なのは、Excelが単に右隣のセルを見ているわけではないことです。」","「検索範囲で見つけた位置と、戻り範囲の位置を対応させているんです。だから戻り範囲が左側にあっても構いません。」","## D｜具体例：実際に操作して理解する","「では先輩、商品コードから商品名を調べたり、逆に商品名から商品コードを調べたりしてみましょう。」","「特に『商品名から検索』を選んでください。B列で商品名を探して、左側のA列にある商品コードを取り出せますよね。これがVLOOKUPとの大きな違いです。」","### 実務での使い方","例えば、銀行明細に記載された取引先コードから、別シートにある取引先名を表示する場合です。","「この式なら、A2の取引先コードをマスタのA列で探し、対応するB列の取引先名を表示できます。登録されていなければ『未登録』になります。」","「ただし、同じコードが複数存在する場合は、標準では最初に見つかったものが返ります。重複のあるデータでは注意してくださいね。」","## 理解確認：3問","## 30秒復習","「先輩、最後に6つだけ確認します。」","1. **何の関数？** 指定した値を検索して、対応する値を取り出す関数。\n2. **一番重要なのは？** 検索範囲と戻り範囲を自由に指定できること。\n3. **なぜ便利？** VLOOKUPのように列番号を数える必要がないから。\n4. **検索の流れは？** 検索値 → 検索範囲 → 戻り範囲。\n5. **具体例は？** 商品コード102から「みかん」を取得。\n6. **間違えやすいところは？** 検索範囲と戻り範囲の大きさを対応させること。検索値のデータ型や重複にも注意。","## 一文記憶","**XLOOKUPは「探す場所」と「取り出す場所」を別々に指定できる検索関数。**","「先輩、VLOOKUPは『表の左端から探して、右側の何列目を取るか』でしたよね。一方、XLOOKUPは『この範囲から探して、あの範囲から取る』です。この違いが頭に入れば、使い分けはかなり簡単になります。」","「ちなみに、XLOOKUPはMicrosoft 365やExcel 2021以降などで利用できますが、Excel 2019以前では基本的に使えません。職場のExcelのバージョンも確認しておきましょう。」"],"quizzes":[{"q":"XLOOKUPで、検索範囲より左側の列から値を取り出すことはできますか？","options":["できない","できる","完全一致の場合だけできない"],"correct":1,"explain":"検索範囲と戻り範囲を独立して指定するので、左方向にも検索できます。"},{"q":"XLOOKUPの標準の一致方法はどれですか？","options":["完全一致","近似一致","部分一致"],"correct":0,"explain":"標準は完全一致です。VLOOKUPのようにFALSEを毎回指定する必要はありません。"},{"q":"=XLOOKUP(102,A2:A4,C2:C4) の戻り値は？","options":["みかん","102","100円"],"correct":2,"explain":"A列で102を見つけ、その位置に対応するC列の価格100円を取り出します。"}]},{"name":"IF","original":"\u003cp># ③ IF関数（イフ関数）\u003c/p>\u003cp>&lt;text color=\"secondary\" size=\"sm\"&gt;Excel関数｜論理関数｜条件による自動判定&lt;/text&gt;\u003c/p>\u003cp>## A｜要点：IF関数とは？\u003c/p>\u003cp>「先輩、今回はExcelのIF関数ですね。VLOOKUPやXLOOKUPが『情報を探す関数』だったのに対して、IFは**条件によって処理を分ける関数**なんです。」\u003c/p>\u003cp>「例えば、テストで80点以上なら合格、80点未満なら不合格と表示したいとします。」\u003c/p>\u003cp>&lt;box border radius=\"lg\" padding={3} gap={2}&gt;\u003cbr>  **IF関数の基本イメージ**\u003c/p>\u003cp>  &lt;box background=\"surface-secondary\" radius=\"lg\" padding={3} align=\"center\" gap={1}&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"xs\"&gt;条件&lt;/text&gt;\u003cbr>    **点数は80点以上？**\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;svg viewBox=\"0 0 320 112\" width=\"100%\"&gt;\u003cbr>    &lt;path d=\"M160 0 V17 H80 V38 M160 17 H240 V38\" stroke=\"currentColor\" strokeOpacity=\".45\" strokeWidth=\"1.8\" fill=\"none\"/&gt;\u003cbr>    &lt;path d=\"M75 32 L80 39 L85 32 M235 32 L240 39 L245 32\" fill=\"none\" stroke=\"currentColor\" strokeOpacity=\".45\" strokeWidth=\"1.8\"/&gt;\u003cbr>    &lt;rect x=\"7\" y=\"40\" width=\"146\" height=\"62\" rx=\"9\" fill=\"#16a34a\" fillOpacity=\".10\" stroke=\"#16a34a\"/&gt;\u003cbr>    &lt;rect x=\"167\" y=\"40\" width=\"146\" height=\"62\" rx=\"9\" fill=\"#dc2626\" fillOpacity=\".08\" stroke=\"#dc2626\"/&gt;\u003cbr>    &lt;g fontSize=\"13\" textAnchor=\"middle\" fill=\"currentColor\"&gt;\u003cbr>      &lt;text x=\"80\" y=\"59\"&gt;YES（真）&lt;/text&gt;\u003cbr>      &lt;text x=\"240\" y=\"59\"&gt;NO（偽）&lt;/text&gt;\u003cbr>    &lt;/g&gt;\u003cbr>    &lt;text x=\"80\" y=\"85\" textAnchor=\"middle\" fontSize=\"19\" fontWeight=\"bold\" fill=\"#16a34a\"&gt;合格&lt;/text&gt;\u003cbr>    &lt;text x=\"240\" y=\"85\" textAnchor=\"middle\" fontSize=\"19\" fontWeight=\"bold\" fill=\"#dc2626\"&gt;不合格&lt;/text&gt;\u003cbr>  &lt;/svg&gt;\u003cbr>  &lt;caption&gt;条件が成立するかどうかで、表示する結果が変わります。&lt;/caption&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>「つまりIF関数は、Excelに『もし○○なら△△、そうでなければ□□にして』と判断させる仕組みなんです。」\u003c/p>\u003cp>## B｜詳しい解説：IF関数の仕組み\u003c/p>\u003cp>### 1. 基本の書き方\u003c/p>\u003cp>「3つの引数を順番に見ていきましょう。」\u003c/p>\u003cp>| 引数 | 意味 |\u003cbr>|---|---|\u003cbr>| 論理式 | どんな条件で判断する？ |\u003cbr>| 真の場合 | 条件が成立したら何を返す？ |\u003cbr>| 偽の場合 | 条件が成立しなかったら何を返す？ |\u003c/p>\u003cp>例えば、A2に点数が入力されているとします。\u003c/p>\u003cp>この式を分解すると、\u003c/p>\u003cp>- `A2&gt;=80`：A2が80以上か調べる\u003cbr>- `\"合格\"`：80以上なら合格を表示\u003cbr>- `\"不合格\"`：80未満なら不合格を表示\u003c/p>\u003cp>「先輩、`&gt;=`は『以上』という意味です。`&gt;`だけなら『より大きい』なので、80点ちょうどの扱いが変わります。ここは間違えないでくださいね。」\u003c/p>\u003cp>### 2. IF関数が判断する流れ\u003c/p>\u003cp>&lt;box gap={1} align=\"center\"&gt;\u003cbr>  &lt;box border radius=\"md\" padding={3} width=\"100%\" align=\"center\" gap={1}&gt;\u003cbr>    **① 論理式を評価**\u003c/p>\u003cp>    &lt;text size=\"sm\"&gt;A2の点数が80以上かを調べる&lt;/text&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;icon name=\"arrow-down\" color=\"tertiary\"/&gt;\u003cbr>  &lt;box border radius=\"md\" padding={3} width=\"100%\" align=\"center\" gap={1}&gt;\u003cbr>    **② TRUEかFALSEかを判断**\u003c/p>\u003cp>    &lt;text size=\"sm\"&gt;条件が成立すればTRUE、成立しなければFALSE&lt;/text&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;icon name=\"arrow-down\" color=\"tertiary\"/&gt;\u003cbr>  &lt;box background=\"rgba(22,163,74,0.07)\" border={{size:1,color:\"success\"}} radius=\"md\" padding={3} width=\"100%\" align=\"center\" gap={1}&gt;\u003cbr>    **③ 対応する結果を返す**\u003c/p>\u003cp>    &lt;text size=\"sm\"&gt;TRUEなら「合格」、FALSEなら「不合格」&lt;/text&gt;\u003cbr>  &lt;/box&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>### 3. 比較演算子を覚えましょう\u003c/p>\u003cp>「IF関数では、条件を作るための比較演算子をよく使います。」\u003c/p>\u003cp>| 記号 | 意味 | 例 |\u003cbr>|---|---|---|\u003cbr>| `=` | 等しい | `A2=80` |\u003cbr>| `&gt;` | より大きい | `A2&gt;80` |\u003cbr>| `&lt;` | より小さい | `A2&lt;80` |\u003cbr>| `&gt;=` | 以上 | `A2&gt;=80` |\u003cbr>| `&lt;=` | 以下 | `A2&lt;=80` |\u003cbr>| `&lt;&gt;` | 等しくない | `A2&lt;&gt;80` |\u003c/p>\u003cp>「特に`&lt;&gt;`は少し変わった形ですが、『等しくない』という意味なので覚えておきましょう。」\u003c/p>\u003cp>### 4. 数値と文字列の違い\u003c/p>\u003cp>「もう一つ大切なのが、ダブルクォーテーションです。」\u003c/p>\u003cp>「合格」のような文字列は、通常`\" \"`で囲みます。\u003c/p>\u003cp>一方、数値を返すなら囲みません。\u003c/p>\u003cp>この式は、80点以上なら数値の1、それ以外なら数値の0を返します。\u003c/p>\u003cp>## C｜イメージ理解：IFは分かれ道\u003c/p>\u003cp>「先輩、IF関数は道の分岐だと考えると理解しやすいですよ。」\u003c/p>\u003cp>例えば、遊園地のアトラクションに身長制限があるとします。\u003c/p>\u003cp>「身長が120cm以上なら乗れる。120cm未満なら乗れない。」\u003c/p>\u003cp>ここで必要なのは、身長という情報を探すことではありません。\u003c/p>\u003cp>**すでに分かっている身長を条件と比較して、結果を決めること**です。\u003c/p>\u003cp>これがIF関数の役割なんです。\u003c/p>\u003cp>「だから、VLOOKUPやXLOOKUPと混同しないでくださいね。検索するのか、判断するのか。この違いが重要です。」\u003c/p>\u003cp>## D｜具体例：実際にIF関数を操作する\u003c/p>\u003cp>「では先輩、点数を変えながらIF関数の動きを確認しましょう。」\u003c/p>\u003cp>{@body const [score,setScore]=DIL.useState(75)}\u003cbr>{@body const [passing,setPassing]=DIL.useState(80)}\u003cbr>{@body const passed=score&gt;=passing}\u003cbr>&lt;box border radius=\"xl\" padding={3} gap={3}&gt;\u003cbr>  &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>    **IF関数シミュレーター**\u003cbr>    &lt;badge&gt;操作できます&lt;/badge&gt;\u003cbr>  &lt;/row&gt;\u003cbr>  &lt;box gap={1}&gt;\u003cbr>    &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>      &lt;label&gt;テストの点数（A2）&lt;/label&gt;\u003cbr>      &lt;title size=\"lg\" tabularNums&gt;{score}点&lt;/title&gt;\u003cbr>    &lt;/row&gt;\u003cbr>    &lt;slider min={0} max={100} step={1} value={score} onChange={setScore}/&gt;\u003cbr>    &lt;row justify=\"between\"&gt;\u003cbr>      &lt;caption&gt;0点&lt;/caption&gt;\u003cbr>      &lt;caption&gt;100点&lt;/caption&gt;\u003cbr>    &lt;/row&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;box gap={1}&gt;\u003cbr>    &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>      &lt;label&gt;合格基準&lt;/label&gt;\u003cbr>      &lt;text weight=\"medium\" tabularNums&gt;{passing}点以上&lt;/text&gt;\u003cbr>    &lt;/row&gt;\u003cbr>    &lt;slider min={50} max={100} step={5} value={passing} onChange={setPassing}/&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;box background=\"surface-secondary\" radius=\"lg\" padding={3} gap={2}&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"xs\"&gt;現在の数式&lt;/text&gt;\u003cbr>    &lt;row align=\"center\" justify=\"between\" wrap=\"wrap\"&gt;\u003cbr>      &lt;text weight=\"medium\" size=\"sm\"&gt;{\"=IF(A2&gt;=\"+passing+',\"合格\",\"不合格\")'}&lt;/text&gt;\u003cbr>      &lt;button size=\"xs\" color=\"secondary\" variant=\"outline\" onClick={()=&gt;GenUI.copy('=IF(A2&gt;='+passing+',\"合格\",\"不合格\")')}&gt;&lt;icon name=\"copy\" size=\"xs\"/&gt; コピー&lt;/button&gt;\u003cbr>    &lt;/row&gt;\u003cbr>    &lt;divider color=\"subtle\"/&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"xs\"&gt;論理式の評価&lt;/text&gt;\u003cbr>    &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>      &lt;text weight=\"medium\"&gt;{score} ≥ {passing}&lt;/text&gt;\u003cbr>      &lt;badge color={passed?\"success\":\"danger\"}&gt;{passed?\"TRUE\":\"FALSE\"}&lt;/badge&gt;\u003cbr>    &lt;/row&gt;\u003cbr>    &lt;divider color=\"subtle\"/&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"xs\"&gt;IF関数の結果&lt;/text&gt;\u003cbr>    &lt;row align=\"center\" gap={2}&gt;\u003cbr>      &lt;icon name={passed?\"check-circle\":\"x-circle\"} color={passed?\"success\":\"danger\"} size=\"xl\"/&gt;\u003cbr>      &lt;title size=\"2xl\" color={passed?\"success\":\"danger\"}&gt;{passed?\"合格\":\"不合格\"}&lt;/title&gt;\u003cbr>    &lt;/row&gt;\u003cbr>    &lt;caption&gt;{passed?score+\"点は\"+passing+\"点以上なので、条件が成立します。\":score+\"点は\"+passing+\"点未満なので、条件が成立しません。\"}&lt;/caption&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;button block variant=\"outline\" color=\"secondary\" onClick={()=&gt;{setScore(75);setPassing(80)}}&gt;初期値に戻す&lt;/button&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>「点数を80点にしてみてください。条件が『80点以上』なので、80点ちょうどでも合格になります。」\u003c/p>\u003cp>### 実務例①：請求書の支払状況\u003c/p>\u003cp>「仕事では、支払済みか未払いかを自動判定する使い方ができます。」\u003c/p>\u003cp>例えば、B2に支払日が入力されている場合、\u003c/p>\u003cp>B2が空欄なら「未払い」、何か入力されていれば「支払済み」と表示します。\u003c/p>\u003cp>ただし、入力されている内容が本当に正しい支払日かどうかまでは判定していません。\u003c/p>\u003cp>### 実務例②：予算超過の判定\u003c/p>\u003cp>A2が予算、B2が実際の支出額なら、\u003c/p>\u003cp>例えば、予算10万円に対して支出12万円なら「予算超過」です。\u003c/p>\u003cp>「こういう判定を大量の行で自動化できるのが、IF関数の便利なところですね。」\u003c/p>\u003cp>### 実務例③：IF関数を複数組み合わせる\u003c/p>\u003cp>「先輩、条件が2つ以上ある場合はどうすると思います？」\u003c/p>\u003cp>例えば、成績を3段階に分けたいとします。\u003c/p>\u003cp>- 80点以上：優\u003cbr>- 60点以上80点未満：良\u003cbr>- 60点未満：不可\u003c/p>\u003cp>この場合は、IF関数の中にIF関数を入れます。\u003c/p>\u003cp>「最初に80点以上かを確認し、違った場合に60点以上かを確認するんです。これを**IF関数のネスト（入れ子）**と呼びます。」\u003c/p>\u003cp>「ただし、条件が多い場合はIFS関数を使った方が読みやすくなることもあります。」\u003c/p>\u003cp>## 理解確認：3問\u003c/p>\u003cp>{@body const qs=[{q:\"=IF(A2&gt;=80,\\\"合格\\\",\\\"不合格\\\") でA2が80の場合は？\",opts:[\"合格\",\"不合格\",\"エラー\"],a:0,ex:\"「&gt;=」は以上を意味するので、80点ちょうども条件を満たします。\"},{q:\"A2がB2と等しくない場合に「不一致」と表示したい。正しい条件は？\",opts:[\"A2=B2\",\"A2&lt;&gt;B2\",\"A2&gt;=B2\"],a:1,ex:\"「&lt;&gt;」は等しくないという意味です。A2とB2の値が異なるとTRUEになります。\"},{q:\"=IF(A2&gt;100,\\\"超過\\\",\\\"範囲内\\\") でA2が100の場合は？\",opts:[\"超過\",\"範囲内\",\"TRUE\"],a:1,ex:\"「&gt;100」は100より大きいという条件です。100ちょうどでは成立しません。\"}]}\u003cbr>{@body const [answers,setAnswers]=DIL.useState({})}\u003cbr>&lt;box border radius=\"lg\" padding={3} gap={3}&gt;\u003cbr>  {#each qs as q,i}\u003cbr>    &lt;box key={i} gap={2}&gt;\u003cbr>      **Q{i+1}. {q.q}**\u003cbr>      &lt;radio-group direction=\"col\" value={answers[i]===undefined?\"\":String(answers[i])} onChange={v=&gt;setAnswers(p=&gt;({...p,[i]:Number(v)}))}&gt;\u003cbr>        {#each q.opts as opt,j}\u003cbr>          &lt;radio value={String(j)}&gt;{opt}&lt;/radio&gt;\u003cbr>        {/each}\u003cbr>      &lt;/radio-group&gt;\u003cbr>      {#if answers[i]!==undefined}\u003cbr>        &lt;box background=\"surface-secondary\" padding={2} radius=\"md\" gap={1}&gt;\u003cbr>          &lt;row align=\"center\" gap={2}&gt;\u003cbr>            &lt;icon name={answers[i]===q.a?\"check-circle\":\"x-circle\"} color={answers[i]===q.a?\"success\":\"danger\"}/&gt;\u003cbr>            **{answers[i]===q.a?\"正解です！\":\"不正解です\" }**\u003cbr>          &lt;/row&gt;\u003cbr>          &lt;text size=\"sm\"&gt;正解：{q.opts[q.a]}。{q.ex}&lt;/text&gt;\u003cbr>        &lt;/box&gt;\u003cbr>      {/if}\u003cbr>    &lt;/box&gt;\u003cbr>    {#if i&lt;2}&lt;divider color=\"subtle\"/&gt;{/if}\u003cbr>  {/each}\u003cbr>  &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"sm\"&gt;正解数：{qs.filter((q,i)=&gt;answers[i]===q.a).length} / 3&lt;/text&gt;\u003cbr>    &lt;button size=\"sm\" variant=\"outline\" color=\"secondary\" onClick={()=&gt;setAnswers({})}&gt;再挑戦&lt;/button&gt;\u003cbr>  &lt;/row&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>## 30秒復習\u003c/p>\u003cp>「先輩、最後に重要なポイントを整理します。」\u003c/p>\u003cp>1. **何の関数？** 条件によって結果を切り替える関数。\u003cbr>2. **最重要ポイントは？** 条件がTRUEかFALSEかで処理が分かれること。\u003cbr>3. **なぜ便利？** 人間が一つずつ判断する作業を自動化できるから。\u003cbr>4. **基本構造は？** `=IF(論理式,真の場合,偽の場合)`\u003cbr>5. **具体例は？** 80点以上なら合格、それ以外なら不合格。\u003cbr>6. **間違えやすいところは？** `&gt;`と`&gt;=`の違い、文字列を囲む`\" \"`の付け忘れ。\u003c/p>\u003cp>## 一文記憶\u003c/p>\u003cp>**IF関数は「もし条件を満たせばA、満たさなければB」とExcelに判断させる関数。**\u003c/p>\u003cp>「これでVLOOKUP、XLOOKUP、IFの3つを学習しましたね。検索する関数と条件判断する関数を区別できるようになれば、次はこれらを組み合わせた実務的な数式も理解しやすくなりますよ、先輩。」\u003c/p>","originalText":"# ③ IF関数（イフ関数）\u003ctext color=\"secondary\" size=\"sm\">Excel関数｜論理関数｜条件による自動判定\u003c/text>## A｜要点：IF関数とは？「先輩、今回はExcelのIF関数ですね。VLOOKUPやXLOOKUPが『情報を探す関数』だったのに対して、IFは**条件によって処理を分ける関数**なんです。」「例えば、テストで80点以上なら合格、80点未満なら不合格と表示したいとします。」\u003cbox border radius=\"lg\" padding={3} gap={2}>  **IF関数の基本イメージ**  \u003cbox background=\"surface-secondary\" radius=\"lg\" padding={3} align=\"center\" gap={1}>    \u003ctext color=\"secondary\" size=\"xs\">条件\u003c/text>    **点数は80点以上？**  \u003c/box>  \u003csvg viewBox=\"0 0 320 112\" width=\"100%\">    \u003cpath d=\"M160 0 V17 H80 V38 M160 17 H240 V38\" stroke=\"currentColor\" strokeOpacity=\".45\" strokeWidth=\"1.8\" fill=\"none\"/>    \u003cpath d=\"M75 32 L80 39 L85 32 M235 32 L240 39 L245 32\" fill=\"none\" stroke=\"currentColor\" strokeOpacity=\".45\" strokeWidth=\"1.8\"/>    \u003crect x=\"7\" y=\"40\" width=\"146\" height=\"62\" rx=\"9\" fill=\"#16a34a\" fillOpacity=\".10\" stroke=\"#16a34a\"/>    \u003crect x=\"167\" y=\"40\" width=\"146\" height=\"62\" rx=\"9\" fill=\"#dc2626\" fillOpacity=\".08\" stroke=\"#dc2626\"/>    \u003cg fontSize=\"13\" textAnchor=\"middle\" fill=\"currentColor\">      \u003ctext x=\"80\" y=\"59\">YES（真）\u003c/text>      \u003ctext x=\"240\" y=\"59\">NO（偽）\u003c/text>    \u003c/g>    \u003ctext x=\"80\" y=\"85\" textAnchor=\"middle\" fontSize=\"19\" fontWeight=\"bold\" fill=\"#16a34a\">合格\u003c/text>    \u003ctext x=\"240\" y=\"85\" textAnchor=\"middle\" fontSize=\"19\" fontWeight=\"bold\" fill=\"#dc2626\">不合格\u003c/text>  \u003c/svg>  \u003ccaption>条件が成立するかどうかで、表示する結果が変わります。\u003c/caption>\u003c/box>「つまりIF関数は、Excelに『もし○○なら△△、そうでなければ□□にして』と判断させる仕組みなんです。」## B｜詳しい解説：IF関数の仕組み### 1. 基本の書き方「3つの引数を順番に見ていきましょう。」| 引数 | 意味 ||---|---|| 論理式 | どんな条件で判断する？ || 真の場合 | 条件が成立したら何を返す？ || 偽の場合 | 条件が成立しなかったら何を返す？ |例えば、A2に点数が入力されているとします。この式を分解すると、- `A2>=80`：A2が80以上か調べる- `\"合格\"`：80以上なら合格を表示- `\"不合格\"`：80未満なら不合格を表示「先輩、`>=`は『以上』という意味です。`>`だけなら『より大きい』なので、80点ちょうどの扱いが変わります。ここは間違えないでくださいね。」### 2. IF関数が判断する流れ\u003cbox gap={1} align=\"center\">  \u003cbox border radius=\"md\" padding={3} width=\"100%\" align=\"center\" gap={1}>    **① 論理式を評価**    \u003ctext size=\"sm\">A2の点数が80以上かを調べる\u003c/text>  \u003c/box>  \u003cicon name=\"arrow-down\" color=\"tertiary\"/>  \u003cbox border radius=\"md\" padding={3} width=\"100%\" align=\"center\" gap={1}>    **② TRUEかFALSEかを判断**    \u003ctext size=\"sm\">条件が成立すればTRUE、成立しなければFALSE\u003c/text>  \u003c/box>  \u003cicon name=\"arrow-down\" color=\"tertiary\"/>  \u003cbox background=\"rgba(22,163,74,0.07)\" border={{size:1,color:\"success\"}} radius=\"md\" padding={3} width=\"100%\" align=\"center\" gap={1}>    **③ 対応する結果を返す**    \u003ctext size=\"sm\">TRUEなら「合格」、FALSEなら「不合格」\u003c/text>  \u003c/box>\u003c/box>### 3. 比較演算子を覚えましょう「IF関数では、条件を作るための比較演算子をよく使います。」| 記号 | 意味 | 例 ||---|---|---|| `=` | 等しい | `A2=80` || `>` | より大きい | `A2>80` || `\u003c` | より小さい | `A2\u003c80` || `>=` | 以上 | `A2>=80` || `\u003c=` | 以下 | `A2\u003c=80` || `\u003c>` | 等しくない | `A2\u003c>80` |「特に`\u003c>`は少し変わった形ですが、『等しくない』という意味なので覚えておきましょう。」### 4. 数値と文字列の違い「もう一つ大切なのが、ダブルクォーテーションです。」「合格」のような文字列は、通常`\" \"`で囲みます。一方、数値を返すなら囲みません。この式は、80点以上なら数値の1、それ以外なら数値の0を返します。## C｜イメージ理解：IFは分かれ道「先輩、IF関数は道の分岐だと考えると理解しやすいですよ。」例えば、遊園地のアトラクションに身長制限があるとします。「身長が120cm以上なら乗れる。120cm未満なら乗れない。」ここで必要なのは、身長という情報を探すことではありません。**すでに分かっている身長を条件と比較して、結果を決めること**です。これがIF関数の役割なんです。「だから、VLOOKUPやXLOOKUPと混同しないでくださいね。検索するのか、判断するのか。この違いが重要です。」## D｜具体例：実際にIF関数を操作する「では先輩、点数を変えながらIF関数の動きを確認しましょう。」{@body const [score,setScore]=DIL.useState(75)}{@body const [passing,setPassing]=DIL.useState(80)}{@body const passed=score>=passing}\u003cbox border radius=\"xl\" padding={3} gap={3}>  \u003crow align=\"center\" justify=\"between\">    **IF関数シミュレーター**    \u003cbadge>操作できます\u003c/badge>  \u003c/row>  \u003cbox gap={1}>    \u003crow align=\"center\" justify=\"between\">      \u003clabel>テストの点数（A2）\u003c/label>      \u003ctitle size=\"lg\" tabularNums>{score}点\u003c/title>    \u003c/row>    \u003cslider min={0} max={100} step={1} value={score} onChange={setScore}/>    \u003crow justify=\"between\">      \u003ccaption>0点\u003c/caption>      \u003ccaption>100点\u003c/caption>    \u003c/row>  \u003c/box>  \u003cbox gap={1}>    \u003crow align=\"center\" justify=\"between\">      \u003clabel>合格基準\u003c/label>      \u003ctext weight=\"medium\" tabularNums>{passing}点以上\u003c/text>    \u003c/row>    \u003cslider min={50} max={100} step={5} value={passing} onChange={setPassing}/>  \u003c/box>  \u003cbox background=\"surface-secondary\" radius=\"lg\" padding={3} gap={2}>    \u003ctext color=\"secondary\" size=\"xs\">現在の数式\u003c/text>    \u003crow align=\"center\" justify=\"between\" wrap=\"wrap\">      \u003ctext weight=\"medium\" size=\"sm\">{\"=IF(A2>=\"+passing+',\"合格\",\"不合格\")'}\u003c/text>      \u003cbutton size=\"xs\" color=\"secondary\" variant=\"outline\" onClick={()=>GenUI.copy('=IF(A2>='+passing+',\"合格\",\"不合格\")')}>\u003cicon name=\"copy\" size=\"xs\"/> コピー\u003c/button>    \u003c/row>    \u003cdivider color=\"subtle\"/>    \u003ctext color=\"secondary\" size=\"xs\">論理式の評価\u003c/text>    \u003crow align=\"center\" justify=\"between\">      \u003ctext weight=\"medium\">{score} ≥ {passing}\u003c/text>      \u003cbadge color={passed?\"success\":\"danger\"}>{passed?\"TRUE\":\"FALSE\"}\u003c/badge>    \u003c/row>    \u003cdivider color=\"subtle\"/>    \u003ctext color=\"secondary\" size=\"xs\">IF関数の結果\u003c/text>    \u003crow align=\"center\" gap={2}>      \u003cicon name={passed?\"check-circle\":\"x-circle\"} color={passed?\"success\":\"danger\"} size=\"xl\"/>      \u003ctitle size=\"2xl\" color={passed?\"success\":\"danger\"}>{passed?\"合格\":\"不合格\"}\u003c/title>    \u003c/row>    \u003ccaption>{passed?score+\"点は\"+passing+\"点以上なので、条件が成立します。\":score+\"点は\"+passing+\"点未満なので、条件が成立しません。\"}\u003c/caption>  \u003c/box>  \u003cbutton block variant=\"outline\" color=\"secondary\" onClick={()=>{setScore(75);setPassing(80)}}>初期値に戻す\u003c/button>\u003c/box>「点数を80点にしてみてください。条件が『80点以上』なので、80点ちょうどでも合格になります。」### 実務例①：請求書の支払状況「仕事では、支払済みか未払いかを自動判定する使い方ができます。」例えば、B2に支払日が入力されている場合、B2が空欄なら「未払い」、何か入力されていれば「支払済み」と表示します。ただし、入力されている内容が本当に正しい支払日かどうかまでは判定していません。### 実務例②：予算超過の判定A2が予算、B2が実際の支出額なら、例えば、予算10万円に対して支出12万円なら「予算超過」です。「こういう判定を大量の行で自動化できるのが、IF関数の便利なところですね。」### 実務例③：IF関数を複数組み合わせる「先輩、条件が2つ以上ある場合はどうすると思います？」例えば、成績を3段階に分けたいとします。- 80点以上：優- 60点以上80点未満：良- 60点未満：不可この場合は、IF関数の中にIF関数を入れます。「最初に80点以上かを確認し、違った場合に60点以上かを確認するんです。これを**IF関数のネスト（入れ子）**と呼びます。」「ただし、条件が多い場合はIFS関数を使った方が読みやすくなることもあります。」## 理解確認：3問{@body const qs=[{q:\"=IF(A2>=80,\\\"合格\\\",\\\"不合格\\\") でA2が80の場合は？\",opts:[\"合格\",\"不合格\",\"エラー\"],a:0,ex:\"「>=」は以上を意味するので、80点ちょうども条件を満たします。\"},{q:\"A2がB2と等しくない場合に「不一致」と表示したい。正しい条件は？\",opts:[\"A2=B2\",\"A2\u003c>B2\",\"A2>=B2\"],a:1,ex:\"「\u003c>」は等しくないという意味です。A2とB2の値が異なるとTRUEになります。\"},{q:\"=IF(A2>100,\\\"超過\\\",\\\"範囲内\\\") でA2が100の場合は？\",opts:[\"超過\",\"範囲内\",\"TRUE\"],a:1,ex:\"「>100」は100より大きいという条件です。100ちょうどでは成立しません。\"}]}{@body const [answers,setAnswers]=DIL.useState({})}\u003cbox border radius=\"lg\" padding={3} gap={3}>  {#each qs as q,i}    \u003cbox key={i} gap={2}>      **Q{i+1}. {q.q}**      \u003cradio-group direction=\"col\" value={answers[i]===undefined?\"\":String(answers[i])} onChange={v=>setAnswers(p=>({...p,[i]:Number(v)}))}>        {#each q.opts as opt,j}          \u003cradio value={String(j)}>{opt}\u003c/
