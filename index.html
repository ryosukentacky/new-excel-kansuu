 **SUBTOTAL練習シミュレーター**\u003cbr>    &lt;badge&gt;操作できます&lt;/badge&gt;\u003cbr>  &lt;/row&gt;\u003cbr>  &lt;box gap={1}&gt;\u003cbr>    &lt;label&gt;① 部署フィルター&lt;/label&gt;\u003cbr>    &lt;radio-group direction=\"col\" value={dept} onChange={setDept}&gt;\u003cbr>      &lt;radio value=\"all\"&gt;すべて表示&lt;/radio&gt;\u003cbr>      &lt;radio value=\"営業部\"&gt;営業部のみ表示&lt;/radio&gt;\u003cbr>      &lt;radio value=\"総務部\"&gt;総務部のみ表示&lt;/radio&gt;\u003cbr>      &lt;radio value=\"経理部\"&gt;経理部のみ表示&lt;/radio&gt;\u003cbr>    &lt;/radio-group&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;box gap={2}&gt;\u003cbr>    &lt;label&gt;② 手動で非表示にする行&lt;/label&gt;\u003cbr>    {#each rows as r,i}\u003cbr>      &lt;checkbox key={i} checked={hidden.includes(i)} onChange={v=&gt;setHidden(prev=&gt;v?[...prev,i]:prev.filter(x=&gt;x!==i))} lineThrough={false}&gt;\u003cbr>        {i+2}行目：{r.dept}・{money(r.amount)}\u003cbr>      &lt;/checkbox&gt;\u003cbr>    {/each}\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;box gap={1}&gt;\u003cbr>    &lt;label&gt;③ SUBTOTALの集計方法&lt;/label&gt;\u003cbr>    &lt;radio-group direction=\"col\" value={method} onChange={setMethod}&gt;\u003cbr>      &lt;radio value=\"9\"&gt;9：手動非表示行を含む&lt;/radio&gt;\u003cbr>      &lt;radio value=\"109\"&gt;109：手動非表示行も除外&lt;/radio&gt;\u003cbr>    &lt;/radio-group&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;box gap={1}&gt;\u003cbr>    &lt;text weight=\"medium\" size=\"sm\"&gt;現在の表示状態&lt;/text&gt;\u003cbr>    &lt;table&gt;\u003cbr>      &lt;table-row&gt;\u003cbr>        &lt;table-cell&gt;行&lt;/table-cell&gt;\u003cbr>        &lt;table-cell&gt;部署&lt;/table-cell&gt;\u003cbr>        &lt;table-cell align=\"end\"&gt;売上&lt;/table-cell&gt;\u003cbr>        &lt;table-cell&gt;状態&lt;/table-cell&gt;\u003cbr>      &lt;/table-row&gt;\u003cbr>      {#each filtered as r}\u003cbr>        &lt;table-row&gt;\u003cbr>          &lt;table-cell&gt;{r.i+2}&lt;/table-cell&gt;\u003cbr>          &lt;table-cell&gt;{r.dept}&lt;/table-cell&gt;\u003cbr>          &lt;table-cell align=\"end\"&gt;&lt;text tabularNums&gt;{money(r.amount)}&lt;/text&gt;&lt;/table-cell&gt;\u003cbr>          &lt;table-cell&gt;\u003cbr>            &lt;text color={r.filtered||r.manual?\"secondary\":\"success\"} size=\"xs\"&gt;{r.filtered?\"フィルター除外\":r.manual?\"手動非表示\":\"表示\"}&lt;/text&gt;\u003cbr>          &lt;/table-cell&gt;\u003cbr>        &lt;/table-row&gt;\u003cbr>      {/each}\u003cbr>    &lt;/table&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;box background=\"surface-secondary\" padding={3} radius=\"lg\" gap={2}&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"xs\"&gt;現在の数式&lt;/text&gt;\u003cbr>    &lt;row align=\"center\" justify=\"between\" wrap=\"wrap\"&gt;\u003cbr>      &lt;text weight=\"medium\"&gt;{\"=SUBTOTAL(\"+method+\",B2:B6)\"}&lt;/text&gt;\u003cbr>      &lt;button size=\"xs\" color=\"secondary\" variant=\"outline\" onClick={()=&gt;GenUI.copy(\"=SUBTOTAL(\"+method+\",B2:B6)\")}&gt;&lt;icon name=\"copy\" size=\"xs\"/&gt; コピー&lt;/button&gt;\u003cbr>    &lt;/row&gt;\u003cbr>    &lt;divider color=\"subtle\"/&gt;\u003cbr>    &lt;row justify=\"between\"&gt;\u003cbr>      &lt;text size=\"sm\"&gt;SUM（全体）&lt;/text&gt;\u003cbr>      **{money(sum)}**\u003cbr>    &lt;/row&gt;\u003cbr>    &lt;row justify=\"between\"&gt;\u003cbr>      &lt;text size=\"sm\"&gt;SUBTOTAL(9)&lt;/text&gt;\u003cbr>      **{money(subtotal9)}**\u003cbr>    &lt;/row&gt;\u003cbr>    &lt;row justify=\"between\"&gt;\u003cbr>      &lt;text size=\"sm\"&gt;SUBTOTAL(109)&lt;/text&gt;\u003cbr>      **{money(subtotal109)}**\u003cbr>    &lt;/row&gt;\u003cbr>    &lt;divider color=\"subtle\"/&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"xs\"&gt;選択中のSUBTOTALの結果&lt;/text&gt;\u003cbr>    &lt;title size=\"2xl\" color=\"success\" tabularNums&gt;{money(current)}&lt;/title&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;button block color=\"secondary\" variant=\"outline\" onClick={()=&gt;{setDept(\"all\");setHidden([]);setMethod(\"109\")}}&gt;初期値に戻す&lt;/button&gt;\u003cbr>  &lt;caption&gt;この練習では行の状態を一覧表示しています。実際のExcelでは、フィルターや行の非表示によって行自体が画面から隠れます。&lt;/caption&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>「先輩、まず営業部だけにフィルターをかけてください。9でも109でも30万円になります。」\u003c/p>\u003cp>「次に営業部の10万円の行を手動で非表示にしてみましょう。9なら30万円のまま、109なら20万円になります。」\u003c/p>\u003cp>「この違いが理解できれば、SUBTOTALの重要な部分はもう押さえられていますよ。」\u003c/p>\u003cp>### 実務例①：銀行明細の入金額を集計する\u003c/p>\u003cp>A列に取引区分、B列に入出金額が入力されているとします。\u003c/p>\u003cp>入金の行だけをフィルター表示した状態で、\u003c/p>\u003cp>「これで、表示されている入金額だけを合計できます。」\u003c/p>\u003cp>ただし、B列に入金と出金が別々の列で記録されている場合は、対象の列を正しく選んでください。\u003c/p>\u003cp>### 実務例②：表示中の取引件数を数える\u003c/p>\u003cp>「先輩、SUBTOTALは件数も数えられるんでしたよね。」\u003c/p>\u003cp>例えば、A列に取引番号がある場合、\u003c/p>\u003cp>これは、フィルターで除外された行や手動非表示行を除き、空白ではないセルを数えます。\u003c/p>\u003cp>「103はCOUNTAに対応しています。取引番号が必ず入力される表なら、表示中の取引件数の確認に使えますね。」\u003c/p>\u003cp>### 実務例③：表示中の売上平均を求める\u003c/p>\u003cp>「101はAVERAGEです。つまり、表示中の数値の平均を計算します。」\u003c/p>\u003cp>「合計だけではなく、件数や平均もフィルターに連動させられる。これがSUBTOTALの強みなんです。」\u003c/p>\u003cp>## 理解確認：3問\u003c/p>\u003cp>{@body const qs=[{q:\"SUBTOTAL関数の大きな特徴は何ですか？\",opts:[\"文字列だけを集計する\",\"フィルターで除外された行を集計しない\",\"必ず全行を合計する\"],a:1,ex:\"SUBTOTALはフィルターで除外された行を集計対象から外します。\"},{q:\"SUBTOTAL(9,範囲)とSUBTOTAL(109,範囲)の違いは？\",opts:[\"9は平均、109は合計\",\"109は手動で非表示にした行も除外する\",\"9だけフィルターに対応する\"],a:1,ex:\"9も109も合計ですが、109は手動非表示行も除外します。\"},{q:\"フィルターで表示されている行の空白以外のセル数を、手動非表示行も除外して数える番号は？\",opts:[\"3\",\"9\",\"103\",\"109\"],a:2,ex:\"103はCOUNTAに対応し、手動非表示行も除外します。\"}]}\u003cbr>{@body const [answers,setAnswers]=DIL.useState({})}\u003cbr>&lt;box border radius=\"lg\" padding={3} gap={3}&gt;\u003cbr>  {#each qs as q,i}\u003cbr>    &lt;box key={i} gap={2}&gt;\u003cbr>      **Q{i+1}. {q.q}**\u003cbr>      &lt;radio-group direction=\"col\" value={answers[i]===undefined?\"\":String(answers[i])} onChange={v=&gt;setAnswers(p=&gt;({...p,[i]:Number(v)}))}&gt;\u003cbr>        {#each q.opts as opt,j}\u003cbr>          &lt;radio value={String(j)}&gt;{opt}&lt;/radio&gt;\u003cbr>        {/each}\u003cbr>      &lt;/radio-group&gt;\u003cbr>      {#if answers[i]!==undefined}\u003cbr>        &lt;box background=\"surface-secondary\" padding={2} radius=\"md\" gap={1}&gt;\u003cbr>          &lt;row align=\"center\" gap={2}&gt;\u003cbr>            &lt;icon name={answers[i]===q.a?\"check-circle\":\"x-circle\"} color={answers[i]===q.a?\"success\":\"danger\"}/&gt;\u003cbr>            **{answers[i]===q.a?\"正解です！\":\"不正解です\"}**\u003cbr>          &lt;/row&gt;\u003cbr>          &lt;text size=\"sm\"&gt;正解：{q.opts[q.a]}。{q.ex}&lt;/text&gt;\u003cbr>        &lt;/box&gt;\u003cbr>      {/if}\u003cbr>    &lt;/box&gt;\u003cbr>    {#if i&lt;2}&lt;divider color=\"subtle\"/&gt;{/if}\u003cbr>  {/each}\u003cbr>  &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"sm\"&gt;正解数：{qs.filter((q,i)=&gt;answers[i]===q.a).length} / 3&lt;/text&gt;\u003cbr>    &lt;button size=\"sm\" color=\"secondary\" variant=\"outline\" onClick={()=&gt;setAnswers({})}&gt;再挑戦&lt;/button&gt;\u003cbr>  &lt;/row&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>## 30秒復習\u003c/p>\u003cp>「先輩、最後に6つのポイントを確認しましょう。」\u003c/p>\u003cp>1. **何の関数？** フィルターに対応した合計・平均・件数などの集計関数。\u003cbr>2. **一番重要なのは？** フィルターで除外された行を集計しないこと。\u003cbr>3. **9と109の違いは？** 109は手動非表示行も除外する。\u003cbr>4. **基本構造は？** `=SUBTOTAL(集計方法,参照範囲)`\u003cbr>5. **具体例は？** フィルターで表示した営業部の売上だけを合計する。\u003cbr>6. **間違えやすいところは？** 手動非表示行の扱いと、集計方法の番号。\u003c/p>\u003cp>## 一文記憶\u003c/p>\u003cp>**SUBTOTALは「フィルターに連動して集計できる関数。表示行だけなら109で合計、103で件数」。**\u003c/p>\u003cp>「先輩、これでExcel関数の学習もかなり進みましたね。」\u003c/p>\u003cp>「特にSUBTOTALは、表にフィルターをかけてデータを確認する仕事で便利です。SUMとSUBTOTALの違いだけでなく、9と109の違いまで理解しておけば、集計ミスを防ぎやすくなりますよ。」\u003c/p>","originalText":"# ⑧ SUBTOTAL関数（サブトータル関数）\u003ctext color=\"secondary\" size=\"sm\">Excel関数｜集計・小計｜フィルター・非表示行への対応\u003c/text>「先輩、今回はSUBTOTAL関数ですね。これは、SUM関数との違いを理解すると一気に使いやすくなりますよ。」「例えば、Excelで売上一覧にフィルターをかけて、営業部のデータだけを表示したとします。ここで、**画面に表示されている営業部の売上だけを合計したい**場合、どうすればいいでしょう？」「そんなときに役立つのがSUBTOTAL関数です。」## A｜要点：SUBTOTAL関数とは？**SUBTOTAL関数は、合計・平均・件数などの集計を行い、フィルターで除外された行を集計対象から外せる関数です。**\u003cbox border radius=\"lg\" padding={3} gap={3}>  **売上一覧の例**  | 部署 | 売上 |  |---|---:|  | 営業部 | 10万円 |  | 総務部 | 20万円 |  | 営業部 | 15万円 |  | 経理部 | 30万円 |  | 営業部 | 5万円 |  \u003cgrid columns={2} gap={2}>    \u003cgrid-item>      \u003cbox background=\"surface-secondary\" radius=\"lg\" padding={3} gap={1}>        \u003ctext color=\"secondary\" size=\"xs\">SUM関数\u003c/text>        \u003ctitle size=\"xl\" tabularNums>80万円\u003c/title>        \u003ccaption>非表示行も含めて合計\u003c/caption>      \u003c/box>    \u003c/grid-item>    \u003cgrid-item>      \u003cbox background=\"rgba(22,163,74,0.08)\" radius=\"lg\" padding={3} gap={1}>        \u003ctext color=\"secondary\" size=\"xs\">SUBTOTAL関数\u003c/text>        \u003ctitle color=\"success\" size=\"xl\" tabularNums>30万円\u003c/title>        \u003ccaption>営業部だけをフィルター表示した場合\u003c/caption>      \u003c/box>    \u003c/grid-item>  \u003c/grid>\u003c/box>「SUM関数は、フィルターで行が隠れても基本的にすべての数値を合計します。一方、SUBTOTALはフィルターで除外された行を集計しません。」「ただし先輩、**手動で非表示にした行を除外するかどうかは、SUBTOTALの指定方法によって変わります。** ここが今回の重要ポイントです。」## B｜詳しい解説：SUBTOTALの仕組み### 1. 基本の書き方| 引数 | 意味 ||---|---|| 集計方法 | 合計・平均・件数など、何を計算するか || 参照1 | 集計するセル範囲 || 参照2以降 | 必要に応じて追加する集計範囲 |「先輩、SUMIFは『条件範囲・条件・合計範囲』でしたよね。でもSUBTOTALは、最初に**どんな集計をするかを番号で指定する**んです。」例えば、これはB2:B6の数値を合計します。「この9がSUM、つまり合計を意味しています。」### 2. 集計方法の番号「SUBTOTALは合計だけの関数ではありません。番号を変えると、平均や件数も計算できます。」| 集計内容 | 番号 | 番号 ||---|---:|---:|| AVERAGE（平均） | 1 | 101 || COUNT（数値の件数） | 2 | 102 || COUNTA（空白以外の件数） | 3 | 103 || MAX（最大値） | 4 | 104 || MIN（最小値） | 5 | 105 || PRODUCT（積） | 6 | 106 || STDEV.S（標本標準偏差） | 7 | 107 || STDEV.P（母標準偏差） | 8 | 108 || SUM（合計） | 9 | 109 || VAR.S（標本分散） | 10 | 110 || VAR.P（母分散） | 11 | 111 |「では先輩、なぜ同じ集計に9と109のような2種類の番号があるのでしょう？」### 3. 9と109の違いが最重要\u003cbox border radius=\"lg\" padding={3} gap={3}>  \u003cgrid columns={2} gap={2}>    \u003cgrid-item>      \u003cbox border radius=\"md\" padding={3} gap={1}>        \u003ctitle size=\"xl\">9\u003c/title>        **SUM**        \u003ctext size=\"sm\">フィルターで除外された行は除く。手動で非表示にした行は含める。\u003c/text>      \u003c/box>    \u003c/grid-item>    \u003cgrid-item>      \u003cbox border radius=\"md\" padding={3} gap={1}>        \u003ctitle size=\"xl\" color=\"success\">109\u003c/title>        **SUM**        \u003ctext size=\"sm\">フィルターで除外された行も、手動で非表示にした行も除く。\u003c/text>      \u003c/box>    \u003c/grid-item>  \u003c/grid>  \u003ctext size=\"sm\" color=\"secondary\">※ どちらも、フィルターで除外された行は集計しません。\u003c/text>\u003c/box>「ここを整理しましょう。」| 行の状態 | SUM | SUBTOTAL(9) | SUBTOTAL(109) ||---|---|---|---|| 表示中 | 含む | 含む | 含む || フィルターで除外 | 含む | 除外 | 除外 || 手動で非表示 | 含む | 含む | 除外 |「つまり、**表示されている行だけを合計したいなら109**、と覚えると便利です。」### 4. SUBTOTALのもう一つの特徴「先輩、実はSUBTOTALには、もう一つ便利な仕組みがあります。」**参照範囲内に別のSUBTOTAL関数がある場合、そのSUBTOTALの結果は二重集計されません。**例えば、各部署の小計をSUBTOTALで求め、その下に全体の集計を置いた場合です。「普通のSUMだと、小計と元データを両方足してしまうことがありますよね。SUBTOTALは、そのような二重計算を避けられるんです。」ただし、通常のSUM関数で作った小計は自動的には除外されません。## C｜イメージ理解：フィルター付きのレジ「先輩、SUBTOTALは、商品一覧から今見えている商品だけを集計するレジのようなものです。」\u003cbox border radius=\"lg\" padding={3} gap={2}>  \u003csvg viewBox=\"0 0 330 208\" width=\"100%\">    {#each [{label:\"営業部\",amount:\"10万円\",show:true},{label:\"総務部\",amount:\"20万円\",show:false},{label:\"営業部\",amount:\"15万円\",show:true},{label:\"経理部\",amount:\"30万円\",show:false},{label:\"営業部\",amount:\"5万円\",show:true}] as r,i}      \u003crect x=\"10\" y={8+i*32} width=\"310\" height=\"28\" rx=\"5\" fill={r.show?\"#16a34a\":\"#64748b\"} fillOpacity={r.show?\".12\":\".07\"} stroke={r.show?\"#16a34a\":\"#94a3b8\"} strokeOpacity={r.show?\"1\":\".4\"}/>      \u003ctext x=\"28\" y={27+i*32} fontSize=\"12\" fill=\"currentColor\" opacity={r.show?\"1\":\".45\"}>{r.label}\u003c/text>      \u003ctext x=\"270\" y={27+i*32} textAnchor=\"end\" fontSize=\"13\" fontWeight={r.show?\"bold\":\"normal\"} fill=\"currentColor\" opacity={r.show?\"1\":\".45\"}>{r.amount}\u003c/text>      {#if !r.show}        \u003cpath d={`M15 ${22+i*32} H315`} stroke=\"#94a3b8\" strokeOpacity=\".5\" strokeWidth=\"1\"/>      {/if}    {/each}    \u003crect x=\"86\" y=\"175\" width=\"158\" height=\"30\" rx=\"8\" fill=\"#16a34a\" fillOpacity=\".14\" stroke=\"#16a34a\"/>    \u003ctext x=\"165\" y=\"195\" textAnchor=\"middle\" fontSize=\"15\" fontWeight=\"bold\" fill=\"#16a34a\">表示分：30万円\u003c/text>  \u003c/svg>  \u003ccaption>営業部だけをフィルター表示すると、SUBTOTALは営業部の10万円・15万円・5万円を合計します。\u003c/caption>\u003c/box>「SUM関数は元の一覧全体を見ていますが、SUBTOTALはフィルターの状態を考慮するんです。」## D｜具体例：実際に操作してみましょう「では先輩、フィルターと手動非表示を切り替えて、SUM・SUBTOTAL(9)・SUBTOTAL(109)の違いを確認しましょう。」{@body const rows=[{dept:\"営業部\",amount:100000},{dept:\"総務部\",amount:200000},{dept:\"営業部\",amount:150000},{dept:\"経理部\",amount:300000},{dept:\"営業部\",amount:50000}]}{@body const [dept,setDept]=DIL.useState(\"all\")}{@body const [hidden,setHidden]=DIL.useState([])}{@body const [method,setMethod]=DIL.useState(\"109\")}{@body const filtered=rows.map((r,i)=>({...r,i,filtered:dept!==\"all\"&&r.dept!==dept,manual:hidden.includes(i)}))}{@body const sum=rows.reduce((s,r)=>s+r.amount,0)}{@body const subtotal9=filtered.filter(r=>!r.filtered).reduce((s,r)=>s+r.amount,0)}{@body const subtotal109=filtered.filter(r=>!r.filtered&&!r.manual).reduce((s,r)=>s+r.amount,0)}{@body const current=method===\"9\"?subtotal9:subtotal109}{@body const money=n=>n.toLocaleString(\"ja-JP\")+\"円\"}\u003cbox border radius=\"xl\" padding={3} gap={3}>  \u003crow align=\"center\" justify=\"between\">    **SUBTOTAL練習シミュレーター**    \u003cbadge>操作できます\u003c/badge>  \u003c/row>  \u003cbox gap={1}>    \u003clabel>① 部署フィルター\u003c/label>    \u003cradio-group direction=\"col\" value={dept} onChange={setDept}>      \u003cradio value=\"all\">すべて表示\u003c/radio>      \u003cradio value=\"営業部\">営業部のみ表示\u003c/radio>      \u003cradio value=\"総務部\">総務部のみ表示\u003c/radio>      \u003cradio value=\"経理部\">経理部のみ表示\u003c/radio>    \u003c/radio-group>  \u003c/box>  \u003cbox gap={2}>    \u003clabel>② 手動で非表示にする行\u003c/label>    {#each rows as r,i}      \u003ccheckbox key={i} checked={hidden.includes(i)} onChange={v=>setHidden(prev=>v?[...prev,i]:prev.filter(x=>x!==i))} lineThrough={false}>        {i+2}行目：{r.dept}・{money(r.amount)}      \u003c/checkbox>    {/each}  \u003c/box>  \u003cbox gap={1}>    \u003clabel>③ SUBTOTALの集計方法\u003c/label>    \u003cradio-group direction=\"col\" value={method} onChange={setMethod}>      \u003cradio value=\"9\">9：手動非表示行を含む\u003c/radio>      \u003cradio value=\"109\">109：手動非表示行も除外\u003c/radio>    \u003c/radio-group>  \u003c/box>  \u003cbox gap={1}>    \u003ctext weight=\"medium\" size=\"sm\">現在の表示状態\u003c/text>    \u003ctable>      \u003ctable-row>        \u003ctable-cell>行\u003c/table-cell>        \u003ctable-cell>部署\u003c/table-cell>        \u003ctable-cell align=\"end\">売上\u003c/table-cell>        \u003ctable-cell>状態\u003c/table-cell>      \u003c/table-row>      {#each filtered as r}        \u003ctable-row>          \u003ctable-cell>{r.i+2}\u003c/table-cell>          \u003ctable-cell>{r.dept}\u003c/table-cell>          \u003ctable-cell align=\"end\">\u003ctext tabularNums>{money(r.amount)}\u003c/text>\u003c/table-cell>          \u003ctable-cell>            \u003ctext color={r.filtered||r.manual?\"secondary\":\"success\"} size=\"xs\">{r.filtered?\"フィルター除外\":r.manual?\"手動非表示\":\"表示\"}\u003c/text>          \u003c/table-cell>        \u003c/table-row>      {/each}    \u003c/table>  \u003c/box>  \u003cbox background=\"surface-secondary\" padding={3} radius=\"lg\" gap={2}>    \u003ctext color=\"secondary\" size=\"xs\">現在の数式\u003c/text>    \u003crow align=\"center\" justify=\"between\" wrap=\"wrap\">      \u003ctext weight=\"medium\">{\"=SUBTOTAL(\"+method+\",B2:B6)\"}\u003c/text>      \u003cbutton size=\"xs\" color=\"secondary\" variant=\"outline\" onClick={()=>GenUI.copy(\"=SUBTOTAL(\"+method+\",B2:B6)\")}>\u003cicon name=\"copy\" size=\"xs\"/> コピー\u003c/button>    \u003c/row>    \u003cdivider color=\"subtle\"/>    \u003crow justify=\"between\">      \u003ctext size=\"sm\">SUM（全体）\u003c/text>      **{money(sum)}**    \u003c/row>    \u003crow justify=\"between\">      \u003ctext size=\"sm\">SUBTOTAL(9)\u003c/text>      **{money(subtotal9)}**    \u003c/row>    \u003crow justify=\"between\">      \u003ctext size=\"sm\">SUBTOTAL(109)\u003c/text>      **{money(subtotal109)}**    \u003c/row>    \u003cdivider color=\"subtle\"/>    \u003ctext color=\"secondary\" size=\"xs\">選択中のSUBTOTALの結果\u003c/text>    \u003ctitle size=\"2xl\" color=\"success\" tabularNums>{money(current)}\u003c/title>  \u003c/box>  \u003cbutton block color=\"secondary\" variant=\"outline\" onClick={()=>{setDept(\"all\");setHidden([]);setMethod(\"109\")}}>初期値に戻す\u003c/button>  \u003ccaption>この練習では行の状態を一覧表示しています。実際のExcelでは、フィルターや行の非表示によって行自体が画面から隠れます。\u003c/caption>\u003c/box>「先輩、まず営業部だけにフィルターをかけてください。9でも109でも30万円になります。」「次に営業部の10万円の行を手動で非表示にしてみましょう。9なら30万円のまま、109なら20万円になります。」「この違いが理解できれば、SUBTOTALの重要な部分はもう押さえられていますよ。」### 実務例①：銀行明細の入金額を集計するA列に取引区分、B列に入出金額が入力されているとします。入金の行だけをフィルター表示した状態で、「これで、表示されている入金額だけを合計できます。」ただし、B列に入金と出金が別々の列で記録されている場合は、対象の列を正しく選んでください。### 実務例②：表示中の取引件数を数える「先輩、SUBTOTALは件数も数えられるんでしたよね。」例えば、A列に取引番号がある場合、これは、フィルターで除外された行や手動非表示行を除き、空白ではないセルを数えます。「103はCOUNTAに対応しています。取引番号が必ず入力される表なら、表示中の取引件数の確認に使えますね。」### 実務例③：表示中の売上平均を求める「101はAVERAGEです。つまり、表示中の数値の平均を計算します。」「合計だけではなく、件数や平均もフィルターに連動させられる。これがSUBTOTALの強みなんです。」## 理解確認：3問{@body const qs=[{q:\"SUBTOTAL関数の大きな特徴は何ですか？\",opts:[\"文字列だけを集計する\",\"フィルターで除外された行を集計しない\",\"必ず全行を合計する\"],a:1,ex:\"SUBTOTALはフィルターで除外された行を集計対象から外します。\"},{q:\"SUBTOTAL(9,範囲)とSUBTOTAL(109,範囲)の違いは？\",opts:[\"9は平均、109は合計\",\"109は手動で非表示にした行も除外する\",\"9だけフィルターに対応する\"],a:1,ex:\"9も109も合計ですが、109は手動非表示行も除外します。\"},{q:\"フィルターで表示されている行の空白以外のセル数を、手動非表示行も除外して数える番号は？\",opts:[\"3\",\"9\",\"103\",\"109\"],a:2,ex:\"103はCOUNTAに対応し、手動非表示行も除外します。\"}]}{@body const [answers,setAnswers]=DIL.useState({})}\u003cbox border radius=\"lg\" padding={3} gap={3}>  {#each qs as q,i}    \u003cbox key={i} gap={2}>      **Q{i+1}. {q.q}**      \u003cradio-group direction=\"col\" value={answers[i]===undefined?\"\":String(answers[i])} onChange={v=>setAnswers(p=>({...p,[i]:Number(v)}))}>        {#each q.opts as opt,j}          \u003cradio value={String(j)}>{opt}\u003c/radio>        {/each}      \u003c/radio-group>      {#if answers[i]!==undefined}        \u003cbox background=\"surface-secondary\" padding={2} radius=\"md\" gap={1}>          \u003crow align=\"center\" gap={2}>            \u003cicon name={answers[i]===q.a?\"check-circle\":\"x-circle\"} color={answers[i]===q.a?\"success\":\"danger\"}/>            **{answers[i]===q.a?\"正解です！\":\"不正解です\"}**          \u003c/row>          \u003ctext size=\"sm\">正解：{q.opts[q.a]}。{q.ex}\u003c/text>        \u003c/box>      {/if}    \u003c/box>    {#if i\u003c2}\u003cdivider color=\"subtle\"/>{/if}  {/each}  \u003crow align=\"center\" justify=\"between\">    \u003ctext color=\"secondary\" size=\"sm\">正解数：{qs.filter((q,i)=>answers[i]===q.a).length} / 3\u003c/text>    \u003cbutton size=\"sm\" color=\"secondary\" variant=\"outline\" onClick={()=>setAnswers({})}>再挑戦\u003c/button>  \u003c/row>\u003c/box>## 30秒復習「先輩、最後に6つのポイントを確認しましょう。」1. **何の関数？** フィルターに対応した合計・平均・件数などの集計関数。2. **一番重要なのは？** フィルターで除外された行を集計しないこと。3. **9と109の違いは？** 109は手動非表示行も除外する。4. **基本構造は？** `=SUBTOTAL(集計方法,参照範囲)`5. **具体例は？** フィルターで表示した営業部の売上だけを合計する。6. **間違えやすいところは？** 手動非表示行の扱いと、集計方法の番号。## 一文記憶**SUBTOTALは「フィルターに連動して集計できる関数。表示行だけなら109で合計、103で件数」。**「先輩、これでExcel関数の学習もかなり進みましたね。」「特にSUBTOTALは、表にフィルターをかけてデータを確認する仕事で便利です。SUMとSUBTOTALの違いだけでなく、9と109の違いまで理解しておけば、集計ミスを防ぎやすくなりますよ。」","sections":{"A":"\u003ch1>⑧ SUBTOTAL関数（サブトータル関数）\u003c/h1>\n\u003cp class=\"muted\">Excel関数｜集計・小計｜フィルター・非表示行への対応\u003c/p>\u003cp>「先輩、今回はSUBTOTAL関数ですね。これは、SUM関数との違いを理解すると一気に使いやすくなりますよ。」\u003c/p>\n\u003cp>「例えば、Excelで売上一覧にフィルターをかけて、営業部のデータだけを表示したとします。ここで、\u003cstrong>画面に表示されている営業部の売上だけを合計したい\u003c/strong>場合、どうすればいいでしょう？」\u003c/p>\n\u003cp>「そんなときに役立つのがSUBTOTAL関数です。」\u003c/p>\n\u003ch2>A｜要点：SUBTOTAL関数とは？\u003c/h2>\u003cp>\u003cstrong>SUBTOTAL関数は、合計・平均・件数などの集計を行い、フィルターで除外された行を集計対象から外せる関数です。\u003c/strong>\u003c/p>\n\u003cdiv class=\"source-static\">\u003cdiv>\n  \u003cstrong>売上一覧の例\u003c/strong>\n\u003c/div>\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>部署\u003c/th>\n\u003cth align=\"right\">売上\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>営業部\u003c/td>\n\u003ctd align=\"right\">10万円\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>総務部\u003c/td>\n\u003ctd align=\"right\">20万円\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>営業部\u003c/td>\n\u003ctd align=\"right\">15万円\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>経理部\u003c/td>\n\u003ctd align=\"right\">30万円\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>営業部\u003c/td>\n\u003ctd align=\"right\">5万円\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cdiv class=\"source-static\">\u003cdiv>\n    \u003cdiv>\n      \u003cdiv>\n        \u003cspan>SUM関数\u003c/span>\n        \u003cstrong>80万円\u003c/strong>\n        \u003csmall>非表示行も含めて合計\u003c/small>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv>\n      \u003cdiv>\n        \u003cspan>SUBTOTAL関数\u003c/span>\n        \u003cstrong>30万円\u003c/strong>\n        \u003csmall>営業部だけをフィルター表示した場合\u003c/small>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003c/div>\u003cp>「SUM関数は、フィルターで行が隠れても基本的にすべての数値を合計します。一方、SUBTOTALはフィルターで除外された行を集計しません。」\u003c/p>\n\u003cp>「ただし先輩、\u003cstrong>手動で非表示にした行を除外するかどうかは、SUBTOTALの指定方法によって変わります。\u003c/strong> ここが今回の重要ポイントです。」\u003c/p>\n","B":"\u003ch2>B｜詳しい解説：SUBTOTALの仕組み\u003c/h2>\u003ch3>1. 基本の書き方\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>引数\u003c/th>\n\u003cth>意味\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>集計方法\u003c/td>\n\u003ctd>合計・平均・件数など、何を計算するか\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>参照1\u003c/td>\n\u003ctd>集計するセル範囲\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>参照2以降\u003c/td>\n\u003ctd>必要に応じて追加する集計範囲\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>「先輩、SUMIFは『条件範囲・条件・合計範囲』でしたよね。でもSUBTOTALは、最初に\u003cstrong>どんな集計をするかを番号で指定する\u003c/strong>んです。」\u003c/p>\n\u003cp>例えば、\u003c/p>\n\u003cp>これはB2:B6の数値を合計します。\u003c/p>\n\u003cp>「この9がSUM、つまり合計を意味しています。」\u003c/p>\n\u003ch3>2. 集計方法の番号\u003c/h3>\n\u003cp>「SUBTOTALは合計だけの関数ではありません。番号を変えると、平均や件数も計算できます。」\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>集計内容\u003c/th>\n\u003cth align=\"right\">番号\u003c/th>\n\u003cth align=\"right\">番号\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>AVERAGE（平均）\u003c/td>\n\u003ctd align=\"right\">1\u003c/td>\n\u003ctd align=\"right\">101\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>COUNT（数値の件数）\u003c/td>\n\u003ctd align=\"right\">2\u003c/td>\n\u003ctd align=\"right\">102\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>COUNTA（空白以外の件数）\u003c/td>\n\u003ctd align=\"right\">3\u003c/td>\n\u003ctd align=\"right\">103\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MAX（最大値）\u003c/td>\n\u003ctd align=\"right\">4\u003c/td>\n\u003ctd align=\"right\">104\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MIN（最小値）\u003c/td>\n\u003ctd align=\"right\">5\u003c/td>\n\u003ctd align=\"right\">105\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PRODUCT（積）\u003c/td>\n\u003ctd align=\"right\">6\u003c/td>\n\u003ctd align=\"right\">106\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>STDEV.S（標本標準偏差）\u003c/td>\n\u003ctd align=\"right\">7\u003c/td>\n\u003ctd align=\"right\">107\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>STDEV.P（母標準偏差）\u003c/td>\n\u003ctd align=\"right\">8\u003c/td>\n\u003ctd align=\"right\">108\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SUM（合計）\u003c/td>\n\u003ctd align=\"right\">9\u003c/td>\n\u003ctd align=\"right\">109\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>VAR.S（標本分散）\u003c/td>\n\u003ctd align=\"right\">10\u003c/td>\n\u003ctd align=\"right\">110\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>VAR.P（母分散）\u003c/td>\n\u003ctd align=\"right\">11\u003c/td>\n\u003ctd align=\"right\">111\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>「では先輩、なぜ同じ集計に9と109のような2種類の番号があるのでしょう？」\u003c/p>\n\u003ch3>3. 9と109の違いが最重要\u003c/h3>\n\u003cdiv class=\"source-static\">\u003cdiv>\n  \u003cdiv>\n    \u003cdiv>\n      \u003cdiv>\n        \u003cstrong>9\u003c/strong>\n        \u003cstrong>SUM\u003c/strong>\n\u003cspan>フィルターで除外された行は除く。手動で非表示にした行は含める。\u003c/span>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv>\n      \u003cdiv>\n        \u003cstrong>109\u003c/strong>\n        \u003cstrong>SUM\u003c/strong>\n\u003cspan>フィルターで除外された行も、手動で非表示にした行も除く。\u003c/span>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n  \u003cspan>※ どちらも、フィルターで除外された行は集計しません。\u003c/span>\n\u003c/div>\n\u003c/div>\u003cp>「ここを整理しましょう。」\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>行の状態\u003c/th>\n\u003cth>SUM\u003c/th>\n\u003cth>SUBTOTAL(9)\u003c/th>\n\u003cth>SUBTOTAL(109)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>表示中\u003c/td>\n\u003ctd>含む\u003c/td>\n\u003ctd>含む\u003c/td>\n\u003ctd>含む\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>フィルターで除外\u003c/td>\n\u003ctd>含む\u003c/td>\n\u003ctd>除外\u003c/td>\n\u003ctd>除外\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>手動で非表示\u003c/td>\n\u003ctd>含む\u003c/td>\n\u003ctd>含む\u003c/td>\n\u003ctd>除外\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>「つまり、\u003cstrong>表示されている行だけを合計したいなら109\u003c/strong>、と覚えると便利です。」\u003c/p>\n\u003ch3>4. SUBTOTALのもう一つの特徴\u003c/h3>\n\u003cp>「先輩、実はSUBTOTALには、もう一つ便利な仕組みがあります。」\u003c/p>\n\u003cp>\u003cstrong>参照範囲内に別のSUBTOTAL関数がある場合、そのSUBTOTALの結果は二重集計されません。\u003c/strong>\u003c/p>\n\u003cp>例えば、各部署の小計をSUBTOTALで求め、その下に全体の集計を置いた場合です。\u003c/p>\n\u003cp>「普通のSUMだと、小計と元データを両方足してしまうことがありますよね。SUBTOTALは、そのような二重計算を避けられるんです。」\u003c/p>\n\u003cp>ただし、通常のSUM関数で作った小計は自動的には除外されません。\u003c/p>\n","C":"\u003ch2>C｜イメージ理解：フィルター付きのレジ\u003c/h2>\u003cp>「先輩、SUBTOTALは、商品一覧から今見えている商品だけを集計するレジのようなものです。」\u003c/p>\n\u003cp>「SUM関数は元の一覧全体を見ていますが、SUBTOTALはフィルターの状態を考慮するんです。」\u003c/p>\n","D":"\u003ch2>D｜具体例：実際に操作してみましょう\u003c/h2>\u003cp>「では先輩、フィルターと手動非表示を切り替えて、SUM・SUBTOTAL(9)・SUBTOTAL(109)の違いを確認しましょう。」\u003c/p>\n\u003cp>「先輩、まず営業部だけにフィルターをかけてください。9でも109でも30万円になります。」\u003c/p>\n\u003cp>「次に営業部の10万円の行を手動で非表示にしてみましょう。9なら30万円のまま、109なら20万円になります。」\u003c/p>\n\u003cp>「この違いが理解できれば、SUBTOTALの重要な部分はもう押さえられていますよ。」\u003c/p>\n\u003ch3>実務例①：銀行明細の入金額を集計する\u003c/h3>\n\u003cp>A列に取引区分、B列に入出金額が入力されているとします。\u003c/p>\n\u003cp>入金の行だけをフィルター表示した状態で、\u003c/p>\n\u003cp>「これで、表示されている入金額だけを合計できます。」\u003c/p>\n\u003cp>ただし、B列に入金と出金が別々の列で記録されている場合は、対象の列を正しく選んでください。\u003c/p>\n\u003ch3>実務例②：表示中の取引件数を数える\u003c/h3>\n\u003cp>「先輩、SUBTOTALは件数も数えられるんでしたよね。」\u003c/p>\n\u003cp>例えば、A列に取引番号がある場合、\u003c/p>\n\u003cp>これは、フィルターで除外された行や手動非表示行を除き、空白ではないセルを数えます。\u003c/p>\n\u003cp>「103はCOUNTAに対応しています。取引番号が必ず入力される表なら、表示中の取引件数の確認に使えますね。」\u003c/p>\n\u003ch3>実務例③：表示中の売上平均を求める\u003c/h3>\n\u003cp>「101はAVERAGEです。つまり、表示中の数値の平均を計算します。」\u003c/p>\n\u003cp>「合計だけではなく、件数や平均もフィルターに連動させられる。これがSUBTOTALの強みなんです。」\u003c/p>\n","その他":"\u003ch2>理解確認：3問\u003c/h2>\u003ch2>30秒復習\u003c/h2>\u003cp>「先輩、最後に6つのポイントを確認しましょう。」\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>何の関数？\u003c/strong> フィルターに対応した合計・平均・件数などの集計関数。\u003c/li>\n\u003cli>\u003cstrong>一番重要なのは？\u003c/strong> フィルターで除外された行を集計しないこと。\u003c/li>\n\u003cli>\u003cstrong>9と109の違いは？\u003c/strong> 109は手動非表示行も除外する。\u003c/li>\n\u003cli>\u003cstrong>基本構造は？\u003c/strong> \u003ccode>=SUBTOTAL(集計方法,参照範囲)\u003c/code>\u003c/li>\n\u003cli>\u003cstrong>具体例は？\u003c/strong> フィルターで表示した営業部の売上だけを合計する。\u003c/li>\n\u003cli>\u003cstrong>間違えやすいところは？\u003c/strong> 手動非表示行の扱いと、集計方法の番号。\u003c/li>\n\u003c/ol>\n\u003ch2>一文記憶\u003c/h2>\u003cp>\u003cstrong>SUBTOTALは「フィルターに連動して集計できる関数。表示行だけなら109で合計、103で件数」。\u003c/strong>\u003c/p>\n\u003cp>「先輩、これでExcel関数の学習もかなり進みましたね。」\u003c/p>\n\u003cp>「特にSUBTOTALは、表にフィルターをかけてデータを確認する仕事で便利です。SUMとSUBTOTALの違いだけでなく、9と109の違いまで理解しておけば、集計ミスを防ぎやすくなりますよ。」\u003c/p>\n"},"prose":["# ⑧ SUBTOTAL関数（サブトータル関数）","Excel関数｜集計・小計｜フィルター・非表示行への対応","「先輩、今回はSUBTOTAL関数ですね。これは、SUM関数との違いを理解すると一気に使いやすくなりますよ。」","「例えば、Excelで売上一覧にフィルターをかけて、営業部のデータだけを表示したとします。ここで、**画面に表示されている営業部の売上だけを合計したい**場合、どうすればいいでしょう？」","「そんなときに役立つのがSUBTOTAL関数です。」","## A｜要点：SUBTOTAL関数とは？","**SUBTOTAL関数は、合計・平均・件数などの集計を行い、フィルターで除外された行を集計対象から外せる関数です。**","| 部署 | 売上 |\n  |---|---:|\n  | 営業部 | 10万円 |\n  | 総務部 | 20万円 |\n  | 営業部 | 15万円 |\n  | 経理部 | 30万円 |\n  | 営業部 | 5万円 |","「SUM関数は、フィルターで行が隠れても基本的にすべての数値を合計します。一方、SUBTOTALはフィルターで除外された行を集計しません。」","「ただし先輩、**手動で非表示にした行を除外するかどうかは、SUBTOTALの指定方法によって変わります。** ここが今回の重要ポイントです。」","## B｜詳しい解説：SUBTOTALの仕組み","### 1. 基本の書き方","| 引数 | 意味 |\n|---|---|\n| 集計方法 | 合計・平均・件数など、何を計算するか |\n| 参照1 | 集計するセル範囲 |\n| 参照2以降 | 必要に応じて追加する集計範囲 |","「先輩、SUMIFは『条件範囲・条件・合計範囲』でしたよね。でもSUBTOTALは、最初に**どんな集計をするかを番号で指定する**んです。」","例えば、","これはB2:B6の数値を合計します。","「この9がSUM、つまり合計を意味しています。」","### 2. 集計方法の番号","「SUBTOTALは合計だけの関数ではありません。番号を変えると、平均や件数も計算できます。」","| 集計内容 | 番号 | 番号 |\n|---|---:|---:|\n| AVERAGE（平均） | 1 | 101 |\n| COUNT（数値の件数） | 2 | 102 |\n| COUNTA（空白以外の件数） | 3 | 103 |\n| MAX（最大値） | 4 | 104 |\n| MIN（最小値） | 5 | 105 |\n| PRODUCT（積） | 6 | 106 |\n| STDEV.S（標本標準偏差） | 7 | 107 |\n| STDEV.P（母標準偏差） | 8 | 108 |\n| SUM（合計） | 9 | 109 |\n| VAR.S（標本分散） | 10 | 110 |\n| VAR.P（母分散） | 11 | 111 |","「では先輩、なぜ同じ集計に9と109のような2種類の番号があるのでしょう？」","### 3. 9と109の違いが最重要","「ここを整理しましょう。」","| 行の状態 | SUM | SUBTOTAL(9) | SUBTOTAL(109) |\n|---|---|---|---|\n| 表示中 | 含む | 含む | 含む |\n| フィルターで除外 | 含む | 除外 | 除外 |\n| 手動で非表示 | 含む | 含む | 除外 |","「つまり、**表示されている行だけを合計したいなら109**、と覚えると便利です。」","### 4. SUBTOTALのもう一つの特徴","「先輩、実はSUBTOTALには、もう一つ便利な仕組みがあります。」","**参照範囲内に別のSUBTOTAL関数がある場合、そのSUBTOTALの結果は二重集計されません。**","例えば、各部署の小計をSUBTOTALで求め、その下に全体の集計を置いた場合です。","「普通のSUMだと、小計と元データを両方足してしまうことがありますよね。SUBTOTALは、そのような二重計算を避けられるんです。」","ただし、通常のSUM関数で作った小計は自動的には除外されません。","## C｜イメージ理解：フィルター付きのレジ","「先輩、SUBTOTALは、商品一覧から今見えている商品だけを集計するレジのようなものです。」","「SUM関数は元の一覧全体を見ていますが、SUBTOTALはフィルターの状態を考慮するんです。」","## D｜具体例：実際に操作してみましょう","「では先輩、フィルターと手動非表示を切り替えて、SUM・SUBTOTAL(9)・SUBTOTAL(109)の違いを確認しましょう。」","「先輩、まず営業部だけにフィルターをかけてください。9でも109でも30万円になります。」","「次に営業部の10万円の行を手動で非表示にしてみましょう。9なら30万円のまま、109なら20万円になります。」","「この違いが理解できれば、SUBTOTALの重要な部分はもう押さえられていますよ。」","### 実務例①：銀行明細の入金額を集計する","A列に取引区分、B列に入出金額が入力されているとします。","入金の行だけをフィルター表示した状態で、","「これで、表示されている入金額だけを合計できます。」","ただし、B列に入金と出金が別々の列で記録されている場合は、対象の列を正しく選んでください。","### 実務例②：表示中の取引件数を数える","「先輩、SUBTOTALは件数も数えられるんでしたよね。」","例えば、A列に取引番号がある場合、","これは、フィルターで除外された行や手動非表示行を除き、空白ではないセルを数えます。","「103はCOUNTAに対応しています。取引番号が必ず入力される表なら、表示中の取引件数の確認に使えますね。」","### 実務例③：表示中の売上平均を求める","「101はAVERAGEです。つまり、表示中の数値の平均を計算します。」","「合計だけではなく、件数や平均もフィルターに連動させられる。これがSUBTOTALの強みなんです。」","## 理解確認：3問","## 30秒復習","「先輩、最後に6つのポイントを確認しましょう。」","1. **何の関数？** フィルターに対応した合計・平均・件数などの集計関数。\n2. **一番重要なのは？** フィルターで除外された行を集計しないこと。\n3. **9と109の違いは？** 109は手動非表示行も除外する。\n4. **基本構造は？** `=SUBTOTAL(集計方法,参照範囲)`\n5. **具体例は？** フィルターで表示した営業部の売上だけを合計する。\n6. **間違えやすいところは？** 手動非表示行の扱いと、集計方法の番号。","## 一文記憶","**SUBTOTALは「フィルターに連動して集計できる関数。表示行だけなら109で合計、103で件数」。**","「先輩、これでExcel関数の学習もかなり進みましたね。」","「特にSUBTOTALは、表にフィルターをかけてデータを確認する仕事で便利です。SUMとSUBTOTALの違いだけでなく、9と109の違いまで理解しておけば、集計ミスを防ぎやすくなりますよ。」"],"quizzes":[{"q":"SUBTOTAL関数の大きな特徴は何ですか？","options":["文字列だけを集計する","フィルターで除外された行を集計しない","必ず全行を合計する"],"correct":1,"explain":"SUBTOTALはフィルターで除外された行を集計対象から外します。"},{"q":"SUBTOTAL(9,範囲)とSUBTOTAL(109,範囲)の違いは？","options":["9は平均、109は合計","109は手動で非表示にした行も除外する","9だけフィルターに対応する"],"correct":1,"explain":"9も109も合計ですが、109は手動非表示行も除外します。"},{"q":"フィルターで表示されている行の空白以外のセル数を、手動非表示行も除外して数える番号は？","options":["3","9","103","109"],"correct":2,"explain":"103はCOUNTAに対応し、手動非表示行も除外します。"}]},{"name":"AND・OR","original":"\u003cp># ⑨ AND関数・OR関数（アンド・オア関数）\u003c/p>\u003cp>&lt;text color=\"secondary\" size=\"sm\"&gt;Excel関数｜論理関数｜複数条件の判定・IF関数との組み合わせ&lt;/text&gt;\u003c/p>\u003cp>「先輩、今回はAND関数とOR関数ですね。どちらも**複数の条件をまとめて判定する関数**です。」\u003c/p>\u003cp>「以前勉強したIF関数は、条件が成立したかどうかで結果を切り替える関数でしたよね。でも、仕事では『条件が2つとも成立したら』とか『どちらか一方が成立したら』という判断も必要になります。」\u003c/p>\u003cp>「そんなときに使うのがANDとORなんです。」\u003c/p>\u003cp>## A｜要点：ANDとORの違い\u003c/p>\u003cp>&lt;box border radius=\"lg\" padding={3} gap={3}&gt;\u003cbr>  &lt;grid columns={2} gap={3}&gt;\u003cbr>    &lt;grid-item&gt;\u003cbr>      &lt;box background=\"rgba(37,99,235,0.07)\" border={{size:1,color:\"info\"}} radius=\"lg\" padding={3} gap={2}&gt;\u003cbr>        &lt;title size=\"lg\" color=\"info\"&gt;AND&lt;/title&gt;\u003cbr>        **すべて成立**\u003c/p>\u003cp>        &lt;text size=\"sm\"&gt;条件Aも条件Bも満たした場合だけTRUE&lt;/text&gt;\u003cbr>        &lt;row align=\"center\" justify=\"center\" gap={2}&gt;\u003cbr>          &lt;badge color=\"success\"&gt;A ✓&lt;/badge&gt;\u003cbr>          &lt;icon name=\"plus\" color=\"secondary\"/&gt;\u003cbr>          &lt;badge color=\"success\"&gt;B ✓&lt;/badge&gt;\u003cbr>        &lt;/row&gt;\u003cbr>        &lt;box align=\"center\" gap={1}&gt;\u003cbr>          &lt;icon name=\"arrow-down\" color=\"secondary\"/&gt;\u003cbr>          **TRUE**\u003cbr>        &lt;/box&gt;\u003cbr>      &lt;/box&gt;\u003cbr>    &lt;/grid-item&gt;\u003cbr>    &lt;grid-item&gt;\u003cbr>      &lt;box background=\"rgba(22,163,74,0.07)\" border={{size:1,color:\"success\"}} radius=\"lg\" padding={3} gap={2}&gt;\u003cbr>        &lt;title size=\"lg\" color=\"success\"&gt;OR&lt;/title&gt;\u003cbr>        **どれか成立**\u003c/p>\u003cp>        &lt;text size=\"sm\"&gt;条件Aか条件Bの少なくとも一方を満たせばTRUE&lt;/text&gt;\u003cbr>        &lt;row align=\"center\" justify=\"center\" gap={2}&gt;\u003cbr>          &lt;badge color=\"success\"&gt;A ✓&lt;/badge&gt;\u003cbr>          &lt;text color=\"secondary\"&gt;または&lt;/text&gt;\u003cbr>          &lt;badge&gt;B ×&lt;/badge&gt;\u003cbr>        &lt;/row&gt;\u003cbr>        &lt;box align=\"center\" gap={1}&gt;\u003cbr>          &lt;icon name=\"arrow-down\" color=\"secondary\"/&gt;\u003cbr>          **TRUE**\u003cbr>        &lt;/box&gt;\u003cbr>      &lt;/box&gt;\u003cbr>    &lt;/grid-item&gt;\u003cbr>  &lt;/grid&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>「先輩、最初に覚えるのはこの違いだけで構いません。」\u003c/p>\u003cp>- **AND：全部の条件を満たす必要がある**\u003cbr>- **OR：1つでも条件を満たせばよい**\u003c/p>\u003cp>「ただし、ORは『どちらか一方だけ』という意味ではありません。両方成立していてもTRUEです。ここは重要ですよ。」\u003c/p>\u003cp>## B｜詳しい解説：仕組みを理解しましょう\u003c/p>\u003cp>### 1. AND関数の書き方\u003c/p>\u003cp>例えば、テストで次の条件を満たしたら合格とします。\u003c/p>\u003cp>- 英語が80点以上\u003cbr>- 数学が70点以上\u003c/p>\u003cp>A2が英語、B2が数学の点数なら、\u003c/p>\u003cp>「先輩、この式は合格・不合格という文字を返すのではなく、TRUEかFALSEを返します。」\u003c/p>\u003cp>例えば英語85点、数学75点なら、両方の条件が成立するためTRUEです。\u003c/p>\u003cp>一方、英語90点でも数学65点なら、数学の条件が成立しないのでFALSEです。\u003c/p>\u003cp>### 2. OR関数の書き方\u003c/p>\u003cp>同じ条件をORで判定すると、\u003c/p>\u003cp>「こちらは英語が80点以上、または数学が70点以上ならTRUEです。」\u003c/p>\u003cp>「つまり、英語90点・数学65点なら、ANDはFALSEですがORはTRUEになります。」\u003c/p>\u003cp>### 3. 真理値表で比較する\u003c/p>\u003cp>「先輩、ここは表にすると一目で分かりますよ。」\u003c/p>\u003cp>| 条件A | 条件B | AND | OR |\u003cbr>|---|---|---|---|\u003cbr>| TRUE | TRUE | TRUE | TRUE |\u003cbr>| TRUE | FALSE | FALSE | TRUE |\u003cbr>| FALSE | TRUE | FALSE | TRUE |\u003cbr>| FALSE | FALSE | FALSE | FALSE |\u003c/p>\u003cp>「ANDは両方TRUEの1パターンだけ。ORは両方FALSEのときだけFALSEです。」\u003c/p>\u003cp>### 4. IF関数と組み合わせる\u003c/p>\u003cp>「ここからが実務で特に重要です。」\u003c/p>\u003cp>ANDとORだけでは通常、TRUEかFALSEが表示されます。しかし、IFと組み合わせれば、好きな文字を表示できます。\u003c/p>\u003cp>**ANDとIFの組み合わせ**\u003c/p>\u003cp>「英語80点以上、かつ数学70点以上なら『合格』。どちらかが足りなければ『不合格』です。」\u003c/p>\u003cp>**ORとIFの組み合わせ**\u003c/p>\u003cp>「こちらは、英語か数学のどちらかが基準に達していれば『合格』になります。」\u003c/p>\u003cp>「同じIF関数でも、中に入れるのがANDかORかで判定結果が変わるんです。」\u003c/p>\u003cp>### 5. 3つ以上の条件も指定できる\u003c/p>\u003cp>ANDとORは2条件に限定されません。\u003c/p>\u003cp>これは3条件すべてが成立した場合にTRUEです。\u003c/p>\u003cp>こちらは3条件のうち、1つ以上が成立すればTRUEです。\u003c/p>\u003cp>## C｜イメージ理解：入場条件で考える\u003c/p>\u003cp>「先輩、身近な例で考えてみましょう。」\u003c/p>\u003cp>&lt;box border radius=\"lg\" padding={3} gap={2}&gt;\u003cbr>  **AND：2つの鍵が必要な扉**\u003c/p>\u003cp>  &lt;svg viewBox=\"0 0 320 128\" width=\"100%\"&gt;\u003cbr>    &lt;rect x=\"6\" y=\"14\" width=\"91\" height=\"56\" rx=\"9\" fill=\"#2563eb\" fillOpacity=\".10\" stroke=\"#2563eb\"/&gt;\u003cbr>    &lt;rect x=\"112\" y=\"14\" width=\"91\" height=\"56\" rx=\"9\" fill=\"#2563eb\" fillOpacity=\".10\" stroke=\"#2563eb\"/&gt;\u003cbr>    &lt;rect x=\"226\" y=\"14\" width=\"88\" height=\"56\" rx=\"9\" fill=\"#16a34a\" fillOpacity=\".10\" stroke=\"#16a34a\"/&gt;\u003cbr>    &lt;g fill=\"currentColor\" fontSize=\"12\" textAnchor=\"middle\"&gt;\u003cbr>      &lt;text x=\"51\" y=\"36\"&gt;会員証&lt;/text&gt;&lt;text x=\"51\" y=\"53\"&gt;あり&lt;/text&gt;\u003cbr>      &lt;text x=\"157\" y=\"36\"&gt;予約&lt;/text&gt;&lt;text x=\"157\" y=\"53\"&gt;あり&lt;/text&gt;\u003cbr>      &lt;text x=\"270\" y=\"36\"&gt;入場&lt;/text&gt;&lt;text x=\"270\" y=\"53\"&gt;OK&lt;/text&gt;\u003cbr>    &lt;/g&gt;\u003cbr>    &lt;path d=\"M97 42 H112 M203 42 H225\" stroke=\"currentColor\" strokeWidth=\"1.6\" strokeOpacity=\".5\"/&gt;\u003cbr>    &lt;text x=\"160\" y=\"107\" fontSize=\"13\" textAnchor=\"middle\" fill=\"currentColor\"&gt;両方必要 → AND&lt;/text&gt;\u003cbr>  &lt;/svg&gt;\u003c/p>\u003cp>  「会員証を持っていて、さらに予約もしている人だけが入場できる。これがANDです。」\u003c/p>\u003cp>  &lt;divider color=\"subtle\"/&gt;\u003c/p>\u003cp>  **OR：どちらかの資格があれば入れる扉**\u003c/p>\u003cp>  &lt;svg viewBox=\"0 0 320 128\" width=\"100%\"&gt;\u003cbr>    &lt;rect x=\"6\" y=\"14\" width=\"91\" height=\"56\" rx=\"9\" fill=\"#16a34a\" fillOpacity=\".10\" stroke=\"#16a34a\"/&gt;\u003cbr>    &lt;rect x=\"112\" y=\"14\" width=\"91\" height=\"56\" rx=\"9\" fill=\"#64748b\" fillOpacity=\".08\" stroke=\"#94a3b8\"/&gt;\u003cbr>    &lt;rect x=\"226\" y=\"14\" width=\"88\" height=\"56\" rx=\"9\" fill=\"#16a34a\" fillOpacity=\".10\" stroke=\"#16a34a\"/&gt;\u003cbr>    &lt;g fill=\"currentColor\" fontSize=\"12\" textAnchor=\"middle\"&gt;\u003cbr>      &lt;text x=\"51\" y=\"36\"&gt;社員証&lt;/text&gt;&lt;text x=\"51\" y=\"53\"&gt;あり&lt;/text&gt;\u003cbr>      &lt;text x=\"157\" y=\"36\"&gt;来客証&lt;/text&gt;&lt;text x=\"157\" y=\"53\"&gt;なし&lt;/text&gt;\u003cbr>      &lt;text x=\"270\" y=\"36\"&gt;入場&lt;/text&gt;&lt;text x=\"270\" y=\"53\"&gt;OK&lt;/text&gt;\u003cbr>    &lt;/g&gt;\u003cbr>    &lt;path d=\"M97 42 H112 M203 42 H225\" stroke=\"currentColor\" strokeWidth=\"1.6\" strokeOpacity=\".5\"/&gt;\u003cbr>    &lt;text x=\"160\" y=\"107\" fontSize=\"13\" textAnchor=\"middle\" fill=\"currentColor\"&gt;どちらかでよい → OR&lt;/text&gt;\u003cbr>  &lt;/svg&gt;\u003c/p>\u003cp>  「社員証か来客証のどちらかを持っていれば入場できる。これがORです。」\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>「先輩、ANDは条件が増えるほど厳しくなり、ORは条件が増えるほど成立しやすくなります。」\u003c/p>\u003cp>「この性質まで理解しておけば、複雑な数式でも考えやすくなりますよ。」\u003c/p>\u003cp>## D｜具体例：AND・ORを操作してみましょう\u003c/p>\u003cp>「では先輩、英語と数学の点数を動かして、両方の結果を比較してみてください。」\u003c/p>\u003cp>{@body const [english,setEnglish]=DIL.useState(85)}\u003cbr>{@body const [math,setMath]=DIL.useState(65)}\u003cbr>{@body const [fn,setFn]=DIL.useState(\"AND\")}\u003cbr>{@body const eok=english&gt;=80}\u003cbr>{@body const mok=math&gt;=70}\u003cbr>{@body const andResult=eok&amp;&amp;mok}\u003cbr>{@body const orResult=eok||mok}\u003cbr>{@body const result=fn===\"AND\"?andResult:orResult}\u003cbr>{@body const formula=\"=IF(\"+fn+'(A2&gt;=80,B2&gt;=70),\"合格\",\"不合格\")'}\u003cbr>&lt;box border radius=\"xl\" padding={3} gap={3}&gt;\u003cbr>  &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>    **AND・OR比較シミュレーター**\u003cbr>    &lt;badge&gt;操作できます&lt;/badge&gt;\u003cbr>  &lt;/row&gt;\u003cbr>  &lt;box gap={1}&gt;\u003cbr>    &lt;row justify=\"between\" align=\"center\"&gt;\u003cbr>      &lt;label&gt;英語（A2）&lt;/label&gt;\u003cbr>      &lt;title size=\"lg\" tabularNums&gt;{english}点&lt;/title&gt;\u003cbr>    &lt;/row&gt;\u003cbr>    &lt;slider min={0} max={100} value={english} onChange={setEnglish}/&gt;\u003cbr>    &lt;caption&gt;合格基準：80点以上&lt;/caption&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;box gap={1}&gt;\u003cbr>    &lt;row justify=\"between\" align=\"center\"&gt;\u003cbr>      &lt;label&gt;数学（B2）&lt;/label&gt;\u003cbr>      &lt;title size=\"lg\" tabularNums&gt;{math}点&lt;/title&gt;\u003cbr>    &lt;/row&gt;\u003cbr>    &lt;slider min={0} max={100} value={math} onChange={setMath}/&gt;\u003cbr>    &lt;caption&gt;合格基準：70点以上&lt;/caption&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;box gap={1}&gt;\u003cbr>    &lt;label&gt;使用する関数&lt;/label&gt;\u003cbr>    &lt;segmented-control block={true} value={fn} onChange={setFn} options={[{label:\"AND\",value:\"AND\"},{label:\"OR\",value:\"OR\"}]}/&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;box background=\"surface-secondary\" radius=\"lg\" padding={3} gap={2}&gt;\u003cbr>    &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>      &lt;text size=\"sm\"&gt;英語80点以上&lt;/text&gt;\u003cbr>      &lt;badge color={eok?\"success\":\"danger\"}&gt;{eok?\"TRUE\":\"FALSE\"}&lt;/badge&gt;\u003cbr>    &lt;/row&gt;\u003cbr>    &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>      &lt;text size=\"sm\"&gt;数学70点以上&lt;/text&gt;\u003cbr>      &lt;badge color={mok?\"success\":\"danger\"}&gt;{mok?\"TRUE\":\"FALSE\"}&lt;/badge&gt;\u003cbr>    &lt;/row&gt;\u003cbr>    &lt;divider color=\"subtle\"/&gt;\u003cbr>    &lt;grid columns={2} gap={2}&gt;\u003cbr>      &lt;grid-item&gt;\u003cbr>        &lt;box border={{size:1,color:fn===\"AND\"?\"info\":\"subtle\"}} radius=\"md\" padding={2} gap={1} align=\"center\"&gt;\u003cbr>          &lt;text size=\"xs\" color=\"secondary\"&gt;ANDの結果&lt;/text&gt;\u003cbr>          &lt;title color={andResult?\"success\":\"danger\"} size=\"lg\"&gt;{andResult?\"TRUE\":\"FALSE\"}&lt;/title&gt;\u003cbr>        &lt;/box&gt;\u003cbr>      &lt;/grid-item&gt;\u003cbr>      &lt;grid-item&gt;\u003cbr>        &lt;box border={{size:1,color:fn===\"OR\"?\"info\":\"subtle\"}} radius=\"md\" padding={2} gap={1} align=\"center\"&gt;\u003cbr>          &lt;text size=\"xs\" color=\"secondary\"&gt;ORの結果&lt;/text&gt;\u003cbr>          &lt;title color={orResult?\"success\":\"danger\"} size=\"lg\"&gt;{orResult?\"TRUE\":\"FALSE\"}&lt;/title&gt;\u003cbr>        &lt;/box&gt;\u003cbr>      &lt;/grid-item&gt;\u003cbr>    &lt;/grid&gt;\u003cbr>    &lt;divider color=\"subtle\"/&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"xs\"&gt;IF関数と組み合わせた数式&lt;/text&gt;\u003cbr>    &lt;text size=\"sm\" weight=\"medium\"&gt;{formula}&lt;/text&gt;\u003cbr>    &lt;row justify=\"end\"&gt;\u003cbr>      &lt;button size=\"xs\" color=\"secondary\" variant=\"outline\" onClick={()=&gt;GenUI.copy(formula)}&gt;&lt;icon name=\"copy\" size=\"xs\"/&gt; 数式をコピー&lt;/button&gt;\u003cbr>    &lt;/row&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"xs\"&gt;判定結果&lt;/text&gt;\u003cbr>    &lt;row align=\"center\" gap={2}&gt;\u003cbr>      &lt;icon name={result?\"check-circle\":\"x-circle\"} color={result?\"success\":\"danger\"} size=\"xl\"/&gt;\u003cbr>      &lt;title size=\"2xl\" color={result?\"success\":\"danger\"}&gt;{result?\"合格\":\"不合格\"}&lt;/title&gt;\u003cbr>    &lt;/row&gt;\u003cbr>    &lt;caption&gt;{fn===\"AND\"?\"英語と数学の両方が基準に達しているかを判定しています。\":\"英語か数学の少なくとも一方が基準に達しているかを判定しています。\"}&lt;/caption&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;button block variant=\"outline\" color=\"secondary\" onClick={()=&gt;{setEnglish(85);setMath(65);setFn(\"AND\")}}&gt;初期値に戻す&lt;/button&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>「先輩、最初は英語85点、数学65点ですよね。ANDでは不合格ですが、ORでは合格になります。」\u003c/p>\u003cp>「次に数学を75点にしてみてください。今度はANDでもORでも合格です。つまり、ORは両方の条件が成立していてもTRUEなんです。」\u003c/p>\u003cp>### 実務例①：請求書の処理完了判定\u003c/p>\u003cp>「例えば、請求書の処理に『内容確認』と『上司承認』の両方が必要だとします。」\u003c/p>\u003cp>A2が内容確認、B2が上司承認なら、\u003c/p>\u003cp>「両方が『済』になって初めて処理完了です。片方だけでは未完了になります。」\u003c/p>\u003cp>### 実務例②：優先対応が必要な取引\u003c/p>\u003cp>「今度は、次のどちらかに当てはまれば優先対応するとしましょう。」\u003c/p>\u003cp>- 支払期限が過ぎている\u003cbr>- 支払額が100万円以上\u003c/p>\u003cp>A2が支払期限、B2が支払額なら、\u003c/p>\u003cp>「TODAY関数は今日の日付を返します。期限が過ぎているか、金額が100万円以上なら『優先対応』です。」\u003c/p>\u003cp>ただし、支払期限が空白の場合などは、意図しない判定を避けるための追加条件が必要です。\u003c/p>\u003cp>### 実務例③：ANDとORを組み合わせる\u003c/p>\u003cp>「先輩、少し応用です。」\u003c/p>\u003cp>例えば、次の条件をすべて満たす人を対象にするとします。\u003c/p>\u003cp>- 年齢が20歳以上\u003cbr>- 正社員または契約社員\u003c/p>\u003cp>A2が年齢、B2が雇用形態なら、\u003c/p>\u003cp>「これは、ANDの中にORを入れているんです。」\u003c/p>\u003cp>&lt;box border radius=\"lg\" padding={3} gap={2}&gt;\u003cbr>  **条件の構造**\u003c/p>\u003cp>  &lt;box background=\"surface-secondary\" radius=\"md\" padding={3} align=\"center\"&gt;\u003cbr>    **AND：両方必要**\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;grid columns={2} gap={2}&gt;\u003cbr>    &lt;grid-item&gt;\u003cbr>      &lt;box border radius=\"md\" padding={3} align=\"center\" gap={1}&gt;\u003cbr>        **年齢20歳以上**\u003cbr>        &lt;caption&gt;条件①&lt;/caption&gt;\u003cbr>      &lt;/box&gt;\u003cbr>    &lt;/grid-item&gt;\u003cbr>    &lt;grid-item&gt;\u003cbr>      &lt;box border radius=\"md\" padding={3} align=\"center\" gap={1}&gt;\u003cbr>        **OR**\u003cbr>        &lt;caption&gt;正社員 または 契約社員&lt;/caption&gt;\u003cbr>      &lt;/box&gt;\u003cbr>    &lt;/grid-item&gt;\u003cbr>  &lt;/grid&gt;\u003cbr>  &lt;caption&gt;年齢条件を満たし、さらに雇用形態がどちらかに一致すれば対象です。&lt;/caption&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>「こうした複雑な条件も、ANDとORを組み合わせれば表現できます。」\u003c/p>\u003cp>## 理解確認：3問\u003c/p>\u003cp>{@body const qs=[{q:\"AND関数がTRUEになるのはどの場合ですか？\",opts:[\"どれか1つの条件が成立した場合\",\"すべての条件が成立した場合\",\"すべての条件が成立しなかった場合\"],a:1,exp:\"ANDは指定したすべての条件がTRUEの場合だけTRUEを返します。\"},{q:\"OR関数で、2つの条件が両方TRUEの場合はどうなりますか？\",opts:[\"TRUE\",\"FALSE\",\"エラー\"],a:0,exp:\"ORは少なくとも1つの条件がTRUEならTRUEです。両方TRUEでも問題ありません。\"},{q:'=IF(AND(85&gt;=80,65&gt;=70),\"合格\",\"不合格\") の結果は？',opts:[\"合格\",\"不合格\",\"TRUE\"],a:1,exp:\"英語の条件はTRUEですが、数学の条件はFALSEです。ANDはFALSEとなるため、IFは「不合格」を返します。\"}]}\u003cbr>{@body const [answers,setAnswers]=DIL.useState({})}\u003cbr>&lt;box border radius=\"lg\" padding={3} gap={3}&gt;\u003cbr>  {#each qs as q,i}\u003cbr>    &lt;box key={i} gap={2}&gt;\u003cbr>      **Q{i+1}. {q.q}**\u003cbr>      &lt;radio-group direction=\"col\" value={answers[i]===undefined?\"\":String(answers[i])} onChange={v=&gt;setAnswers(p=&gt;({...p,[i]:Number(v)}))}&gt;\u003cbr>        {#each q.opts as opt,j}\u003cbr>          &lt;radio value={String(j)}&gt;{opt}&lt;/radio&gt;\u003cbr>        {/each}\u003cbr>      &lt;/radio-group&gt;\u003cbr>      {#if answers[i]!==undefined}\u003cbr>        &lt;box background=\"surface-secondary\" padding={2} radius=\"md\" gap={1}&gt;\u003cbr>          &lt;row align=\"center\" gap={2}&gt;\u003cbr>            &lt;icon name={answers[i]===q.a?\"check-circle\":\"x-circle\"} color={answers[i]===q.a?\"success\":\"danger\"}/&gt;\u003cbr>            **{answers[i]===q.a?\"正解です！\":\"不正解です\"}**\u003cbr>          &lt;/row&gt;\u003cbr>          &lt;text size=\"sm\"&gt;正解：{q.opts[q.a]}。{q.exp}&lt;/text&gt;\u003cbr>        &lt;/box&gt;\u003cbr>      {/if}\u003cbr>    &lt;/box&gt;\u003cbr>    {#if i&lt;2}&lt;divider color=\"subtle\"/&gt;{/if}\u003cbr>  {/each}\u003cbr>  &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"sm\"&gt;正解数：{qs.filter((q,i)=&gt;answers[i]===q.a).length} / 3&lt;/text&gt;\u003cbr>    &lt;button size=\"sm\" color=\"secondary\" variant=\"outline\" onClick={()=&gt;setAnswers({})}&gt;再挑戦&lt;/button&gt;\u003cbr>  &lt;/row&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>## 30秒復習\u003c/p>\u003cp>「先輩、最後に6つだけ確認しましょう。」\u003c/p>\u003cp>1. **ANDとは？** すべての条件が成立した場合にTRUEを返す関数。\u003cbr>2. **ORとは？** どれか1つ以上の条件が成立した場合にTRUEを返す関数。\u003cbr>3. **何が違う？** ANDは全部必要、ORは1つでもよい。\u003cbr>4. **基本構造は？** `=AND(条件1,条件2)`、`=OR(条件1,条件2)`。\u003cbr>5. **実務での使い方は？** IF関数と組み合わせて、複数条件に応じた表示を切り替える。\u003cbr>6. **間違えやすいところは？** ORは両方の条件がTRUEでもTRUEになること。\u003c/p>\u003cp>## 一文記憶\u003c/p>\u003cp>**ANDは「全部満たす」、ORは「1つでも満たす」。**\u003c/p>\u003cp>「先輩、今回のANDとORは、以前学んだIF関数とセットで覚えておいてください。」\u003c/p>\u003cp>「IFが『条件に応じて結果を分ける役割』、ANDとORが『複数の条件をまとめる役割』です。この役割分担が理解できれば、複雑なExcelの判定式も少しずつ組み立てられるようになりますよ。」\u003c/p>","originalText":"# ⑨ AND関数・OR関数（アンド・オア関数）\u003ctext color=\"secondary\" size=\"sm\">Excel関数｜論理関数｜複数条件の判定・IF関数との組み合わせ\u003c/text>「先輩、今回はAND関数とOR関数ですね。どちらも**複数の条件をまとめて判定する関数**です。」「以前勉強したIF関数は、条件が成立したかどうかで結果を切り替える関数でしたよね。でも、仕事では『条件が2つとも成立したら』とか『どちらか一方が成立したら』という判断も必要になります。」「そんなときに使うのがANDとORなんです。」## A｜要点：ANDとORの違い\u003cbox border radius=\"lg\" padding={3} gap={3}>  \u003cgrid columns={2} gap={3}>    \u003cgrid-item>      \u003cbox background=\"rgba(37,99,235,0.07)\" border={{size:1,color:\"info\"}} radius=\"lg\" padding={3} gap={2}>        \u003ctitle size=\"lg\" color=\"info\">AND\u003c/title>        **すべて成立**        \u003ctext size=\"sm\">条件Aも条件Bも満たした場合だけTRUE\u003c/text>        \u003crow align=\"center\" justify=\"center\" gap={2}>          \u003cbadge color=\"success\">A ✓\u003c/badge>          \u003cicon name=\"plus\" color=\"secondary\"/>          \u003cbadge color=\"success\">B ✓\u003c/badge>        \u003c/row>        \u003cbox align=\"center\" gap={1}>          \u003cicon name=\"arrow-down\" color=\"secondary\"/>          **TRUE**        \u003c/box>      \u003c/box>    \u003c/grid-item>    \u003cgrid-item>      \u003cbox background=\"rgba(22,163,74,0.07)\" border={{size:1,color:\"success\"}} radius=\"lg\" padding={3} gap={2}>        \u003ctitle size=\"lg\" color=\"success\">OR\u003c/title>        **どれか成立**        \u003ctext size=\"sm\">条件Aか条件Bの少なくとも一方を満たせばTRUE\u003c/text>        \u003crow align=\"center\" justify=\"center\" gap={2}>          \u003cbadge color=\"success\">A ✓\u003c/badge>          \u003ctext color=\"secondary\">または\u003c/text>          \u003cbadge>B ×\u003c/badge>        \u003c/row>        \u003cbox align=\"center\" gap={1}>          \u003cicon name=\"arrow-down\" color=\"secondary\"/>          **TRUE**        \u003c/box>      \u003c/box>    \u003c/grid-item>  \u003c/grid>\u003c/box>「先輩、最初に覚えるのはこの違いだけで構いません。」- **AND：全部の条件を満たす必要がある**- **OR：1つでも条件を満たせばよい**「ただし、ORは『どちらか一方だけ』という意味ではありません。両方成立していてもTRUEです。ここは重要ですよ。」## B｜詳しい解説：仕組みを理解しましょう### 1. AND関数の書き方例えば、テストで次の条件を満たしたら合格とします。- 英語が80点以上- 数学が70点以上A2が英語、B2が数学の点数なら、「先輩、この式は合格・不合格という文字を返すのではなく、TRUEかFALSEを返します。」例えば英語85点、数学75点なら、両方の条件が成立するためTRUEです。一方、英語90点でも数学65点なら、数学の条件が成立しないのでFALSEです。### 2. OR関数の書き方同じ条件をORで判定すると、「こちらは英語が80点以上、または数学が70点以上ならTRUEです。」「つまり、英語90点・数学65点なら、ANDはFALSEですがORはTRUEになります。」### 3. 真理値表で比較する「先輩、ここは表にすると一目で分かりますよ。」| 条件A | 条件B | AND | OR ||---|---|---|---|| TRUE | TRUE | TRUE | TRUE || TRUE | FALSE | FALSE | TRUE || FALSE | TRUE | FALSE | TRUE || FALSE | FALSE | FALSE | FALSE |「ANDは両方TRUEの1パターンだけ。ORは両方FALSEのときだけFALSEです。」### 4. IF関数と組み合わせる「ここからが実務で特に重要です。」ANDとORだけでは通常、TRUEかFALSEが表示されます。しかし、IFと組み合わせれば、好きな文字を表示できます。**ANDとIFの組み合わせ**「英語80点以上、かつ数学70点以上なら『合格』。どちらかが足りなければ『不合格』です。」**ORとIFの組み合わせ**「こちらは、英語か数学のどちらかが基準に達していれば『合格』になります。」「同じIF関数でも、中に入れるのがANDかORかで判定結果が変わるんです。」### 5. 3つ以上の条件も指定できるANDとORは2条件に限定されません。これは3条件すべてが成立した場合にTRUEです。こちらは3条件のうち、1つ以上が成立すればTRUEです。## C｜イメージ理解：入場条件で考える「先輩、身近な例で考えてみましょう。」\u003cbox border radius=\"lg\" padding={3} gap={2}>  **AND：2つの鍵が必要な扉**  \u003csvg viewBox=\"0 0 320 128\" width=\"100%\">    \u003crect x=\"6\" y=\"14\" width=\"91\" height=\"56\" rx=\"9\" fill=\"#2563eb\" fillOpacity=\".10\" stroke=\"#2563eb\"/>    \u003crect x=\"112\" y=\"14\" width=\"91\" height=\"56\" rx=\"9\" fill=\"#2563eb\" fillOpacity=\".10\" stroke=\"#2563eb\"/>    \u003crect x=\"226\" y=\"14\" width=\"88\" height=\"56\" rx=\"9\" fill=\"#16a34a\" fillOpacity=\".10\" stroke=\"#16a34a\"/>    \u003cg fill=\"currentColor\" fontSize=\"12\" textAnchor=\"middle\">      \u003ctext x=\"51\" y=\"36\">会員証\u003c/text>\u003ctext x=\"51\" y=\"53\">あり\u003c/text>      \u003ctext x=\"157\" y=\"36\">予約\u003c/text>\u003ctext x=\"157\" y=\"53\">あり\u003c/text>      \u003ctext x=\"270\" y=\"36\">入場\u003c/text>\u003ctext x=\"270\" y=\"53\">OK\u003c/text>    \u003c/g>    \u003cpath d=\"M97 42 H112 M203 42 H225\" stroke=\"currentColor\" strokeWidth=\"1.6\" strokeOpacity=\".5\"/>    \u003ctext x=\"160\" y=\"107\" fontSize=\"13\" textAnchor=\"middle\" fill=\"currentColor\">両方必要 → AND\u003c/text>  \u003c/svg>  「会員証を持っていて、さらに予約もしている人だけが入場できる。これがANDです。」  \u003cdivider color=\"subtle\"/>  **OR：どちらかの資格があれば入れる扉**  \u003csvg viewBox=\"0 0 320 128\" width=\"100%\">    \u003crect x=\"6\" y=\"14\" width=\"91\" height=\"56\" rx=\"9\" fill=\"#16a34a\" fillOpacity=\".10\" stroke=\"#16a34a\"/>    \u003crect x=\"112\" y=\"14\" width=\"91\" height=\"56\" rx=\"9\" fill=\"#64748b\" fillOpacity=\".08\" stroke=\"#94a3b8\"/>    \u003crect x=\"226\" y=\"14\" width=\"88\" height=\"56\" rx=\"9\" fill=\"#16a34a\" fillOpacity=\".10\" stroke=\"#16a34a\"/>    \u003cg fill=\"currentColor\" fontSize=\"12\" textAnchor=\"middle\">      \u003ctext x=\"51\" y=\"36\">社員証\u003c/text>\u003ctext x=\"51\" y=\"53\">あり\u003c/text>      \u003ctext x=\"157\" y=\"36\">来客証\u003c/text>\u003ctext x=\"157\" y=\"53\">なし\u003c/text>      \u003ctext x=\"270\" y=\"36\">入場\u003c/text>\u003ctext x=\"270\" y=\"53\">OK\u003c/text>    \u003c/g>    \u003cpath d=\"M97 42 H112 M203 42 H225\" stroke=\"currentColor\" strokeWidth=\"1.6\" strokeOpacity=\".5\"/>    \u003ctext x=\"160\" y=\"107\" fontSize=\"13\" textAnchor=\"middle\" fill=\"currentColor\">どちらかでよい → OR\u003c/text>  \u003c/svg>  「社員証か来客証のどちらかを持っていれば入場できる。これがORです。」\u003c/box>「先輩、ANDは条件が増えるほど厳しくなり、ORは条件が増えるほど成立しやすくなります。」「この性質まで理解しておけば、複雑な数式でも考えやすくなりますよ。」## D｜具体例：AND・ORを操作してみましょう「では先輩、英語と数学の点数を動かして、両方の結果を比較してみてください。」{@body const [english,setEnglish]=DIL.useState(85)}{@body const [math,setMath]=DIL.useState(65)}{@body const [fn,setFn]=DIL.useState(\"AND\")}{@body const eok=english>=80}{@body const mok=math>=70}{@body const andResult=eok&&mok}{@body const orResult=eok||mok}{@body const result=fn===\"AND\"?andResult:orResult}{@body const formula=\"=IF(\"+fn+'(A2>=80,B2>=70),\"合格\",\"不合格\")'}\u003cbox border radius=\"xl\" padding={3} gap={3}>  \u003crow align=\"center\" justify=\"between\">    **AND・OR比較シミュレーター**    \u003cbadge>操作できます\u003c/badge>  \u003c/row>  \u003cbox gap={1}>    \u003crow justify=\"between\" align=\"center\">      \u003clabel>英語（A2）\u003c/label>      \u003ctitle size=\"lg\" tabularNums>{english}点\u003c/title>    \u003c/row>    \u003cslider min={0} max={100} value={english} onChange={setEnglish}/>    \u003ccaption>合格基準：80点以上\u003c/caption>  \u003c/box>  \u003cbox gap={1}>    \u003crow justify=\"between\" align=\"center\">      \u003clabel>数学（B2）\u003c/label>      \u003ctitle size=\"lg\" tabularNums>{math}点\u003c/title>    \u003c/row>    \u003cslider min={0} max={100} value={math} onChange={setMath}/>    \u003ccaption>合格基準：70点以上\u003c/caption>  \u003c/box>  \u003cbox gap={1}>    \u003clabel>使用する関数\u003c/label>    \u003csegmented-control block={true} value={fn} onChange={setFn} options={[{label:\"AND\",value:\"AND\"},{label:\"OR\",value:\"OR\"}]}/>  \u003c/box>  \u003cbox background=\"surface-secondary\" radius=\"lg\" padding={3} gap={2}>    \u003crow align=\"center\" justify=\"between\">      \u003ctext size=\"sm\">英語80点以上\u003c/text>      \u003cbadge color={eok?\"success\":\"danger\"}>{eok?\"TRUE\":\"FALSE\"}\u003c/badge>    \u003c/row>    \u003crow align=\"center\" justify=\"between\">      \u003ctext size=\"sm\">数学70点以上\u003c/text>      \u003cbadge color={mok?\"success\":\"danger\"}>{mok?\"TRUE\":\"FALSE\"}\u003c/badge>    \u003c/row>    \u003cdivider color=\"subtle\"/>    \u003cgrid columns={2} gap={2}>      \u003cgrid-item>        \u003cbox border={{size:1,color:fn===\"AND\"?\"info\":\"subtle\"}} radius=\"md\" padding={2} gap={1} align=\"center\">          \u003ctext size=\"xs\" color=\"secondary\">ANDの結果\u003c/text>          \u003ctitle color={andResult?\"success\":\"danger\"} size=\"lg\">{andResult?\"TRUE\":\"FALSE\"}\u003c/title>        \u003c/box>      \u003c/grid-item>      \u003cgrid-item>        \u003cbox border={{size:1,color:fn===\"OR\"?\"info\":\"subtle\"}} radius=\"md\" padding={2} gap={1} align=\"center\">          \u003ctext size=\"xs\" color=\"secondary\">ORの結果\u003c/text>          \u003ctitle color={orResult?\"success\":\"danger\"} size=\"lg\">{orResult?\"TRUE\":\"FALSE\"}\u003c/title>        \u003c/box>      \u003c/grid-item>    \u003c/grid>    \u003cdivider color=\"subtle\"/>    \u003ctext color=\"secondary\" size=\"xs\">IF関数と組み合わせた数式\u003c/text>    \u003ctext size=\"sm\" weight=\"medium\">{formula}\u003c/text>    \u003crow justify=\"end\">      \u003cbutton size=\"xs\" color=\"secondary\" variant=\"outline\" onClick={()=>GenUI.copy(formula)}>\u003cicon name=\"copy\" size=\"xs\"/> 数式をコピー\u003c/button>    \u003c/row>    \u003ctext color=\"secondary\" size=\"xs\">判定結果\u003c/text>    \u003crow align=\"center\" gap={2}>      \u003cicon name={result?\"check-circle\":\"x-circle\"} color={result?\"success\":\"danger\"} size=\"xl\"/>      \u003ctitle size=\"2xl\" color={result?\"success\":\"danger\"}>{result?\"合格\":\"不合格\"}\u003c/title>    \u003c/row>    \u003ccaption>{fn===\"AND\"?\"英語と数学の両方が基準に達しているかを判定しています。\":\"英語か数学の少なくとも一方が基準に達しているかを判定しています。\"}\u003c/caption>  \u003c/box>  \u003cbutton block variant=\"outline\" color=\"secondary\" onClick={()=>{setEnglish(85);setMath(65);setFn(\"AND\")}}>初期値に戻す\u003c/button>\u003c/box>「先輩、最初は英語85点、数学65点ですよね。ANDでは不合格ですが、ORでは合格になります。」「次に数学を75点にしてみてください。今度はANDでもORでも合格です。つまり、ORは両方の条件が成立していてもTRUEなんです。」### 実務例①：請求書の処理完了判定「例えば、請求書の処理に『内容確認』と『上司承認』の両方が必要だとします。」A2が内容確認、B2が上司承認なら、「両方が『済』になって初めて処理完了です。片方だけでは未完了になります。」### 実務例②：優先対応が必要な取引「今度は、次のどちらかに当てはまれば優先対応するとしましょう。」- 支払期限が過ぎている- 支払額が100万円以上A2が支払期限、B2が支払額なら、「TODAY関数は今日の日付を返します。期限が過ぎているか、金額が100万円以上なら『優先対応』です。」ただし、支払期限が空白の場合などは、意図しない判定を避けるための追加条件が必要です。### 実務例③：ANDとORを組み合わせる「先輩、少し応用です。」例えば、次の条件をすべて満たす人を対象にするとします。- 年齢が20歳以上- 正社員または契約社員A2が年齢、B2が雇用形態なら、「これは、ANDの中にORを入れているんです。」\u003cbox border radius=\"lg\" padding={3} gap={2}>  **条件の構造**  \u003cbox background=\"surface-secondary\" radius=\"md\" padding={3} align=\"center\">    **AND：両方必要**  \u003c/box>  \u003cgrid columns={2} gap={2}>    \u003cgrid-item>      \u003cbox border radius=\"md\" padding={3} align=\"center\" gap={1}>        **年齢20歳以上**        \u003ccaption>条件①\u003c/caption>      \u003c/box>    \u003c/grid-item>    \u003cgrid-item>      \u003cbox border radius=\"md\" padding={3} align=\"center\" gap={1}>        **OR**        \u003ccaption>正社員 または 契約社員\u003c/caption>      \u003c/box>    \u003c/grid-item>  \u003c/grid>  \u003ccaption>年齢条件を満たし、さらに雇用形態がどちらかに一致すれば対象です。\u003c/caption>\u003c/box>「こうした複雑な条件も、ANDとORを組み合わせれば表現できます。」## 理解確認：3問{@body const qs=[{q:\"AND関数がTRUEになるのはどの場合ですか？\",opts:[\"どれか1つの条件が成立した場合\",\"すべての条件が成立した場合\",\"すべての条件が成立しなかった場合\"],a:1,exp:\"ANDは指定したすべての条件がTRUEの場合だけTRUEを返します。\"},{q:\"OR関数で、2つの条件が両方TRUEの場合はどうなりますか？\",opts:[\"TRUE\",\"FALSE\",\"エラー\"],a:0,exp:\"ORは少なくとも1つの条件がTRUEならTRUEです。両方TRUEでも問題ありません。\"},{q:'=IF(AND(85>=80,65>=70),\"合格\",\"不合格\") の結果は？',opts:[\"合格\",\"不合格\",\"TRUE\"],a:1,exp:\"英語の条件はTRUEですが、数学の条件はFALSEです。ANDはFALSEとなるため、IFは「不合格」を返します。\"}]}{@body const [answers,setAnswers]=DIL.useState({})}\u003cbox border radius=\"lg\" padding={3} gap={3}>  {#each qs as q,i}    \u003cbox key={i} gap={2}>      **Q{i+1}. {q.q}**      \u003cradio-group direction=\"col\" value={answers[i]===undefined?\"\":String(answers[i])} onChange={v=>setAnswers(p=>({...p,[i]:Number(v)}))}>        {#each q.opts as opt,j}          \u003cradio value={String(j)}>{opt}\u003c/radio>        {/each}      \u003c/radio-group>      {#if answers[i]!==undefined}        \u003cbox background=\"surface-secondary\" padding={2} radius=\"md\" gap={1}>          \u003crow align=\"center\" gap={2}>            \u003cicon name={answers[i]===q.a?\"check-circle\":\"x-circle\"} color={answers[i]===q.a?\"success\":\"danger\"}/>            **{answers[i]===q.a?\"正解です！\":\"不正解です\"}**          \u003c/row>          \u003ctext size=\"sm\">正解：{q.opts[q.a]}。{q.exp}\u003c/text>        \u003c/box>      {/if}    \u003c/box>    {#if i\u003c2}\u003cdivider color=\"subtle\"/>{/if}  {/each}  \u003crow align=\"center\" justify=\"between\">    \u003ctext color=\"secondary\" size=\"sm\">正解数：{qs.filter((q,i)=>answers[i]===q.a).length} / 3\u003c/text>    \u003cbutton size=\"sm\" color=\"secondary\" variant=\"outline\" onClick={()=>setAnswers({})}>再挑戦\u003c/button>  \u003c/row>\u003c/box>## 30秒復習「先輩、最後に6つだけ確認しましょう。」1. **ANDとは？** すべての条件が成立した場合にTRUEを返す関数。2. **ORとは？** どれか1つ以上の条件が成立した場合にTRUEを返す関数。3. **何が違う？** ANDは全部必要、ORは1つでもよい。4. **基本構造は？** `=AND(条件1,条件2)`、`=OR(条件1,条件2)`。5. **実務での使い方は？** IF関数と組み合わせて、複数条件に応じた表示を切り替える。6. **間違えやすいところは？** ORは両方の条件がTRUEでもTRUEになること。## 一文記憶**ANDは「全部満たす」、ORは「1つでも満たす」。**「先輩、今回のANDとORは、以前学んだIF関数とセットで覚えておいてください。」「IFが『条件に応じて結果を分ける役割』、ANDとORが『複数の条件をまとめる役割』です。この役割分担が理解できれば、複雑なExcelの判定式も少しずつ組み立てられるようになりますよ。」","sections":{"A":"\u003ch1>⑨ AND関数・OR関数（アンド・オア関数）\u003c/h1>\n\u003cp class=\"muted\">Excel関数｜論理関数｜複数条件の判定・IF関数との組み合わせ\u003c/p>\u003cp>「先輩、今回はAND関数とOR関数ですね。どちらも\u003cstrong>複数の条件をまとめて判定する関数\u003c/strong>です。」\u003c/p>\n\u003cp>「以前勉強したIF関数は、条件が成立したかどうかで結果を切り替える関数でしたよね。でも、仕事では『条件が2つとも成立したら』とか『どちらか一方が成立したら』という判断も必要になります。」\u003c/p>\n\u003cp>「そんなときに使うのがANDとORなんです。」\u003c/p>\n\u003ch2>A｜要点：ANDとORの違い\u003c/h2>\u003cdiv class=\"source-static\">\u003cdiv>\n  \u003cdiv>\n    \u003cdiv>\n      \u003cdiv>\n        \u003cstrong>AND\u003c/strong>\n        \u003cstrong>すべて成立\u003c/strong>\n\u003cspan>条件Aも条件Bも満たした場合だけTRUE\u003c/span>\n        \u003cdiv>\n          \u003csmall>A ✓\u003c/small>\n           → \n          \u003csmall>B ✓\u003c/small>\n        \u003c/div>\n        \u003cdiv>\n           → \n          \u003cstrong>TRUE\u003c/strong>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv>\n      \u003cdiv>\n        \u003cstrong>OR\u003c/strong>\n        \u003cstrong>どれか成立\u003c/strong>\n\u003cspan>条件Aか条件Bの少なくとも一方を満たせばTRUE\u003c/span>\n        \u003cdiv>\n          \u003csmall>A ✓\u003c/small>\n          \u003cspan>または\u003c/span>\n          \u003csmall>B ×\u003c/small>\n        \u003c/div>\n        \u003cdiv>\n           → \n          \u003cstrong>TRUE\u003c/strong>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003c/div>\u003cp>「先輩、最初に覚えるのはこの違いだけで構いません。」\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>AND：全部の条件を満たす必要がある\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>OR：1つでも条件を満たせばよい\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cp>「ただし、ORは『どちらか一方だけ』という意味ではありません。両方成立していてもTRUEです。ここは重要ですよ。」\u003c/p>\n","B":"\u003ch2>B｜詳しい解説：仕組みを理解しましょう\u003c/h2>\u003ch3>1. AND関数の書き方\u003c/h3>\n\u003cp>例えば、テストで次の条件を満たしたら合格とします。\u003c/p>\n\u003cul>\n\u003cli>英語が80点以上\u003c/li>\n\u003cli>数学が70点以上\u003c/li>\n\u003c/ul>\n\u003cp>A2が英語、B2が数学の点数なら、\u003c/p>\n\u003cp>「先輩、この式は合格・不合格という文字を返すのではなく、TRUEかFALSEを返します。」\u003c/p>\n\u003cp>例えば英語85点、数学75点なら、両方の条件が成立するためTRUEです。\u003c/p>\n\u003cp>一方、英語90点でも数学65点なら、数学の条件が成立しないのでFALSEです。\u003c/p>\n\u003ch3>2. OR関数の書き方\u003c/h3>\n\u003cp>同じ条件をORで判定すると、\u003c/p>\n\u003cp>「こちらは英語が80点以上、または数学が70点以上ならTRUEです。」\u003c/p>\n\u003cp>「つまり、英語90点・数学65点なら、ANDはFALSEですがORはTRUEになります。」\u003c/p>\n\u003ch3>3. 真理値表で比較する\u003c/h3>\n\u003cp>「先輩、ここは表にすると一目で分かりますよ。」\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>条件A\u003c/th>\n\u003cth>条件B\u003c/th>\n\u003cth>AND\u003c/th>\n\u003cth>OR\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>TRUE\u003c/td>\n\u003ctd>TRUE\u003c/td>\n\u003ctd>TRUE\u003c/td>\n\u003ctd>TRUE\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TRUE\u003c/td>\n\u003ctd>FALSE\u003c/td>\n\u003ctd>FALSE\u003c/td>\n\u003ctd>TRUE\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FALSE\u003c/td>\n\u003ctd>TRUE\u003c/td>\n\u003ctd>FALSE\u003c/td>\n\u003ctd>TRUE\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FALSE\u003c/td>\n\u003ctd>FALSE\u003c/td>\n\u003ctd>FALSE\u003c/td>\n\u003ctd>FALSE\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>「ANDは両方TRUEの1パターンだけ。ORは両方FALSEのときだけFALSEです。」\u003c/p>\n\u003ch3>4. IF関数と組み合わせる\u003c/h3>\n\u003cp>「ここからが実務で特に重要です。」\u003c/p>\n\u003cp>ANDとORだけでは通常、TRUEかFALSEが表示されます。しかし、IFと組み合わせれば、好きな文字を表示できます。\u003c/p>\n\u003cp>\u003cstrong>ANDとIFの組み合わせ\u003c/strong>\u003c/p>\n\u003cp>「英語80点以上、かつ数学70点以上なら『合格』。どちらかが足りなければ『不合格』です。」\u003c/p>\n\u003cp>\u003cstrong>ORとIFの組み合わせ\u003c/strong>\u003c/p>\n\u003cp>「こちらは、英語か数学のどちらかが基準に達していれば『合格』になります。」\u003c/p>\n\u003cp>「同じIF関数でも、中に入れるのがANDかORかで判定結果が変わるんです。」\u003c/p>\n\u003ch3>5. 3つ以上の条件も指定できる\u003c/h3>\n\u003cp>ANDとORは2条件に限定されません。\u003c/p>\n\u003cp>これは3条件すべてが成立した場合にTRUEです。\u003c/p>\n\u003cp>こちらは3条件のうち、1つ以上が成立すればTRUEです。\u003c/p>\n","C":"\u003ch2>C｜イメージ理解：入場条件で考える\u003c/h2>\u003cp>「先輩、身近な例で考えてみましょう。」\u003c/p>\n\u003cdiv class=\"source-static\">\u003cdiv>\n  \u003cstrong>AND：2つの鍵が必要な扉\u003c/strong>\n\u003csvg viewBox=\"0 0 320 128\" width=\"100%\">\n    \u003crect x=\"6\" y=\"14\" width=\"91\" height=\"56\" rx=\"9\" fill=\"#2563eb\" fill-opacity=\".10\" stroke=\"#2563eb\"/>\n    \u003crect x=\"112\" y=\"14\" width=\"91\" height=\"56\" rx=\"9\" fill=\"#2563eb\" fill-opacity=\".10\" stroke=\"#2563eb\"/>\n    \u003crect x=\"226\" y=\"14\" width=\"88\" height=\"56\" rx=\"9\" fill=\"#16a34a\" fill-opacity=\".10\" stroke=\"#16a34a\"/>\n    \u003cg fill=\"currentColor\" font-size=\"12\" text-anchor=\"middle\">\n      \u003ctext x=\"51\" y=\"36\">会員証\u003c/text>\u003ctext x=\"51\" y=\"53\">あり\u003c/text>\n      \u003ctext x=\"157\" y=\"36\">予約\u003c/text>\u003ctext x=\"157\" y=\"53\">あり\u003c/text>\n      \u003ctext x=\"270\" y=\"36\">入場\u003c/text>\u003ctext x=\"270\" y=\"53\">OK\u003c/text>\n    \u003c/g>\n    \u003cpath d=\"M97 42 H112 M203 42 H225\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-opacity=\".5\"/>\n    \u003ctext x=\"160\" y=\"107\" font-size=\"13\" text-anchor=\"middle\" fill=\"currentColor\">両方必要 → AND\u003c/text>\n  \u003c/svg>\n\u003c/div>\u003cp>「会員証を持っていて、さらに予約もしている人だけが入場できる。これがANDです。」\u003c/p>\n\u003cdiv class=\"source-static\">\u003chr>\n\u003c/div>\u003cp>\u003cstrong>OR：どちらかの資格があれば入れる扉\u003c/strong>\u003c/p>\n\u003cdiv class=\"source-static\">\u003csvg viewBox=\"0 0 320 128\" width=\"100%\">\n    \u003crect x=\"6\" y=\"14\" width=\"91\" height=\"56\" rx=\"9\" fill=\"#16a34a\" fill-opacity=\".10\" stroke=\"#16a34a\"/>\n    \u003crect x=\"112\" y=\"14\" width=\"91\" height=\"56\" rx=\"9\" fill=\"#64748b\" fill-opacity=\".08\" stroke=\"#94a3b8\"/>\n    \u003crect x=\"226\" y=\"14\" width=\"88\" height=\"56\" rx=\"9\" fill=\"#16a34a\" fill-opacity=\".10\" stroke=\"#16a34a\"/>\n    \u003cg fill=\"currentColor\" font-size=\"12\" text-anchor=\"middle\">\n      \u003ctext x=\"51\" y=\"36\">社員証\u003c/text>\u003ctext x=\"51\" y=\"53\">あり\u003c/text>\n      \u003ctext x=\"157\" y=\"36\">来客証\u003c/text>\u003ctext x=\"157\" y=\"53\">なし\u003c/text>\n      \u003ctext x=\"270\" y=\"36\">入場\u003c/text>\u003ctext x=\"270\" y=\"53\">OK\u003c/text>\n    \u003c/g>\n    \u003cpath d=\"M97 42 H112 M203 42 H225\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-opacity=\".5\"/>\n    \u003ctext x=\"160\" y=\"107\" font-size=\"13\" text-anchor=\"middle\" fill=\"currentColor\">どちらかでよい → OR\u003c/text>\n  \u003c/svg>\n「社員証か来客証のどちらかを持っていれば入場できる。これがORです。」\n\u003c/div>\n\u003c/div>\u003cp>「先輩、ANDは条件が増えるほど厳しくなり、ORは条件が増えるほど成立しやすくなります。」\u003c/p>\n\u003cp>「この性質まで理解しておけば、複雑な数式でも考えやすくなりますよ。」\u003c/p>\n","D":"\u003ch2>D｜具体例：AND・ORを操作してみましょう\u003c/h2>\u003cp>「では先輩、英語と数学の点数を動かして、両方の結果を比較してみてください。」\u003c/p>\n\u003cp>「先輩、最初は英語85点、数学65点ですよね。ANDでは不合格ですが、ORでは合格になります。」\u003c/p>\n\u003cp>「次に数学を75点にしてみてください。今度はANDでもORでも合格です。つまり、ORは両方の条件が成立していてもTRUEなんです。」\u003c/p>\n\u003ch3>実務例①：請求書の処理完了判定\u003c/h3>\n\u003cp>「例えば、請求書の処理に『内容確認』と『上司承認』の両方が必要だとします。」\u003c/p>\n\u003cp>A2が内容確認、B2が上司承認なら、\u003c/p>\n\u003cp>「両方が『済』になって初めて処理完了です。片方だけでは未完了になります。」\u003c/p>\n\u003ch3>実務例②：優先対応が必要な取引\u003c/h3>\n\u003cp>「今度は、次のどちらかに当てはまれば優先対応するとしましょう。」\u003c/p>\n\u003cul>\n\u003cli>支払期限が過ぎている\u003c/li>\n\u003cli>支払額が100万円以上\u003c/li>\n\u003c/ul>\n\u003cp>A2が支払期限、B2が支払額なら、\u003c/p>\n\u003cp>「TODAY関数は今日の日付を返します。期限が過ぎているか、金額が100万円以上なら『優先対応』です。」\u003c/p>\n\u003cp>ただし、支払期限が空白の場合などは、意図しない判定を避けるための追加条件が必要です。\u003c/p>\n\u003ch3>実務例③：ANDとORを組み合わせる\u003c/h3>\n\u003cp>「先輩、少し応用です。」\u003c/p>\n\u003cp>例えば、次の条件をすべて満たす人を対象にするとします。\u003c/p>\n\u003cul>\n\u003cli>年齢が20歳以上\u003c/li>\n\u003cli>正社員または契約社員\u003c/li>\n\u003c/ul>\n\u003cp>A2が年齢、B2が雇用形態なら、\u003c/p>\n\u003cp>「これは、ANDの中にORを入れているんです。」\u003c/p>\n\u003cdiv class=\"source-static\">\u003cdiv>\n  \u003cstrong>条件の構造\u003c/strong>\n\u003cdiv>\n    \u003cstrong>AND：両方必要\u003c/strong>\n  \u003c/div>\n  \u003cdiv>\n    \u003cdiv>\n      \u003cdiv>\n        \u003cstrong>年齢20歳以上\u003c/strong>\n        \u003csmall>条件①\u003c/small>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv>\n      \u003cdiv>\n        \u003cstrong>OR\u003c/strong>\n        \u003csmall>正社員 または 契約社員\u003c/small>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n  \u003csmall>年齢条件を満たし、さらに雇用形態がどちらかに一致すれば対象です。\u003c/small>\n\u003c/div>\n\u003c/div>\u003cp>「こうした複雑な条件も、ANDとORを組み合わせれば表現できます。」\u003c/p>\n","その他":"\u003ch2>理解確認：3問\u003c/h2>\u003ch2>30秒復習\u003c/h2>\u003cp>「先輩、最後に6つだけ確認しましょう。」\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>ANDとは？\u003c/strong> すべての条件が成立した場合にTRUEを返す関数。\u003c/li>\n\u003cli>\u003cstrong>ORとは？\u003c/strong> どれか1つ以上の条件が成立した場合にTRUEを返す関数。\u003c/li>\n\u003cli>\u003cstrong>何が違う？\u003c/strong> ANDは全部必要、ORは1つでもよい。\u003c/li>\n\u003cli>\u003cstrong>基本構造は？\u003c/strong> \u003ccode>=AND(条件1,条件2)\u003c/code>、\u003ccode>=OR(条件1,条件2)\u003c/code>。\u003c/li>\n\u003cli>\u003cstrong>実務での使い方は？\u003c/strong> IF関数と組み合わせて、複数条件に応じた表示を切り替える。\u003c/li>\n\u003cli>\u003cstrong>間違えやすいところは？\u003c/strong> ORは両方の条件がTRUEでもTRUEになること。\u003c/li>\n\u003c/ol>\n\u003ch2>一文記憶\u003c/h2>\u003cp>\u003cstrong>ANDは「全部満たす」、ORは「1つでも満たす」。\u003c/strong>\u003c/p>\n\u003cp>「先輩、今回のANDとORは、以前学んだIF関数とセットで覚えておいてください。」\u003c/p>\n\u003cp>「IFが『条件に応じて結果を分ける役割』、ANDとORが『複数の条件をまとめる役割』です。この役割分担が理解できれば、複雑なExcelの判定式も少しずつ組み立てられるようになりますよ。」\u003c/p>\n"},"prose":["# ⑨ AND関数・OR関数（アンド・オア関数）","Excel関数｜論理関数｜複数条件の判定・IF関数との組み合わせ","「先輩、今回はAND関数とOR関数ですね。どちらも**複数の条件をまとめて判定する関数**です。」","「以前勉強したIF関数は、条件が成立したかどうかで結果を切り替える関数でしたよね。でも、仕事では『条件が2つとも成立したら』とか『どちらか一方が成立したら』という判断も必要になります。」","「そんなときに使うのがANDとORなんです。」","## A｜要点：ANDとORの違い","「先輩、最初に覚えるのはこの違いだけで構いません。」","- **AND：全部の条件を満たす必要がある**\n- **OR：1つでも条件を満たせばよい**","「ただし、ORは『どちらか一方だけ』という意味ではありません。両方成立していてもTRUEです。ここは重要ですよ。」","## B｜詳しい解説：仕組みを理解しましょう","### 1. AND関数の書き方","例えば、テストで次の条件を満たしたら合格とします。","- 英語が80点以上\n- 数学が70点以上","A2が英語、B2が数学の点数なら、","「先輩、この式は合格・不合格という文字を返すのではなく、TRUEかFALSEを返します。」","例えば英語85点、数学75点なら、両方の条件が成立するためTRUEです。","一方、英語90点でも数学65点なら、数学の条件が成立しないのでFALSEです。","### 2. OR関数の書き方","同じ条件をORで判定すると、","「こちらは英語が80点以上、または数学が70点以上ならTRUEです。」","「つまり、英語90点・数学65点なら、ANDはFALSEですがORはTRUEになります。」","### 3. 真理値表で比較する","「先輩、ここは表にすると一目で分かりますよ。」","| 条件A | 条件B | AND | OR |\n|---|---|---|---|\n| TRUE | TRUE | TRUE | TRUE |\n| TRUE | FALSE | FALSE | TRUE |\n| FALSE | TRUE | FALSE | TRUE |\n| FALSE | FALSE | FALSE | FALSE |","「ANDは両方TRUEの1パターンだけ。ORは両方FALSEのときだけFALSEです。」","### 4. IF関数と組み合わせる","「ここからが実務で特に重要です。」","ANDとORだけでは通常、TRUEかFALSEが表示されます。しかし、IFと組み合わせれば、好きな文字を表示できます。","**ANDとIFの組み合わせ**","「英語80点以上、かつ数学70点以上なら『合格』。どちらかが足りなければ『不合格』です。」","**ORとIFの組み合わせ**","「こちらは、英語か数学のどちらかが基準に達していれば『合格』になります。」","「同じIF関数でも、中に入れるのがANDかORかで判定結果が変わるんです。」","### 5. 3つ以上の条件も指定できる","ANDとORは2条件に限定されません。","これは3条件すべてが成立した場合にTRUEです。","こちらは3条件のうち、1つ以上が成立すればTRUEです。","## C｜イメージ理解：入場条件で考える","「先輩、身近な例で考えてみましょう。」","「会員証を持っていて、さらに予約もしている人だけが入場できる。これがANDです。」","**OR：どちらかの資格があれば入れる扉**","「先輩、ANDは条件が増えるほど厳しくなり、ORは条件が増えるほど成立しやすくなります。」","「この性質まで理解しておけば、複雑な数式でも考えやすくなりますよ。」","## D｜具体例：AND・ORを操作してみましょう","「では先輩、英語と数学の点数を動かして、両方の結果を比較してみてください。」","「先輩、最初は英語85点、数学65点ですよね。ANDでは不合格ですが、ORでは合格になります。」","「次に数学を75点にしてみてください。今度はANDでもORでも合格です。つまり、ORは両方の条件が成立していてもTRUEなんです。」","### 実務例①：請求書の処理完了判定","「例えば、請求書の処理に『内容確認』と『上司承認』の両方が必要だとします。」","A2が内容確認、B2が上司承認なら、","「両方が『済』になって初めて処理完了です。片方だけでは未完了になります。」","### 実務例②：優先対応が必要な取引","「今度は、次のどちらかに当てはまれば優先対応するとしましょう。」","- 支払期限が過ぎている\n- 支払額が100万円以上","A2が支払期限、B2が支払額なら、","「TODAY関数は今日の日付を返します。期限が過ぎているか、金額が100万円以上なら『優先対応』です。」","ただし、支払期限が空白の場合などは、意図しない判定を避けるための追加条件が必要です。","### 実務例③：ANDとORを組み合わせる","「先輩、少し応用です。」","例えば、次の条件をすべて満たす人を対象にするとします。","- 年齢が20歳以上\n- 正社員または契約社員","A2が年齢、B2が雇用形態なら、","「これは、ANDの中にORを入れているんです。」","「こうした複雑な条件も、ANDとORを組み合わせれば表現できます。」","## 理解確認：3問","## 30秒復習","「先輩、最後に6つだけ確認しましょう。」","1. **ANDとは？** すべての条件が成立した場合にTRUEを返す関数。\n2. **ORとは？** どれか1つ以上の条件が成立した場合にTRUEを返す関数。\n3. **何が違う？** ANDは全部必要、ORは1つでもよい。\n4. **基本構造は？** `=AND(条件1,条件2)`、`=OR(条件1,条件2)`。\n5. **実務での使い方は？** IF関数と組み合わせて、複数条件に応じた表示を切り替える。\n6. **間違えやすいところは？** ORは両方の条件がTRUEでもTRUEになること。","## 一文記憶","**ANDは「全部満たす」、ORは「1つでも満たす」。**","「先輩、今回のANDとORは、以前学んだIF関数とセットで覚えておいてください。」","「IFが『条件に応じて結果を分ける役割』、ANDとORが『複数の条件をまとめる役割』です。この役割分担が理解できれば、複雑なExcelの判定式も少しずつ組み立てられるようになりますよ。」"],"quizzes":[{"q":"AND関数がTRUEになるのはどの場合ですか？","options":["どれか1つの条件が成立した場合","すべての条件が成立した場合","すべての条件が成立しなかった場合"],"correct":1,"explain":"ANDは指定したすべての条件がTRUEの場合だけTRUEを返します。"},{"q":"OR関数で、2つの条件が両方TRUEの場合はどうなりますか？","options":["TRUE","FALSE","エラー"],"correct":0,"explain":"ORは少なくとも1つの条件がTRUEならTRUEです。両方TRUEでも問題ありません。"},{"q":"=IF(AND(85>=80,65>=70),\"合格\",\"不合格\") の結果は？","options":["合格","不合格","TRUE"],"correct":1,"explain":"英語の条件はTRUEですが、数学の条件はFALSEです。ANDはFALSEとなるため、IFは「不合格」を返します。"}]},{"name":"INDEX＋MATCH","original":"\u003ch1>⑩ INDEX関数・MATCH関数（インデックス・マッチ関数）\u003c/h1>\u003cp>Excel関数｜検索・参照｜VLOOKUP・XLOOKUPとの比較\u003c/p>\u003cp>「先輩、今回はINDEX関数とMATCH関数ですね。名前が2つあるので難しそうに見えますけど、役割を分けて考えれば大丈夫です。」\u003c/p>\u003cp>「以前勉強したVLOOKUPやXLOOKUPと同じく、表から必要なデータを取り出すために使います。ただし、INDEXとMATCHはそれぞれ別の仕事を担当する関数なんです。」\u003c/p>\u003ch2>A｜要点：INDEXとMATCHとは？\u003c/h2>\u003cp>「まず、この2つの役割を覚えてください。」\u003c/p>\u003ch2>MATCH\u003c/h2>\u003cp>位置を探す\u003c/p>\u003cp>指定した値が、範囲の何番目にあるかを調べる。\u003c/p>\u003cp>検索結果\u003c/p>\u003ch1>2番目\u003c/h1>\u003ch2>INDEX\u003c/h2>\u003cp>値を取り出す\u003c/p>\u003cp>指定した範囲の何番目にある値かを指定して取得する。\u003c/p>\u003cp>取得結果\u003c/p>\u003ch1>みかん\u003c/h1>\u003cp>「つまり、MATCHが場所を見つけて、INDEXがその場所のデータを取り出すんです。」\u003c/p>\u003cp>例えば、次の商品表を見てください。\u003c/p>\u003ctable>\u003ctbody>\u003ctr>\u003cth>行\u003c/th>\u003cth>A列：商品コード\u003c/th>\u003cth>B列：商品名\u003c/th>\u003cth>C列：価格\u003c/th>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>101\u003c/td>\u003ctd>りんご\u003c/td>\u003ctd>150円\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>102\u003c/td>\u003ctd>みかん\u003c/td>\u003ctd>100円\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>103\u003c/td>\u003ctd>ぶどう\u003c/td>\u003ctd>300円\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>「商品コード102に対応する商品名を調べたいとします。」\u003c/p>\u003cp>まずMATCHが、商品コード102は検索範囲の2番目だと調べます。そしてINDEXが、商品名の範囲から2番目の「みかん」を取り出すんです。\u003c/p>\u003ch2>B｜詳しい解説：それぞれの仕組み\u003c/h2>\u003ch3>1. MATCH関数\u003c/h3>excel\u003ccode>=MATCH(検索値,検索範囲,照合の種類)\u003c/code>\u003ctable>\u003ctbody>\u003ctr>\u003cth>引数\u003c/th>\u003cth>意味\u003c/th>\u003c/tr>\u003ctr>\u003ctd>検索値\u003c/td>\u003ctd>何を探すか\u003c/td>\u003c/tr>\u003ctr>\u003ctd>検索範囲\u003c/td>\u003ctd>どこから探すか\u003c/td>\u003c/tr>\u003ctr>\u003ctd>照合の種類\u003c/td>\u003ctd>どのように一致を判定するか\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>例えば、\u003c/p>excel\u003ccode>=MATCH(102,A2:A4,0)\u003c/code>\u003cp>結果は 2 です。\u003c/p>\u003cp>「先輩、102がExcelの3行目にあるのに、結果は2なんです。なぜでしょう？」\u003c/p>\u003cp>「MATCHが返すのはワークシートの行番号ではなく、指定した検索範囲の中で何番目かだからです。」\u003c/p>\u003cp>MATCHが返す位置\u003c/p>検索範囲 A2:A4\u003cp>101\u003c/p>\u003cp>102\u003c/p>\u003cp>103\u003c/p>範囲内の位置\u003cp>1番目\u003c/p>\u003cp>2番目\u003c/p>\u003cp>3番目\u003c/p>\u003cp>102はA2:A4の2番目にあるので、MATCHの結果は2です。\u003c/p>\u003cp>「最後の \u003ccode>0\u003c/code> は完全一致を意味します。商品コードのように正確に一致する値を探すときは、基本的に0を指定しましょう。」\u003c/p>\u003cp>MATCHの照合の種類には、次の3つがあります。\u003c/p>\u003ctable>\u003ctbody>\u003ctr>\u003cth>指定\u003c/th>\u003cth>意味\u003c/th>\u003c/tr>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>完全一致\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>検索値以下の最大値を探す（昇順に整列が必要）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>-1\u003c/td>\u003ctd>検索値以上の最小値を探す（降順に整列が必要）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>「省略すると1として扱われます。つまり、完全一致ではなくなるので注意してくださいね。」\u003c/p>\u003ch3>2. INDEX関数\u003c/h3>excel\u003ccode>=INDEX(配列,行番号,[列番号])\u003c/code>\u003cp>「INDEXは、指定した範囲の何行目・何列目にある値かを指定して取り出します。」\u003c/p>\u003cp>例えば、\u003c/p>excel\u003ccode>=INDEX(B2:B4,2)\u003c/code>\u003cp>結果は みかん です。\u003c/p>\u003cp>「B2:B4の2番目はB3ですから、そこにある『みかん』が返されます。」\u003c/p>\u003cp>INDEXは2次元の表でも使えます。\u003c/p>excel\u003ccode>=INDEX(A2:C4,2,3)\u003c/code>\u003cp>これはA2:C4の2行目・3列目を指定しているので、結果は 100 です。\u003c/p>\u003cp>「先輩、ここでもワークシート全体の行番号ではなく、指定した範囲内での位置を使うんです。」\u003c/p>\u003cp>なお、INDEXには配列形式と参照形式がありますが、まずはこの配列形式を理解すれば十分です。\u003c/p>\u003ch3>3. INDEXとMATCHを組み合わせる\u003c/h3>\u003cp>「では、いよいよ2つを組み合わせましょう。」\u003c/p>excel\u003ccode>=INDEX(B2:B4,MATCH(102,A2:A4,0))\u003c/code>\u003cp>処理の流れ\u003c/p>\u003cp>① MATCHが検索\u003c/p>\u003cp>A2:A4から商品コード102を探す\u003c/p>\u003cp>結果：2番目\u003c/p>\u003cp>② INDEXに位置を渡す\u003c/p>\u003cp>INDEX(B2:B4, 2)\u003c/p>\u003cp>最終結果\u003c/p>\u003ch1>みかん\u003c/h1>\u003cp>「先輩、数式の外側から読もうとすると混乱しやすいので、内側のMATCHから先に計算すると考えてください。」\u003c/p>\u003ch3>4. VLOOKUP・XLOOKUPとの違い\u003c/h3>\u003ctable>\u003ctbody>\u003ctr>\u003cth>比較\u003c/th>\u003cth>VLOOKUP\u003c/th>\u003cth>INDEX＋MATCH\u003c/th>\u003cth>XLOOKUP\u003c/th>\u003c/tr>\u003ctr>\u003ctd>左方向の検索\u003c/td>\u003ctd>原則不可\u003c/td>\u003ctd>可能\u003c/td>\u003ctd>可能\u003c/td>\u003c/tr>\u003ctr>\u003ctd>完全一致\u003c/td>\u003ctd>FALSE指定\u003c/td>\u003ctd>MATCHで0指定\u003c/td>\u003ctd>標準\u003c/td>\u003c/tr>\u003ctr>\u003ctd>列番号の指定\u003c/td>\u003ctd>必要\u003c/td>\u003ctd>不要\u003c/td>\u003ctd>不要\u003c/td>\u003c/tr>\u003ctr>\u003ctd>列の挿入への対応\u003c/td>\u003ctd>列番号に注意\u003c/td>\u003ctd>比較的柔軟\u003c/td>\u003ctd>比較的柔軟\u003c/td>\u003c/tr>\u003ctr>\u003ctd>数式の分かりやすさ\u003c/td>\u003ctd>比較的簡単\u003c/td>\u003ctd>やや複雑\u003c/td>\u003ctd>比較的簡単\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>「新しいExcelであればXLOOKUPが便利なことも多いですが、INDEXとMATCHは既存の業務ファイルでもよく使われます。仕組みを理解しておく価値がありますよ。」\u003c/p>\u003ch2>C｜イメージ理解：図書館で本を探す\u003c/h2>\u003cp>「先輩、図書館で本を探す場面を想像してください。」\u003c/p>\u003cp>図書館の検索システムで、目的の本が棚の何番目にあるかを調べます。\u003c/p>\u003cp>これがMATCHです。\u003c/p>\u003cp>その位置をもとに、実際の棚から本を取り出します。\u003c/p>\u003cp>これがINDEXです。\u003c/p>\u003cp>「MATCHは本そのものを取り出すわけではありません。あくまで場所を教えてくれるだけなんです。」\u003c/p>\u003cp>「そしてINDEXは、指定された場所にあるものを取り出す役割です。」\u003c/p>\u003cp>MATCH：どこにある？\u003c/p>\u003cp>「商品コード102は2番目にあります」\u003c/p>\u003cp>INDEX：そこに何がある？\u003c/p>\u003cp>「2番目にあるのは、みかんです」\u003c/p>\u003cp>「この役割分担を覚えておけば、数式が長くなっても理解しやすくなります。」\u003c/p>\u003ch2>D｜具体例：実際に操作してみましょう\u003c/h2>\u003cp>「では先輩、商品コードを変えたり、取り出す項目を変えたりして、INDEXとMATCHがどう動くか確認しましょう。」\u003c/p>\u003cp>INDEX＋MATCHシミュレーター\u003c/p>操作できます\u003ctable>\u003ctbody>\u003ctr>\u003ctd>商品コード\u003c/td>\u003ctd>商品名\u003c/td>\u003ctd>価格\u003c/td>\u003c/tr>\u003ctr>\u003ctd>101\u003c/td>\u003ctd>りんご\u003c/td>\u003ctd>150円\u003c/td>\u003c/tr>\u003ctr>\u003ctd>102\u003c/td>\u003ctd>みかん\u003c/td>\u003ctd>100円\u003c/td>\u003c/tr>\u003ctr>\u003ctd>103\u003c/td>\u003ctd>ぶどう\u003c/td>\u003ctd>300円\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>① 検索する商品コード② 取り出す項目商品名（B列）価格（C列）\u003cp>現在の数式\u003c/p>\u003cp>=INDEX(B2:B4,MATCH(102,A2:A4,0))\u003c/p>\u003cp>MATCHの結果\u003c/p>\u003ch2>2番目\u003c/h2>\u003cp>INDEXの結果\u003c/p>\u003ch2>みかん\u003c/h2>MATCHが見つけた2番目の位置をINDEXに渡しています。この練習では商品コードを数値として扱っています。実際のExcelでは検索値と検索範囲のデータ型を一致させてください。\u003cp>「先輩、まず102を選んでください。MATCHが2を返して、INDEXがみかんを取り出します。」\u003c/p>\u003cp>「次に取り出す項目を価格に変更すると、同じ2番目の位置から100円を取り出せます。」\u003c/p>\u003cp>「これがINDEXとMATCHの組み合わせの強みです。」\u003c/p>\u003ch3>実務例①：社員番号から部署名を取得する\u003c/h3>\u003cp>A列に社員番号、C列に部署名が入力されている場合、\u003c/p>excel\u003ccode>=INDEX(C2:C100,MATCH(E2,A2:A100,0))\u003c/code>\u003cp>「E2に入力した社員番号をA列から探し、対応するC列の部署名を取得できます。」\u003c/p>\u003ch3>実務例②：左方向の検索\u003c/h3>\u003cp>「先輩、ここはVLOOKUPとの違いが分かる例です。」\u003c/p>\u003cp>A列に社員番号、B列に社員名があるとします。社員名から社員番号を調べたい場合、\u003c/p>excel\u003ccode>=INDEX(A2:A100,MATCH(E2,B2:B100,0))\u003c/code>\u003cp>「B列で社員名を検索して、左側のA列から社員番号を取り出せます。」\u003c/p>\u003cp>ただし、同姓同名の社員が複数いる場合、MATCHの完全一致検索は最初に一致した位置を返すため、社員名だけでは正しい社員を特定できない可能性があります。\u003c/p>\u003ch3>実務例③：IFERRORと組み合わせる\u003c/h3>\u003cp>「以前勉強したIFERRORも使えますよ。」\u003c/p>excel\u003ccode>=IFERROR(INDEX(B2:B100,MATCH(E2,A2:A100,0)),\"未登録\")\u003c/code>\u003cp>「検索値が見つからなければ『未登録』と表示します。ただし、参照範囲の誤りなど、別の原因によるエラーも隠れるので注意してくださいね。」\u003c/p>\u003ch3>応用：縦と横の両方から検索する\u003c/h3>\u003cp>「さらに、INDEXとMATCHは2次元の表にも使えます。」\u003c/p>\u003cp>例えば、A2:A4に商品名、B1:D1に月、B2:D4に売上が入力されている場合です。\u003c/p>excel\u003ccode>=INDEX(B2:D4,MATCH(\"みかん\",A2:A4,0),MATCH(\"2月\",B1:D1,0))\u003c/code>\u003cp>「1つ目のMATCHが『みかん』の行位置を探し、2つ目のMATCHが『2月』の列位置を探します。INDEXはその交差するセルの売上を取り出すんです。」\u003c/p>\u003cp>「縦方向と横方向を組み合わせて検索できることも、INDEXとMATCHの大きな特徴ですね。」\u003c/p>\u003ch2>理解確認：3問\u003c/h2>\u003cp>Q1. MATCH関数が返すものは何ですか？\u003c/p>検索値に対応する商品名検索範囲内での位置検索値の合計\u003cp>Q2. =INDEX(B2:B4,MATCH(102,A2:A4,0)) の結果は？\u003c/p>102みかん100\u003cp>Q3. MATCH関数で完全一致を指定する値は？\u003c/p>01-1\u003cp>正解数：0 / 3\u003c/p>\u003ch2>30秒復習\u003c/h2>\u003cp>「先輩、最後に6つのポイントを確認しましょう。」\u003c/p>\u003col>\u003cli>\u003cp>MATCHとは？ 検索値が指定範囲の何番目にあるかを調べる関数。\u003c/p>\u003c/li>\u003cli>\u003cp>INDEXとは？ 指定した位置にある値を取り出す関数。\u003c/p>\u003c/li>\u003cli>\u003cp>組み合わせる理由は？ 検索した位置を使って、対応するデータを取得するため。\u003c/p>\u003c/li>\u003cli>\u003cp>基本構造は？ \u003ccode>=INDEX(戻り範囲,MATCH(検索値,検索範囲,0))\u003c/code>\u003c/p>\u003c/li>\u003cli>\u003cp>具体例は？ 商品コード102を検索し、対応する商品名「みかん」を取得する。\u003c/p>\u003c/li>\u003cli>\u003cp>間違えやすいところは？ MATCHが返すのはシートの行番号ではなく範囲内の位置であること、完全一致では0を指定すること。\u003c/p>\u003c/li>\u003c/ol>\u003ch2>一文記憶\u003c/h2>\u003cp>MATCHは「何番目？」を探し、INDEXは「その位置の値」を取り出す。\u003c/p>\u003cp>「先輩、これでINDEXとMATCHの仕組みも理解できましたね。VLOOKUPやXLOOKUPと同じように検索に使いますが、INDEXとMATCHは役割を分担しているんです。」\u003c/p>\u003cp>「数式が複雑に見えたら、まず
