const cards=[{"name": "VLOOKUP", "category": "検索・参照", "formula": "=VLOOKUP(検索値,範囲,列番号,FALSE)", "summary": "表の左端列で値を探し、同じ行の指定列の値を返す。", "A": "「先輩、VLOOKUPは表の左端にある検索キーを見つけ、その行の右側にある情報を取り出します。最後のFALSEは完全一致です。商品コードや社員番号の照合では、まずFALSEを覚えてください。」", "B": "「商品コード102をA2:C4の左端列から探し、3列目の価格100を取得します。列番号はワークシートのC列という意味ではなく、指定範囲の左から数えた番号です。列の挿入によって意図した列番号が変わる場合があります。検索値が見つからないと#N/Aです。」", "C": "「先輩、名簿の一番左の番号を指でたどって、同じ行の右側に書かれた情報を見るイメージです。左端で探す制約があることも忘れないでください。」", "D": "A2:C4が「101 りんご 150」「102 みかん 100」「103 ぶどう 300」のとき、=VLOOKUP(102,A2:C4,3,FALSE) の結果は100です。", "q": "VLOOKUPで完全一致を指定する値は？", "options": ["TRUE", "FALSE", "省略"], "correct": 1, "explain": "FALSEを指定します。TRUEまたは省略は近似一致です。", "review": "左端列で検索→同じ行の右側を返す。列番号は範囲の左から数える。FALSEで完全一致。", "memory": "VLOOKUPは「左端で探し、右の列から取り出す」。", "image": "images/01.svg"}, {"name": "XLOOKUP", "category": "検索・参照", "formula": "=XLOOKUP(検索値,検索範囲,戻り範囲,[見つからない場合],[一致モード],[検索モード])", "summary": "検索範囲と戻り範囲を別々に指定できる柔軟な検索関数。", "A": "「先輩、XLOOKUPなら探す列と取り出す列を別々に指定できます。右から左への検索もできますし、標準で完全一致です。見つからない場合の表示も指定できます。」", "B": "「=XLOOKUP(102,A2:A4,B2:B4,\"未登録\") は、A列から102を探してB列の商品名を返します。検索値が見つからない場合は『未登録』です。検索範囲と戻り範囲は対応する大きさにそろえます。重複がある場合は通常最初の一致が返ります。」", "C": "「先輩、名簿のどの列で探すか、どの列を読むかを自由に決められる案内係です。VLOOKUPと違い、左側の列も読めるんですよ。」", "D": "A列が商品コード101・102・103、B列がりんご・みかん・ぶどうのとき、=XLOOKUP(102,A2:A4,B2:B4,\"未登録\") は「みかん」です。", "q": "XLOOKUPの標準の一致方法は？", "options": ["完全一致", "近似一致（昇順）", "ワイルドカード一致"], "correct": 0, "explain": "XLOOKUPは一致モードを省略すると完全一致です。", "review": "検索範囲と戻り範囲を分けて指定。左方向も可。完全一致が標準。", "memory": "XLOOKUPは「探す列も、取り出す列も自由」。", "image": "images/02.svg"}, {"name": "IF", "category": "条件分岐", "formula": "=IF(論理式,真の場合,偽の場合)", "summary": "条件が成立するかどうかで返す結果を切り替える。", "A": "「先輩、IFは『もし〜ならA、そうでなければB』をExcelに任せる関数です。数字の判定も、文字の表示もできます。」", "B": "「=IF(A2>=80,\"合格\",\"不合格\") は、A2が80以上なら合格、そうでなければ不合格です。>=は以上、>は超える、<=は以下、<>は等しくない、を表します。文字列はダブルクォーテーションで囲みます。複数条件にはAND・ORやIFの入れ子を使えます。」", "C": "「先輩、雨なら傘を持つ、雨でなければ持たない、という日常の判断をそのまま数式にしたものです。」", "D": "A2が79なら =IF(A2>=80,\"合格\",\"不合格\") は「不合格」、A2が80なら「合格」です。", "q": "A2が80のとき、=IF(A2>=80,\"合格\",\"不合格\") は？", "options": ["合格", "不合格", "エラー"], "correct": 0, "explain": "80は80以上に含まれます。", "review": "条件→真の場合→偽の場合。>=は以上。文字は引用符で囲む。", "memory": "IFは「もし条件が正しければA、違えばB」。", "image": "images/03.svg"}, {"name": "SUMIF", "category": "条件付き集計", "formula": "=SUMIF(範囲,検索条件,合計範囲)", "summary": "指定した条件に一致する行の数値だけを合計する。", "A": "「先輩、SUMIFは条件に合うものだけを足します。経費の一覧から交通費だけを集計する、といった仕事に便利です。」", "B": "「=SUMIF(A2:A6,\"交通費\",B2:B6) は、A列が交通費の行だけB列の金額を合計します。条件は文字列のほか、セル参照や \">=1000\" のような比較式も指定できます。複数条件ならSUMIFSを使い、SUMIFSでは合計範囲が先頭になる点に注意してください。」", "C": "「先輩、領収書の山から『交通費』の札が付いたものだけを集め、その金額を足すイメージです。数を数えるCOUNTIFとは役割が違います。」", "D": "A2:A6が交通費・消耗品費・交通費・通信費・交通費、B2:B6が1200・3000・800・5000・1500のとき、=SUMIF(A2:A6,\"交通費\",B2:B6) は3500です。", "q": "交通費1200・800・1500の合計は？", "options": ["2300", "3500", "6500"], "correct": 1, "explain": "1200+800+1500=3500です。", "review": "条件範囲→条件→合計範囲。SUMIFSは合計範囲が先頭。", "memory": "SUMIFは「条件に合う行だけ足す」。", "image": "images/04.svg"}, {"name": "INDEX＋MATCH", "category": "検索・参照", "formula": "=INDEX(戻り範囲,MATCH(検索値,検索範囲,0))", "summary": "MATCHが位置を調べ、INDEXがその位置の値を取り出す。", "A": "「先輩、INDEXとMATCHは二人一組です。MATCHは『何番目にあるか』を調べ、INDEXは『その番目の値』を取り出します。内側のMATCHから順に考えれば難しくありません。」", "B": "「=MATCH(102,A2:A4,0) の結果は2です。Excelの行番号3ではなく、検索範囲内の2番目という意味です。=INDEX(B2:B4,2) はみかんを返します。組み合わせると =INDEX(B2:B4,MATCH(102,A2:A4,0)) です。MATCHの0は完全一致で、省略すると1（近似一致）です。INDEXは2次元の範囲なら行番号と列番号の両方を指定できます。検索が失敗すると#N/Aになり、IFERRORで代替表示を指定できます。」", "C": "「先輩、図書館で本を探すとき、MATCHが『2番目の棚です』と場所を教え、INDEXが『そこにある本はこちらです』と取り出すイメージです。場所探しと取り出しを分担しています。」", "D": "A2:A4が101・102・103、B2:B4がりんご・みかん・ぶどうなら、=INDEX(B2:B4,MATCH(102,A2:A4,0)) の結果は「みかん」です。さらに =INDEX(B2:D4,MATCH(\"みかん\",A2:A4,0),MATCH(\"2月\",B1:D1,0)) のように縦横検索もできます。", "q": "MATCH(102,A2:A4,0) が返すのは？", "options": ["Excelの3行目", "検索範囲内の2番目", "商品名のみかん"], "correct": 1, "explain": "MATCHは指定範囲内での位置を返します。", "review": "MATCHは位置、INDEXは値。MATCHの完全一致は0。範囲内の位置に注意。", "memory": "MATCHが「何番目？」を探し、INDEXが「その値」を取り出す。", "image": "images/05.svg"}];
const $=id=>document.getElementById(id);const saved=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};let state=saved('excelcard-state-v1',{}),current=0,tab='A',favoriteOnly=false,wrongOnly=false,showAnswer=false;function keep(){try{localStorage.setItem('excelcard-state-v1',JSON.stringify(state))}catch{}}function record(i){return state[i]||(state[i]={favorite:false,studied:false,wrong:false})}function filtered(){let q=$('search').value.toLowerCase().trim(),cat=$('category').value;return cards.map((c,i)=>i).filter(i=>{let c=cards[i],s=record(i);return (!q||Object.values(c).filter(x=>typeof x==='string').join(' ').toLowerCase().includes(q))&&(!cat||c.category===cat)&&(!favoriteOnly||s.favorite)&&(!wrongOnly||s.wrong)})}function el(tag,cls,txt){let n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}function add(parent,child){parent.appendChild(child);return child}function btn(label,fn,cls=''){let b=el('button',cls,label);b.type='button';b.addEventListener('click',fn);return b}function render(){let ids=filtered();if(!ids.includes(current)){current=ids[0]??-1;showAnswer=false;}$('card-slider').disabled=!ids.length;$('card-slider').max=Math.max(1,ids.length);$('card-slider').value=Math.max(1,ids.indexOf(current)+1);$('slider-label').textContent=ids.length?`カード ${ids.indexOf(current)+1} / ${ids.length}`:'該当カードなし';let host=$('card');host.replaceChildren();$('counter').textContent=`表示 ${ids.length} / ${cards.length}項目｜学習済み ${cards.filter((c,i)=>record(i).studied).length}項目`;$('prev').disabled=$('next').disabled=ids.length===0;if(current<0){host.textContent='条件に合うカードがありません。検索条件を変更してください。';return}let c=cards[current],s=record(current);let top=add(host,el('div','top'));let t=add(top,el('div'));add(t,el('span','tag',c.category));add(t,el('h2','',`${current+1}. ${c.name}`));add(t,el('p','meta',c.summary));let actions=add(top,el('div'));add(actions,btn(s.favorite?'★':'☆',()=>{s.favorite=!s.favorite;keep();render()},s.favorite?'good':''));let flip=add(host,el('div','flip',showAnswer?c.memory:`${c.name} は何をする関数？（タップして答えを確認）`));flip.tabIndex=0;flip.setAttribute('role','button');flip.addEventListener('click',()=>{showAnswer=!showAnswer;render()});flip.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showAnswer=!showAnswer;render()}});let tabs=add(host,el('div','tabs'));for(let x of ['A','B','C','D'])add(tabs,btn(x+' '+({A:'要点',B:'詳解',C:'イメージ',D:'具体例'}[x]),()=>{tab=x;render()},tab===x?'active':''));let area=add(host,el('section'));add(area,el('h3','',({A:'A｜要点',B:'B｜詳しい解説',C:'C｜イメージ理解',D:'D｜具体例'}[tab])));add(area,el('p','bodytext',c[tab]));if(tab==='A'||tab==='B'||tab==='D'){add(area,el('h3','','基本の数式'));add(area,el('div','formula',c.formula))}if(tab==='C'){let img=el('img','visual');img.src=EMBEDDED_IMAGES[c.image];img.alt=c.name+'の検索・判定・集計の仕組みを表す図解';img.loading='lazy';add(area,img)}let quiz=add(host,el('section','box'));add(quiz,el('h3','','理解確認｜選択問題'));add(quiz,el('p','',c.q));let opts=add(quiz,el('div','options'));c.options.forEach((o,j)=>add(opts,btn(`${j+1}. ${o}`,()=>{s.answer=j;s.wrong=j!==c.correct;keep();render()},s.answer===j?(j===c.correct?'good':'bad'):'')));if(s.answer!==undefined){add(quiz,el('div','feedback',`${s.answer===c.correct?'正解です！':'不正解です。'} 正解：${c.options[c.correct]}。${c.explain}`));add(quiz,btn('もう一度挑戦',()=>{delete s.answer;keep();render()}))}let rev=add(host,el('section','box'));add(rev,el('h3','','30秒復習'));add(rev,el('p','bodytext',c.review));let mem=add(host,el('section','box'));add(mem,el('h3','','一文記憶'));add(mem,el('div','memory',c.memory));let controls=add(host,el('div','row'));add(controls,btn(s.studied?'✓ 学習済み':'□ 学習済みにする',()=>{s.studied=!s.studied;keep();render()},s.studied?'good':''));add(controls,btn('数式をコピー',()=>{if(navigator.clipboard)navigator.clipboard.writeText(c.formula).then(()=>alert('数式をコピーしました')).catch(()=>prompt('数式をコピーしてください',c.formula));else prompt('数式をコピーしてください',c.formula)}));let k=ids.index
