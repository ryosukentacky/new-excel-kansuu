内側のMATCHだけを計算してみてください。そこからINDEXに位置を渡す、と考えればずっと分かりやすくなりますよ。」\u003c/p>","originalText":"⑩ INDEX関数・MATCH関数（インデックス・マッチ関数）Excel関数｜検索・参照｜VLOOKUP・XLOOKUPとの比較「先輩、今回はINDEX関数とMATCH関数ですね。名前が2つあるので難しそうに見えますけど、役割を分けて考えれば大丈夫です。」「以前勉強したVLOOKUPやXLOOKUPと同じく、表から必要なデータを取り出すために使います。ただし、INDEXとMATCHはそれぞれ別の仕事を担当する関数なんです。」A｜要点：INDEXとMATCHとは？「まず、この2つの役割を覚えてください。」MATCH位置を探す指定した値が、範囲の何番目にあるかを調べる。検索結果2番目INDEX値を取り出す指定した範囲の何番目にある値かを指定して取得する。取得結果みかん「つまり、MATCHが場所を見つけて、INDEXがその場所のデータを取り出すんです。」例えば、次の商品表を見てください。行A列：商品コードB列：商品名C列：価格2101りんご150円3102みかん100円4103ぶどう300円「商品コード102に対応する商品名を調べたいとします。」まずMATCHが、商品コード102は検索範囲の2番目だと調べます。そしてINDEXが、商品名の範囲から2番目の「みかん」を取り出すんです。B｜詳しい解説：それぞれの仕組み1. MATCH関数excel=MATCH(検索値,検索範囲,照合の種類)引数意味検索値何を探すか検索範囲どこから探すか照合の種類どのように一致を判定するか例えば、excel=MATCH(102,A2:A4,0)結果は 2 です。「先輩、102がExcelの3行目にあるのに、結果は2なんです。なぜでしょう？」「MATCHが返すのはワークシートの行番号ではなく、指定した検索範囲の中で何番目かだからです。」MATCHが返す位置検索範囲 A2:A4101102103範囲内の位置1番目2番目3番目102はA2:A4の2番目にあるので、MATCHの結果は2です。「最後の 0 は完全一致を意味します。商品コードのように正確に一致する値を探すときは、基本的に0を指定しましょう。」MATCHの照合の種類には、次の3つがあります。指定意味0完全一致1検索値以下の最大値を探す（昇順に整列が必要）-1検索値以上の最小値を探す（降順に整列が必要）「省略すると1として扱われます。つまり、完全一致ではなくなるので注意してくださいね。」2. INDEX関数excel=INDEX(配列,行番号,[列番号])「INDEXは、指定した範囲の何行目・何列目にある値かを指定して取り出します。」例えば、excel=INDEX(B2:B4,2)結果は みかん です。「B2:B4の2番目はB3ですから、そこにある『みかん』が返されます。」INDEXは2次元の表でも使えます。excel=INDEX(A2:C4,2,3)これはA2:C4の2行目・3列目を指定しているので、結果は 100 です。「先輩、ここでもワークシート全体の行番号ではなく、指定した範囲内での位置を使うんです。」なお、INDEXには配列形式と参照形式がありますが、まずはこの配列形式を理解すれば十分です。3. INDEXとMATCHを組み合わせる「では、いよいよ2つを組み合わせましょう。」excel=INDEX(B2:B4,MATCH(102,A2:A4,0))処理の流れ① MATCHが検索A2:A4から商品コード102を探す結果：2番目② INDEXに位置を渡すINDEX(B2:B4, 2)最終結果みかん「先輩、数式の外側から読もうとすると混乱しやすいので、内側のMATCHから先に計算すると考えてください。」4. VLOOKUP・XLOOKUPとの違い比較VLOOKUPINDEX＋MATCHXLOOKUP左方向の検索原則不可可能可能完全一致FALSE指定MATCHで0指定標準列番号の指定必要不要不要列の挿入への対応列番号に注意比較的柔軟比較的柔軟数式の分かりやすさ比較的簡単やや複雑比較的簡単「新しいExcelであればXLOOKUPが便利なことも多いですが、INDEXとMATCHは既存の業務ファイルでもよく使われます。仕組みを理解しておく価値がありますよ。」C｜イメージ理解：図書館で本を探す「先輩、図書館で本を探す場面を想像してください。」図書館の検索システムで、目的の本が棚の何番目にあるかを調べます。これがMATCHです。その位置をもとに、実際の棚から本を取り出します。これがINDEXです。「MATCHは本そのものを取り出すわけではありません。あくまで場所を教えてくれるだけなんです。」「そしてINDEXは、指定された場所にあるものを取り出す役割です。」MATCH：どこにある？「商品コード102は2番目にあります」INDEX：そこに何がある？「2番目にあるのは、みかんです」「この役割分担を覚えておけば、数式が長くなっても理解しやすくなります。」D｜具体例：実際に操作してみましょう「では先輩、商品コードを変えたり、取り出す項目を変えたりして、INDEXとMATCHがどう動くか確認しましょう。」INDEX＋MATCHシミュレーター操作できます商品コード商品名価格101りんご150円102みかん100円103ぶどう300円① 検索する商品コード② 取り出す項目商品名（B列）価格（C列）現在の数式=INDEX(B2:B4,MATCH(102,A2:A4,0))MATCHの結果2番目INDEXの結果みかんMATCHが見つけた2番目の位置をINDEXに渡しています。この練習では商品コードを数値として扱っています。実際のExcelでは検索値と検索範囲のデータ型を一致させてください。「先輩、まず102を選んでください。MATCHが2を返して、INDEXがみかんを取り出します。」「次に取り出す項目を価格に変更すると、同じ2番目の位置から100円を取り出せます。」「これがINDEXとMATCHの組み合わせの強みです。」実務例①：社員番号から部署名を取得するA列に社員番号、C列に部署名が入力されている場合、excel=INDEX(C2:C100,MATCH(E2,A2:A100,0))「E2に入力した社員番号をA列から探し、対応するC列の部署名を取得できます。」実務例②：左方向の検索「先輩、ここはVLOOKUPとの違いが分かる例です。」A列に社員番号、B列に社員名があるとします。社員名から社員番号を調べたい場合、excel=INDEX(A2:A100,MATCH(E2,B2:B100,0))「B列で社員名を検索して、左側のA列から社員番号を取り出せます。」ただし、同姓同名の社員が複数いる場合、MATCHの完全一致検索は最初に一致した位置を返すため、社員名だけでは正しい社員を特定できない可能性があります。実務例③：IFERRORと組み合わせる「以前勉強したIFERRORも使えますよ。」excel=IFERROR(INDEX(B2:B100,MATCH(E2,A2:A100,0)),\"未登録\")「検索値が見つからなければ『未登録』と表示します。ただし、参照範囲の誤りなど、別の原因によるエラーも隠れるので注意してくださいね。」応用：縦と横の両方から検索する「さらに、INDEXとMATCHは2次元の表にも使えます。」例えば、A2:A4に商品名、B1:D1に月、B2:D4に売上が入力されている場合です。excel=INDEX(B2:D4,MATCH(\"みかん\",A2:A4,0),MATCH(\"2月\",B1:D1,0))「1つ目のMATCHが『みかん』の行位置を探し、2つ目のMATCHが『2月』の列位置を探します。INDEXはその交差するセルの売上を取り出すんです。」「縦方向と横方向を組み合わせて検索できることも、INDEXとMATCHの大きな特徴ですね。」理解確認：3問Q1. MATCH関数が返すものは何ですか？検索値に対応する商品名検索範囲内での位置検索値の合計Q2. =INDEX(B2:B4,MATCH(102,A2:A4,0)) の結果は？102みかん100Q3. MATCH関数で完全一致を指定する値は？01-1正解数：0 / 330秒復習「先輩、最後に6つのポイントを確認しましょう。」MATCHとは？ 検索値が指定範囲の何番目にあるかを調べる関数。INDEXとは？ 指定した位置にある値を取り出す関数。組み合わせる理由は？ 検索した位置を使って、対応するデータを取得するため。基本構造は？ =INDEX(戻り範囲,MATCH(検索値,検索範囲,0))具体例は？ 商品コード102を検索し、対応する商品名「みかん」を取得する。間違えやすいところは？ MATCHが返すのはシートの行番号ではなく範囲内の位置であること、完全一致では0を指定すること。一文記憶MATCHは「何番目？」を探し、INDEXは「その位置の値」を取り出す。「先輩、これでINDEXとMATCHの仕組みも理解できましたね。VLOOKUPやXLOOKUPと同じように検索に使いますが、INDEXとMATCHは役割を分担しているんです。」「数式が複雑に見えたら、まず内側のMATCHだけを計算してみてください。そこからINDEXに位置を渡す、と考えればずっと分かりやすくなりますよ。」","sections":{"A":"\u003ch1>⑩ INDEX関数・MATCH関数（インデックス・マッチ関数）\u003c/h1>\u003cp>Excel関数｜検索・参照｜VLOOKUP・XLOOKUPとの比較\u003c/p>\u003cp>「先輩、今回はINDEX関数とMATCH関数ですね。名前が2つあるので難しそうに見えますけど、役割を分けて考えれば大丈夫です。」\u003c/p>\u003cp>「以前勉強したVLOOKUPやXLOOKUPと同じく、表から必要なデータを取り出すために使います。ただし、INDEXとMATCHはそれぞれ別の仕事を担当する関数なんです。」\u003c/p>\u003ch2>A｜要点：INDEXとMATCHとは？\u003c/h2>\u003cp>「まず、この2つの役割を覚えてください。」\u003c/p>\u003ch2>MATCH\u003c/h2>\u003cp>位置を探す\u003c/p>\u003cp>指定した値が、範囲の何番目にあるかを調べる。\u003c/p>\u003cp>検索結果\u003c/p>\u003ch1>2番目\u003c/h1>\u003ch2>INDEX\u003c/h2>\u003cp>値を取り出す\u003c/p>\u003cp>指定した範囲の何番目にある値かを指定して取得する。\u003c/p>\u003cp>取得結果\u003c/p>\u003ch1>みかん\u003c/h1>\u003cp>「つまり、MATCHが場所を見つけて、INDEXがその場所のデータを取り出すんです。」\u003c/p>\u003cp>例えば、次の商品表を見てください。\u003c/p>\u003ctable>\u003ctbody>\u003ctr>\u003cth>行\u003c/th>\u003cth>A列：商品コード\u003c/th>\u003cth>B列：商品名\u003c/th>\u003cth>C列：価格\u003c/th>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>101\u003c/td>\u003ctd>りんご\u003c/td>\u003ctd>150円\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>102\u003c/td>\u003ctd>みかん\u003c/td>\u003ctd>100円\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>103\u003c/td>\u003ctd>ぶどう\u003c/td>\u003ctd>300円\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>「商品コード102に対応する商品名を調べたいとします。」\u003c/p>\u003cp>まずMATCHが、商品コード102は検索範囲の2番目だと調べます。そしてINDEXが、商品名の範囲から2番目の「みかん」を取り出すんです。\u003c/p>","B":"\u003ch2>B｜詳しい解説：それぞれの仕組み\u003c/h2>\u003ch3>1. MATCH関数\u003c/h3>\u003ccode>=MATCH(検索値,検索範囲,照合の種類)\u003c/code>\u003ctable>\u003ctbody>\u003ctr>\u003cth>引数\u003c/th>\u003cth>意味\u003c/th>\u003c/tr>\u003ctr>\u003ctd>検索値\u003c/td>\u003ctd>何を探すか\u003c/td>\u003c/tr>\u003ctr>\u003ctd>検索範囲\u003c/td>\u003ctd>どこから探すか\u003c/td>\u003c/tr>\u003ctr>\u003ctd>照合の種類\u003c/td>\u003ctd>どのように一致を判定するか\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>例えば、\u003c/p>\u003ccode>=MATCH(102,A2:A4,0)\u003c/code>\u003cp>結果は 2 です。\u003c/p>\u003cp>「先輩、102がExcelの3行目にあるのに、結果は2なんです。なぜでしょう？」\u003c/p>\u003cp>「MATCHが返すのはワークシートの行番号ではなく、指定した検索範囲の中で何番目かだからです。」\u003c/p>\u003cp>MATCHが返す位置\u003c/p>\u003cp>検索範囲 A2:A4\u003c/p>\u003cp>101\u003c/p>\u003cp>102\u003c/p>\u003cp>103\u003c/p>\u003cp>範囲内の位置\u003c/p>\u003cp>1番目\u003c/p>\u003cp>2番目\u003c/p>\u003cp>3番目\u003c/p>\u003cp>102はA2:A4の2番目にあるので、MATCHの結果は2です。\u003c/p>\u003cp>「最後の \u003ccode>0\u003c/code> は完全一致を意味します。商品コードのように正確に一致する値を探すときは、基本的に0を指定しましょう。」\u003c/p>\u003cp>MATCHの照合の種類には、次の3つがあります。\u003c/p>\u003ctable>\u003ctbody>\u003ctr>\u003cth>指定\u003c/th>\u003cth>意味\u003c/th>\u003c/tr>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>完全一致\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>検索値以下の最大値を探す（昇順に整列が必要）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>-1\u003c/td>\u003ctd>検索値以上の最小値を探す（降順に整列が必要）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>「省略すると1として扱われます。つまり、完全一致ではなくなるので注意してくださいね。」\u003c/p>\u003ch3>2. INDEX関数\u003c/h3>\u003ccode>=INDEX(配列,行番号,[列番号])\u003c/code>\u003cp>「INDEXは、指定した範囲の何行目・何列目にある値かを指定して取り出します。」\u003c/p>\u003cp>例えば、\u003c/p>\u003ccode>=INDEX(B2:B4,2)\u003c/code>\u003cp>結果は みかん です。\u003c/p>\u003cp>「B2:B4の2番目はB3ですから、そこにある『みかん』が返されます。」\u003c/p>\u003cp>INDEXは2次元の表でも使えます。\u003c/p>\u003ccode>=INDEX(A2:C4,2,3)\u003c/code>\u003cp>これはA2:C4の2行目・3列目を指定しているので、結果は 100 です。\u003c/p>\u003cp>「先輩、ここでもワークシート全体の行番号ではなく、指定した範囲内での位置を使うんです。」\u003c/p>\u003cp>なお、INDEXには配列形式と参照形式がありますが、まずはこの配列形式を理解すれば十分です。\u003c/p>\u003ch3>3. INDEXとMATCHを組み合わせる\u003c/h3>\u003cp>「では、いよいよ2つを組み合わせましょう。」\u003c/p>\u003ccode>=INDEX(B2:B4,MATCH(102,A2:A4,0))\u003c/code>\u003cp>処理の流れ\u003c/p>\u003cp>① MATCHが検索\u003c/p>\u003cp>A2:A4から商品コード102を探す\u003c/p>\u003cp>結果：2番目\u003c/p>\u003cp>② INDEXに位置を渡す\u003c/p>\u003cp>INDEX(B2:B4, 2)\u003c/p>\u003cp>最終結果\u003c/p>\u003ch1>みかん\u003c/h1>\u003cp>「先輩、数式の外側から読もうとすると混乱しやすいので、内側のMATCHから先に計算すると考えてください。」\u003c/p>\u003ch3>4. VLOOKUP・XLOOKUPとの違い\u003c/h3>\u003ctable>\u003ctbody>\u003ctr>\u003cth>比較\u003c/th>\u003cth>VLOOKUP\u003c/th>\u003cth>INDEX＋MATCH\u003c/th>\u003cth>XLOOKUP\u003c/th>\u003c/tr>\u003ctr>\u003ctd>左方向の検索\u003c/td>\u003ctd>原則不可\u003c/td>\u003ctd>可能\u003c/td>\u003ctd>可能\u003c/td>\u003c/tr>\u003ctr>\u003ctd>完全一致\u003c/td>\u003ctd>FALSE指定\u003c/td>\u003ctd>MATCHで0指定\u003c/td>\u003ctd>標準\u003c/td>\u003c/tr>\u003ctr>\u003ctd>列番号の指定\u003c/td>\u003ctd>必要\u003c/td>\u003ctd>不要\u003c/td>\u003ctd>不要\u003c/td>\u003c/tr>\u003ctr>\u003ctd>列の挿入への対応\u003c/td>\u003ctd>列番号に注意\u003c/td>\u003ctd>比較的柔軟\u003c/td>\u003ctd>比較的柔軟\u003c/td>\u003c/tr>\u003ctr>\u003ctd>数式の分かりやすさ\u003c/td>\u003ctd>比較的簡単\u003c/td>\u003ctd>やや複雑\u003c/td>\u003ctd>比較的簡単\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>「新しいExcelであればXLOOKUPが便利なことも多いですが、INDEXとMATCHは既存の業務ファイルでもよく使われます。仕組みを理解しておく価値がありますよ。」\u003c/p>","C":"\u003ch2>C｜イメージ理解：図書館で本を探す\u003c/h2>\u003cp>「先輩、図書館で本を探す場面を想像してください。」\u003c/p>\u003cp>図書館の検索システムで、目的の本が棚の何番目にあるかを調べます。\u003c/p>\u003cp>これがMATCHです。\u003c/p>\u003cp>その位置をもとに、実際の棚から本を取り出します。\u003c/p>\u003cp>これがINDEXです。\u003c/p>\u003cp>「MATCHは本そのものを取り出すわけではありません。あくまで場所を教えてくれるだけなんです。」\u003c/p>\u003cp>「そしてINDEXは、指定された場所にあるものを取り出す役割です。」\u003c/p>\u003cp>MATCH：どこにある？\u003c/p>\u003cp>「商品コード102は2番目にあります」\u003c/p>\u003cp>INDEX：そこに何がある？\u003c/p>\u003cp>「2番目にあるのは、みかんです」\u003c/p>\u003cp>「この役割分担を覚えておけば、数式が長くなっても理解しやすくなります。」\u003c/p>","D":"\u003ch2>D｜具体例：実際に操作してみましょう\u003c/h2>\u003cp>「では先輩、商品コードを変えたり、取り出す項目を変えたりして、INDEXとMATCHがどう動くか確認しましょう。」\u003c/p>\u003cp>INDEX＋MATCHシミュレーター\u003c/p>\u003cp>操作できます\u003c/p>\u003ctable>\u003ctbody>\u003ctr>\u003ctd>商品コード\u003c/td>\u003ctd>商品名\u003c/td>\u003ctd>価格\u003c/td>\u003c/tr>\u003ctr>\u003ctd>101\u003c/td>\u003ctd>りんご\u003c/td>\u003ctd>150円\u003c/td>\u003c/tr>\u003ctr>\u003ctd>102\u003c/td>\u003ctd>みかん\u003c/td>\u003ctd>100円\u003c/td>\u003c/tr>\u003ctr>\u003ctd>103\u003c/td>\u003ctd>ぶどう\u003c/td>\u003ctd>300円\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>① 検索する商品コード② 取り出す項目商品名（B列）価格（C列）\u003c/p>\u003cp>現在の数式\u003c/p>\u003cp>=INDEX(B2:B4,MATCH(102,A2:A4,0))\u003c/p>\u003cp>MATCHの結果\u003c/p>\u003ch2>2番目\u003c/h2>\u003cp>INDEXの結果\u003c/p>\u003ch2>みかん\u003c/h2>\u003cp>MATCHが見つけた2番目の位置をINDEXに渡しています。この練習では商品コードを数値として扱っています。実際のExcelでは検索値と検索範囲のデータ型を一致させてください。\u003c/p>\u003cp>「先輩、まず102を選んでください。MATCHが2を返して、INDEXがみかんを取り出します。」\u003c/p>\u003cp>「次に取り出す項目を価格に変更すると、同じ2番目の位置から100円を取り出せます。」\u003c/p>\u003cp>「これがINDEXとMATCHの組み合わせの強みです。」\u003c/p>\u003ch3>実務例①：社員番号から部署名を取得する\u003c/h3>\u003cp>A列に社員番号、C列に部署名が入力されている場合、\u003c/p>\u003ccode>=INDEX(C2:C100,MATCH(E2,A2:A100,0))\u003c/code>\u003cp>「E2に入力した社員番号をA列から探し、対応するC列の部署名を取得できます。」\u003c/p>\u003ch3>実務例②：左方向の検索\u003c/h3>\u003cp>「先輩、ここはVLOOKUPとの違いが分かる例です。」\u003c/p>\u003cp>A列に社員番号、B列に社員名があるとします。社員名から社員番号を調べたい場合、\u003c/p>\u003ccode>=INDEX(A2:A100,MATCH(E2,B2:B100,0))\u003c/code>\u003cp>「B列で社員名を検索して、左側のA列から社員番号を取り出せます。」\u003c/p>\u003cp>ただし、同姓同名の社員が複数いる場合、MATCHの完全一致検索は最初に一致した位置を返すため、社員名だけでは正しい社員を特定できない可能性があります。\u003c/p>\u003ch3>実務例③：IFERRORと組み合わせる\u003c/h3>\u003cp>「以前勉強したIFERRORも使えますよ。」\u003c/p>\u003ccode>=IFERROR(INDEX(B2:B100,MATCH(E2,A2:A100,0)),\"未登録\")\u003c/code>\u003cp>「検索値が見つからなければ『未登録』と表示します。ただし、参照範囲の誤りなど、別の原因によるエラーも隠れるので注意してくださいね。」\u003c/p>\u003ch3>応用：縦と横の両方から検索する\u003c/h3>\u003cp>「さらに、INDEXとMATCHは2次元の表にも使えます。」\u003c/p>\u003cp>例えば、A2:A4に商品名、B1:D1に月、B2:D4に売上が入力されている場合です。\u003c/p>\u003ccode>=INDEX(B2:D4,MATCH(\"みかん\",A2:A4,0),MATCH(\"2月\",B1:D1,0))\u003c/code>\u003cp>「1つ目のMATCHが『みかん』の行位置を探し、2つ目のMATCHが『2月』の列位置を探します。INDEXはその交差するセルの売上を取り出すんです。」\u003c/p>\u003cp>「縦方向と横方向を組み合わせて検索できることも、INDEXとMATCHの大きな特徴ですね。」\u003c/p>","その他":"\u003ch2>理解確認：3問\u003c/h2>\u003cp>Q1. MATCH関数が返すものは何ですか？\u003c/p>\u003cp>検索値に対応する商品名検索範囲内での位置検索値の合計\u003c/p>\u003cp>Q2. =INDEX(B2:B4,MATCH(102,A2:A4,0)) の結果は？\u003c/p>\u003cp>102みかん100\u003c/p>\u003cp>Q3. MATCH関数で完全一致を指定する値は？\u003c/p>\u003cp>01-1\u003c/p>\u003cp>正解数：0 / 3\u003c/p>\u003ch2>30秒復習\u003c/h2>\u003cp>「先輩、最後に6つのポイントを確認しましょう。」\u003c/p>\u003col>\u003cli>\u003cp>MATCHとは？ 検索値が指定範囲の何番目にあるかを調べる関数。\u003c/p>\u003c/li>\u003cli>\u003cp>INDEXとは？ 指定した位置にある値を取り出す関数。\u003c/p>\u003c/li>\u003cli>\u003cp>組み合わせる理由は？ 検索した位置を使って、対応するデータを取得するため。\u003c/p>\u003c/li>\u003cli>\u003cp>基本構造は？ \u003ccode>=INDEX(戻り範囲,MATCH(検索値,検索範囲,0))\u003c/code>\u003c/p>\u003c/li>\u003cli>\u003cp>具体例は？ 商品コード102を検索し、対応する商品名「みかん」を取得する。\u003c/p>\u003c/li>\u003cli>\u003cp>間違えやすいところは？ MATCHが返すのはシートの行番号ではなく範囲内の位置であること、完全一致では0を指定すること。\u003c/p>\u003c/li>\u003c/ol>\u003ch2>一文記憶\u003c/h2>\u003cp>MATCHは「何番目？」を探し、INDEXは「その位置の値」を取り出す。\u003c/p>\u003cp>「先輩、これでINDEXとMATCHの仕組みも理解できましたね。VLOOKUPやXLOOKUPと同じように検索に使いますが、INDEXとMATCHは役割を分担しているんです。」\u003c/p>\u003cp>「数式が複雑に見えたら、まず内側のMATCHだけを計算してみてください。そこからINDEXに位置を渡す、と考えればずっと分かりやすくなりますよ。」\u003c/p>"},"prose":["⑩ INDEX関数・MATCH関数（インデックス・マッチ関数）","Excel関数｜検索・参照｜VLOOKUP・XLOOKUPとの比較","「先輩、今回はINDEX関数とMATCH関数ですね。名前が2つあるので難しそうに見えますけど、役割を分けて考えれば大丈夫です。」","「以前勉強したVLOOKUPやXLOOKUPと同じく、表から必要なデータを取り出すために使います。ただし、INDEXとMATCHはそれぞれ別の仕事を担当する関数なんです。」","A｜要点：INDEXとMATCHとは？","「まず、この2つの役割を覚えてください。」","MATCH","位置を探す","指定した値が、範囲の何番目にあるかを調べる。","検索結果","2番目","INDEX","値を取り出す","指定した範囲の何番目にある値かを指定して取得する。","取得結果","みかん","「つまり、MATCHが場所を見つけて、INDEXがその場所のデータを取り出すんです。」","例えば、次の商品表を見てください。","行A列：商品コードB列：商品名C列：価格2101りんご150円3102みかん100円4103ぶどう300円","「商品コード102に対応する商品名を調べたいとします。」","まずMATCHが、商品コード102は検索範囲の2番目だと調べます。そしてINDEXが、商品名の範囲から2番目の「みかん」を取り出すんです。","B｜詳しい解説：それぞれの仕組み","1. MATCH関数","=MATCH(検索値,検索範囲,照合の種類)","引数意味検索値何を探すか検索範囲どこから探すか照合の種類どのように一致を判定するか","例えば、","=MATCH(102,A2:A4,0)","結果は 2 です。","「先輩、102がExcelの3行目にあるのに、結果は2なんです。なぜでしょう？」","「MATCHが返すのはワークシートの行番号ではなく、指定した検索範囲の中で何番目かだからです。」","MATCHが返す位置","検索範囲 A2:A4","101","102","103","範囲内の位置","1番目","2番目","3番目","102はA2:A4の2番目にあるので、MATCHの結果は2です。","「最後の 0 は完全一致を意味します。商品コードのように正確に一致する値を探すときは、基本的に0を指定しましょう。」","MATCHの照合の種類には、次の3つがあります。","指定意味0完全一致1検索値以下の最大値を探す（昇順に整列が必要）-1検索値以上の最小値を探す（降順に整列が必要）","「省略すると1として扱われます。つまり、完全一致ではなくなるので注意してくださいね。」","2. INDEX関数","=INDEX(配列,行番号,[列番号])","「INDEXは、指定した範囲の何行目・何列目にある値かを指定して取り出します。」","例えば、","=INDEX(B2:B4,2)","結果は みかん です。","「B2:B4の2番目はB3ですから、そこにある『みかん』が返されます。」","INDEXは2次元の表でも使えます。","=INDEX(A2:C4,2,3)","これはA2:C4の2行目・3列目を指定しているので、結果は 100 です。","「先輩、ここでもワークシート全体の行番号ではなく、指定した範囲内での位置を使うんです。」","なお、INDEXには配列形式と参照形式がありますが、まずはこの配列形式を理解すれば十分です。","3. INDEXとMATCHを組み合わせる","「では、いよいよ2つを組み合わせましょう。」","=INDEX(B2:B4,MATCH(102,A2:A4,0))","処理の流れ","① MATCHが検索","A2:A4から商品コード102を探す","結果：2番目","② INDEXに位置を渡す","INDEX(B2:B4, 2)","最終結果","みかん","「先輩、数式の外側から読もうとすると混乱しやすいので、内側のMATCHから先に計算すると考えてください。」","4. VLOOKUP・XLOOKUPとの違い","比較VLOOKUPINDEX＋MATCHXLOOKUP左方向の検索原則不可可能可能完全一致FALSE指定MATCHで0指定標準列番号の指定必要不要不要列の挿入への対応列番号に注意比較的柔軟比較的柔軟数式の分かりやすさ比較的簡単やや複雑比較的簡単","「新しいExcelであればXLOOKUPが便利なことも多いですが、INDEXとMATCHは既存の業務ファイルでもよく使われます。仕組みを理解しておく価値がありますよ。」","C｜イメージ理解：図書館で本を探す","「先輩、図書館で本を探す場面を想像してください。」","図書館の検索システムで、目的の本が棚の何番目にあるかを調べます。","これがMATCHです。","その位置をもとに、実際の棚から本を取り出します。","これがINDEXです。","「MATCHは本そのものを取り出すわけではありません。あくまで場所を教えてくれるだけなんです。」","「そしてINDEXは、指定された場所にあるものを取り出す役割です。」","MATCH：どこにある？","「商品コード102は2番目にあります」","INDEX：そこに何がある？","「2番目にあるのは、みかんです」","「この役割分担を覚えておけば、数式が長くなっても理解しやすくなります。」","D｜具体例：実際に操作してみましょう","「では先輩、商品コードを変えたり、取り出す項目を変えたりして、INDEXとMATCHがどう動くか確認しましょう。」","INDEX＋MATCHシミュレーター","操作できます","商品コード商品名価格101りんご150円102みかん100円103ぶどう300円","① 検索する商品コード② 取り出す項目商品名（B列）価格（C列）","現在の数式","=INDEX(B2:B4,MATCH(102,A2:A4,0))","MATCHの結果","2番目","INDEXの結果","みかん","MATCHが見つけた2番目の位置をINDEXに渡しています。この練習では商品コードを数値として扱っています。実際のExcelでは検索値と検索範囲のデータ型を一致させてください。","「先輩、まず102を選んでください。MATCHが2を返して、INDEXがみかんを取り出します。」","「次に取り出す項目を価格に変更すると、同じ2番目の位置から100円を取り出せます。」","「これがINDEXとMATCHの組み合わせの強みです。」","実務例①：社員番号から部署名を取得する","A列に社員番号、C列に部署名が入力されている場合、","=INDEX(C2:C100,MATCH(E2,A2:A100,0))","「E2に入力した社員番号をA列から探し、対応するC列の部署名を取得できます。」","実務例②：左方向の検索","「先輩、ここはVLOOKUPとの違いが分かる例です。」","A列に社員番号、B列に社員名があるとします。社員名から社員番号を調べたい場合、","=INDEX(A2:A100,MATCH(E2,B2:B100,0))","「B列で社員名を検索して、左側のA列から社員番号を取り出せます。」","ただし、同姓同名の社員が複数いる場合、MATCHの完全一致検索は最初に一致した位置を返すため、社員名だけでは正しい社員を特定できない可能性があります。","実務例③：IFERRORと組み合わせる","「以前勉強したIFERRORも使えますよ。」","=IFERROR(INDEX(B2:B100,MATCH(E2,A2:A100,0)),\"未登録\")","「検索値が見つからなければ『未登録』と表示します。ただし、参照範囲の誤りなど、別の原因によるエラーも隠れるので注意してくださいね。」","応用：縦と横の両方から検索する","「さらに、INDEXとMATCHは2次元の表にも使えます。」","例えば、A2:A4に商品名、B1:D1に月、B2:D4に売上が入力されている場合です。","=INDEX(B2:D4,MATCH(\"みかん\",A2:A4,0),MATCH(\"2月\",B1:D1,0))","「1つ目のMATCHが『みかん』の行位置を探し、2つ目のMATCHが『2月』の列位置を探します。INDEXはその交差するセルの売上を取り出すんです。」","「縦方向と横方向を組み合わせて検索できることも、INDEXとMATCHの大きな特徴ですね。」","理解確認：3問","Q1. MATCH関数が返すものは何ですか？","検索値に対応する商品名検索範囲内での位置検索値の合計","Q2. =INDEX(B2:B4,MATCH(102,A2:A4,0)) の結果は？","102みかん100","Q3. MATCH関数で完全一致を指定する値は？","01-1","正解数：0 / 3","30秒復習","「先輩、最後に6つのポイントを確認しましょう。」","MATCHとは？ 検索値が指定範囲の何番目にあるかを調べる関数。INDEXとは？ 指定した位置にある値を取り出す関数。組み合わせる理由は？ 検索した位置を使って、対応するデータを取得するため。基本構造は？ =INDEX(戻り範囲,MATCH(検索値,検索範囲,0))具体例は？ 商品コード102を検索し、対応する商品名「みかん」を取得する。間違えやすいところは？ MATCHが返すのはシートの行番号ではなく範囲内の位置であること、完全一致では0を指定すること。","一文記憶","MATCHは「何番目？」を探し、INDEXは「その位置の値」を取り出す。","「先輩、これでINDEXとMATCHの仕組みも理解できましたね。VLOOKUPやXLOOKUPと同じように検索に使いますが、INDEXとMATCHは役割を分担しているんです。」","「数式が複雑に見えたら、まず内側のMATCHだけを計算してみてください。そこからINDEXに位置を渡す、と考えればずっと分かりやすくなりますよ。」"],"quizzes":[{"q":"MATCH関数が返すものは何ですか？","options":["検索値に対応する商品名","検索範囲内での位置","検索値の合計"],"correct":1,"explain":"MATCHが返すのは、指定した検索範囲内での位置です。"},{"q":"=INDEX(B2:B4,MATCH(102,A2:A4,0)) の結果は？","options":["102","みかん","100"],"correct":1,"explain":"MATCHは2を返し、INDEXはB2:B4の2番目の「みかん」を返します。"},{"q":"MATCH関数で完全一致を指定する値は？","options":["0","1","-1"],"correct":0,"explain":"原文の説明通り、0は完全一致です。"}]}]</script><script id="legacy-data" type="application/json">[{"name": "VLOOKUP", "category": "検索・参照", "formula": "=VLOOKUP(検索値,範囲,列番号,FALSE)", "summary": "表の左端列で値を探し、同じ行の指定列の値を返す。", "A": "「先輩、VLOOKUPは表の左端にある検索キーを見つけ、その行の右側にある情報を取り出します。最後のFALSEは完全一致です。商品コードや社員番号の照合では、まずFALSEを覚えてください。」", "B": "「商品コード102をA2:C4の左端列から探し、3列目の価格100を取得します。列番号はワークシートのC列という意味ではなく、指定範囲の左から数えた番号です。列の挿入によって意図した列番号が変わる場合があります。検索値が見つからないと#N/Aです。」", "C": "「先輩、名簿の一番左の番号を指でたどって、同じ行の右側に書かれた情報を見るイメージです。左端で探す制約があることも忘れないでください。」", "D": "A2:C4が「101 りんご 150」「102 みかん 100」「103 ぶどう 300」のとき、=VLOOKUP(102,A2:C4,3,FALSE) の結果は100です。", "q": "VLOOKUPで完全一致を指定する値は？", "options": ["TRUE", "FALSE", "省略"], "correct": 1, "explain": "FALSEを指定します。TRUEまたは省略は近似一致です。", "review": "左端列で検索→同じ行の右側を返す。列番号は範囲の左から数える。FALSEで完全一致。", "memory": "VLOOKUPは「左端で探し、右の列から取り出す」。", "image": "images/01.svg"}, {"name": "XLOOKUP", "category": "検索・参照", "formula": "=XLOOKUP(検索値,検索範囲,戻り範囲,[見つからない場合],[一致モード],[検索モード])", "summary": "検索範囲と戻り範囲を別々に指定できる柔軟な検索関数。", "A": "「先輩、XLOOKUPなら探す列と取り出す列を別々に指定できます。右から左への検索もできますし、標準で完全一致です。見つからない場合の表示も指定できます。」", "B": "「=XLOOKUP(102,A2:A4,B2:B4,\"未登録\") は、A列から102を探してB列の商品名を返します。検索値が見つからない場合は『未登録』です。検索範囲と戻り範囲は対応する大きさにそろえます。重複がある場合は通常最初の一致が返ります。」", "C": "「先輩、名簿のどの列で探すか、どの列を読むかを自由に決められる案内係です。VLOOKUPと違い、左側の列も読めるんですよ。」", "D": "A列が商品コード101・102・103、B列がりんご・みかん・ぶどうのとき、=XLOOKUP(102,A2:A4,B2:B4,\"未登録\") は「みかん」です。", "q": "XLOOKUPの標準の一致方法は？", "options": ["完全一致", "近似一致（昇順）", "ワイルドカード一致"], "correct": 0, "explain": "XLOOKUPは一致モードを省略すると完全一致です。", "review": "検索範囲と戻り範囲を分けて指定。左方向も可。完全一致が標準。", "memory": "XLOOKUPは「探す列も、取り出す列も自由」。", "image": "images/02.svg"}, {"name": "IF", "category": "条件分岐", "formula": "=IF(論理式,真の場合,偽の場合)", "summary": "条件が成立するかどうかで返す結果を切り替える。", "A": "「先輩、IFは『もし〜ならA、そうでなければB』をExcelに任せる関数です。数字の判定も、文字の表示もできます。」", "B": "「=IF(A2>=80,\"合格\",\"不合格\") は、A2が80以上なら合格、そうでなければ不合格です。>=は以上、>は超える、\u003c=は以下、\u003c>は等しくない、を表します。文字列はダブルクォーテーションで囲みます。複数条件にはAND・ORやIFの入れ子を使えます。」", "C": "「先輩、雨なら傘を持つ、雨でなければ持たない、という日常の判断をそのまま数式にしたものです。」", "D": "A2が79なら =IF(A2>=80,\"合格\",\"不合格\") は「不合格」、A2が80なら「合格」です。", "q": "A2が80のとき、=IF(A2>=80,\"合格\",\"不合格\") は？", "options": ["合格", "不合格", "エラー"], "correct": 0, "explain": "80は80以上に含まれます。", "review": "条件→真の場合→偽の場合。>=は以上。文字は引用符で囲む。", "memory": "IFは「もし条件が正しければA、違えばB」。", "image": "images/03.svg"}, {"name": "SUMIF", "category": "条件付き集計", "formula": "=SUMIF(範囲,検索条件,合計範囲)", "summary": "指定した条件に一致する行の数値だけを合計する。", "A": "「先輩、SUMIFは条件に合うものだけを足します。経費の一覧から交通費だけを集計する、といった仕事に便利です。」", "B": "「=SUMIF(A2:A6,\"交通費\",B2:B6) は、A列が交通費の行だけB列の金額を合計します。条件は文字列のほか、セル参照や \">=1000\" のような比較式も指定できます。複数条件ならSUMIFSを使い、SUMIFSでは合計範囲が先頭になる点に注意してください。」", "C": "「先輩、領収書の山から『交通費』の札が付いたものだけを集め、その金額を足すイメージです。数を数えるCOUNTIFとは役割が違います。」", "D": "A2:A6が交通費・消耗品費・交通費・通信費・交通費、B2:B6が1200・3000・800・5000・1500のとき、=SUMIF(A2:A6,\"交通費\",B2:B6) は3500です。", "q": "交通費1200・800・1500の合計は？", "options": ["2300", "3500", "6500"], "correct": 1, "explain": "1200+800+1500=3500です。", "review": "条件範囲→条件→合計範囲。SUMIFSは合計範囲が先頭。", "memory": "SUMIFは「条件に合う行だけ足す」。", "image": "images/04.svg"}, {"name": "INDEX＋MATCH", "category": "検索・参照", "formula": "=INDEX(戻り範囲,MATCH(検索値,検索範囲,0))", "summary": "MATCHが位置を調べ、INDEXがその位置の値を取り出す。", "A": "「先輩、INDEXとMATCHは二人一組です。MATCHは『何番目にあるか』を調べ、INDEXは『その番目の値』を取り出します。内側のMATCHから順に考えれば難しくありません。」", "B": "「=MATCH(102,A2:A4,0) の結果は2です。Excelの行番号3ではなく、検索範囲内の2番目という意味です。=INDEX(B2:B4,2) はみかんを返します。組み合わせると =INDEX(B2:B4,MATCH(102,A2:A4,0)) です。MATCHの0は完全一致で、省略すると1（近似一致）です。INDEXは2次元の範囲なら行番号と列番号の両方を指定できます。検索が失敗すると#N/Aになり、IFERRORで代替表示を指定できます。」", "C": "「先輩、図書館で本を探すとき、MATCHが『2番目の棚です』と場所を教え、INDEXが『そこにある本はこちらです』と取り出すイメージです。場所探しと取り出しを分担しています。」", "D": "A2:A4が101・102・103、B2:B4がりんご・みかん・ぶどうなら、=INDEX(B2:B4,MATCH(102,A2:A4,0)) の結果は「みかん」です。さらに =INDEX(B2:D4,MATCH(\"みかん\",A2:A4,0),MATCH(\"2月\",B1:D1,0)) のように縦横検索もできます。", "q": "MATCH(102,A2:A4,0) が返すのは？", "options": ["Excelの3行目", "検索範囲内の2番目", "商品名のみかん"], "correct": 1, "explain": "MATCHは指定範囲内での位置を返します。", "review": "MATCHは位置、INDEXは値。MATCHの完全一致は0。範囲内の位置に注意。", "memory": "MATCHが「何番目？」を探し、INDEXが「その値」を取り出す。", "image": "images/05.svg"}]</script><script>const LEGACY=JSON.parse(document.getElementById('legacy-data').textContent);const DATA=JSON.parse(document.getElementById('source-data').textContent);const DIAGRAMS=["data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA5MDAgNDIwIj48cmVjdCB3aWR0aD0iOTAwIiBoZWlnaHQ9IjQyMCIgcng9IjI0IiBmaWxsPSIjZWVmNGZmIi8+PHRleHQgeD0iNDUwIiB5PSI2MiIgZm9udC1zaXplPSIzNyIgZm9udC13ZWlnaHQ9ImJvbGQiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiMxNjMzNWMiPlZMT09LVVA8L3RleHQ+PHJlY3QgeD0iNjUiIHk9IjEyMCIgd2lkdGg9IjMyMCIgaGVpZ2h0PSIxOTAiIHJ4PSIxOCIgZmlsbD0id2hpdGUiIHN0cm9rZT0iIzg0YTllOCIgc3Ryb2tlLXdpZHRoPSI0Ii8+PHJlY3QgeD0iNTE1IiB5PSIxMjAiIHdpZHRoPSIzMjAiIGhlaWdodD0iMTkwIiByeD0iMTgiIGZpbGw9IndoaXRlIiBzdHJva2U9IiM3YWI3YTQiIHN0cm9rZS13aWR0aD0iNCIvPjxwYXRoIGQ9Ik00MDIgMjE1IEg0OTIiIHN0cm9rZT0iIzMxNWU5OSIgc3Ryb2tlLXdpZHRoPSI5IiBzdHJva2UtbGluZWNhcD0icm91bmQiLz48cGF0aCBkPSJNNDcyIDE5NSBMNTAwIDIxNSBMNDcyIDIzNSIgZmlsbD0ib
