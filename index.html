radio>        {/each}      \u003c/radio-group>      {#if answers[i]!==undefined}        \u003cbox background=\"surface-secondary\" padding={2} radius=\"md\" gap={1}>          \u003crow align=\"center\" gap={2}>            \u003cicon name={answers[i]===q.a?\"check-circle\":\"x-circle\"} color={answers[i]===q.a?\"success\":\"danger\"}/>            **{answers[i]===q.a?\"正解です！\":\"不正解です\" }**          \u003c/row>          \u003ctext size=\"sm\">正解：{q.opts[q.a]}。{q.ex}\u003c/text>        \u003c/box>      {/if}    \u003c/box>    {#if i\u003c2}\u003cdivider color=\"subtle\"/>{/if}  {/each}  \u003crow align=\"center\" justify=\"between\">    \u003ctext color=\"secondary\" size=\"sm\">正解数：{qs.filter((q,i)=>answers[i]===q.a).length} / 3\u003c/text>    \u003cbutton size=\"sm\" variant=\"outline\" color=\"secondary\" onClick={()=>setAnswers({})}>再挑戦\u003c/button>  \u003c/row>\u003c/box>## 30秒復習「先輩、最後に重要なポイントを整理します。」1. **何の関数？** 条件によって結果を切り替える関数。2. **最重要ポイントは？** 条件がTRUEかFALSEかで処理が分かれること。3. **なぜ便利？** 人間が一つずつ判断する作業を自動化できるから。4. **基本構造は？** `=IF(論理式,真の場合,偽の場合)`5. **具体例は？** 80点以上なら合格、それ以外なら不合格。6. **間違えやすいところは？** `>`と`>=`の違い、文字列を囲む`\" \"`の付け忘れ。## 一文記憶**IF関数は「もし条件を満たせばA、満たさなければB」とExcelに判断させる関数。**「これでVLOOKUP、XLOOKUP、IFの3つを学習しましたね。検索する関数と条件判断する関数を区別できるようになれば、次はこれらを組み合わせた実務的な数式も理解しやすくなりますよ、先輩。」","sections":{"A":"\u003ch1>③ IF関数（イフ関数）\u003c/h1>\n\u003cp class=\"muted\">Excel関数｜論理関数｜条件による自動判定\u003c/p>\u003ch2>A｜要点：IF関数とは？\u003c/h2>\u003cp>「先輩、今回はExcelのIF関数ですね。VLOOKUPやXLOOKUPが『情報を探す関数』だったのに対して、IFは\u003cstrong>条件によって処理を分ける関数\u003c/strong>なんです。」\u003c/p>\n\u003cp>「例えば、テストで80点以上なら合格、80点未満なら不合格と表示したいとします。」\u003c/p>\n\u003cdiv class=\"source-static\">\u003cdiv>\n  \u003cstrong>IF関数の基本イメージ\u003c/strong>\n\u003cdiv>\n    \u003cspan>条件\u003c/span>\n    \u003cstrong>点数は80点以上？\u003c/strong>\n  \u003c/div>\n  \u003csvg viewBox=\"0 0 320 112\" width=\"100%\">\n    \u003cpath d=\"M160 0 V17 H80 V38 M160 17 H240 V38\" stroke=\"currentColor\" stroke-opacity=\".45\" stroke-width=\"1.8\" fill=\"none\"/>\n    \u003cpath d=\"M75 32 L80 39 L85 32 M235 32 L240 39 L245 32\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".45\" stroke-width=\"1.8\"/>\n    \u003crect x=\"7\" y=\"40\" width=\"146\" height=\"62\" rx=\"9\" fill=\"#16a34a\" fill-opacity=\".10\" stroke=\"#16a34a\"/>\n    \u003crect x=\"167\" y=\"40\" width=\"146\" height=\"62\" rx=\"9\" fill=\"#dc2626\" fill-opacity=\".08\" stroke=\"#dc2626\"/>\n    \u003cg font-size=\"13\" text-anchor=\"middle\" fill=\"currentColor\">\n      \u003ctext x=\"80\" y=\"59\">YES（真）\u003c/text>\n      \u003ctext x=\"240\" y=\"59\">NO（偽）\u003c/text>\n    \u003c/g>\n    \u003ctext x=\"80\" y=\"85\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"bold\" fill=\"#16a34a\">合格\u003c/text>\n    \u003ctext x=\"240\" y=\"85\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"bold\" fill=\"#dc2626\">不合格\u003c/text>\n  \u003c/svg>\n  \u003csmall>条件が成立するかどうかで、表示する結果が変わります。\u003c/small>\n\u003c/div>\n\u003c/div>\u003cp>「つまりIF関数は、Excelに『もし○○なら△△、そうでなければ□□にして』と判断させる仕組みなんです。」\u003c/p>\n","B":"\u003ch2>B｜詳しい解説：IF関数の仕組み\u003c/h2>\u003ch3>1. 基本の書き方\u003c/h3>\n\u003cp>「3つの引数を順番に見ていきましょう。」\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>引数\u003c/th>\n\u003cth>意味\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>論理式\u003c/td>\n\u003ctd>どんな条件で判断する？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>真の場合\u003c/td>\n\u003ctd>条件が成立したら何を返す？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>偽の場合\u003c/td>\n\u003ctd>条件が成立しなかったら何を返す？\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>例えば、A2に点数が入力されているとします。\u003c/p>\n\u003cp>この式を分解すると、\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>A2&gt;=80\u003c/code>：A2が80以上か調べる\u003c/li>\n\u003cli>\u003ccode>&quot;合格&quot;\u003c/code>：80以上なら合格を表示\u003c/li>\n\u003cli>\u003ccode>&quot;不合格&quot;\u003c/code>：80未満なら不合格を表示\u003c/li>\n\u003c/ul>\n\u003cp>「先輩、\u003ccode>&gt;=\u003c/code>は『以上』という意味です。\u003ccode>&gt;\u003c/code>だけなら『より大きい』なので、80点ちょうどの扱いが変わります。ここは間違えないでくださいね。」\u003c/p>\n\u003ch3>2. IF関数が判断する流れ\u003c/h3>\n\u003cdiv class=\"source-static\">\u003cdiv>\n  \u003cdiv>\n    \u003cstrong>① 論理式を評価\u003c/strong>\n\u003cspan>A2の点数が80以上かを調べる\u003c/span>\n  \u003c/div>\n   → \n  \u003cdiv>\n    \u003cstrong>② TRUEかFALSEかを判断\u003c/strong>\n\u003cspan>条件が成立すればTRUE、成立しなければFALSE\u003c/span>\n  \u003c/div>\n   → \n  \u003cdiv>\n    \u003cstrong>③ 対応する結果を返す\u003c/strong>\n\u003cspan>TRUEなら「合格」、FALSEなら「不合格」\u003c/span>\n  \u003c/div>\n\u003c/div>\n\u003c/div>\u003ch3>3. 比較演算子を覚えましょう\u003c/h3>\n\u003cp>「IF関数では、条件を作るための比較演算子をよく使います。」\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>記号\u003c/th>\n\u003cth>意味\u003c/th>\n\u003cth>例\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>=\u003c/code>\u003c/td>\n\u003ctd>等しい\u003c/td>\n\u003ctd>\u003ccode>A2=80\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>&gt;\u003c/code>\u003c/td>\n\u003ctd>より大きい\u003c/td>\n\u003ctd>\u003ccode>A2&gt;80\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>&lt;\u003c/code>\u003c/td>\n\u003ctd>より小さい\u003c/td>\n\u003ctd>\u003ccode>A2&lt;80\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>&gt;=\u003c/code>\u003c/td>\n\u003ctd>以上\u003c/td>\n\u003ctd>\u003ccode>A2&gt;=80\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>&lt;=\u003c/code>\u003c/td>\n\u003ctd>以下\u003c/td>\n\u003ctd>\u003ccode>A2&lt;=80\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>&lt;&gt;\u003c/code>\u003c/td>\n\u003ctd>等しくない\u003c/td>\n\u003ctd>\u003ccode>A2&lt;&gt;80\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>「特に\u003ccode>&lt;&gt;\u003c/code>は少し変わった形ですが、『等しくない』という意味なので覚えておきましょう。」\u003c/p>\n\u003ch3>4. 数値と文字列の違い\u003c/h3>\n\u003cp>「もう一つ大切なのが、ダブルクォーテーションです。」\u003c/p>\n\u003cp>「合格」のような文字列は、通常\u003ccode>&quot; &quot;\u003c/code>で囲みます。\u003c/p>\n\u003cp>一方、数値を返すなら囲みません。\u003c/p>\n\u003cp>この式は、80点以上なら数値の1、それ以外なら数値の0を返します。\u003c/p>\n","C":"\u003ch2>C｜イメージ理解：IFは分かれ道\u003c/h2>\u003cp>「先輩、IF関数は道の分岐だと考えると理解しやすいですよ。」\u003c/p>\n\u003cp>例えば、遊園地のアトラクションに身長制限があるとします。\u003c/p>\n\u003cp>「身長が120cm以上なら乗れる。120cm未満なら乗れない。」\u003c/p>\n\u003cp>ここで必要なのは、身長という情報を探すことではありません。\u003c/p>\n\u003cp>\u003cstrong>すでに分かっている身長を条件と比較して、結果を決めること\u003c/strong>です。\u003c/p>\n\u003cp>これがIF関数の役割なんです。\u003c/p>\n\u003cp>「だから、VLOOKUPやXLOOKUPと混同しないでくださいね。検索するのか、判断するのか。この違いが重要です。」\u003c/p>\n","D":"\u003ch2>D｜具体例：実際にIF関数を操作する\u003c/h2>\u003cp>「では先輩、点数を変えながらIF関数の動きを確認しましょう。」\u003c/p>\n\u003cp>「点数を80点にしてみてください。条件が『80点以上』なので、80点ちょうどでも合格になります。」\u003c/p>\n\u003ch3>実務例①：請求書の支払状況\u003c/h3>\n\u003cp>「仕事では、支払済みか未払いかを自動判定する使い方ができます。」\u003c/p>\n\u003cp>例えば、B2に支払日が入力されている場合、\u003c/p>\n\u003cp>B2が空欄なら「未払い」、何か入力されていれば「支払済み」と表示します。\u003c/p>\n\u003cp>ただし、入力されている内容が本当に正しい支払日かどうかまでは判定していません。\u003c/p>\n\u003ch3>実務例②：予算超過の判定\u003c/h3>\n\u003cp>A2が予算、B2が実際の支出額なら、\u003c/p>\n\u003cp>例えば、予算10万円に対して支出12万円なら「予算超過」です。\u003c/p>\n\u003cp>「こういう判定を大量の行で自動化できるのが、IF関数の便利なところですね。」\u003c/p>\n\u003ch3>実務例③：IF関数を複数組み合わせる\u003c/h3>\n\u003cp>「先輩、条件が2つ以上ある場合はどうすると思います？」\u003c/p>\n\u003cp>例えば、成績を3段階に分けたいとします。\u003c/p>\n\u003cul>\n\u003cli>80点以上：優\u003c/li>\n\u003cli>60点以上80点未満：良\u003c/li>\n\u003cli>60点未満：不可\u003c/li>\n\u003c/ul>\n\u003cp>この場合は、IF関数の中にIF関数を入れます。\u003c/p>\n\u003cp>「最初に80点以上かを確認し、違った場合に60点以上かを確認するんです。これを**IF関数のネスト（入れ子）**と呼びます。」\u003c/p>\n\u003cp>「ただし、条件が多い場合はIFS関数を使った方が読みやすくなることもあります。」\u003c/p>\n","その他":"\u003ch2>理解確認：3問\u003c/h2>\u003ch2>30秒復習\u003c/h2>\u003cp>「先輩、最後に重要なポイントを整理します。」\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>何の関数？\u003c/strong> 条件によって結果を切り替える関数。\u003c/li>\n\u003cli>\u003cstrong>最重要ポイントは？\u003c/strong> 条件がTRUEかFALSEかで処理が分かれること。\u003c/li>\n\u003cli>\u003cstrong>なぜ便利？\u003c/strong> 人間が一つずつ判断する作業を自動化できるから。\u003c/li>\n\u003cli>\u003cstrong>基本構造は？\u003c/strong> \u003ccode>=IF(論理式,真の場合,偽の場合)\u003c/code>\u003c/li>\n\u003cli>\u003cstrong>具体例は？\u003c/strong> 80点以上なら合格、それ以外なら不合格。\u003c/li>\n\u003cli>\u003cstrong>間違えやすいところは？\u003c/strong> \u003ccode>&gt;\u003c/code>と\u003ccode>&gt;=\u003c/code>の違い、文字列を囲む\u003ccode>&quot; &quot;\u003c/code>の付け忘れ。\u003c/li>\n\u003c/ol>\n\u003ch2>一文記憶\u003c/h2>\u003cp>\u003cstrong>IF関数は「もし条件を満たせばA、満たさなければB」とExcelに判断させる関数。\u003c/strong>\u003c/p>\n\u003cp>「これでVLOOKUP、XLOOKUP、IFの3つを学習しましたね。検索する関数と条件判断する関数を区別できるようになれば、次はこれらを組み合わせた実務的な数式も理解しやすくなりますよ、先輩。」\u003c/p>\n"},"prose":["# ③ IF関数（イフ関数）","Excel関数｜論理関数｜条件による自動判定","## A｜要点：IF関数とは？","「先輩、今回はExcelのIF関数ですね。VLOOKUPやXLOOKUPが『情報を探す関数』だったのに対して、IFは**条件によって処理を分ける関数**なんです。」","「例えば、テストで80点以上なら合格、80点未満なら不合格と表示したいとします。」","「つまりIF関数は、Excelに『もし○○なら△△、そうでなければ□□にして』と判断させる仕組みなんです。」","## B｜詳しい解説：IF関数の仕組み","### 1. 基本の書き方","「3つの引数を順番に見ていきましょう。」","| 引数 | 意味 |\n|---|---|\n| 論理式 | どんな条件で判断する？ |\n| 真の場合 | 条件が成立したら何を返す？ |\n| 偽の場合 | 条件が成立しなかったら何を返す？ |","例えば、A2に点数が入力されているとします。","この式を分解すると、","- `A2>=80`：A2が80以上か調べる\n- `\"合格\"`：80以上なら合格を表示\n- `\"不合格\"`：80未満なら不合格を表示","「先輩、`>=`は『以上』という意味です。`>`だけなら『より大きい』なので、80点ちょうどの扱いが変わります。ここは間違えないでくださいね。」","### 2. IF関数が判断する流れ","### 3. 比較演算子を覚えましょう","「IF関数では、条件を作るための比較演算子をよく使います。」","| 記号 | 意味 | 例 |\n|---|---|---|\n| `=` | 等しい | `A2=80` |\n| `>` | より大きい | `A2>80` |\n| `\u003c` | より小さい | `A2\u003c80` |\n| `>=` | 以上 | `A2>=80` |\n| `\u003c=` | 以下 | `A2\u003c=80` |\n| `\u003c>` | 等しくない | `A2\u003c>80` |","「特に`\u003c>`は少し変わった形ですが、『等しくない』という意味なので覚えておきましょう。」","### 4. 数値と文字列の違い","「もう一つ大切なのが、ダブルクォーテーションです。」","「合格」のような文字列は、通常`\" \"`で囲みます。","一方、数値を返すなら囲みません。","この式は、80点以上なら数値の1、それ以外なら数値の0を返します。","## C｜イメージ理解：IFは分かれ道","「先輩、IF関数は道の分岐だと考えると理解しやすいですよ。」","例えば、遊園地のアトラクションに身長制限があるとします。","「身長が120cm以上なら乗れる。120cm未満なら乗れない。」","ここで必要なのは、身長という情報を探すことではありません。","**すでに分かっている身長を条件と比較して、結果を決めること**です。","これがIF関数の役割なんです。","「だから、VLOOKUPやXLOOKUPと混同しないでくださいね。検索するのか、判断するのか。この違いが重要です。」","## D｜具体例：実際にIF関数を操作する","「では先輩、点数を変えながらIF関数の動きを確認しましょう。」","「点数を80点にしてみてください。条件が『80点以上』なので、80点ちょうどでも合格になります。」","### 実務例①：請求書の支払状況","「仕事では、支払済みか未払いかを自動判定する使い方ができます。」","例えば、B2に支払日が入力されている場合、","B2が空欄なら「未払い」、何か入力されていれば「支払済み」と表示します。","ただし、入力されている内容が本当に正しい支払日かどうかまでは判定していません。","### 実務例②：予算超過の判定","A2が予算、B2が実際の支出額なら、","例えば、予算10万円に対して支出12万円なら「予算超過」です。","「こういう判定を大量の行で自動化できるのが、IF関数の便利なところですね。」","### 実務例③：IF関数を複数組み合わせる","「先輩、条件が2つ以上ある場合はどうすると思います？」","例えば、成績を3段階に分けたいとします。","- 80点以上：優\n- 60点以上80点未満：良\n- 60点未満：不可","この場合は、IF関数の中にIF関数を入れます。","「最初に80点以上かを確認し、違った場合に60点以上かを確認するんです。これを**IF関数のネスト（入れ子）**と呼びます。」","「ただし、条件が多い場合はIFS関数を使った方が読みやすくなることもあります。」","## 理解確認：3問","## 30秒復習","「先輩、最後に重要なポイントを整理します。」","1. **何の関数？** 条件によって結果を切り替える関数。\n2. **最重要ポイントは？** 条件がTRUEかFALSEかで処理が分かれること。\n3. **なぜ便利？** 人間が一つずつ判断する作業を自動化できるから。\n4. **基本構造は？** `=IF(論理式,真の場合,偽の場合)`\n5. **具体例は？** 80点以上なら合格、それ以外なら不合格。\n6. **間違えやすいところは？** `>`と`>=`の違い、文字列を囲む`\" \"`の付け忘れ。","## 一文記憶","**IF関数は「もし条件を満たせばA、満たさなければB」とExcelに判断させる関数。**","「これでVLOOKUP、XLOOKUP、IFの3つを学習しましたね。検索する関数と条件判断する関数を区別できるようになれば、次はこれらを組み合わせた実務的な数式も理解しやすくなりますよ、先輩。」"],"quizzes":[{"q":"=IF(A2>=80,\"合格\",\"不合格\") でA2が80の場合は？","options":["合格","不合格","エラー"],"correct":0,"explain":"「>=」は以上を意味するので、80点ちょうども条件を満たします。"},{"q":"A2がB2と等しくない場合に「不一致」と表示したい。正しい条件は？","options":["A2=B2","A2\u003c>B2","A2>=B2"],"correct":1,"explain":"「\u003c>」は等しくないという意味です。A2とB2の値が異なるとTRUEになります。"},{"q":"=IF(A2>100,\"超過\",\"範囲内\") でA2が100の場合は？","options":["超過","範囲内","TRUE"],"correct":1,"explain":"「>100」は100より大きいという条件です。100ちょうどでは成立しません。"}]},{"name":"SUMIF","original":"\u003cp># ④ SUMIF関数（サムイフ関数）\u003c/p>\u003cp>&lt;text color=\"secondary\" size=\"sm\"&gt;Excel関数｜条件付き集計｜SUM・IF・SUMIFSとの違い&lt;/text&gt;\u003c/p>\u003cp>## A｜要点：SUMIF関数とは？\u003c/p>\u003cp>「先輩、今回はSUMIF関数ですね。ここまでVLOOKUP、XLOOKUP、IF関数を勉強してきましたけど、今回は**条件に一致するデータだけを合計する関数**です。」\u003c/p>\u003cp>例えば、会社の経費一覧に交通費、消耗品費、通信費が混ざっていたとします。\u003c/p>\u003cp>「この中から交通費だけを合計したいとき、先輩ならどうしますか？」\u003c/p>\u003cp>「交通費の行を一つずつ探して足していく……ですか？ それでは件数が増えたときに大変ですよね。」\u003c/p>\u003cp>SUMIF関数なら、条件を指定するだけで自動的に集計できます。\u003c/p>\u003cp>&lt;box border radius=\"lg\" padding={3} gap={3}&gt;\u003cbr>  **経費一覧の例**\u003c/p>\u003cp>  | A列：費目 | B列：金額 |\u003cbr>  |---|---:|\u003cbr>  | &lt;text color=\"success\" weight=\"medium\"&gt;交通費&lt;/text&gt; | 1,200円 |\u003cbr>  | 消耗品費 | 3,000円 |\u003cbr>  | &lt;text color=\"success\" weight=\"medium\"&gt;交通費&lt;/text&gt; | 800円 |\u003cbr>  | 通信費 | 5,000円 |\u003cbr>  | &lt;text color=\"success\" weight=\"medium\"&gt;交通費&lt;/text&gt; | 1,500円 |\u003c/p>\u003cp>  &lt;box background=\"surface-secondary\" radius=\"md\" padding={3} gap={1}&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"xs\"&gt;条件：費目が「交通費」&lt;/text&gt;\u003cbr>    &lt;row justify=\"between\" align=\"center\"&gt;\u003cbr>      &lt;text weight=\"medium\"&gt;1,200 + 800 + 1,500&lt;/text&gt;\u003cbr>      &lt;title color=\"success\" size=\"xl\" tabularNums&gt;3,500円&lt;/title&gt;\u003cbr>    &lt;/row&gt;\u003cbr>  &lt;/box&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>「重要なのは、交通費以外の行は合計しないということです。」\u003c/p>\u003cp>## B｜詳しい解説：SUMIFの仕組み\u003c/p>\u003cp>### 1. 基本の書き方\u003c/p>\u003cp>「先輩、この3つの引数を順番に理解しましょう。」\u003c/p>\u003cp>| 引数 | 意味 |\u003cbr>|---|---|\u003cbr>| 範囲 | 条件に一致するか調べる場所 |\u003cbr>| 検索条件 | どんなデータを集計するか |\u003cbr>| 合計範囲 | 実際に足し合わせる数値の場所 |\u003c/p>\u003cp>先ほどの経費一覧なら、次のようになります。\u003c/p>\u003cp>&lt;box align=\"center\" gap={1}&gt;\u003cbr>  &lt;box border radius=\"md\" padding={3} width=\"100%\" align=\"center\" gap={1}&gt;\u003cbr>    **① 範囲：A2:A6**\u003c/p>\u003cp>    &lt;text size=\"sm\"&gt;費目が入力されているA列を調べる&lt;/text&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;icon name=\"arrow-down\" color=\"tertiary\"/&gt;\u003cbr>  &lt;box border radius=\"md\" padding={3} width=\"100%\" align=\"center\" gap={1}&gt;\u003cbr>    **② 検索条件：「交通費」**\u003c/p>\u003cp>    &lt;text size=\"sm\"&gt;A列の中から交通費に一致する行を見つける&lt;/text&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;icon name=\"arrow-down\" color=\"tertiary\"/&gt;\u003cbr>  &lt;box border radius=\"md\" padding={3} width=\"100%\" align=\"center\" gap={1}&gt;\u003cbr>    **③ 合計範囲：B2:B6**\u003c/p>\u003cp>    &lt;text size=\"sm\"&gt;一致した行に対応するB列の金額を足す&lt;/text&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;icon name=\"arrow-down\" color=\"tertiary\"/&gt;\u003cbr>  &lt;box background=\"rgba(22,163,74,0.08)\" border={{size:1,color:\"success\"}} radius=\"md\" padding={3} width=\"100%\" align=\"center\" gap={1}&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"xs\"&gt;計算結果&lt;/text&gt;\u003cbr>    &lt;title size=\"xl\" color=\"success\"&gt;3,500円&lt;/title&gt;\u003cbr>  &lt;/box&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>「ここで先輩、勘違いしやすい点があります。SUMIFは、条件に一致する行の**金額を合計する**関数であって、条件に一致する件数を数える関数ではありません。」\u003c/p>\u003cp>「件数を数えたいならCOUNTIF関数を使います。」\u003c/p>\u003cp>### 2. 数値条件も指定できる\u003c/p>\u003cp>「SUMIFは文字列だけでなく、金額などの数値を条件にすることもできます。」\u003c/p>\u003cp>例えば、B2:B6のうち、1,000円以上の金額だけを合計するなら、\u003c/p>\u003cp>「`\"&gt;=1000\"`は1,000以上という条件です。比較演算子を使う条件は、通常ダブルクォーテーションで囲みます。」\u003c/p>\u003cp>この場合、合計範囲を省略しているので、条件を調べたB2:B6自体を合計します。\u003c/p>\u003cp>### 3. セルを検索条件にする\u003c/p>\u003cp>「条件を直接書く代わりに、セルを参照することもできます。」\u003c/p>\u003cp>D2に「交通費」と入力されていれば交通費を集計します。D2を「通信費」に変更すれば、数式を書き換えなくても通信費を集計できます。\u003c/p>\u003cp>「実務では、集計条件を変えながら使うことが多いので、この方法は覚えておいてください。」\u003c/p>\u003cp>### 4. SUM・SUMIF・SUMIFSの違い\u003c/p>\u003cp>| 関数 | 何をする？ |\u003cbr>|---|---|\u003cbr>| SUM | 数値をすべて合計 |\u003cbr>| SUMIF | 1つの条件で合計 |\u003cbr>| SUMIFS | 複数の条件で合計 |\u003c/p>\u003cp>「例えば『交通費だけ』ならSUMIF、『営業部の交通費だけ』ならSUMIFSです。」\u003c/p>\u003cp>## C｜イメージ理解：条件に合うものだけを集める\u003c/p>\u003cp>「先輩、SUMIFは、たくさんのレシートから交通費のレシートだけを選び出して、その金額を合計する作業と同じです。」\u003c/p>\u003cp>&lt;box border radius=\"lg\" padding={3} gap={2}&gt;\u003cbr>  &lt;svg viewBox=\"0 0 340 214\" width=\"100%\"&gt;\u003cbr>    {#each [{x:10,y:8,t:\"交通費\",v:\"1,200円\",ok:true},{x:120,y:8,t:\"消耗品費\",v:\"3,000円\",ok:false},{x:230,y:8,t:\"交通費\",v:\"800円\",ok:true},{x:10,y:79,t:\"通信費\",v:\"5,000円\",ok:false},{x:120,y:79,t:\"交通費\",v:\"1,500円\",ok:true}] as r}\u003cbr>      &lt;rect x={r.x} y={r.y} width=\"100\" height=\"58\" rx=\"7\" fill={r.ok?\"#16a34a\":\"#64748b\"} fillOpacity={r.ok?\".12\":\".08\"} stroke={r.ok?\"#16a34a\":\"#94a3b8\"} strokeOpacity={r.ok?\"1\":\".55\"}/&gt;\u003cbr>      &lt;text x={r.x+50} y={r.y+22} fontSize=\"12\" fill=\"currentColor\" textAnchor=\"middle\"&gt;{r.t}&lt;/text&gt;\u003cbr>      &lt;text x={r.x+50} y={r.y+43} fontSize=\"14\" fontWeight=\"bold\" fill=\"currentColor\" textAnchor=\"middle\"&gt;{r.v}&lt;/text&gt;\u003cbr>    {/each}\u003cbr>    &lt;path d=\"M60 140 V153 H170 V169 M170 153 V169 M280 69 V153 H170\" stroke=\"#16a34a\" strokeWidth=\"2\" fill=\"none\"/&gt;\u003cbr>    &lt;path d=\"M164 164 L170 171 L176 164\" stroke=\"#16a34a\" strokeWidth=\"2\" fill=\"none\"/&gt;\u003cbr>    &lt;rect x=\"86\" y=\"175\" width=\"168\" height=\"34\" rx=\"8\" fill=\"#16a34a\" fillOpacity=\".13\" stroke=\"#16a34a\"/&gt;\u003cbr>    &lt;text x=\"170\" y=\"197\" textAnchor=\"middle\" fill=\"#16a34a\" fontSize=\"16\" fontWeight=\"bold\"&gt;合計 3,500円&lt;/text&gt;\u003cbr>  &lt;/svg&gt;\u003cbr>  &lt;caption&gt;緑色の「交通費」だけを選んで金額を合計します。消耗品費と通信費は除外します。&lt;/caption&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>「つまり、SUMIFは『条件に合う行を選ぶ』ことと『金額を足す』ことを、一つの関数で実行しているんです。」\u003c/p>\u003cp>## D｜具体例：SUMIFを操作してみましょう\u003c/p>\u003cp>「では先輩、実際に費目を切り替えながら、SUMIFの結果がどう変わるか確認しましょう。」\u003c/p>\u003cp>{@body const expenses=[{type:\"交通費\",amount:1200},{type:\"消耗品費\",amount:3000},{type:\"交通費\",amount:800},{type:\"通信費\",amount:5000},{type:\"交通費\",amount:1500}]}\u003cbr>{@body const [condition,setCondition]=DIL.useState(\"交通費\")}\u003cbr>{@body const [min,setMin]=DIL.useState(1000)}\u003cbr>{@body const [mode,setMode]=DIL.useState(\"category\")}\u003cbr>{@body const selected=expenses.filter(e=&gt;mode===\"category\"?e.type===condition:e.amount&gt;=min)}\u003cbr>{@body const total=selected.reduce((s,e)=&gt;s+e.amount,0)}\u003cbr>{@body const formula=mode===\"category\"?'=SUMIF(A2:A6,\"'+condition+'\",B2:B6)':'=SUMIF(B2:B6,\"&gt;='+min+'\")'}\u003cbr>&lt;box border radius=\"xl\" padding={3} gap={3}&gt;\u003cbr>  &lt;row justify=\"between\" align=\"center\"&gt;\u003cbr>    **SUMIF練習シミュレーター**\u003cbr>    &lt;badge&gt;操作できます&lt;/badge&gt;\u003cbr>  &lt;/row&gt;\u003cbr>  &lt;table&gt;\u003cbr>    &lt;table-row&gt;\u003cbr>      &lt;table-cell width=\"12%\"&gt;行&lt;/table-cell&gt;\u003cbr>      &lt;table-cell&gt;A列：費目&lt;/table-cell&gt;\u003cbr>      &lt;table-cell align=\"end\"&gt;B列：金額&lt;/table-cell&gt;\u003cbr>    &lt;/table-row&gt;\u003cbr>    {#each expenses as e,i}\u003cbr>      &lt;table-row&gt;\u003cbr>        &lt;table-cell&gt;{i+2}&lt;/table-cell&gt;\u003cbr>        &lt;table-cell&gt;&lt;text weight={(mode===\"category\"?e.type===condition:e.amount&gt;=min)?\"semibold\":\"normal\"} color={(mode===\"category\"?e.type===condition:e.amount&gt;=min)?\"success\":\"default\"}&gt;{e.type}&lt;/text&gt;&lt;/table-cell&gt;\u003cbr>        &lt;table-cell align=\"end\"&gt;&lt;text tabularNums&gt;{e.amount.toLocaleString(\"ja-JP\")}円&lt;/text&gt;&lt;/table-cell&gt;\u003cbr>      &lt;/table-row&gt;\u003cbr>    {/each}\u003cbr>  &lt;/table&gt;\u003cbr>  &lt;box gap={1}&gt;\u003cbr>    &lt;label&gt;① 集計方法を選択&lt;/label&gt;\u003cbr>    &lt;radio-group direction=\"col\" value={mode} onChange={setMode}&gt;\u003cbr>      &lt;radio value=\"category\"&gt;費目を条件に集計&lt;/radio&gt;\u003cbr>      &lt;radio value=\"amount\"&gt;金額を条件に集計&lt;/radio&gt;\u003cbr>    &lt;/radio-group&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  {#if mode===\"category\"}\u003cbr>    &lt;box gap={1}&gt;\u003cbr>      &lt;label&gt;② 集計する費目&lt;/label&gt;\u003cbr>      &lt;radio-group direction=\"col\" value={condition} onChange={setCondition}&gt;\u003cbr>        &lt;radio value=\"交通費\"&gt;交通費&lt;/radio&gt;\u003cbr>        &lt;radio value=\"消耗品費\"&gt;消耗品費&lt;/radio&gt;\u003cbr>        &lt;radio value=\"通信費\"&gt;通信費&lt;/radio&gt;\u003cbr>      &lt;/radio-group&gt;\u003cbr>    &lt;/box&gt;\u003cbr>  {:else}\u003cbr>    &lt;box gap={1}&gt;\u003cbr>      &lt;row justify=\"between\" align=\"center\"&gt;\u003cbr>        &lt;label&gt;② 合計対象となる最低金額&lt;/label&gt;\u003cbr>        &lt;text weight=\"medium\" tabularNums&gt;{min.toLocaleString(\"ja-JP\")}円以上&lt;/text&gt;\u003cbr>      &lt;/row&gt;\u003cbr>      &lt;slider min={0} max={5000} step={100} value={min} onChange={setMin}/&gt;\u003cbr>      &lt;row justify=\"between\"&gt;\u003cbr>        &lt;caption&gt;0円&lt;/caption&gt;\u003cbr>        &lt;caption&gt;5,000円&lt;/caption&gt;\u003cbr>      &lt;/row&gt;\u003cbr>    &lt;/box&gt;\u003cbr>  {/if}\u003cbr>  &lt;box background=\"surface-secondary\" padding={3} radius=\"lg\" gap={2}&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"xs\"&gt;現在の数式&lt;/text&gt;\u003cbr>    &lt;row align=\"center\" justify=\"between\" wrap=\"wrap\"&gt;\u003cbr>      &lt;text weight=\"medium\" size=\"sm\"&gt;{formula}&lt;/text&gt;\u003cbr>      &lt;button color=\"secondary\" variant=\"outline\" size=\"xs\" onClick={()=&gt;GenUI.copy(formula)}&gt;&lt;icon name=\"copy\" size=\"xs\"/&gt; コピー&lt;/button&gt;\u003cbr>    &lt;/row&gt;\u003cbr>    &lt;divider color=\"subtle\"/&gt;\u003cbr>    &lt;row justify=\"between\" align=\"center\"&gt;\u003cbr>      &lt;text color=\"secondary\" size=\"sm\"&gt;条件に一致した件数&lt;/text&gt;\u003cbr>      **{selected.length}件**\u003cbr>    &lt;/row&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"xs\"&gt;SUMIFの計算結果&lt;/text&gt;\u003cbr>    &lt;title size=\"2xl\" color=\"success\" tabularNums&gt;{total.toLocaleString(\"ja-JP\")}円&lt;/title&gt;\u003cbr>    &lt;caption&gt;一致した金額：{selected.length?selected.map(e=&gt;e.amount.toLocaleString(\"ja-JP\")).join(\" + \")+\" = \"+total.toLocaleString(\"ja-JP\")+\"円\":\"一致するデータがないため、合計は0円です。\"}&lt;/caption&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;button block variant=\"outline\" color=\"secondary\" onClick={()=&gt;{setCondition(\"交通費\");setMin(1000);setMode(\"category\")}}&gt;初期値に戻す&lt;/button&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>「先輩、交通費から通信費に切り替えてみてください。SUMIFは、指定した条件に一致する金額だけを集計し直します。」\u003c/p>\u003cp>### 実務例①：部署ごとの経費集計\u003c/p>\u003cp>「例えば、経理で部署ごとの経費を集計するとします。」\u003c/p>\u003cp>A列に部署名、B列に経費が入力されている場合、\u003c/p>\u003cp>これで営業部の経費だけを合計できます。\u003c/p>\u003cp>### 実務例②：特定の取引先への支払額\u003c/p>\u003cp>A列に取引先名、C列に支払額がある場合、\u003c/p>\u003cp>「同じ取引先への支払いが複数回あっても、まとめて合計できます。」\u003c/p>\u003cp>ただし、表記が「株式会社ABC」と「(株)ABC」のように異なる場合は、同じ取引先として自動的にはまとめられません。\u003c/p>\u003cp>### 実務例③：複数条件で集計したい場合\u003c/p>\u003cp>「では先輩、『営業部の交通費だけ』を合計したい場合はどうでしょう？」\u003c/p>\u003cp>この場合、条件が2つあります。\u003c/p>\u003cp>- 部署が営業部\u003cbr>- 費目が交通費\u003c/p>\u003cp>そこでSUMIFS関数を使います。\u003c/p>\u003cp>「先輩、SUMIFとSUMIFSでは引数の順番が違います。SUMIFは『条件範囲→条件→合計範囲』、SUMIFSは『合計範囲→条件範囲→条件』です。ここは実務でも間違えやすいところですよ。」\u003c/p>\u003cp>## 理解確認：3問\u003c/p>\u003cp>{@body const questions=[{q:\"SUMIF関数は何をする関数ですか？\",opts:[\"すべての数値を合計する\",\"条件に一致する数値だけを合計する\",\"条件に一致する件数を数える\"],a:1,exp:\"SUMIFは条件付きの合計関数です。件数を数える場合はCOUNTIFを使います。\"},{q:\"=SUMIF(A2:A6,\\\"交通費\\\",B2:B6) で実際に合計されるのは？\",opts:[\"A2:A6の文字列\",\"B2:B6のすべての金額\",\"A列が交通費の行に対応するB列の金額\"],a:2,exp:\"A列で条件を判定し、一致した行のB列の数値だけを合計します。\"},{q:\"営業部かつ交通費という2つの条件で合計するには？\",opts:[\"SUMIFS\",\"SUM\",\"COUNTIF\"],a:0,exp:\"複数条件で合計する場合はSUMIFSを使います。SUMIFは基本的に1条件です。\"}]}\u003cbr>{@body const [answers,setAnswers]=DIL.useState({})}\u003cbr>&lt;box border radius=\"lg\" padding={3} gap={3}&gt;\u003cbr>  {#each questions as q,i}\u003cbr>    &lt;box key={i} gap={2}&gt;\u003cbr>      **Q{i+1}. {q.q}**\u003cbr>      &lt;radio-group direction=\"col\" value={answers[i]===undefined?\"\":String(answers[i])} onChange={v=&gt;setAnswers(p=&gt;({...p,[i]:Number(v)}))}&gt;\u003cbr>        {#each q.opts as opt,j}\u003cbr>          &lt;radio value={String(j)}&gt;{opt}&lt;/radio&gt;\u003cbr>        {/each}\u003cbr>      &lt;/radio-group&gt;\u003cbr>      {#if answers[i]!==undefined}\u003cbr>        &lt;box background=\"surface-secondary\" padding={2} radius=\"md\" gap={1}&gt;\u003cbr>          &lt;row align=\"center\" gap={2}&gt;\u003cbr>            &lt;icon name={answers[i]===q.a?\"check-circle\":\"x-circle\"} color={answers[i]===q.a?\"success\":\"danger\"}/&gt;\u003cbr>            **{answers[i]===q.a?\"正解です！\":\"不正解です\"}**\u003cbr>          &lt;/row&gt;\u003cbr>          &lt;text size=\"sm\"&gt;正解：{q.opts[q.a]}。{q.exp}&lt;/text&gt;\u003cbr>        &lt;/box&gt;\u003cbr>      {/if}\u003cbr>    &lt;/box&gt;\u003cbr>    {#if i!==2}&lt;divider color=\"subtle\"/&gt;{/if}\u003cbr>  {/each}\u003cbr>  &lt;row justify=\"between\" align=\"center\"&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"sm\"&gt;正解数：{questions.filter((q,i)=&gt;answers[i]===q.a).length} / 3&lt;/text&gt;\u003cbr>    &lt;button size=\"sm\" variant=\"outline\" color=\"secondary\" onClick={()=&gt;setAnswers({})}&gt;再挑戦&lt;/button&gt;\u003cbr>  &lt;/row&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>## 30秒復習\u003c/p>\u003cp>「先輩、最後に重要な6つを確認しましょう。」\u003c/p>\u003cp>1. **何の関数？** 条件に一致する数値だけを合計する関数。\u003cbr>2. **最重要ポイントは？** 条件を調べる範囲と、合計する範囲を区別すること。\u003cbr>3. **なぜ便利？** 大量のデータから必要な金額だけを自動集計できるから。\u003cbr>4. **処理の流れは？** 条件を指定 → 一致する行を探す → 対応する金額を合計。\u003cbr>5. **具体例は？** 経費一覧から交通費だけを合計する。\u003cbr>6. **間違えやすいところは？** SUMIFとSUMIFSの引数の順番、検索条件の指定、集計範囲のずれ。\u003c/p>\u003cp>## 一文記憶\u003c/p>\u003cp>**SUMIFは「条件に合う行だけを選んで、その行の数値を合計する」関数。**\u003c/p>\u003cp>「これで先輩は、VLOOKUP・XLOOKUP・IF・SUMIFの4つを学習しましたね。検索、条件判断、条件付き集計という3つの役割を区別できれば、Excelでの仕事の自動化にかなり役立ちますよ。」\u003c/p>","originalText":"# ④ SUMIF関数（サムイフ関数）\u003ctext color=\"secondary\" size=\"sm\">Excel関数｜条件付き集計｜SUM・IF・SUMIFSとの違い\u003c/text>## A｜要点：SUMIF関数とは？「先輩、今回はSUMIF関数ですね。ここまでVLOOKUP、XLOOKUP、IF関数を勉強してきましたけど、今回は**条件に一致するデータだけを合計する関数**です。」例えば、会社の経費一覧に交通費、消耗品費、通信費が混ざっていたとします。「この中から交通費だけを合計したいとき、先輩ならどうしますか？」「交通費の行を一つずつ探して足していく……ですか？ それでは件数が増えたときに大変ですよね。」SUMIF関数なら、条件を指定するだけで自動的に集計できます。\u003cbox border radius=\"lg\" padding={3} gap={3}>  **経費一覧の例**  | A列：費目 | B列：金額 |  |---|---:|  | \u003ctext color=\"success\" weight=\"medium\">交通費\u003c/text> | 1,200円 |  | 消耗品費 | 3,000円 |  | \u003ctext color=\"success\" weight=\"medium\">交通費\u003c/text> | 800円 |  | 通信費 | 5,000円 |  | \u003ctext color=\"success\" weight=\"medium\">交通費\u003c/text> | 1,500円 |  \u003cbox background=\"surface-secondary\" radius=\"md\" padding={3} gap={1}>    \u003ctext color=\"secondary\" size=\"xs\">条件：費目が「交通費」\u003c/text>    \u003crow justify=\"between\" align=\"center\">      \u003ctext weight=\"medium\">1,200 + 800 + 1,500\u003c/text>      \u003ctitle color=\"success\" size=\"xl\" tabularNums>3,500円\u003c/title>    \u003c/row>  \u003c/box>\u003c/box>「重要なのは、交通費以外の行は合計しないということです。」## B｜詳しい解説：SUMIFの仕組み### 1. 基本の書き方「先輩、この3つの引数を順番に理解しましょう。」| 引数 | 意味 ||---|---|| 範囲 | 条件に一致するか調べる場所 || 検索条件 | どんなデータを集計するか || 合計範囲 | 実際に足し合わせる数値の場所 |先ほどの経費一覧なら、次のようになります。\u003cbox align=\"center\" gap={1}>  \u003cbox border radius=\"md\" padding={3} width=\"100%\" align=\"center\" gap={1}>    **① 範囲：A2:A6**    \u003ctext size=\"sm\">費目が入力されているA列を調べる\u003c/text>  \u003c/box>  \u003cicon name=\"arrow-down\" color=\"tertiary\"/>  \u003cbox border radius=\"md\" padding={3} width=\"100%\" align=\"center\" gap={1}>    **② 検索条件：「交通費」**    \u003ctext size=\"sm\">A列の中から交通費に一致する行を見つける\u003c/text>  \u003c/box>  \u003cicon name=\"arrow-down\" color=\"tertiary\"/>  \u003cbox border radius=\"md\" padding={3} width=\"100%\" align=\"center\" gap={1}>    **③ 合計範囲：B2:B6**    \u003ctext size=\"sm\">一致した行に対応するB列の金額を足す\u003c/text>  \u003c/box>  \u003cicon name=\"arrow-down\" color=\"tertiary\"/>  \u003cbox background=\"rgba(22,163,74,0.08)\" border={{size:1,color:\"success\"}} radius=\"md\" padding={3} width=\"100%\" align=\"center\" gap={1}>    \u003ctext color=\"secondary\" size=\"xs\">計算結果\u003c/text>    \u003ctitle size=\"xl\" color=\"success\">3,500円\u003c/title>  \u003c/box>\u003c/box>「ここで先輩、勘違いしやすい点があります。SUMIFは、条件に一致する行の**金額を合計する**関数であって、条件に一致する件数を数える関数ではありません。」「件数を数えたいならCOUNTIF関数を使います。」### 2. 数値条件も指定できる「SUMIFは文字列だけでなく、金額などの数値を条件にすることもできます。」例えば、B2:B6のうち、1,000円以上の金額だけを合計するなら、「`\">=1000\"`は1,000以上という条件です。比較演算子を使う条件は、通常ダブルクォーテーションで囲みます。」この場合、合計範囲を省略しているので、条件を調べたB2:B6自体を合計します。### 3. セルを検索条件にする「条件を直接書く代わりに、セルを参照することもできます。」D2に「交通費」と入力されていれば交通費を集計します。D2を「通信費」に変更すれば、数式を書き換えなくても通信費を集計できます。「実務では、集計条件を変えながら使うことが多いので、この方法は覚えておいてください。」### 4. SUM・SUMIF・SUMIFSの違い| 関数 | 何をする？ ||---|---|| SUM | 数値をすべて合計 || SUMIF | 1つの条件で合計 || SUMIFS | 複数の条件で合計 |「例えば『交通費だけ』ならSUMIF、『営業部の交通費だけ』ならSUMIFSです。」## C｜イメージ理解：条件に合うものだけを集める「先輩、SUMIFは、たくさんのレシートから交通費のレシートだけを選び出して、その金額を合計する作業と同じです。」\u003cbox border radius=\"lg\" padding={3} gap={2}>  \u003csvg viewBox=\"0 0 340 214\" width=\"100%\">    {#each [{x:10,y:8,t:\"交通費\",v:\"1,200円\",ok:true},{x:120,y:8,t:\"消耗品費\",v:\"3,000円\",ok:false},{x:230,y:8,t:\"交通費\",v:\"800円\",ok:true},{x:10,y:79,t:\"通信費\",v:\"5,000円\",ok:false},{x:120,y:79,t:\"交通費\",v:\"1,500円\",ok:true}] as r}      \u003crect x={r.x} y={r.y} width=\"100\" height=\"58\" rx=\"7\" fill={r.ok?\"#16a34a\":\"#64748b\"} fillOpacity={r.ok?\".12\":\".08\"} stroke={r.ok?\"#16a34a\":\"#94a3b8\"} strokeOpacity={r.ok?\"1\":\".55\"}/>      \u003ctext x={r.x+50} y={r.y+22} fontSize=\"12\" fill=\"currentColor\" textAnchor=\"middle\">{r.t}\u003c/text>      \u003ctext x={r.x+50} y={r.y+43} fontSize=\"14\" fontWeight=\"bold\" fill=\"currentColor\" textAnchor=\"middle\">{r.v}\u003c/text>    {/each}    \u003cpath d=\"M60 140 V153 H170 V169 M170 153 V169 M280 69 V153 H170\" stroke=\"#16a34a\" strokeWidth=\"2\" fill=\"none\"/>    \u003cpath d=\"M164 164 L170 171 L176 164\" stroke=\"#16a34a\" strokeWidth=\"2\" fill=\"none\"/>    \u003crect x=\"86\" y=\"175\" width=\"168\" height=\"34\" rx=\"8\" fill=\"#16a34a\" fillOpacity=\".13\" stroke=\"#16a34a\"/>    \u003ctext x=\"170\" y=\"197\" textAnchor=\"middle\" fill=\"#16a34a\" fontSize=\"16\" fontWeight=\"bold\">合計 3,500円\u003c/text>  \u003c/svg>  \u003ccaption>緑色の「交通費」だけを選んで金額を合計します。消耗品費と通信費は除外します。\u003c/caption>\u003c/box>「つまり、SUMIFは『条件に合う行を選ぶ』ことと『金額を足す』ことを、一つの関数で実行しているんです。」## D｜具体例：SUMIFを操作してみましょう「では先輩、実際に費目を切り替えながら、SUMIFの結果がどう変わるか確認しましょう。」{@body const expenses=[{type:\"交通費\",amount:1200},{type:\"消耗品費\",amount:3000},{type:\"交通費\",amount:800},{type:\"通信費\",amount:5000},{type:\"交通費\",amount:1500}]}{@body const [condition,setCondition]=DIL.useState(\"交通費\")}{@body const [min,setMin]=DIL.useState(1000)}{@body const [mode,setMode]=DIL.useState(\"category\")}{@body const selected=expenses.filter(e=>mode===\"category\"?e.type===condition:e.amount>=min)}{@body const total=selected.reduce((s,e)=>s+e.amount,0)}{@body const formula=mode===\"category\"?'=SUMIF(A2:A6,\"'+condition+'\",B2:B6)':'=SUMIF(B2:B6,\">='+min+'\")'}\u003cbox border radius=\"xl\" padding={3} gap={3}>  \u003crow justify=\"between\" align=\"center\">    **SUMIF練習シミュレーター**    \u003cbadge>操作できます\u003c/badge>  \u003c/row>  \u003ctable>    \u003ctable-row>      \u003ctable-cell width=\"12%\">行\u003c/table-cell>      \u003ctable-cell>A列：費目\u003c/table-cell>      \u003ctable-cell align=\"end\">B列：金額\u003c/table-cell>    \u003c/table-row>    {#each expenses as e,i}      \u003ctable-row>        \u003ctable-cell>{i+2}\u003c/table-cell>        \u003ctable-cell>\u003ctext weight={(mode===\"category\"?e.type===condition:e.amount>=min)?\"semibold\":\"normal\"} color={(mode===\"category\"?e.type===condition:e.amount>=min)?\"success\":\"default\"}>{e.type}\u003c/text>\u003c/table-cell>        \u003ctable-cell align=\"end\">\u003ctext tabularNums>{e.amount.toLocaleString(\"ja-JP\")}円\u003c/text>\u003c/table-cell>      \u003c/table-row>    {/each}  \u003c/table>  \u003cbox gap={1}>    \u003clabel>① 集計方法を選択\u003c/label>    \u003cradio-group direction=\"col\" value={mode} onChange={setMode}>      \u003cradio value=\"category\">費目を条件に集計\u003c/radio>      \u003cradio value=\"amount\">金額を条件に集計\u003c/radio>    \u003c/radio-group>  \u003c/box>  {#if mode===\"category\"}    \u003cbox gap={1}>      \u003clabel>② 集計する費目\u003c/label>      \u003cradio-group direction=\"col\" value={condition} onChange={setCondition}>        \u003cradio value=\"交通費\">交通費\u003c/radio>        \u003cradio value=\"消耗品費\">消耗品費\u003c/radio>        \u003cradio value=\"通信費\">通信費\u003c/radio>      \u003c/radio-group>    \u003c/box>  {:else}    \u003cbox gap={1}>      \u003crow justify=\"between\" align=\"center\">        \u003clabel>② 合計対象となる最低金額\u003c/label>        \u003ctext weight=\"medium\" tabularNums>{min.toLocaleString(\"ja-JP\")}円以上\u003c/text>      \u003c/row>      \u003cslider min={0} max={5000} step={100} value={min} onChange={setMin}/>      \u003crow justify=\"between\">        \u003ccaption>0円\u003c/caption>        \u003ccaption>5,000円\u003c/caption>      \u003c/row>    \u003c/box>  {/if}  \u003cbox background=\"surface-secondary\" padding={3} radius=\"lg\" gap={2}>    \u003ctext color=\"secondary\" size=\"xs\">現在の数式\u003c/text>    \u003crow align=\"center\" justify=\"between\" wrap=\"wrap\">      \u003ctext weight=\"medium\" size=\"sm\">{formula}\u003c/text>      \u003cbutton color=\"secondary\" variant=\"outline\" size=\"xs\" onClick={()=>GenUI.copy(formula)}>\u003cicon name=\"copy\" size=\"xs\"/> コピー\u003c/button>    \u003c/row>    \u003cdivider color=\"subtle\"/>    \u003crow justify=\"between\" align=\"center\">      \u003ctext color=\"secondary\" size=\"sm\">条件に一致した件数\u003c/text>      **{selected.length}件**    \u003c/row>    \u003ctext color=\"secondary\" size=\"xs\">SUMIFの計算結果\u003c/text>    \u003ctitle size=\"2xl\" color=\"success\" tabularNums>{total.toLocaleString(\"ja-JP\")}円\u003c/title>    \u003ccaption>一致した金額：{selected.length?selected.map(e=>e.amount.toLocaleString(\"ja-JP\")).join(\" + \")+\" = \"+total.toLocaleString(\"ja-JP\")+\"円\":\"一致するデータがないため、合計は0円です。\"}\u003c/caption>  \u003c/box>  \u003cbutton block variant=\"outline\" color=\"secondary\" onClick={()=>{setCondition(\"交通費\");setMin(1000);setMode(\"category\")}}>初期値に戻す\u003c/button>\u003c/box>「先輩、交通費から通信費に切り替えてみてください。SUMIFは、指定した条件に一致する金額だけを集計し直します。」### 実務例①：部署ごとの経費集計「例えば、経理で部署ごとの経費を集計するとします。」A列に部署名、B列に経費が入力されている場合、これで営業部の経費だけを合計できます。### 実務例②：特定の取引先への支払額A列に取引先名、C列に支払額がある場合、「同じ取引先への支払いが複数回あっても、まとめて合計できます。」ただし、表記が「株式会社ABC」と「(株)ABC」のように異なる場合は、同じ取引先として自動的にはまとめられません。### 実務例③：複数条件で集計したい場合「では先輩、『営業部の交通費だけ』を合計したい場合はどうでしょう？」この場合、条件が2つあります。- 部署が営業部- 費目が交通費そこでSUMIFS関数を使います。「先輩、SUMIFとSUMIFSでは引数の順番が違います。SUMIFは『条件範囲→条件→合計範囲』、SUMIFSは『合計範囲→条件範囲→条件』です。ここは実務でも間違えやすいところですよ。」## 理解確認：3問{@body const questions=[{q:\"SUMIF関数は何をする関数ですか？\",opts:[\"すべての数値を合計する\",\"条件に一致する数値だけを合計する\",\"条件に一致する件数を数える\"],a:1,exp:\"SUMIFは条件付きの合計関数です。件数を数える場合はCOUNTIFを使います。\"},{q:\"=SUMIF(A2:A6,\\\"交通費\\\",B2:B6) で実際に合計されるのは？\",opts:[\"A2:A6の文字列\",\"B2:B6のすべての金額\",\"A列が交通費の行に対応するB列の金額\"],a:2,exp:\"A列で条件を判定し、一致した行のB列の数値だけを合計します。\"},{q:\"営業部かつ交通費という2つの条件で合計するには？\",opts:[\"SUMIFS\",\"SUM\",\"COUNTIF\"],a:0,exp:\"複数条件で合計する場合はSUMIFSを使います。SUMIFは基本的に1条件です。\"}]}{@body const [answers,setAnswers]=DIL.useState({})}\u003cbox border radius=\"lg\" padding={3} gap={3}>  {#each questions as q,i}    \u003cbox key={i} gap={2}>      **Q{i+1}. {q.q}**      \u003cradio-group direction=\"col\" value={answers[i]===undefined?\"\":String(answers[i])} onChange={v=>setAnswers(p=>({...p,[i]:Number(v)}))}>        {#each q.opts as opt,j}          \u003cradio value={String(j)}>{opt}\u003c/radio>        {/each}      \u003c/radio-group>      {#if answers[i]!==undefined}        \u003cbox background=\"surface-secondary\" padding={2} radius=\"md\" gap={1}>          \u003crow align=\"center\" gap={2}>            \u003cicon name={answers[i]===q.a?\"check-circle\":\"x-circle\"} color={answers[i]===q.a?\"success\":\"danger\"}/>            **{answers[i]===q.a?\"正解です！\":\"不正解です\"}**          \u003c/row>          \u003ctext size=\"sm\">正解：{q.opts[q.a]}。{q.exp}\u003c/text>        \u003c/box>      {/if}    \u003c/box>    {#if i!==2}\u003cdivider color=\"subtle\"/>{/if}  {/each}  \u003crow justify=\"between\" align=\"center\">    \u003ctext color=\"secondary\" size=\"sm\">正解数：{questions.filter((q,i)=>answers[i]===q.a).length} / 3\u003c/text>    \u003cbutton size=\"sm\" variant=\"outline\" color=\"secondary\" onClick={()=>setAnswers({})}>再挑戦\u003c/button>  \u003c/row>\u003c/box>## 30秒復習「先輩、最後に重要な6つを確認しましょう。」1. **何の関数？** 条件に一致する数値だけを合計する関数。2. **最重要ポイントは？** 条件を調べる範囲と、合計する範囲を区別すること。3. **なぜ便利？** 大量のデータから必要な金額だけを自動集計できるから。4. **処理の流れは？** 条件を指定 → 一致する行を探す → 対応する金額を合計。5. **具体例は？** 経費一覧から交通費だけを合計する。6. **間違えやすいところは？** SUMIFとSUMIFSの引数の順番、検索条件の指定、集計範囲のずれ。## 一文記憶**SUMIFは「条件に合う行だけを選んで、その行の数値を合計する」関数。**「これで先輩は、VLOOKUP・XLOOKUP・IF・SUMIFの4つを学習しましたね。検索、条件判断、条件付き集計という3つの役割を区別できれば、Excelでの仕事の自動化にかなり役立ちますよ。」","sections":{"A":"\u003ch1>④ SUMIF関数（サムイフ関数）\u003c/h1>\n\u003cp class=\"muted\">Excel関数｜条件付き集計｜SUM・IF・SUMIFSとの違い\u003c/p>\u003ch2>A｜要点：SUMIF関数とは？\u003c/h2>\u003cp>「先輩、今回はSUMIF関数ですね。ここまでVLOOKUP、XLOOKUP、IF関数を勉強してきましたけど、今回は\u003cstrong>条件に一致するデータだけを合計する関数\u003c/strong>です。」\u003c/p>\n\u003cp>例えば、会社の経費一覧に交通費、消耗品費、通信費が混ざっていたとします。\u003c/p>\n\u003cp>「この中から交通費だけを合計したいとき、先輩ならどうしますか？」\u003c/p>\n\u003cp>「交通費の行を一つずつ探して足していく……ですか？ それでは件数が増えたときに大変ですよね。」\u003c/p>\n\u003cp>SUMIF関数なら、条件を指定するだけで自動的に集計できます。\u003c/p>\n\u003cdiv class=\"source-static\">\u003cdiv>\n  \u003cstrong>経費一覧の例\u003c/strong>\n| A列：費目 | B列：金額 |\n  |---|---:|\n  | \u003cspan>交通費\u003c/span> | 1,200円 |\n  | 消耗品費 | 3,000円 |\n  | \u003cspan>交通費\u003c/span> | 800円 |\n  | 通信費 | 5,000円 |\n  | \u003cspan>交通費\u003c/span> | 1,500円 |\n\u003cdiv>\n    \u003cspan>条件：費目が「交通費」\u003c/span>\n    \u003cdiv>\n      \u003cspan>1,200 + 800 + 1,500\u003c/span>\n      \u003cstrong>3,500円\u003c/strong>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003c/div>\u003cp>「重要なのは、交通費以外の行は合計しないということです。」\u003c/p>\n","B":"\u003ch2>B｜詳しい解説：SUMIFの仕組み\u003c/h2>\u003ch3>1. 基本の書き方\u003c/h3>\n\u003cp>「先輩、この3つの引数を順番に理解しましょう。」\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>引数\u003c/th>\n\u003cth>意味\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>範囲\u003c/td>\n\u003ctd>条件に一致するか調べる場所\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>検索条件\u003c/td>\n\u003ctd>どんなデータを集計するか\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>合計範囲\u003c/td>\n\u003ctd>実際に足し合わせる数値の場所\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>先ほどの経費一覧なら、次のようになります。\u003c/p>\n\u003cdiv class=\"source-static\">\u003cdiv>\n  \u003cdiv>\n    \u003cstrong>① 範囲：A2:A6\u003c/strong>\n\u003cspan>費目が入力されているA列を調べる\u003c/span>\n  \u003c/div>\n   → \n  \u003cdiv>\n    \u003cstrong>② 検索条件：「交通費」\u003c/strong>\n\u003cspan>A列の中から交通費に一致する行を見つける\u003c/span>\n  \u003c/div>\n   → \n  \u003cdiv>\n    \u003cstrong>③ 合計範囲：B2:B6\u003c/strong>\n\u003cspan>一致した行に対応するB列の金額を足す\u003c/span>\n  \u003c/div>\n   → \n  \u003cdiv>\n    \u003cspan>計算結果\u003c/span>\n    \u003cstrong>3,500円\u003c/strong>\n  \u003c/div>\n\u003c/div>\n\u003c/div>\u003cp>「ここで先輩、勘違いしやすい点があります。SUMIFは、条件に一致する行の\u003cstrong>金額を合計する\u003c/strong>関数であって、条件に一致する件数を数える関数ではありません。」\u003c/p>\n\u003cp>「件数を数えたいならCOUNTIF関数を使います。」\u003c/p>\n\u003ch3>2. 数値条件も指定できる\u003c/h3>\n\u003cp>「SUMIFは文字列だけでなく、金額などの数値を条件にすることもできます。」\u003c/p>\n\u003cp>例えば、B2:B6のうち、1,000円以上の金額だけを合計するなら、\u003c/p>\n\u003cp>「\u003ccode>&quot;&gt;=1000&quot;\u003c/code>は1,000以上という条件です。比較演算子を使う条件は、通常ダブルクォーテーションで囲みます。」\u003c/p>\n\u003cp>この場合、合計範囲を省略しているので、条件を調べたB2:B6自体を合計します。\u003c/p>\n\u003ch3>3. セルを検索条件にする\u003c/h3>\n\u003cp>「条件を直接書く代わりに、セルを参照することもできます。」\u003c/p>\n\u003cp>D2に「交通費」と入力されていれば交通費を集計します。D2を「通信費」に変更すれば、数式を書き換えなくても通信費を集計できます。\u003c/p>\n\u003cp>「実務では、集計条件を変えながら使うことが多いので、この方法は覚えておいてください。」\u003c/p>\n\u003ch3>4. SUM・SUMIF・SUMIFSの違い\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>関数\u003c/th>\n\u003cth>何をする？\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>SUM\u003c/td>\n\u003ctd>数値をすべて合計\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SUMIF\u003c/td>\n\u003ctd>1つの条件で合計\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SUMIFS\u003c/td>\n\u003ctd>複数の条件で合計\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>「例えば『交通費だけ』ならSUMIF、『営業部の交通費だけ』ならSUMIFSです。」\u003c/p>\n","C":"\u003ch2>C｜イメージ理解：条件に合うものだけを集める\u003c/h2>\u003cp>「先輩、SUMIFは、たくさんのレシートから交通費のレシートだけを選び出して、その金額を合計する作業と同じです。」\u003c/p>\n\u003cp>「つまり、SUMIFは『条件に合う行を選ぶ』ことと『金額を足す』ことを、一つの関数で実行しているんです。」\u003c/p>\n","D":"\u003ch2>D｜具体例：SUMIFを操作してみましょう\u003c/h2>\u003cp>「では先輩、実際に費目を切り替えながら、SUMIFの結果がどう変わるか確認しましょう。」\u003c/p>\n\u003cp>「先輩、交通費から通信費に切り替えてみてください。SUMIFは、指定した条件に一致する金額だけを集計し直します。」\u003c/p>\n\u003ch3>実務例①：部署ごとの経費集計\u003c/h3>\n\u003cp>「例えば、経理で部署ごとの経費を集計するとします。」\u003c/p>\n\u003cp>A列に部署名、B列に経費が入力されている場合、\u003c/p>\n\u003cp>これで営業部の経費だけを合計できます。\u003c/p>\n\u003ch3>実務例②：特定の取引先への支払額\u003c/h3>\n\u003cp>A列に取引先名、C列に支払額がある場合、\u003c/p>\n\u003cp>「同じ取引先への支払いが複数回あっても、まとめて合計できます。」\u003c/p>\n\u003cp>ただし、表記が「株式会社ABC」と「(株)ABC」のように異なる場合は、同じ取引先として自動的にはまとめられません。\u003c/p>\n\u003ch3>実務例③：複数条件で集計したい場合\u003c/h3>\n\u003cp>「では先輩、『営業部の交通費だけ』を合計したい場合はどうでしょう？」\u003c/p>\n\u003cp>この場合、条件が2つあります。\u003c/p>\n\u003cul>\n\u003cli>部署が営業部\u003c/li>\n\u003cli>費目が交通費\u003c/li>\n\u003c/ul>\n\u003cp>そこでSUMIFS関数を使います。\u003c/p>\n\u003cp>「先輩、SUMIFとSUMIFSでは引数の順番が違います。SUMIFは『条件範囲→条件→合計範囲』、SUMIFSは『合計範囲→条件範囲→条件』です。ここは実務でも間違えやすいところですよ。」\u003c/p>\n","その他":"\u003ch2>理解確認：3問\u003c/h2>\u003ch2>30秒復習\u003c/h2>\u003cp>「先輩、最後に重要な6つを確認しましょう。」\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>何の関数？\u003c/strong> 条件に一致する数値だけを合計する関数。\u003c/li>\n\u003cli>\u003cstrong>最重要ポイントは？\u003c/strong> 条件を調べる範囲と、合計する範囲を区別すること。\u003c/li>\n\u003cli>\u003cstrong>なぜ便利？\u003c/strong> 大量のデータから必要な金額だけを自動集計できるから。\u003c/li>\n\u003cli>\u003cstrong>処理の流れは？\u003c/strong> 条件を指定 → 一致する行を探す → 対応する金額を合計。\u003c/li>\n\u003cli>\u003cstrong>具体例は？\u003c/strong> 経費一覧から交通費だけを合計する。\u003c/li>\n\u003cli>\u003cstrong>間違えやすいところは？\u003c/strong> SUMIFとSUMIFSの引数の順番、検索条件の指定、集計範囲のずれ。\u003c/li>\n\u003c/ol>\n\u003ch2>一文記憶\u003c/h2>\u003cp>\u003cstrong>SUMIFは「条件に合う行だけを選んで、その行の数値を合計する」関数。\u003c/strong>\u003c/p>\n\u003cp>「これで先輩は、VLOOKUP・XLOOKUP・IF・SUMIFの4つを学習しましたね。検索、条件判断、条件付き集計という3つの役割を区別できれば、Excelでの仕事の自動化にかなり役立ちますよ。」\u003c/p>\n"},"prose":["# ④ SUMIF関数（サムイフ関数）","Excel関数｜条件付き集計｜SUM・IF・SUMIFSとの違い","## A｜要点：SUMIF関数とは？","「先輩、今回はSUMIF関数ですね。ここまでVLOOKUP、XLOOKUP、IF関数を勉強してきましたけど、今回は**条件に一致するデータだけを合計する関数**です。」","例えば、会社の経費一覧に交通費、消耗品費、通信費が混ざっていたとします。","「この中から交通費だけを合計したいとき、先輩ならどうしますか？」","「交通費の行を一つずつ探して足していく……ですか？ それでは件数が増えたときに大変ですよね。」","SUMIF関数なら、条件を指定するだけで自動的に集計できます。","「重要なのは、交通費以外の行は合計しないということです。」","## B｜詳しい解説：SUMIFの仕組み","### 1. 基本の書き方","「先輩、この3つの引数を順番に理解しましょう。」","| 引数 | 意味 |\n|---|---|\n| 範囲 | 条件に一致するか調べる場所 |\n| 検索条件 | どんなデータを集計するか |\n| 合計範囲 | 実際に足し合わせる数値の場所 |","先ほどの経費一覧なら、次のようになります。","「ここで先輩、勘違いしやすい点があります。SUMIFは、条件に一致する行の**金額を合計する**関数であって、条件に一致する件数を数える関数ではありません。」","「件数を数えたいならCOUNTIF関数を使います。」","### 2. 数値条件も指定できる","「SUMIFは文字列だけでなく、金額などの数値を条件にすることもできます。」","例えば、B2:B6のうち、1,000円以上の金額だけを合計するなら、","「`\">=1000\"`は1,000以上という条件です。比較演算子を使う条件は、通常ダブルクォーテーションで囲みます。」","この場合、合計範囲を省略しているので、条件を調べたB2:B6自体を合計します。","### 3. セルを検索条件にする","「条件を直接書く代わりに、セルを参照することもできます。」","D2に「交通費」と入力されていれば交通費を集計します。D2を「通信費」に変更すれば、数式を書き換えなくても通信費を集計できます。","「実務では、集計条件を変えながら使うことが多いので、この方法は覚えておいてください。」","### 4. SUM・SUMIF・SUMIFSの違い","| 関数 | 何をする？ |\n|---|---|\n| SUM | 数値をすべて合計 |\n| SUMIF | 1つの条件で合計 |\n| SUMIFS | 複数の条件で合計 |","「例えば『交通費だけ』ならSUMIF、『営業部の交通費だけ』ならSUMIFSです。」","## C｜イメージ理解：条件に合うものだけを集める","「先輩、SUMIFは、たくさんのレシートから交通費のレシートだけを選び出して、その金額を合計する作業と同じです。」","「つまり、SUMIFは『条件に合う行を選ぶ』ことと『金額を足す』ことを、一つの関数で実行しているんです。」","## D｜具体例：SUMIFを操作してみましょう","「では先輩、実際に費目を切り替えながら、SUMIFの結果がどう変わるか確認しましょう。」","「先輩、交通費から通信費に切り替えてみてください。SUMIFは、指定した条件に一致する金額だけを集計し直します。」","### 実務例①：部署ごとの経費集計","「例えば、経理で部署ごとの経費を集計するとします。」","A列に部署名、B列に経費が入力されている場合、","これで営業部の経費だけを合計できます。","### 実務例②：特定の取引先への支払額","A列に取引先名、C列に支払額がある場合、","「同じ取引先への支払いが複数回あっても、まとめて合計できます。」","ただし、表記が「株式会社ABC」と「(株)ABC」のように異なる場合は、同じ取引先として自動的にはまとめられません。","### 実務例③：複数条件で集計したい場合","「では先輩、『営業部の交通費だけ』を合計したい場合はどうでしょう？」","この場合、条件が2つあります。","- 部署が営業部\n- 費目が交通費","そこでSUMIFS関数を使います。","「先輩、SUMIFとSUMIFSでは引数の順番が違います。SUMIFは『条件範囲→条件→合計範囲』、SUMIFSは『合計範囲→条件範囲→条件』です。ここは実務でも間違えやすいところですよ。」","## 理解確認：3問","## 30秒復習","「先輩、最後に重要な6つを確認しましょう。」","1. **何の関数？** 条件に一致する数値だけを合計する関数。\n2. **最重要ポイントは？** 条件を調べる範囲と、合計する範囲を区別すること。\n3. **なぜ便利？** 大量のデータから必要な金額だけを自動集計できるから。\n4. **処理の流れは？** 条件を指定 → 一致する行を探す → 対応する金額を合計。\n5. **具体例は？** 経費一覧から交通費だけを合計する。\n6. **間違えやすいところは？** SUMIFとSUMIFSの引数の順番、検索条件の指定、集計範囲のずれ。","## 一文記憶","**SUMIFは「条件に合う行だけを選んで、その行の数値を合計する」関数。**","「これで先輩は、VLOOKUP・XLOOKUP・IF・SUMIFの4つを学習しましたね。検索、条件判断、条件付き集計という3つの役割を区別できれば、Excelでの仕事の自動化にかなり役立ちますよ。」"],"quizzes":[{"q":"SUMIF関数は何をする関数ですか？","options":["すべての数値を合計する","条件に一致する数値だけを合計する","条件に一致する件数を数える"],"correct":1,"explain":"SUMIFは条件付きの合計関数です。件数を数える場合はCOUNTIFを使います。"},{"q":"=SUMIF(A2:A6,\"交通費\",B2:B6) で実際に合計されるのは？","options":["A2:A6の文字列","B2:B6のすべての金額","A列が交通費の行に対応するB列の金額"],"correct":2,"explain":"A列で条件を判定し、一致した行のB列の数値だけを合計します。"},{"q":"営業部かつ交通費という2つの条件で合計するには？","options":["SUMIFS","SUM","COUNTIF"],"correct":0,"explain":"複数条件で合計する場合はSUMIFSを使います。SUMIFは基本的に1条件です。"}]},{"name":"IFERROR","original":"\u003cp># ⑤ IFERROR関数（イフエラー関数）\u003c/p>\u003cp>&lt;text color=\"secondary\" size=\"sm\"&gt;Excel関数｜エラー処理｜VLOOKUP・XLOOKUPとの組み合わせ&lt;/text&gt;\u003c/p>\u003cp>## A｜要点：IFERROR関数とは？\u003c/p>\u003cp>「先輩、今回はIFERROR関数ですね。これまで勉強したVLOOKUPやIF関数と組み合わせると、とても便利な関数なんですよ。」\u003c/p>\u003cp>「例えば、Excelで計算したときに、こんな表示を見たことはありませんか？」\u003c/p>\u003cp>&lt;box border radius=\"lg\" padding={3} gap={2}&gt;\u003cbr>  &lt;grid columns={2} gap={2}&gt;\u003cbr>    &lt;grid-item&gt;\u003cbr>      &lt;box background=\"rgba(220,38,38,0.06)\" border={{size:1,color:\"danger\"}} radius=\"md\" padding={3} align=\"center\" gap={1}&gt;\u003cbr>        &lt;text color=\"secondary\" size=\"xs\"&gt;通常の計算&lt;/text&gt;\u003cbr>        &lt;title color=\"danger\" size=\"xl\"&gt;#DIV/0!&lt;/title&gt;\u003cbr>        &lt;caption&gt;0で割ったエラー&lt;/caption&gt;\u003cbr>      &lt;/box&gt;\u003cbr>    &lt;/grid-item&gt;\u003cbr>    &lt;grid-item&gt;\u003cbr>      &lt;box background=\"rgba(22,163,74,0.07)\" border={{size:1,color:\"success\"}} radius=\"md\" padding={3} align=\"center\" gap={1}&gt;\u003cbr>        &lt;text color=\"secondary\" size=\"xs\"&gt;IFERRORを使用&lt;/text&gt;\u003cbr>        &lt;title color=\"success\" size=\"xl\"&gt;計算不可&lt;/title&gt;\u003cbr>        &lt;caption&gt;指定した文字に変更&lt;/caption&gt;\u003cbr>      &lt;/box&gt;\u003cbr>    &lt;/grid-item&gt;\u003cbr>  &lt;/grid&gt;\u003cbr>  &lt;text color=\"secondary\" size=\"sm\"&gt;数式がエラーになった場合に、別の値を表示できます。&lt;/text&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>「**IFERROR関数とは、数式の結果がエラーになった場合に、指定した別の値を返す関数**です。」\u003c/p>\u003cp>例えば、次のように書きます。\u003c/p>\u003cp>「A2÷B2が正常に計算できれば、その計算結果を表示します。でも、0で割るなどしてエラーになった場合は、『計算不可』と表示するんです。」\u003c/p>\u003cp>ここで覚えてほしいのは、**IFERRORはエラーの原因を修正する関数ではなく、エラーが発生したときの表示結果を切り替える関数**だということです。\u003c/p>\u003cp>## B｜詳しい解説：なぜそうなるのか？\u003c/p>\u003cp>### 1. 基本の書き方\u003c/p>\u003cp>「先輩、引数はたった2つです。」\u003c/p>\u003cp>| 引数 | 意味 |\u003cbr>|---|---|\u003cbr>| 値 | 計算・評価したい数式や値 |\u003cbr>| エラーの場合の値 | エラーだったときに返す値 |\u003c/p>\u003cp>例えば、\u003c/p>\u003cp>100÷0は計算できないので、「エラー」と表示します。\u003c/p>\u003cp>一方、\u003c/p>\u003cp>こちらは正常に計算できるので、20が表示されます。\u003c/p>\u003cp>「つまり、IFERRORはすべての計算結果を置き換えるわけではありません。**エラーが発生したときだけ、別の結果に切り替える**んです。」\u003c/p>\u003cp>### 2. IFERRORの処理の流れ\u003c/p>\u003cp>&lt;box align=\"center\" gap={1}&gt;\u003cbr>  &lt;box border radius=\"md\" padding={3} width=\"100%\" align=\"center\" gap={1}&gt;\u003cbr>    **① 数式を計算する**\u003c/p>\u003cp>    &lt;text size=\"sm\"&gt;例えば A2÷B2&lt;/text&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;icon name=\"arrow-down\" color=\"tertiary\"/&gt;\u003cbr>  &lt;box border radius=\"md\" padding={3} width=\"100%\" align=\"center\" gap={1}&gt;\u003cbr>    **② エラーが発生したか判断する**\u003c/p>\u003cp>    &lt;text size=\"sm\"&gt;計算結果が正常か、Excelのエラー値かを確認&lt;/text&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;svg viewBox=\"0 0 320 108\" width=\"100%\"&gt;\u003cbr>    &lt;path d=\"M160 0 V16 H80 V37 M160 16 H240 V37\" stroke=\"currentColor\" strokeOpacity=\".5\" strokeWidth=\"1.8\" fill=\"none\"/&gt;\u003cbr>    &lt;path d=\"M75 31 L80 38 L85 31 M235 31 L240 38 L245 31\" stroke=\"currentColor\" strokeOpacity=\".5\" strokeWidth=\"1.8\" fill=\"none\"/&gt;\u003cbr>    &lt;rect x=\"7\" y=\"40\" width=\"146\" height=\"62\" rx=\"9\" fill=\"#16a34a\" fillOpacity=\".09\" stroke=\"#16a34a\"/&gt;\u003cbr>    &lt;rect x=\"167\" y=\"40\" width=\"146\" height=\"62\" rx=\"9\" fill=\"#dc2626\" fillOpacity=\".07\" stroke=\"#dc2626\"/&gt;\u003cbr>    &lt;g fill=\"currentColor\" textAnchor=\"middle\" fontSize=\"12\"&gt;\u003cbr>      &lt;text x=\"80\" y=\"59\"&gt;エラーなし&lt;/text&gt;\u003cbr>      &lt;text x=\"240\" y=\"59\"&gt;エラーあり&lt;/text&gt;\u003cbr>    &lt;/g&gt;\u003cbr>    &lt;text x=\"80\" y=\"84\" fill=\"#16a34a\" textAnchor=\"middle\" fontWeight=\"bold\" fontSize=\"15\"&gt;計算結果を返す&lt;/text&gt;\u003cbr>    &lt;text x=\"240\" y=\"84\" fill=\"#dc2626\" textAnchor=\"middle\" fontWeight=\"bold\" fontSize=\"15\"&gt;代替値を返す&lt;/text&gt;\u003cbr>  &lt;/svg&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>### 3. IFERRORで対応できる主なエラー\u003c/p>\u003cp>「Excelのエラーにはいくつか種類があります。原因まで理解しておくと、仕事で困りませんよ。」\u003c/p>\u003cp>| エラー | 意味・主な原因 |\u003cbr>|---|---|\u003cbr>| `#DIV/0!` | 0で割っている |\u003cbr>| `#N/A` | 検索値が見つからない |\u003cbr>| `#VALUE!` | 計算に使う値の種類が不適切 |\u003cbr>| `#REF!` | 参照先が無効 |\u003cbr>| `#NAME?` | 関数名などを認識できない |\u003cbr>| `#NUM!` | 数値計算に問題がある |\u003cbr>| `#NULL!` | 範囲の指定・交差に問題がある |\u003cbr>| `#SPILL!` | 配列結果を展開できない |\u003cbr>| `#CALC!` | 配列などの計算が成立しない |\u003c/p>\u003cp>「IFERRORは、これらのエラーをまとめて処理できます。ただし、エラーの種類によっては、隠さず原因を調べた方がいい場合もあります。」\u003c/p>\u003cp>### 4. IF関数との違い\u003c/p>\u003cp>「先輩、ここは以前勉強したIF関数と比較しましょう。」\u003c/p>\u003cp>| 関数 | 判断すること |\u003cbr>|---|---|\u003cbr>| IF | 指定した条件が成立するか |\u003cbr>| IFERROR | 計算結果がエラーか |\u003c/p>\u003cp>例えば、\u003c/p>\u003cp>これは80点以上かどうかを判断します。\u003c/p>\u003cp>一方、\u003c/p>\u003cp>これは計算がエラーになった場合に0を返します。\u003c/p>\u003cp>「IFは条件分岐、IFERRORはエラー処理。この役割の違いを覚えてくださいね。」\u003c/p>\u003cp>## C｜イメージ理解：失敗したときの予備ルート\u003c/p>\u003cp>「先輩、IFERRORは、目的地へ向かうときの予備ルートだと思ってください。」\u003c/p>\u003cp>通常のルートが使えるなら、そのまま進みます。でも、通行止めになっていたら、あらかじめ決めておいた別のルートへ進むんです。\u003c/p>\u003cp>&lt;box border radius=\"lg\" padding={3} gap={2}&gt;\u003cbr>  &lt;svg viewBox=\"0 0 340 206\" width=\"100%\"&gt;\u003cbr>    &lt;rect x=\"95\" y=\"7\" width=\"150\" height=\"43\" rx=\"9\" fill=\"#64748b\" fillOpacity=\".12\" stroke=\"#94a3b8\"/&gt;\u003cbr>    &lt;text x=\"170\" y=\"25\" fontSize=\"13\" textAnchor=\"middle\" fill=\"currentColor\"&gt;数式を実行&lt;/text&gt;\u003cbr>    &lt;text x=\"170\" y=\"41\" fontSize=\"12\" textAnchor=\"middle\" fill=\"currentColor\"&gt;A2 ÷ B2&lt;/text&gt;\u003cbr>    &lt;path d=\"M170 50 V69 M170 69 H83 V92 M170 69 H257 V92\" stroke=\"currentColor\" strokeOpacity=\".55\" strokeWidth=\"2\" fill=\"none\"/&gt;\u003cbr>    &lt;rect x=\"5\" y=\"94\" width=\"156\" height=\"66\" rx=\"9\" fill=\"#16a34a\" fillOpacity=\".09\" stroke=\"#16a34a\"/&gt;\u003cbr>    &lt;rect x=\"179\" y=\"94\" width=\"156\" height=\"66\" rx=\"9\" fill=\"#dc2626\" fillOpacity=\".07\" stroke=\"#dc2626\"/&gt;\u003cbr>    &lt;g fill=\"currentColor\" textAnchor=\"middle\" fontSize=\"12\"&gt;\u003cbr>      &lt;text x=\"83\" y=\"114\"&gt;通常ルート&lt;/text&gt;\u003cbr>      &lt;text x=\"257\" y=\"114\"&gt;予備ルート&lt;/text&gt;\u003cbr>      &lt;text x=\"83\" y=\"132\"&gt;正常に計算できた&lt;/text&gt;\u003cbr>      &lt;text x=\"257\" y=\"132\"&gt;エラーが発生した&lt;/text&gt;\u003cbr>    &lt;/g&gt;\u003cbr>    &lt;text x=\"83\" y=\"150\" textAnchor=\"middle\" fill=\"#16a34a\" fontSize=\"15\" fontWeight=\"bold\"&gt;計算結果&lt;/text&gt;\u003cbr>    &lt;text x=\"257\" y=\"150\" textAnchor=\"middle\" fill=\"#dc2626\" fontSize=\"15\" fontWeight=\"bold\"&gt;「計算不可」&lt;/text&gt;\u003cbr>    &lt;text x=\"170\" y=\"192\" textAnchor=\"middle\" fontSize=\"12\" fill=\"currentColor\"&gt;どちらかの結果をセルに表示&lt;/text&gt;\u003cbr>  &lt;/svg&gt;\u003cbr>  &lt;caption&gt;通常の計算が成功すればその結果を使い、エラーなら指定した代替値を返す仕組みです。&lt;/caption&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>「ただし、先輩。予備ルートへ進めたからといって、元の道路の通行止めが解消されたわけではありませんよね？」\u003c/p>\u003cp>「IFERRORも同じです。**エラーを表示しなくするだけで、元の数式やデータの問題が解決したとは限らない**んです。」\u003c/p>\u003cp>## D｜具体例：実際に操作してみましょう\u003c/p>\u003cp>「では、実際に分母を変えて、IFERRORの動きを確かめましょう。」\u003c/p>\u003cp>{@body const [numerator,setNumerator]=DIL.useState(100)}\u003cbr>{@body const [denominator,setDenominator]=DIL.useState(5)}\u003cbr>{@body const [fallback,setFallback]=DIL.useState(\"計算不可\")}\u003cbr>{@body const error=denominator===0}\u003cbr>{@body const result=error?fallback:String(Number((numerator/denominator).toFixed(6)))}\u003cbr>{@body const fmla='=IFERROR(A2/B2,\"'+fallback.replaceAll('\"','\"\"')+'\")'}\u003cbr>&lt;box border radius=\"xl\" padding={3} gap={3}&gt;\u003cbr>  &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>    **IFERROR練習シミュレーター**\u003cbr>    &lt;badge&gt;操作できます&lt;/badge&gt;\u003cbr>  &lt;/row&gt;\u003cbr>  &lt;box gap={1}&gt;\u003cbr>    &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>      &lt;label&gt;① 分子（A2）&lt;/label&gt;\u003cbr>      &lt;title size=\"lg\" tabularNums&gt;{numerator}&lt;/title&gt;\u003cbr>    &lt;/row&gt;\u003cbr>    &lt;slider min={0} max={200} step={10} value={numerator} onChange={setNumerator}/&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;box gap={1}&gt;\u003cbr>    &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>      &lt;label&gt;② 分母（B2）&lt;/label&gt;\u003cbr>      &lt;title size=\"lg\" tabularNums&gt;{denominator}&lt;/title&gt;\u003cbr>    &lt;/row&gt;\u003cbr>    &lt;slider min={0} max={20} step={1} value={denominator} onChange={setDenominator}/&gt;\u003cbr>    &lt;caption&gt;分母を0にすると、通常の割り算ではエラーが発生します。&lt;/caption&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;box gap={1}&gt;\u003cbr>    &lt;label&gt;③ エラーの場合に表示する文字&lt;/label&gt;\u003cbr>    &lt;radio-group direction=\"col\" value={fallback} onChange={setFallback}&gt;\u003cbr>      &lt;radio value=\"計算不可\"&gt;計算不可&lt;/radio&gt;\u003cbr>      &lt;radio value=\"未入力\"&gt;未入力&lt;/radio&gt;\u003cbr>      &lt;radio value=\"\"&gt;空白にする&lt;/radio&gt;\u003cbr>    &lt;/radio-group&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;box background=\"surface-secondary\" radius=\"lg\" padding={3} gap={2}&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"xs\"&gt;現在の数式&lt;/text&gt;\u003cbr>    &lt;row align=\"center\" justify=\"between\" wrap=\"wrap\"&gt;\u003cbr>      &lt;text weight=\"medium\" size=\"sm\"&gt;{fmla}&lt;/text&gt;\u003cbr>      &lt;button size=\"xs\" color=\"secondary\" variant=\"outline\" onClick={()=&gt;GenUI.copy(fmla)}&gt;&lt;icon name=\"copy\" size=\"xs\"/&gt; コピー&lt;/button&gt;\u003cbr>    &lt;/row&gt;\u003cbr>    &lt;divider color=\"subtle\"/&gt;\u003cbr>    &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>      &lt;text color=\"secondary\" size=\"sm\"&gt;通常の計算結果&lt;/text&gt;\u003cbr>      &lt;text weight=\"medium\" color={error?\"danger\":\"default\"}&gt;{error?\"#DIV/0!\":result}&lt;/text&gt;\u003cbr>    &lt;/row&gt;\u003cbr>    &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>      &lt;text color=\"secondary\" size=\"sm\"&gt;エラー判定&lt;/text&gt;\u003cbr>      &lt;badge color={error?\"danger\":\"success\"}&gt;{error?\"エラーあり\":\"エラーなし\"}&lt;/badge&gt;\u003cbr>    &lt;/row&gt;\u003cbr>    &lt;divider color=\"subtle\"/&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"xs\"&gt;IFERROR関数の結果&lt;/text&gt;\u003cbr>    &lt;title size=\"2xl\" color={error?\"default\":\"success\"}&gt;{result===\"\"?\"（空白）\":result}&lt;/title&gt;\u003cbr>    &lt;caption&gt;{error?\"分母が0なので、指定した代替値を返しています。\":\"計算が正常に完了したので、計算結果をそのまま返しています。\"}&lt;/caption&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;button block color=\"secondary\" variant=\"outline\" onClick={()=&gt;{setNumerator(100);setDenominator(5);setFallback(\"計算不可\")}}&gt;初期値に戻す&lt;/button&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>「先輩、分母を0にしてみてください。通常なら`#DIV/0!`になりますが、IFERRORを使うと指定した文字に変わりますね。」\u003c/p>\u003cp>### 実務例①：VLOOKUPと組み合わせる\u003c/p>\u003cp>「ここは特に重要です。以前勉強したVLOOKUPと組み合わせると、商品コードが見つからない場合のエラーを処理できます。」\u003c/p>\u003cp>処理の流れは、\u003c/p>\u003cp>1. A2の商品コードを検索する。\u003cbr>2. 見つかれば商品名を返す。\u003cbr>3. エラーになれば「未登録」と表示する。\u003c/p>\u003cp>「ただし、検索値が見つからない場合だけでなく、参照範囲の誤りなどでエラーになった場合も『未登録』と表示されます。ここは注意が必要です。」\u003c/p>\u003cp>### 実務例②：XLOOKUPと組み合わせる\u003c/p>\u003cp>XLOOKUPは、検索値が見つからない場合の値を直接指定できます。\u003c/p>\u003cp>「この場合、検索値が見つからないだけなら、IFERRORを使う必要はありません。」\u003c/p>\u003cp>一方、XLOOKUPの処理で発生するさまざまなエラーをまとめて処理したいなら、IFERRORで囲むこともできます。\u003c/p>\u003cp>「でも、原因を調べたいときは、何でもIFERRORで隠さない方がいいですよ。」\u003c/p>\u003cp>### 実務例③：売上に対する利益率\u003c/p>\u003cp>「会社の利益率を計算するときにも使えます。」\u003c/p>\u003cp>利益率は、\u003c/p>\u003cp>\\[\u003cbr>利益率=\\frac{利益}{売上高}\\times100\u003cbr>\\]\u003c/p>\u003cp>です。\u003c/p>\u003cp>例えば、A2が利益、B2が売上高なら、\u003c/p>\u003cp>セルをパーセント表示にすれば、利益率として表示できます。\u003c/p>\u003cp>「ただし、売上高が0の場合にIFERRORで0%と表示すると、『利益率が本当に0%だった』と誤解される可能性があります。」\u003c/p>\u003cp>「だから、計算できない場合は『算出不可』と表示した方が、意味が正確なこともあるんです。」\u003c/p>\u003cp>## 理解確認：3問\u003c/p>\u003cp>{@body const questions=[{q:\"IFERROR関数の主な役割は何ですか？\",opts:[\"エラーの原因を自動修正する\",\"エラーが発生したときに別の値を返す\",\"すべての数式を0にする\"],a:1,exp:\"IFERRORはエラー時に指定した値を返します。元の数式やデータを修正するわけではありません。\"},{q:'=IFERROR(100/0,\"計算不可\") の結果は？',opts:[\"0\",\"100\",\"#DIV/0!\",\"計算不可\"],a:3,exp:\"0で割ると#DIV/0!になるため、IFERRORが指定された「計算不可」を返します。\"},{q:'=IFERROR(100/5,\"エラー\") の結果は？',opts:[\"20\",\"エラー\",\"5\"],a:0,exp:\"正常に計算できる場合は、代替値ではなく元の計算結果20を返します。\"}]}\u003cbr>{@body const [answers,setAnswers]=DIL.useState({})}\u003cbr>&lt;box border radius=\"lg\" padding={3} gap={3}&gt;\u003cbr>  {#each questions as q,i}\u003cbr>    &lt;box key={i} gap={2}&gt;\u003cbr>      **Q{i+1}. {q.q}**\u003cbr>      &lt;radio-group direction=\"col\" value={answers[i]===undefined?\"\":String(answers[i])} onChange={v=&gt;setAnswers(p=&gt;({...p,[i]:Number(v)}))}&gt;\u003cbr>        {#each q.opts as opt,j}\u003cbr>          &lt;radio value={String(j)}&gt;{opt}&lt;/radio&gt;\u003cbr>        {/each}\u003cbr>      &lt;/radio-group&gt;\u003cbr>      {#if answers[i]!==undefined}\u003cbr>        &lt;box background=\"surface-secondary\" radius=\"md\" padding={2} gap={1}&gt;\u003cbr>          &lt;row align=\"center\" gap={2}&gt;\u003cbr>            &lt;icon name={answers[i]===q.a?\"check-circle\":\"x-circle\"} color={answers[i]===q.a?\"success\":\"danger\"}/&gt;\u003cbr>            **{answers[i]===q.a?\"正解です！\":\"不正解です\"}**\u003cbr>          &lt;/row&gt;\u003cbr>          &lt;text size=\"sm\"&gt;正解：{q.opts[q.a]}。{q.exp}&lt;/text&gt;\u003cbr>        &lt;/box&gt;\u003cbr>      {/if}\u003cbr>    &lt;/box&gt;\u003cbr>    {#if i!==2}&lt;divider color=\"subtle\"/&gt;{/if}\u003cbr>  {/each}\u003cbr>  &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"sm\"&gt;正解数：{questions.filter((q,i)=&gt;answers[i]===q.a).length} / 3&lt;/text&gt;\u003cbr>    &lt;button size=\"sm\" color=\"secondary\" variant=\"outline\" onClick={()=&gt;setAnswers({})}&gt;再挑戦&lt;/button&gt;\u003cbr>  &lt;/row&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>## 30秒復習\u003c/p>\u003cp>「先輩、最後に6つのポイントを確認します。」\u003c/p>\u003cp>1. **何の関数？** 数式がエラーになった場合に別の値を返す関数。\u003cbr>2. **一番重要なのは？** エラーがなければ元の計算結果をそのまま返すこと。\u003cbr>3. **なぜ便利？** エラー表示を指定した文字や数値に置き換えられるから。\u003cbr>4. **処理の流れは？** 数式を計算 → エラー判定 → 通常結果または代替値を返す。\u003cbr>5. **具体例は？** VLOOKUPで検索できなければ「未登録」と表示する。\u003cbr>6. **間違えやすいところは？** エラー表示を隠しても、原因そのものが修正されるわけではないこと。\u003c/p>\u003cp>## 一文記憶\u003c/p>\u003cp>**IFERRORは「正常ならそのまま、エラーなら指定した別の値」を返す関数。**\u003c/p>\u003cp>「先輩、これでVLOOKUP・XLOOKUP・IF・SUMIF・IFERRORの5つを学習しましたね。」\u003c/p>\u003cp>「特にIFERRORは、単独で使うよりも他の関数と組み合わせることが多いんです。ただし、エラーを隠すことと、エラーを解決することは違います。この区別だけは忘れないでくださいね。」\u003c/p>","originalText":"# ⑤ IFERROR関数（イフエラー関数）\u003ctext color=\"secondary\" size=\"sm\">Excel関数｜エラー処理｜VLOOKUP・XLOOKUPとの組み合わせ\u003c/text>## A｜要点：IFERROR関数とは？「先輩、今回はIFERROR関数ですね。これまで勉強したVLOOKUPやIF関数と組み合わせると、とても便利な関数なんですよ。」「例えば、Excelで計算したときに、こんな表示を見たことはありませんか？」\u003cbox border radius=\"lg\" padding={3} gap={2}>  \u003cgrid columns={2} gap={2}>    \u003cgrid-item>      \u003cbox background=\"rgba(220,38,38,0.06)\" border={{size:1,color:\"danger\"}} radius=\"md\" padding={3} align=\"center\" gap={1}>        \u003ctext color=\"secondary\" size=\"xs\">通常の計算\u003c/text>        \u003ctitle color=\"danger\" size=\"xl\">#DIV/0!\u003c/title>        \u003ccaption>0で割ったエラー\u003c/caption>      \u003c/box>    \u003c/grid-item>    \u003cgrid-item>      \u003cbox background=\"rgba(22,163,74,0.07)\" border={{size:1,color:\"success\"}} radius=\"md\" padding={3} align=\"center\" gap={1}>        \u003ctext color=\"secondary\" size=\"xs\">IFERRORを使用\u003c/text>        \u003ctitle color=\"success\" size=\"xl\">計算不可\u003c/title>        \u003ccaption>指定した文字に変更\u003c/caption>      \u003c/box>    \u003c/grid-item>  \u003c/grid>  \u003ctext color=\"secondary\" size=\"sm\">数式がエラーになった場合に、別の値を表示できます。\u003c/text>\u003c/box>「**IFERROR関数とは、数式の結果がエラーになった場合に、指定した別の値を返す関数**です。」例えば、次のように書きます。「A2÷B2が正常に計算できれば、その計算結果を表示します。でも、0で割るなどしてエラーになった場合は、『計算不可』と表示するんです。」ここで覚えてほしいのは、**IFERRORはエラーの原因を修正する関数ではなく、エラーが発生したときの表示結果を切り替える関数**だということです。## B｜詳しい解説：なぜそうなるのか？### 1. 基本の書き方「先輩、引数はたった2つです。」| 引数 | 意味 ||---|---|| 値 | 計算・評価したい数式や値 || エラーの場合の値 | エラーだったときに返す値 |例えば、100÷0は計算できないので、「エラー」と表示します。一方、こちらは正常に計算できるので、20が表示されます。「つまり、IFERRORはすべての計算結果を置き換えるわけではありません。**エラーが発生したときだけ、別の結果に切り替える**んです。」### 2. IFERRORの処理の流れ\u003cbox align=\"center\" gap={1}>  \u003cbox border radius=\"md\" padding={3} width=\"100%\" align=\"center\" gap={1}>    **① 数式を計算する**    \u003ctext size=\"sm\">例えば A2÷B2\u003c/text>  \u003c/box>  \u003cicon name=\"arrow-down\" color=\"tertiary\"/>  \u003cbox border radius=\"md\" padding={3} width=\"100%\" align=\"center\" gap={1}>    **② エラーが発生したか判断する**    \u003ctext size=\"sm\">計算結果が正常か、Excelのエラー値かを確認\u003c/text>  \u003c/box>  \u003csvg viewBox=\"0 0 320 108\" width=\"100%\">    \u003cpath d=\"M160 0 V16 H80 V37 M160 16 H240 V37\" stroke=\"currentColor\" strokeOpacity=\".5\" strokeWidth=\"1.8\" fill=\"none\"/>    \u003cpath d=\"M75 31 L80 38 L85 31 M235 31 L240 38 L245 31\" stroke=\"currentColor\" strokeOpacity=\".5\" strokeWidth=\"1.8\" fill=\"none\"/>    \u003crect x=\"7\" y=\"40\" width=\"146\" height=\"62\" rx=\"9\" fill=\"#16a34a\" fillOpacity=\".09\" stroke=\"#16a34a\"/>    \u003crect x=\"167\" y=\"40\" width=\"146\" height=\"62\" rx=\"9\" fill=\"#dc2626\" fillOpacity=\".07\" stroke=\"#dc2626\"/>    \u003cg fill=\"currentColor\" textAnchor=\"middle\" fontSize=\"12\">      \u003ctext x=\"80\" y=\"59\">エラーなし\u003c/text>      \u003ctext x=\"240\" y=\"59\">エラーあり\u003c/text>    \u003c/g>    \u003ctext x=\"80\" y=\"84\" fill=\"#16a34a\" textAnchor=\"middle\" fontWeight=\"bold\" fontSize=\"15\">計算結果を返す\u003c/text>    \u003ctext x=\"240\" y=\"84\" fill=\"#dc2626\" textAnchor=\"middle\" fontWeight=\"bold\" fontSize=\"15\">代替値を返す\u003c/text>  \u003c/svg>\u003c/box>### 3. IFERRORで対応できる主なエラー「Excelのエラーにはいくつか種類があります。原因まで理解しておくと、仕事で困りませんよ。」| エラー | 意味・主な原因 ||---|---|| `#DIV/0!` | 0で割っている || `#N/A` | 検索値が見つからない || `#VALUE!` | 計算に使う値の種類が不適切 || `#REF!` | 参照先が無効 || `#NAME?` | 関数名などを認識できない || `#NUM!` | 数値計算に問題がある || `#NULL!` | 範囲の指定・交差に問題がある || `#SPILL!` | 配列結果を展開できない || `#CALC!` | 配列などの計算が成立しない |「IFERRORは、これらのエラーをまとめて処理できます。ただし、エラーの種類によっては、隠さず原因を調べた方がいい場合もあります。」### 4. IF関数との違い「先輩、ここは以前勉強したIF関数と比較しましょう。」| 関数 | 判断すること ||---|---|| IF | 指定した条件が成立するか || IFERROR | 計算結果がエラーか |例えば、これは80点以上かどうかを判断します。一方、これは計算がエラーになった場合に0を返します。「IFは条件分岐、IFERRORはエラー処理。この役割の違いを覚えてくださいね。」## C｜イメージ理解：失敗したときの予備ルート「先輩、IFERRORは、目的地へ向かうときの予備ルートだと思ってください。」通常のルートが使えるなら、そのまま進みます。でも、通行止めになっていたら、あらかじめ決めておいた別のルートへ進むんです。\u003cbox border radius=\"lg\" padding={3} gap={2}>  \u003csvg viewBox=\"0 0 340 206\" width=\"100%\">    \u003crect x=\"95\" y=\"7\" width=\"150\" height=\"43\" rx=\"9\" fill=\"#64748b\" fillOpacity=\".12\" stroke=\"#94a3b8\"/>    \u003ctext x=\"170\" y=\"25\" fontSize=\"13\" textAnchor=\"middle\" fill=\"currentColor\">数式を実行\u003c/text>    \u003ctext x=\"170\" y=\"41\" fontSize=\"12\" textAnchor=\"middle\" fill=\"currentColor\">A2 ÷ B2\u003c/text>    \u003cpath d=\"M170 50 V69 M170 69 H83 V92 M170 69 H257 V92\" stroke=\"currentColor\" strokeOpacity=\".55\" strokeWidth=\"2\" fill=\"none\"/>    \u003crect x=\"5\" y=\"94\" width=\"156\" height=\"66\" rx=\"9\" fill=\"#16a34a\" fillOpacity=\".09\" stroke=\"#16a34a\"/>    \u003crect x=\"179\" y=\"94\" width=\"156\" height=\"66\" rx=\"9\" fill=\"#dc2626\" fillOpacity=\".07\" stroke=\"#dc2626\"/>    \u003cg fill=\"currentColor\" textAnchor=\"middle\" fontSize=\"12\">      \u003ctext x=\"83\" y=\"114\">通常ルート\u003c/text>      \u003ctext x=\"257\" y=\"114\">予備ルート\u003c/text>      \u003ctext x=\"83\" y=\"132\">正常に計算できた\u003c/text>      \u003ctext x=\"257\" y=\"132\">エラーが発生した\u003c/text>    \u003c/g>    \u003ctext x=\"83\" y=\"150\" textAnchor=\"middle\" fill=\"#16a34a\" fontSize=\"15\" fontWeight=\"bold\">計算結果\u003c/text>    \u003ctext x=\"257\" y=\"150\" textAnchor=\"middle\" fill=\"#dc2626\" fontSize=\"15\" fontWeight=\"bold\">「計算不可」\u003c/text>    \u003ctext x=\"170\" y=\"192\" textAnchor=\"middle\" fontSize=\"12\" fill=\"currentColor\">どちらかの結果をセルに表示\u003c/text>  \u003c/svg>  \u003ccaption>通常の計算が成功すればその結果を使い、エラーなら指定した代替値を返す仕組みです。\u003c/caption>\u003c/box>「ただし、先輩。予備ルートへ進めたからといって、元の道路の通行止めが解消されたわけではありませんよね？」「IFERRORも同じです。**エラーを表示しなくするだけで、元の数式やデータの問題が解決したとは限らない**んです。」## D｜具体例：実際に操作してみましょう「では、実際に分母を変えて、IFERRORの動きを確かめましょう。」{@body const [numerator,setNumerator]=DIL.useState(100)}{@body const [denominator,setDenominator]=DIL.useState(5)}{@body const [fallback,setFallback]=DIL.useState(\"計算不可\")}{@body const error=denominator===0}{@body const result=error?fallback:String(Number((numerator/denominator).toFixed(6)))}{@body const fmla='=IFERROR(A2/B2,\"'+fallback.replaceAll('\"','\"\"')+'\")'}\u003cbox border radius=\"xl\" padding={3} gap={3}>  \u003crow align=\"center\" justify=\"between\">    **IFERROR練習シミュレーター**    \u003cbadge>操作できます\u003c/badge>  \u003c/row>  \u003cbox gap={1}>    \u003crow align=\"center\" justify=\"between\">      \u003clabel>① 分子（A2）\u003c/label>      \u003ctitle size=\"lg\" tabularNums>{numerator}\u003c/title>    \u003c/row>    \u003cslider min={0} max={200} step={10} value={numerator} onChange={setNumerator}/>  \u003c/box>  \u003cbox gap={1}>    \u003crow align=\"center\" justify=\"between\">      \u003clabel>② 分母（B2）\u003c/label>      \u003ctitle size=\"lg\" tabularNums>{denominator}\u003c/title>    \u003c/row>    \u003cslider min={0} max={20} step={1} value={denominator} onChange={setDenominator}/>    \u003ccaption>分母を0にすると、通常の割り算ではエラーが発生します。\u003c/caption>  \u003c/box>  \u003cbox gap={1}>    \u003clabel>③ エラーの場合に表示する文字\u003c/label>    \u003cradio-group direction=\"col\" value={fallback} onChange={setFallback}>      \u003cradio value=\"計算不可\">計算不可\u003c/radio>      \u003cradio value=\"未入力\">未入力\u003c/radio>      \u003cradio value=\"\">空白にする\u003c/radio>    \u003c/radio-group>  \u003c/box>  \u003cbox background=\"surface-secondary\" radius=\"lg\" padding={3} gap={2}>    \u003ctext color=\"secondary\" size=\"xs\">現在の数式\u003c/text>    \u003crow align=\"center\" justify=\"between\" wrap=\"wrap\">      \u003ctext weight=\"medium\" size=\"sm\">{fmla}\u003c/text>      \u003cbutton size=\"xs\" color=\"secondary\" variant=\"outline\" onClick={()=>GenUI.copy(fmla)}>\u003cicon name=\"copy\" size=\"xs\"/> コピー\u003c/button>    \u003c/row>    \u003cdivider color=\"subtle\"/>    \u003crow align=\"center\" justify=\"between\">      \u003ctext color=\"secondary\" size=\"sm\">通常の計算結果\u003c/text>      \u003ctext weight=\"medium\" color={error?\"danger\":\"default\"}>{error?\"#DIV/0!\":result}\u003c/text>    \u003c/row>    \u003crow align=\"center\" justify=\"between\">      \u003ctext color=\"secondary\" size=\"sm\">エラー判定\u003c/text>      \u003cbadge color={error?\"danger\":\"success\"}>{error?\"エラーあり\":\"エラーなし\"}\u003c/badge>    \u003c/row>    \u003cdivider color=\"subtle\"/>    \u003ctext color=\"secondary\" size=\"xs\">IFERROR関数の結果\u003c/text>    \u003ctitle size=\"2xl\" color={error?\"default\":\"success\"}>{result===\"\"?\"（空白）\":result}\u003c/title>    \u003ccaption>{error?\"分母が0なので、指定した代替値を返しています。\":\"計算が正常に完了したので、計算結果をそのまま返しています。\"}\u003c/caption>  \u003c/box>  \u003cbutton block color=\"secondary\" variant=\"outline\" onClick={()=>{setNumerator(100);setDenominator(5);setFallback(\"計算不可\")}}>初期値に戻す\u003c/button>\u003c/box>「先輩、分母を0にしてみてください。通常なら`#DIV/0!`になりますが、IFERRORを使うと指定した文字に変わりますね。」### 実務例①：VLOOKUPと組み合わせる「ここは特に重要です。以前勉強したVLOOKUPと組み合わせると、商品コードが見つからない場合のエラーを処理できます。」処理の流れは、1. A2の商品コードを検索する。2. 見つかれば商品名を返す。3. エラーになれば「未登録」と表示する。「ただし、検索値が見つからない場合だけでなく、参照範囲の誤りなどでエラーになった場合も『未登録』と表示されます。ここは注意が必要です。」### 実務例②：XLOOKUPと組み合わせるXLOOKUPは、検索値が見つからない場合の値を直接指定できます。「この場合、検索値が見つからないだけなら、IFERRORを使う必要はありません。」一方、XLOOKUPの処理で発生するさまざまなエラーをまとめて処理したいなら、IFERRORで囲むこともできます。「でも、原因を調べたいときは、何でもIFERRORで隠さない方がいいですよ。」### 実務例③：売上に対する利益率「会社の利益率を計算するときにも使えます。」利益率は、\\[利益率=\\frac{利益}{売上高}\\times100\\]です。例えば、A2が利益、B2が売上高なら、セルをパーセント表示にすれば、利益率として表示できます。「ただし、売上高が0の場合にIFERRORで0%と表示すると、『利益率が本当に0%だった』と誤解される可能性があります。」「だから、計算できない場合は『算出不可』と表示した方が、意味が正確なこともあるんです。」## 理解確認：3問{@body const questions=[{q:\"IFERROR関数の主な役割は何ですか？\",opts:[\"エラーの原因を自動修正する\",\"エラーが発生したときに別の値を返す\",\"すべての数式を0にする\"],a:1,exp:\"IFERRORはエラー時に指定した値を返します。元の数式やデータを修正するわけではありません。\"},{q:'=IFERROR(100/0,\"計算不可\") の結果は？',opts:[\"0\",\"100\",\"#DIV/0!\",\"計算不可\"],a:3,exp:\"0で割ると#DIV/0!になるため、IFERRORが指定された「計算不可」を返します。\"},{q:'=IFERROR(100/5,\"エラー\") の結果は？',opts:[\"20\",\"エラー\",\"5\"],a:0,exp:\"正常に計算できる場合は、代替値ではなく元の計算結果20を返します。\"}]}{@body const [answers,setAnswers]=DIL.useState({})}\u003cbox border radius=\"lg\" padding={3} gap={3}>  {#each questions as q,i}    \u003cbox key={i} gap={2}>      **Q{i+1}. {q.q}**      \u003cradio-group direction=\"col\" value={answers[i]===undefined?\"\":String(answers[i])} onChange={v=>setAnswers(p=>({...p,[i]:Number(v)}))}>        {#each q.opts as opt,j}          \u003cradio value={String(j)}>{opt}\u003c/radio>        {/each}      \u003c/radio-group>      {#if answers[i]!==undefined}        \u003cbox background=\"surface-secondary\" radius=\"md\" padding={2} gap={1}>          \u003crow align=\"center\" gap={2}>            \u003cicon name={answers[i]===q.a?\"check-circle\":\"x-circle\"} color={answers[i]===q.a?\"success\":\"danger\"}/>            **{answers[i]===q.a?\"正解です！\":\"不正解です\"}**          \u003c/row>          \u003ctext size=\"sm\">正解：{q.opts[q.a]}。{q.exp}\u003c/text>        \u003c/box>      {/if}    \u003c/box>    {#if i!==2}\u003cdivider color=\"subtle\"/>{/if}  {/each}  \u003crow align=\"center\" justify=\"between\">    \u003ctext color=\"secondary\" size=\"sm\">正解数：{questions.filter((q,i)=>answers[i]===q.a).length} / 3\u003c/text>    \u003cbutton size=\"sm\" color=\"secondary\" variant=\"outline\" onClick={()=>setAnswers({})}>再挑戦\u003c/button>  \u003c/row>\u003c/box>## 30秒復習「先輩、最後に6つのポイントを確認します。」1. **何の関数？** 数式がエラーになった場合に別の値を返す関数。2. **一番重要なのは？** エラーがなければ元の計算結果をそのまま返すこと。3. **なぜ便利？** エラー表示を指定した文字や数値に置き換えられるから。4. **処理の流れは？** 数式を計算 → エラー判定 → 通常結果または代替値を返す。5. **具体例は？** VLOOKUPで検索できなければ「未登録」と表示する。6. **間違えやすいところは？** エラー表示を隠しても、原因そのものが修正されるわけではないこと。## 一文記憶**IFERRORは「正常ならそのまま、エラーなら指定した別の値」を返す関数。**「先輩、これでVLOOKUP・XLOOKUP・IF・SUMIF・IFERRORの5つを学習しましたね。」「特にIFERRORは、単独で使うよりも他の関数と組み合わせることが多いんです。ただし、エラーを隠すことと、エラーを解決することは違います。この区別だけは忘れないでくださいね。」","sections":{"A":"\u003ch1>⑤ IFERROR関数（イフエラー関数）\u003c/h1>\n\u003cp class=\"muted\">Excel関数｜エラー処理｜VLOOKUP・XLOOKUPとの組み合わせ\u003c/p>\u003ch2>A｜要点：IFERROR関数とは？\u003c/h2>\u003cp>「先輩、今回はIFERROR関数ですね。これまで勉強したVLOOKUPやIF関数と組み合わせると、とても便利な関数なんですよ。」\u003c/p>\n\u003cp>「例えば、Excelで計算したときに、こんな表示を見たことはありませんか？」\u003c/p>\n\u003cdiv class=\"source-static\">\u003cdiv>\n  \u003cdiv>\n    \u003cdiv>\n      \u003cdiv>\n        \u003cspan>通常の計算\u003c/span>\n        \u003cstrong>#DIV/0!\u003c/strong>\n        \u003csmall>0で割ったエラー\u003c/small>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv>\n      \u003cdiv>\n        \u003cspan>IFERRORを使用\u003c/span>\n        \u003cstrong>計算不可\u003c/strong>\n        \u003csmall>指定した文字に変更\u003c/small>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n  \u003cspan>数式がエラーになった場合に、別の値を表示できます。\u003c/span>\n\u003c/div>\n\u003c/div>\u003cp>「\u003cstrong>IFERROR関数とは、数式の結果がエラーになった場合に、指定した別の値を返す関数\u003c/strong>です。」\u003c/p>\n\u003cp>例えば、次のように書きます。\u003c/p>\n\u003cp>「A2÷B2が正常に計算できれば、その計算結果を表示します。でも、0で割るなどしてエラーになった場合は、『計算不可』と表示するんです。」\u003c/p>\n\u003cp>ここで覚えてほしいのは、\u003cstrong>IFERRORはエラーの原因を修正する関数ではなく、エラーが発生したときの表示結果を切り替える関数\u003c/strong>だということです。\u003c/p>\n","B":"\u003ch2>B｜詳しい解説：なぜそうなるのか？\u003c/h2>\u003ch3>1. 基本の書き方\u003c/h3>\n\u003cp>「先輩、引数はたった2つです。」\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>引数\u003c/th>\n\u003cth>意味\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>値\u003c/td>\n\u003ctd>計算・評価したい数式や値\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>エラーの場合の値\u003c/td>\n\u003ctd>エラーだったときに返す値\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>例えば、\u003c/p>\n\u003cp>100÷0は計算できないので、「エラー」と表示します。\u003c/p>\n\u003cp>一方、\u003c/p>\n\u003cp>こちらは正常に計算できるので、20が表示されます。\u003c/p>\n\u003cp>「つまり、IFERRORはすべての計算結果を置き換えるわけではありません。\u003cstrong>エラーが発生したときだけ、別の結果に切り替える\u003c/strong>んです。」\u003c/p>\n\u003ch3>2. IFERRORの処理の流れ\u003c/h3>\n\u003cdiv class=\"source-static\">\u003cdiv>\n  \u003cdiv>\n    \u003cstrong>① 数式を計算する\u003c/strong>\n\u003cspan>例えば A2÷B2\u003c/span>\n  \u003c/div>\n   → \n  \u003cdiv>\n    \u003cstrong>② エラーが発生したか判断する\u003c/strong>\n\u003cspan>計算結果が正常か、Excelのエラー値かを確認\u003c/span>\n  \u003c/div>\n  \u003csvg viewBox=\"0 0 320 108\" width=\"100%\">\n    \u003cpath d=\"M160 0 V16 H80 V37 M160 16 H240 V37\" stroke=\"currentColor\" stroke-opacity=\".5\" stroke-width=\"1.8\" fill=\"none\"/>\n    \u003cpath d=\"M75 31 L80 38 L85 31 M235 31 L240 38 L245 31\" stroke=\"currentColor\" stroke-opacity=\".5\" stroke-width=\"1.8\" fill=\"none\"/>\n    \u003crect x=\"7\" y=\"40\" width=\"146\" height=\"62\" rx=\"9\" fill=\"#16a34a\" fill-opacity=\".09\" stroke=\"#16a34a\"/>\n    \u003crect x=\"167\" y=\"40\" width=\"146\" height=\"62\" rx=\"9\" fill=\"#dc2626\" fill-opacity=\".07\" stroke=\"#dc2626\"/>\n    \u003cg fill=\"currentColor\" text-anchor=\"middle\" font-size=\"12\">\n      \u003ctext x=\"80\" y=\"59\">エラーなし\u003c/text>\n      \u003ctext x=\"240\" y=\"59\">エラーあり\u003c/text>\n    \u003c/g>\n    \u003ctext x=\"80\" y=\"84\" fill=\"#16a34a\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"15\">計算結果を返す\u003c/text>\n    \u003ctext x=\"240\" y=\"84\" fill=\"#dc2626\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"15\">代替値を返す\u003c/text>\n  \u003c/svg>\n\u003c/div>\n\u003c/div>\u003ch3>3. IFERRORで対応できる主なエラー\u003c/h3>\n\u003cp>「Excelのエラーにはいくつか種類があります。原因まで理解しておくと、仕事で困りませんよ。」\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>エラー\u003c/th>\n\u003cth>意味・主な原因\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>#DIV/0!\u003c/code>\u003c/td>\n\u003ctd>0で割っている\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>#N/A\u003c/code>\u003c/td>\n\u003ctd>検索値が見つからない\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>#VALUE!\u003c/code>\u003c/td>\n\u003ctd>計算に使う値の種類が不適切\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>#REF!\u003c/code>\u003c/td>\n\u003ctd>参照先が無効\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>#NAME?\u003c/code>\u003c/td>\n\u003ctd>関数名などを認識できない\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>#NUM!\u003c/code>\u003c/td>\n\u003ctd>数値計算に問題がある\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>#NULL!\u003c/code>\u003c/td>\n\u003ctd>範囲の指定・交差に問題がある\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>#SPILL!\u003c/code>\u003c/td>\n\u003ctd>配列結果を展開できない\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>#CALC!\u003c/code>\u003c/td>\n\u003ctd>配列などの計算が成立しない\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>「IFERRORは、これらのエラーをまとめて処理できます。ただし、エラーの種類によっては、隠さず原因を調べた方がいい場合もあります。」\u003c/p>\n\u003ch3>4. IF関数との違い\u003c/h3>\n\u003cp>「先輩、ここは以前勉強したIF関数と比較しましょう。」\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>関数\u003c/th>\n\u003cth>判断すること\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>IF\u003c/td>\n\u003ctd>指定した条件が成立するか\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>IFERROR\u003c/td>\n\u003ctd>計算結果がエラーか\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>例えば、\u003c/p>\n\u003cp>これは80点以上かどうかを判断します。\u003c/p>\n\u003cp>一方、\u003c/p>\n\u003cp>これは計算がエラーになった場合に0を返します。\u003c/p>\n\u003cp>「IFは条件分岐、IFERRORはエラー処理。この役割の違いを覚えてくださいね。」\u003c/p>\n","C":"\u003ch2>C｜イメージ理解：失敗したときの予備ルート\u003c/h2>\u003cp>「先輩、IFERRORは、目的地へ向かうときの予備ルートだと思ってください。」\u003c/p>\n\u003cp>通常のルートが使えるなら、そのまま進みます。でも、通行止めになっていたら、あらかじめ決めておいた別のルートへ進むんです。\u003c/p>\n\u003cdiv class=\"source-static\">\u003cdiv>\n  \u003csvg viewBox=\"0 0 340 206\" width=\"100%\">\n    \u003crect x=\"95\" y=\"7\" width=\"150\" height=\"43\" rx=\"9\" fill=\"#64748b\" fill-opacity=\".12\" stroke=\"#94a3b8\"/>\n    \u003ctext x=\"170\" y=\"25\" font-size=\"13\" text-anchor=\"middle\" fill=\"currentColor\">数式を実行\u003c/text>\n    \u003ctext x=\"170\" y=\"41\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\">A2 ÷ B2\u003c/text>\n    \u003cpath d=\"M170 50 V69 M170 69 H83 V92 M170 69 H257 V92\" stroke=\"currentColor\" stroke-opacity=\".55\" stroke-width=\"2\" fill=\"none\"/>\n    \u003crect x=\"5\" y=\"94\" width=\"156\" height=\"66\" rx=\"9\" fill=\"#16a34a\" fill-opacity=\".09\" stroke=\"#16a34a\"/>\n    \u003crect x=\"179\" y=\"94\" width=\"156\" height=\"66\" rx=\"9\" fill=\"#dc2626\" fill-opacity=\".07\" stroke=\"#dc2626\"/>\n    \u003cg fill=\"currentColor\" text-anchor=\"middle\" font-size=\"12\">\n      \u003ctext x=\"83\" y=\"114\">通常ルート\u003c/text>\n      \u003ctext x=\"257\" y=\"114\">予備ルート\u003c/text>\n      \u003ctext x=\"83\" y=\"132\">正常に計算できた\u003c/text>\n      \u003ctext x=\"257\" y=\"132\">エラーが発生した\u003c/text>\n    \u003c/g>\n    \u003ctext x=\"83\" y=\"150\" text-anchor=\"middle\" fill=\"#16a34a\" font-size=\"15\" font-weight=\"bold\">計算結果\u003c/text>\n    \u003ctext x=\"257\" y=\"150\" text-anchor=\"middle\" fill=\"#dc2626\" font-size=\"15\" font-weight=\"bold\">「計算不可」\u003c/text>\n    \u003ctext x=\"170\" y=\"192\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\">どちらかの結果をセルに表示\u003c/text>\n  \u003c/svg>\n  \u003csmall>通常の計算が成功すればその結果を使い、エラーなら指定した代替値を返す仕組みです。\u003c/small>\n\u003c/div>\n\u003c/div>\u003cp>「ただし、先輩。予備ルートへ進めたからといって、元の道路の通行止めが解消されたわけではありませんよね？」\u003c/p>\n\u003cp>「IFERRORも同じです。\u003cstrong>エラーを表示しなくするだけで、元の数式やデータの問題が解決したとは限らない\u003c/strong>んです。」\u003c/p>\n","D":"\u003ch2>D｜具体例：実際に操作してみましょう\u003c/h2>\u003cp>「では、実際に分母を変えて、IFERRORの動きを確かめましょう。」\u003c/p>\n\u003cp>「先輩、分母を0にしてみてください。通常なら\u003ccode>#DIV/0!\u003c/code>になりますが、IFERRORを使うと指定した文字に変わりますね。」\u003c/p>\n\u003ch3>実務例①：VLOOKUPと組み合わせる\u003c/h3>\n\u003cp>「ここは特に重要です。以前勉強したVLOOKUPと組み合わせると、商品コードが見つからない場合のエラーを処理できます。」\u003c/p>\n\u003cp>処理の流れは、\u003c/p>\n\u003col>\n\u003cli>A2の商品コードを検索する。\u003c/li>\n\u003cli>見つかれば商品名を返す。\u003c/li>\n\u003cli>エラーになれば「未登録」と表示する。\u003c/li>\n\u003c/ol>\n\u003cp>「ただし、検索値が見つからない場合だけでなく、参照範囲の誤りなどでエラーになった場合も『未登録』と表示されます。ここは注意が必要です。」\u003c/p>\n\u003ch3>実務例②：XLOOKUPと組み合わせる\u003c/h3>\n\u003cp>XLOOKUPは、検索値が見つからない場合の値を直接指定できます。\u003c/p>\n\u003cp>「この場合、検索値が見つからないだけなら、IFERRORを使う必要はありません。」\u003c/p>\n\u003cp>一方、XLOOKUPの処理で発生するさまざまなエラーをまとめて処理したいなら、IFERRORで囲むこともできます。\u003c/p>\n\u003cp>「でも、原因を調べたいときは、何でもIFERRORで隠さない方がいいですよ。」\u003c/p>\n\u003ch3>実務例③：売上に対する利益率\u003c/h3>\n\u003cp>「会社の利益率を計算するときにも使えます。」\u003c/p>\n\u003cp>利益率は、\u003c/p>\n\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>利益率\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>利益\u003c/mi>\u003cmi>売上高\u003c/mi>\u003c/mfrac>\u003cmo>×\u003c/mo>\u003cmn>100\u003c/mn>\u003c/mrow>\u003c/math>\u003cp>です。\u003c/p>\n\u003cp>例えば、A2が利益、B2が売上高なら、\u003c/p>\n\u003cp>セルをパーセント表示にすれば、利益率として表示できます。\u003c/p>\n\u003cp>「ただし、売上高が0の場合にIFERRORで0%と表示すると、『利益率が本当に0%だった』と誤解される可能性があります。」\u003c/p>\n\u003cp>「だから、計算できない場合は『算出不可』と表示した方が、意味が正確なこともあるんです。」\u003c/p>\n","その他":"\u003ch2>理解確認：3問\u003c/h2>\u003ch2>30秒復習\u003c/h2>\u003cp>「先輩、最後に6つのポイントを確認します。」\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>何の関数？\u003c/strong> 数式がエラーになった場合に別の値を返す関数。\u003c/li>\n\u003cli>\u003cstrong>一番重要なのは？\u003c/strong> エラーがなければ元の計算結果をそのまま返すこと。\u003c/li>\n\u003cli>\u003cstrong>なぜ便利？\u003c/strong> エラー表示を指定した文字や数値に置き換えられるから。\u003c/li>\n\u003cli>\u003cstrong>処理の流れは？\u003c/strong> 数式を計算 → エラー判定 → 通常結果または代替値を返す。\u003c/li>\n\u003cli>\u003cstrong>具体例は？\u003c/strong> VLOOKUPで検索できなければ「未登録」と表示する。\u003c/li>\n\u003cli>\u003cstrong>間違えやすいところは？\u003c/strong> エラー表示を隠しても、原因そのものが修正されるわけではないこと。\u003c/li>\n\u003c/ol>\n\u003ch2>一文記憶\u003c/h2>\u003cp>\u003cstrong>IFERRORは「正常ならそのまま、エラーなら指定した別の値」を返す関数。\u003c/strong>\u003c/p>\n\u003cp>「先輩、これでVLOOKUP・XLOOKUP・IF・SUMIF・IFERRORの5つを学習しましたね。」\u003c/p>\n\u003cp>「特にIFERRORは、単独で使うよりも他の関数と組み合わせることが多いんです。ただし、エラーを隠すことと、エラーを解決することは違います。この区別だけは忘れないでくださいね。」\u003c/p>\n"},"prose":["# ⑤ IFERROR関数（イフエラー関数）","Excel関数｜エラー処理｜VLOOKUP・XLOOKUPとの組み合わせ","## A｜要点：IFERROR関数とは？","「先輩、今回はIFERROR関数ですね。これまで勉強したVLOOKUPやIF関数と組み合わせると、とても便利な関数なんですよ。」","「例えば、Excelで計算したときに、こんな表示を見たことはありませんか？」","「**IFERROR関数とは、数式の結果がエラーになった場合に、指定した別の値を返す関数**です。」","例えば、次のように書きます。","「A2÷B2が正常に計算できれば、その計算結果を表示します。でも、0で割るなどしてエラーになった場合は、『計算不可』と表示するんです。」","ここで覚えてほしいのは、**IFERRORはエラーの原因を修正する関数ではなく、エラーが発生したときの表示結果を切り替え
