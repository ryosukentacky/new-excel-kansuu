る関数**だということです。","## B｜詳しい解説：なぜそうなるのか？","### 1. 基本の書き方","「先輩、引数はたった2つです。」","| 引数 | 意味 |\n|---|---|\n| 値 | 計算・評価したい数式や値 |\n| エラーの場合の値 | エラーだったときに返す値 |","例えば、","100÷0は計算できないので、「エラー」と表示します。","一方、","こちらは正常に計算できるので、20が表示されます。","「つまり、IFERRORはすべての計算結果を置き換えるわけではありません。**エラーが発生したときだけ、別の結果に切り替える**んです。」","### 2. IFERRORの処理の流れ","### 3. IFERRORで対応できる主なエラー","「Excelのエラーにはいくつか種類があります。原因まで理解しておくと、仕事で困りませんよ。」","| エラー | 意味・主な原因 |\n|---|---|\n| `#DIV/0!` | 0で割っている |\n| `#N/A` | 検索値が見つからない |\n| `#VALUE!` | 計算に使う値の種類が不適切 |\n| `#REF!` | 参照先が無効 |\n| `#NAME?` | 関数名などを認識できない |\n| `#NUM!` | 数値計算に問題がある |\n| `#NULL!` | 範囲の指定・交差に問題がある |\n| `#SPILL!` | 配列結果を展開できない |\n| `#CALC!` | 配列などの計算が成立しない |","「IFERRORは、これらのエラーをまとめて処理できます。ただし、エラーの種類によっては、隠さず原因を調べた方がいい場合もあります。」","### 4. IF関数との違い","「先輩、ここは以前勉強したIF関数と比較しましょう。」","| 関数 | 判断すること |\n|---|---|\n| IF | 指定した条件が成立するか |\n| IFERROR | 計算結果がエラーか |","例えば、","これは80点以上かどうかを判断します。","一方、","これは計算がエラーになった場合に0を返します。","「IFは条件分岐、IFERRORはエラー処理。この役割の違いを覚えてくださいね。」","## C｜イメージ理解：失敗したときの予備ルート","「先輩、IFERRORは、目的地へ向かうときの予備ルートだと思ってください。」","通常のルートが使えるなら、そのまま進みます。でも、通行止めになっていたら、あらかじめ決めておいた別のルートへ進むんです。","「ただし、先輩。予備ルートへ進めたからといって、元の道路の通行止めが解消されたわけではありませんよね？」","「IFERRORも同じです。**エラーを表示しなくするだけで、元の数式やデータの問題が解決したとは限らない**んです。」","## D｜具体例：実際に操作してみましょう","「では、実際に分母を変えて、IFERRORの動きを確かめましょう。」","「先輩、分母を0にしてみてください。通常なら`#DIV/0!`になりますが、IFERRORを使うと指定した文字に変わりますね。」","### 実務例①：VLOOKUPと組み合わせる","「ここは特に重要です。以前勉強したVLOOKUPと組み合わせると、商品コードが見つからない場合のエラーを処理できます。」","処理の流れは、","1. A2の商品コードを検索する。\n2. 見つかれば商品名を返す。\n3. エラーになれば「未登録」と表示する。","「ただし、検索値が見つからない場合だけでなく、参照範囲の誤りなどでエラーになった場合も『未登録』と表示されます。ここは注意が必要です。」","### 実務例②：XLOOKUPと組み合わせる","XLOOKUPは、検索値が見つからない場合の値を直接指定できます。","「この場合、検索値が見つからないだけなら、IFERRORを使う必要はありません。」","一方、XLOOKUPの処理で発生するさまざまなエラーをまとめて処理したいなら、IFERRORで囲むこともできます。","「でも、原因を調べたいときは、何でもIFERRORで隠さない方がいいですよ。」","### 実務例③：売上に対する利益率","「会社の利益率を計算するときにも使えます。」","利益率は、","\\[\n利益率=\\frac{利益}{売上高}\\times100\n\\]","です。","例えば、A2が利益、B2が売上高なら、","セルをパーセント表示にすれば、利益率として表示できます。","「ただし、売上高が0の場合にIFERRORで0%と表示すると、『利益率が本当に0%だった』と誤解される可能性があります。」","「だから、計算できない場合は『算出不可』と表示した方が、意味が正確なこともあるんです。」","## 理解確認：3問","## 30秒復習","「先輩、最後に6つのポイントを確認します。」","1. **何の関数？** 数式がエラーになった場合に別の値を返す関数。\n2. **一番重要なのは？** エラーがなければ元の計算結果をそのまま返すこと。\n3. **なぜ便利？** エラー表示を指定した文字や数値に置き換えられるから。\n4. **処理の流れは？** 数式を計算 → エラー判定 → 通常結果または代替値を返す。\n5. **具体例は？** VLOOKUPで検索できなければ「未登録」と表示する。\n6. **間違えやすいところは？** エラー表示を隠しても、原因そのものが修正されるわけではないこと。","## 一文記憶","**IFERRORは「正常ならそのまま、エラーなら指定した別の値」を返す関数。**","「先輩、これでVLOOKUP・XLOOKUP・IF・SUMIF・IFERRORの5つを学習しましたね。」","「特にIFERRORは、単独で使うよりも他の関数と組み合わせることが多いんです。ただし、エラーを隠すことと、エラーを解決することは違います。この区別だけは忘れないでくださいね。」"],"quizzes":[{"q":"IFERROR関数の主な役割は何ですか？","options":["エラーの原因を自動修正する","エラーが発生したときに別の値を返す","すべての数式を0にする"],"correct":1,"explain":"IFERRORはエラー時に指定した値を返します。元の数式やデータを修正するわけではありません。"},{"q":"=IFERROR(100/0,\"計算不可\") の結果は？","options":["0","100","#DIV/0!","計算不可"],"correct":3,"explain":"0で割ると#DIV/0!になるため、IFERRORが指定された「計算不可」を返します。"},{"q":"=IFERROR(100/5,\"エラー\") の結果は？","options":["20","エラー","5"],"correct":0,"explain":"正常に計算できる場合は、代替値ではなく元の計算結果20を返します。"}]},{"name":"COUNTA","original":"\u003cp># ⑥ COUNTA関数（カウントエー関数）\u003c/p>\u003cp>&lt;text color=\"secondary\" size=\"sm\"&gt;Excel関数｜データ集計｜COUNT・COUNTBLANKとの違い&lt;/text&gt;\u003c/p>\u003cp>## A｜要点：COUNTA関数とは？\u003c/p>\u003cp>「先輩、今回はCOUNTA関数ですね。ここまでSUMIFやIFERRORなどを勉強してきましたけど、今回はもっとシンプルで、しかも実務でよく使う関数です。」\u003c/p>\u003cp>**COUNTA関数とは、指定した範囲の中で、空白ではないセルの個数を数える関数です。**\u003c/p>\u003cp>例えば、社員名簿があったとします。\u003c/p>\u003cp>&lt;box border radius=\"lg\" padding={3} gap={2}&gt;\u003cbr>  **社員名簿の例**\u003c/p>\u003cp>  | 行 | A列：社員名 |\u003cbr>  |---|---|\u003cbr>  | 2 | 田中 |\u003cbr>  | 3 | 佐藤 |\u003cbr>  | 4 | &lt;text color=\"tertiary\"&gt;（空白）&lt;/text&gt; |\u003cbr>  | 5 | 鈴木 |\u003cbr>  | 6 | 山本 |\u003c/p>\u003cp>  &lt;box background=\"surface-secondary\" radius=\"md\" padding={3} gap={1}&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"xs\"&gt;入力されているセルの数&lt;/text&gt;\u003cbr>    &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>      **=COUNTA(A2:A6)**\u003cbr>      &lt;title size=\"2xl\" color=\"success\"&gt;4件&lt;/title&gt;\u003cbr>    &lt;/row&gt;\u003cbr>  &lt;/box&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>「5行あるのに、結果は4件ですね。どうしてか分かりますか？」\u003c/p>\u003cp>「そうです。A4が空白だからです。COUNTAは行数を数えるのではなく、**値が入っているセルの数を数える**んです。」\u003c/p>\u003cp>ただし、文字だけではなく、数値や日付、TRUE・FALSEなども数えます。\u003c/p>\u003cp>## B｜詳しい解説：COUNTAの仕組み\u003c/p>\u003cp>### 1. 基本の書き方\u003c/p>\u003cp>「先輩、基本的には数えたい範囲を指定するだけです。」\u003c/p>\u003cp>これはA2からA10までの9セルについて、空白ではないセルの数を返します。\u003c/p>\u003cp>複数の範囲を指定することもできます。\u003c/p>\u003cp>「この場合は、A列とC列の指定範囲をそれぞれ数えて、合計します。」\u003c/p>\u003cp>### 2. 何がカウントされる？\u003c/p>\u003cp>「ここが一番大事です。COUNTAは数字だけを数えるわけではありません。」\u003c/p>\u003cp>| セルの内容 | COUNTAで数える？ |\u003cbr>|---|---|\u003cbr>| `100` | 数える |\u003cbr>| `田中` | 数える |\u003cbr>| `2026/10/26` | 数える |\u003cbr>| `TRUE` | 数える |\u003cbr>| `0` | 数える |\u003cbr>| エラー値 `#N/A` | 数える |\u003cbr>| 完全な空白セル | 数えない |\u003cbr>| 数式 `=\"\"` の結果 | 数える |\u003cbr>| スペースだけの文字列 | 数える |\u003c/p>\u003cp>「先輩、特に注意してほしいのは、**見た目が空白でも、実際には何か入っているセルがある**ことです。」\u003c/p>\u003cp>例えば、\u003c/p>\u003cp>この式は、A2が空白なら空文字列 `\"\"` を返します。\u003c/p>\u003cp>画面上は何も表示されませんが、数式が入っているセルなのでCOUNTAでは1件と数えられます。\u003c/p>\u003cp>「見た目が空白だからといって、必ず0件になるわけではありませんよ。」\u003c/p>\u003cp>### 3. COUNT・COUNTA・COUNTBLANKの違い\u003c/p>\u003cp>「先輩、名前が似ている関数を整理しましょう。」\u003c/p>\u003cp>| 関数 | 数える対象 |\u003cbr>|---|---|\u003cbr>| COUNT | 数値が入ったセル |\u003cbr>| COUNTA | 空白ではないセル |\u003cbr>| COUNTBLANK | 空白セル |\u003c/p>\u003cp>例えば、次のような範囲を考えてください。\u003c/p>\u003cp>| セル | 内容 |\u003cbr>|---|---|\u003cbr>| A1 | 100 |\u003cbr>| A2 | 田中 |\u003cbr>| A3 | 空白 |\u003cbr>| A4 | 200 |\u003cbr>| A5 | 完了 |\u003c/p>\u003cp>この場合、\u003c/p>\u003cp>- `=COUNT(A1:A5)` → **2**\u003cbr>- `=COUNTA(A1:A5)` → **4**\u003cbr>- `=COUNTBLANK(A1:A5)` → **1**\u003c/p>\u003cp>「COUNTは数値だけ。COUNTAは文字も数値も。COUNTBLANKは空白を数える。この違いですね。」\u003c/p>\u003cp>なお、COUNTはExcel内部で数値として扱われる日付や時刻も数えます。\u003c/p>\u003cp>## C｜イメージ理解：出席簿の記入欄\u003c/p>\u003cp>「先輩、COUNTAは出席簿の記入欄を確認する作業に似ています。」\u003c/p>\u003cp>例えば、5人分の提出確認欄があり、提出した人には何か記入されているとします。\u003c/p>\u003cp>&lt;box border radius=\"lg\" padding={3} gap={2}&gt;\u003cbr>  &lt;svg viewBox=\"0 0 330 188\" width=\"100%\"&gt;\u003cbr>    {#each [{name:\"田中\",val:\"提出済\",ok:true},{name:\"佐藤\",val:\"提出済\",ok:true},{name:\"鈴木\",val:\"\",ok:false},{name:\"山本\",val:\"提出済\",ok:true},{name:\"高橋\",val:\"提出済\",ok:true}] as p,i}\u003cbr>      &lt;rect x=\"12\" y={8+i*30} width=\"306\" height=\"26\" rx=\"5\" fill={p.ok?\"#16a34a\":\"#64748b\"} fillOpacity={p.ok?\".09\":\".06\"} stroke={p.ok?\"#16a34a\":\"#94a3b8\"} strokeOpacity=\".5\"/&gt;\u003cbr>      &lt;text x=\"27\" y={26+i*30} fontSize=\"12\" fill=\"currentColor\"&gt;{p.name}&lt;/text&gt;\u003cbr>      &lt;text x=\"178\" y={26+i*30} textAnchor=\"middle\" fontSize=\"12\" fill={p.ok?\"#16a34a\":\"currentColor\"}&gt;{p.ok?p.val:\"未記入\"}&lt;/text&gt;\u003cbr>      {#if p.ok}\u003cbr>        &lt;path d={`M280 ${17+i*30} l5 5 l10 -12`} stroke=\"#16a34a\" strokeWidth=\"2.3\" fill=\"none\" strokeLinecap=\"round\"/&gt;\u003cbr>      {/if}\u003cbr>    {/each}\u003cbr>    &lt;text x=\"165\" y=\"177\" textAnchor=\"middle\" fontSize=\"14\" fontWeight=\"bold\" fill=\"#16a34a\"&gt;記入あり：4件&lt;/text&gt;\u003cbr>  &lt;/svg&gt;\u003cbr>  &lt;caption&gt;5人分の欄のうち、4つに文字が入力されています。COUNTAの結果は4です。&lt;/caption&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>「でも先輩、ここで気をつけてください。」\u003c/p>\u003cp>「COUNTAが分かるのは、あくまで**セルに何か入っているかどうか**です。」\u003c/p>\u003cp>「例えば提出確認欄に『未提出』と入力されていても、COUNTAはそれを1件として数えます。提出済みだけを数えたいなら、COUNTIF関数で『提出済』という条件を指定する必要があります。」\u003c/p>\u003cp>## D｜具体例：実際にCOUNTAを操作してみましょう\u003c/p>\u003cp>「では先輩、セルの内容を変えながら、COUNTとCOUNTAの違いを確かめてみましょう。」\u003c/p>\u003cp>{@body const opts=[{value:\"text\",label:\"文字列（田中）\"},{value:\"number\",label:\"数値（100）\"},{value:\"zero\",label:\"数値（0）\"},{value:\"empty\",label:\"完全な空白\"},{value:\"formula\",label:'数式 =\"\"'},{value:\"space\",label:\"半角スペース\"},{value:\"error\",label:\"エラー（#N/A）\"}]}\u003cbr>{@body const [cells,setCells]=DIL.useState([\"text\",\"number\",\"empty\",\"zero\",\"formula\"])}\u003cbr>{@body const counta=cells.filter(v=&gt;v!==\"empty\").length}\u003cbr>{@body const count=cells.filter(v=&gt;v===\"number\"||v===\"zero\").length}\u003cbr>{@body const blank=cells.filter(v=&gt;v===\"empty\"||v===\"formula\").length}\u003cbr>{@body const displays={text:\"田中\",number:\"100\",zero:\"0\",empty:\"（空白）\",formula:'=\"\" → 表示は空白',space:\"（半角スペース）\",error:\"#N/A\"}}\u003cbr>&lt;box border radius=\"xl\" padding={3} gap={3}&gt;\u003cbr>  &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>    **COUNTA練習シミュレーター**\u003cbr>    &lt;badge&gt;操作できます&lt;/badge&gt;\u003cbr>  &lt;/row&gt;\u003cbr>  &lt;text color=\"secondary\" size=\"sm\"&gt;A1〜A5の内容を変更してみましょう。&lt;/text&gt;\u003cbr>  {#each cells as c,i}\u003cbr>    &lt;row key={i} align=\"center\" gap={2}&gt;\u003cbr>      &lt;box width=\"34px\" align=\"center\"&gt;\u003cbr>        &lt;text weight=\"medium\" color=\"secondary\" size=\"sm\"&gt;A{i+1}&lt;/text&gt;\u003cbr>      &lt;/box&gt;\u003cbr>      &lt;box flex=\"1\" gap={1}&gt;\u003cbr>        &lt;select block size=\"md\" value={c} options={opts} onChange={v=&gt;setCells(prev=&gt;prev.map((x,j)=&gt;j===i?v:x))}/&gt;\u003cbr>      &lt;/box&gt;\u003cbr>    &lt;/row&gt;\u003cbr>  {/each}\u003cbr>  &lt;box background=\"surface-secondary\" radius=\"lg\" padding={3} gap={3}&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"xs\"&gt;関数の計算結果&lt;/text&gt;\u003cbr>    &lt;grid columns={3} gap={2}&gt;\u003cbr>      &lt;grid-item&gt;\u003cbr>        &lt;box gap={1} align=\"center\"&gt;\u003cbr>          &lt;text size=\"xs\" color=\"secondary\"&gt;COUNT&lt;/text&gt;\u003cbr>          &lt;title size=\"2xl\" tabularNums&gt;{count}&lt;/title&gt;\u003cbr>          &lt;caption&gt;数値&lt;/caption&gt;\u003cbr>        &lt;/box&gt;\u003cbr>      &lt;/grid-item&gt;\u003cbr>      &lt;grid-item&gt;\u003cbr>        &lt;box gap={1} align=\"center\"&gt;\u003cbr>          &lt;text size=\"xs\" color=\"secondary\"&gt;COUNTA&lt;/text&gt;\u003cbr>          &lt;title size=\"2xl\" color=\"success\" tabularNums&gt;{counta}&lt;/title&gt;\u003cbr>          &lt;caption&gt;空白以外&lt;/caption&gt;\u003cbr>        &lt;/box&gt;\u003cbr>      &lt;/grid-item&gt;\u003cbr>      &lt;grid-item&gt;\u003cbr>        &lt;box gap={1} align=\"center\"&gt;\u003cbr>          &lt;text size=\"xs\" color=\"secondary\"&gt;COUNTBLANK&lt;/text&gt;\u003cbr>          &lt;title size=\"2xl\" tabularNums&gt;{blank}&lt;/title&gt;\u003cbr>          &lt;caption&gt;空白扱い&lt;/caption&gt;\u003cbr>        &lt;/box&gt;\u003cbr>      &lt;/grid-item&gt;\u003cbr>    &lt;/grid&gt;\u003cbr>    &lt;divider color=\"subtle\"/&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"xs\"&gt;COUNTAの数式&lt;/text&gt;\u003cbr>    &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>      **=COUNTA(A1:A5)**\u003cbr>      &lt;button size=\"xs\" variant=\"outline\" color=\"secondary\" onClick={()=&gt;GenUI.copy(\"=COUNTA(A1:A5)\")}&gt;&lt;icon name=\"copy\" size=\"xs\"/&gt; コピー&lt;/button&gt;\u003cbr>    &lt;/row&gt;\u003cbr>    &lt;text size=\"sm\"&gt;5セルのうち、{counta}セルが空白ではないため、結果は **{counta}** です。&lt;/text&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;button block variant=\"outline\" color=\"secondary\" onClick={()=&gt;setCells([\"text\",\"number\",\"empty\",\"zero\",\"formula\"])}&gt;初期値に戻す&lt;/button&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>「先輩、特に『完全な空白』と『数式 `=\"\"`』を切り替えてみてください。見た目はどちらも空白なのに、COUNTAの結果が変わりますよね。」\u003c/p>\u003cp>「なお、COUNTBLANKは空文字列 `\"\"` を返す数式も空白として数えるため、COUNTAとCOUNTBLANKの結果を足しても、必ずしもセルの総数にはなりません。」\u003c/p>\u003cp>### 実務例①：社員名簿の登録件数\u003c/p>\u003cp>A列に社員名が入力されている場合、\u003c/p>\u003cp>「これで社員名が入力されているセルの数を数えられます。ただし、同じ社員が2回登録されていれば2件として数えます。」\u003c/p>\u003cp>### 実務例②：銀行明細の入力件数\u003c/p>\u003cp>「例えば、銀行明細の取引番号がA列に並んでいるとします。」\u003c/p>\u003cp>これで取引番号が入力されたセル数を確認できます。\u003c/p>\u003cp>「ただし、取引番号がない行や、数式だけが入った行があれば、実際の取引件数とは一致しない可能性があります。」\u003c/p>\u003cp>### 実務例③：入力漏れを確認する\u003c/p>\u003cp>「先輩、今度はCOUNTAとIFを組み合わせてみましょう。」\u003c/p>\u003cp>A2からD2までの4項目がすべて入力されているかを確認します。\u003c/p>\u003cp>「COUNTAの結果が4なら『入力完了』、4未満なら『未入力あり』です。」\u003c/p>\u003cp>ただし、`=\"\"` を返す数式もCOUNTAで数えられるので、見た目の空欄まで厳密に判定したい場合は別の方法が必要です。\u003c/p>\u003cp>## 理解確認：3問\u003c/p>\u003cp>{@body const qs=[{q:\"COUNTA関数が数えるものはどれですか？\",opts:[\"数値が入ったセルだけ\",\"空白ではないセル\",\"空白セルだけ\"],a:1,exp:\"COUNTAは文字列、数値、論理値、エラー値など、空白ではないセルを数えます。\"},{q:'セルに数式 =\"\" が入力され、見た目が空白の場合、COUNTAはどう扱いますか？',opts:[\"数えない\",\"1件として数える\",\"エラーになる\"],a:1,exp:\"数式が入力されているため、COUNTAでは数えられます。見た目が空白でも完全な空白セルとは異なります。\"},{q:\"A1:A5に「100、田中、空白、200、完了」がある場合、COUNTAの結果は？\",opts:[\"2\",\"3\",\"4\",\"5\"],a:2,exp:\"100、田中、200、完了の4セルが空白ではないので、結果は4です。\"}]}\u003cbr>{@body const [answers,setAnswers]=DIL.useState({})}\u003cbr>&lt;box border radius=\"lg\" padding={3} gap={3}&gt;\u003cbr>  {#each qs as q,i}\u003cbr>    &lt;box key={i} gap={2}&gt;\u003cbr>      **Q{i+1}. {q.q}**\u003cbr>      &lt;radio-group direction=\"col\" value={answers[i]===undefined?\"\":String(answers[i])} onChange={v=&gt;setAnswers(p=&gt;({...p,[i]:Number(v)}))}&gt;\u003cbr>        {#each q.opts as opt,j}\u003cbr>          &lt;radio value={String(j)}&gt;{opt}&lt;/radio&gt;\u003cbr>        {/each}\u003cbr>      &lt;/radio-group&gt;\u003cbr>      {#if answers[i]!==undefined}\u003cbr>        &lt;box background=\"surface-secondary\" padding={2} radius=\"md\" gap={1}&gt;\u003cbr>          &lt;row align=\"center\" gap={2}&gt;\u003cbr>            &lt;icon name={answers[i]===q.a?\"check-circle\":\"x-circle\"} color={answers[i]===q.a?\"success\":\"danger\"}/&gt;\u003cbr>            **{answers[i]===q.a?\"正解です！\":\"不正解です\"}**\u003cbr>          &lt;/row&gt;\u003cbr>          &lt;text size=\"sm\"&gt;正解：{q.opts[q.a]}。{q.exp}&lt;/text&gt;\u003cbr>        &lt;/box&gt;\u003cbr>      {/if}\u003cbr>    &lt;/box&gt;\u003cbr>    {#if i!==2}&lt;divider color=\"subtle\"/&gt;{/if}\u003cbr>  {/each}\u003cbr>  &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"sm\"&gt;正解数：{qs.filter((q,i)=&gt;answers[i]===q.a).length} / 3&lt;/text&gt;\u003cbr>    &lt;button size=\"sm\" variant=\"outline\" color=\"secondary\" onClick={()=&gt;setAnswers({})}&gt;再挑戦&lt;/button&gt;\u003cbr>  &lt;/row&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>## 30秒復習\u003c/p>\u003cp>「先輩、最後に6つのポイントを整理します。」\u003c/p>\u003cp>1. **何の関数？** 空白ではないセルの数を数える関数。\u003cbr>2. **一番重要なのは？** 数値だけでなく、文字列も数えること。\u003cbr>3. **なぜ便利？** 名簿や入力データの登録件数を簡単に確認できるから。\u003cbr>4. **どういう流れ？** 範囲を指定 → 空白ではないセルを判定 → 個数を返す。\u003cbr>5. **具体例は？** 社員名簿の名前が入力されたセルを数える。\u003cbr>6. **間違えやすいところは？** `=\"\"`を返す数式やスペースも数えること。\u003c/p>\u003cp>## 一文記憶\u003c/p>\u003cp>**COUNTAは「数字でも文字でも、空白ではないセルを数える」関数。**\u003c/p>\u003cp>「先輩、これでVLOOKUP、XLOOKUP、IF、SUMIF、IFERROR、COUNTAの6つを学習しましたね。」\u003c/p>\u003cp>「特にCOUNTAは、COUNTやCOUNTBLANKと比較して覚えると、実務での使い分けがずっと簡単になります。見た目が空白でも数式が入っている場合があること、そこまで覚えておけば十分実践的ですよ。」\u003c/p>","originalText":"# ⑥ COUNTA関数（カウントエー関数）\u003ctext color=\"secondary\" size=\"sm\">Excel関数｜データ集計｜COUNT・COUNTBLANKとの違い\u003c/text>## A｜要点：COUNTA関数とは？「先輩、今回はCOUNTA関数ですね。ここまでSUMIFやIFERRORなどを勉強してきましたけど、今回はもっとシンプルで、しかも実務でよく使う関数です。」**COUNTA関数とは、指定した範囲の中で、空白ではないセルの個数を数える関数です。**例えば、社員名簿があったとします。\u003cbox border radius=\"lg\" padding={3} gap={2}>  **社員名簿の例**  | 行 | A列：社員名 |  |---|---|  | 2 | 田中 |  | 3 | 佐藤 |  | 4 | \u003ctext color=\"tertiary\">（空白）\u003c/text> |  | 5 | 鈴木 |  | 6 | 山本 |  \u003cbox background=\"surface-secondary\" radius=\"md\" padding={3} gap={1}>    \u003ctext color=\"secondary\" size=\"xs\">入力されているセルの数\u003c/text>    \u003crow align=\"center\" justify=\"between\">      **=COUNTA(A2:A6)**      \u003ctitle size=\"2xl\" color=\"success\">4件\u003c/title>    \u003c/row>  \u003c/box>\u003c/box>「5行あるのに、結果は4件ですね。どうしてか分かりますか？」「そうです。A4が空白だからです。COUNTAは行数を数えるのではなく、**値が入っているセルの数を数える**んです。」ただし、文字だけではなく、数値や日付、TRUE・FALSEなども数えます。## B｜詳しい解説：COUNTAの仕組み### 1. 基本の書き方「先輩、基本的には数えたい範囲を指定するだけです。」これはA2からA10までの9セルについて、空白ではないセルの数を返します。複数の範囲を指定することもできます。「この場合は、A列とC列の指定範囲をそれぞれ数えて、合計します。」### 2. 何がカウントされる？「ここが一番大事です。COUNTAは数字だけを数えるわけではありません。」| セルの内容 | COUNTAで数える？ ||---|---|| `100` | 数える || `田中` | 数える || `2026/10/26` | 数える || `TRUE` | 数える || `0` | 数える || エラー値 `#N/A` | 数える || 完全な空白セル | 数えない || 数式 `=\"\"` の結果 | 数える || スペースだけの文字列 | 数える |「先輩、特に注意してほしいのは、**見た目が空白でも、実際には何か入っているセルがある**ことです。」例えば、この式は、A2が空白なら空文字列 `\"\"` を返します。画面上は何も表示されませんが、数式が入っているセルなのでCOUNTAでは1件と数えられます。「見た目が空白だからといって、必ず0件になるわけではありませんよ。」### 3. COUNT・COUNTA・COUNTBLANKの違い「先輩、名前が似ている関数を整理しましょう。」| 関数 | 数える対象 ||---|---|| COUNT | 数値が入ったセル || COUNTA | 空白ではないセル || COUNTBLANK | 空白セル |例えば、次のような範囲を考えてください。| セル | 内容 ||---|---|| A1 | 100 || A2 | 田中 || A3 | 空白 || A4 | 200 || A5 | 完了 |この場合、- `=COUNT(A1:A5)` → **2**- `=COUNTA(A1:A5)` → **4**- `=COUNTBLANK(A1:A5)` → **1**「COUNTは数値だけ。COUNTAは文字も数値も。COUNTBLANKは空白を数える。この違いですね。」なお、COUNTはExcel内部で数値として扱われる日付や時刻も数えます。## C｜イメージ理解：出席簿の記入欄「先輩、COUNTAは出席簿の記入欄を確認する作業に似ています。」例えば、5人分の提出確認欄があり、提出した人には何か記入されているとします。\u003cbox border radius=\"lg\" padding={3} gap={2}>  \u003csvg viewBox=\"0 0 330 188\" width=\"100%\">    {#each [{name:\"田中\",val:\"提出済\",ok:true},{name:\"佐藤\",val:\"提出済\",ok:true},{name:\"鈴木\",val:\"\",ok:false},{name:\"山本\",val:\"提出済\",ok:true},{name:\"高橋\",val:\"提出済\",ok:true}] as p,i}      \u003crect x=\"12\" y={8+i*30} width=\"306\" height=\"26\" rx=\"5\" fill={p.ok?\"#16a34a\":\"#64748b\"} fillOpacity={p.ok?\".09\":\".06\"} stroke={p.ok?\"#16a34a\":\"#94a3b8\"} strokeOpacity=\".5\"/>      \u003ctext x=\"27\" y={26+i*30} fontSize=\"12\" fill=\"currentColor\">{p.name}\u003c/text>      \u003ctext x=\"178\" y={26+i*30} textAnchor=\"middle\" fontSize=\"12\" fill={p.ok?\"#16a34a\":\"currentColor\"}>{p.ok?p.val:\"未記入\"}\u003c/text>      {#if p.ok}        \u003cpath d={`M280 ${17+i*30} l5 5 l10 -12`} stroke=\"#16a34a\" strokeWidth=\"2.3\" fill=\"none\" strokeLinecap=\"round\"/>      {/if}    {/each}    \u003ctext x=\"165\" y=\"177\" textAnchor=\"middle\" fontSize=\"14\" fontWeight=\"bold\" fill=\"#16a34a\">記入あり：4件\u003c/text>  \u003c/svg>  \u003ccaption>5人分の欄のうち、4つに文字が入力されています。COUNTAの結果は4です。\u003c/caption>\u003c/box>「でも先輩、ここで気をつけてください。」「COUNTAが分かるのは、あくまで**セルに何か入っているかどうか**です。」「例えば提出確認欄に『未提出』と入力されていても、COUNTAはそれを1件として数えます。提出済みだけを数えたいなら、COUNTIF関数で『提出済』という条件を指定する必要があります。」## D｜具体例：実際にCOUNTAを操作してみましょう「では先輩、セルの内容を変えながら、COUNTとCOUNTAの違いを確かめてみましょう。」{@body const opts=[{value:\"text\",label:\"文字列（田中）\"},{value:\"number\",label:\"数値（100）\"},{value:\"zero\",label:\"数値（0）\"},{value:\"empty\",label:\"完全な空白\"},{value:\"formula\",label:'数式 =\"\"'},{value:\"space\",label:\"半角スペース\"},{value:\"error\",label:\"エラー（#N/A）\"}]}{@body const [cells,setCells]=DIL.useState([\"text\",\"number\",\"empty\",\"zero\",\"formula\"])}{@body const counta=cells.filter(v=>v!==\"empty\").length}{@body const count=cells.filter(v=>v===\"number\"||v===\"zero\").length}{@body const blank=cells.filter(v=>v===\"empty\"||v===\"formula\").length}{@body const displays={text:\"田中\",number:\"100\",zero:\"0\",empty:\"（空白）\",formula:'=\"\" → 表示は空白',space:\"（半角スペース）\",error:\"#N/A\"}}\u003cbox border radius=\"xl\" padding={3} gap={3}>  \u003crow align=\"center\" justify=\"between\">    **COUNTA練習シミュレーター**    \u003cbadge>操作できます\u003c/badge>  \u003c/row>  \u003ctext color=\"secondary\" size=\"sm\">A1〜A5の内容を変更してみましょう。\u003c/text>  {#each cells as c,i}    \u003crow key={i} align=\"center\" gap={2}>      \u003cbox width=\"34px\" align=\"center\">        \u003ctext weight=\"medium\" color=\"secondary\" size=\"sm\">A{i+1}\u003c/text>      \u003c/box>      \u003cbox flex=\"1\" gap={1}>        \u003cselect block size=\"md\" value={c} options={opts} onChange={v=>setCells(prev=>prev.map((x,j)=>j===i?v:x))}/>      \u003c/box>    \u003c/row>  {/each}  \u003cbox background=\"surface-secondary\" radius=\"lg\" padding={3} gap={3}>    \u003ctext color=\"secondary\" size=\"xs\">関数の計算結果\u003c/text>    \u003cgrid columns={3} gap={2}>      \u003cgrid-item>        \u003cbox gap={1} align=\"center\">          \u003ctext size=\"xs\" color=\"secondary\">COUNT\u003c/text>          \u003ctitle size=\"2xl\" tabularNums>{count}\u003c/title>          \u003ccaption>数値\u003c/caption>        \u003c/box>      \u003c/grid-item>      \u003cgrid-item>        \u003cbox gap={1} align=\"center\">          \u003ctext size=\"xs\" color=\"secondary\">COUNTA\u003c/text>          \u003ctitle size=\"2xl\" color=\"success\" tabularNums>{counta}\u003c/title>          \u003ccaption>空白以外\u003c/caption>        \u003c/box>      \u003c/grid-item>      \u003cgrid-item>        \u003cbox gap={1} align=\"center\">          \u003ctext size=\"xs\" color=\"secondary\">COUNTBLANK\u003c/text>          \u003ctitle size=\"2xl\" tabularNums>{blank}\u003c/title>          \u003ccaption>空白扱い\u003c/caption>        \u003c/box>      \u003c/grid-item>    \u003c/grid>    \u003cdivider color=\"subtle\"/>    \u003ctext color=\"secondary\" size=\"xs\">COUNTAの数式\u003c/text>    \u003crow align=\"center\" justify=\"between\">      **=COUNTA(A1:A5)**      \u003cbutton size=\"xs\" variant=\"outline\" color=\"secondary\" onClick={()=>GenUI.copy(\"=COUNTA(A1:A5)\")}>\u003cicon name=\"copy\" size=\"xs\"/> コピー\u003c/button>    \u003c/row>    \u003ctext size=\"sm\">5セルのうち、{counta}セルが空白ではないため、結果は **{counta}** です。\u003c/text>  \u003c/box>  \u003cbutton block variant=\"outline\" color=\"secondary\" onClick={()=>setCells([\"text\",\"number\",\"empty\",\"zero\",\"formula\"])}>初期値に戻す\u003c/button>\u003c/box>「先輩、特に『完全な空白』と『数式 `=\"\"`』を切り替えてみてください。見た目はどちらも空白なのに、COUNTAの結果が変わりますよね。」「なお、COUNTBLANKは空文字列 `\"\"` を返す数式も空白として数えるため、COUNTAとCOUNTBLANKの結果を足しても、必ずしもセルの総数にはなりません。」### 実務例①：社員名簿の登録件数A列に社員名が入力されている場合、「これで社員名が入力されているセルの数を数えられます。ただし、同じ社員が2回登録されていれば2件として数えます。」### 実務例②：銀行明細の入力件数「例えば、銀行明細の取引番号がA列に並んでいるとします。」これで取引番号が入力されたセル数を確認できます。「ただし、取引番号がない行や、数式だけが入った行があれば、実際の取引件数とは一致しない可能性があります。」### 実務例③：入力漏れを確認する「先輩、今度はCOUNTAとIFを組み合わせてみましょう。」A2からD2までの4項目がすべて入力されているかを確認します。「COUNTAの結果が4なら『入力完了』、4未満なら『未入力あり』です。」ただし、`=\"\"` を返す数式もCOUNTAで数えられるので、見た目の空欄まで厳密に判定したい場合は別の方法が必要です。## 理解確認：3問{@body const qs=[{q:\"COUNTA関数が数えるものはどれですか？\",opts:[\"数値が入ったセルだけ\",\"空白ではないセル\",\"空白セルだけ\"],a:1,exp:\"COUNTAは文字列、数値、論理値、エラー値など、空白ではないセルを数えます。\"},{q:'セルに数式 =\"\" が入力され、見た目が空白の場合、COUNTAはどう扱いますか？',opts:[\"数えない\",\"1件として数える\",\"エラーになる\"],a:1,exp:\"数式が入力されているため、COUNTAでは数えられます。見た目が空白でも完全な空白セルとは異なります。\"},{q:\"A1:A5に「100、田中、空白、200、完了」がある場合、COUNTAの結果は？\",opts:[\"2\",\"3\",\"4\",\"5\"],a:2,exp:\"100、田中、200、完了の4セルが空白ではないので、結果は4です。\"}]}{@body const [answers,setAnswers]=DIL.useState({})}\u003cbox border radius=\"lg\" padding={3} gap={3}>  {#each qs as q,i}    \u003cbox key={i} gap={2}>      **Q{i+1}. {q.q}**      \u003cradio-group direction=\"col\" value={answers[i]===undefined?\"\":String(answers[i])} onChange={v=>setAnswers(p=>({...p,[i]:Number(v)}))}>        {#each q.opts as opt,j}          \u003cradio value={String(j)}>{opt}\u003c/radio>        {/each}      \u003c/radio-group>      {#if answers[i]!==undefined}        \u003cbox background=\"surface-secondary\" padding={2} radius=\"md\" gap={1}>          \u003crow align=\"center\" gap={2}>            \u003cicon name={answers[i]===q.a?\"check-circle\":\"x-circle\"} color={answers[i]===q.a?\"success\":\"danger\"}/>            **{answers[i]===q.a?\"正解です！\":\"不正解です\"}**          \u003c/row>          \u003ctext size=\"sm\">正解：{q.opts[q.a]}。{q.exp}\u003c/text>        \u003c/box>      {/if}    \u003c/box>    {#if i!==2}\u003cdivider color=\"subtle\"/>{/if}  {/each}  \u003crow align=\"center\" justify=\"between\">    \u003ctext color=\"secondary\" size=\"sm\">正解数：{qs.filter((q,i)=>answers[i]===q.a).length} / 3\u003c/text>    \u003cbutton size=\"sm\" variant=\"outline\" color=\"secondary\" onClick={()=>setAnswers({})}>再挑戦\u003c/button>  \u003c/row>\u003c/box>## 30秒復習「先輩、最後に6つのポイントを整理します。」1. **何の関数？** 空白ではないセルの数を数える関数。2. **一番重要なのは？** 数値だけでなく、文字列も数えること。3. **なぜ便利？** 名簿や入力データの登録件数を簡単に確認できるから。4. **どういう流れ？** 範囲を指定 → 空白ではないセルを判定 → 個数を返す。5. **具体例は？** 社員名簿の名前が入力されたセルを数える。6. **間違えやすいところは？** `=\"\"`を返す数式やスペースも数えること。## 一文記憶**COUNTAは「数字でも文字でも、空白ではないセルを数える」関数。**「先輩、これでVLOOKUP、XLOOKUP、IF、SUMIF、IFERROR、COUNTAの6つを学習しましたね。」「特にCOUNTAは、COUNTやCOUNTBLANKと比較して覚えると、実務での使い分けがずっと簡単になります。見た目が空白でも数式が入っている場合があること、そこまで覚えておけば十分実践的ですよ。」","sections":{"A":"\u003ch1>⑥ COUNTA関数（カウントエー関数）\u003c/h1>\n\u003cp class=\"muted\">Excel関数｜データ集計｜COUNT・COUNTBLANKとの違い\u003c/p>\u003ch2>A｜要点：COUNTA関数とは？\u003c/h2>\u003cp>「先輩、今回はCOUNTA関数ですね。ここまでSUMIFやIFERRORなどを勉強してきましたけど、今回はもっとシンプルで、しかも実務でよく使う関数です。」\u003c/p>\n\u003cp>\u003cstrong>COUNTA関数とは、指定した範囲の中で、空白ではないセルの個数を数える関数です。\u003c/strong>\u003c/p>\n\u003cp>例えば、社員名簿があったとします。\u003c/p>\n\u003cdiv class=\"source-static\">\u003cdiv>\n  \u003cstrong>社員名簿の例\u003c/strong>\n| 行 | A列：社員名 |\n  |---|---|\n  | 2 | 田中 |\n  | 3 | 佐藤 |\n  | 4 | \u003cspan>（空白）\u003c/span> |\n  | 5 | 鈴木 |\n  | 6 | 山本 |\n\u003cdiv>\n    \u003cspan>入力されているセルの数\u003c/span>\n    \u003cdiv>\n      \u003cstrong>=COUNTA(A2:A6)\u003c/strong>\n      \u003cstrong>4件\u003c/strong>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003c/div>\u003cp>「5行あるのに、結果は4件ですね。どうしてか分かりますか？」\u003c/p>\n\u003cp>「そうです。A4が空白だからです。COUNTAは行数を数えるのではなく、\u003cstrong>値が入っているセルの数を数える\u003c/strong>んです。」\u003c/p>\n\u003cp>ただし、文字だけではなく、数値や日付、TRUE・FALSEなども数えます。\u003c/p>\n","B":"\u003ch2>B｜詳しい解説：COUNTAの仕組み\u003c/h2>\u003ch3>1. 基本の書き方\u003c/h3>\n\u003cp>「先輩、基本的には数えたい範囲を指定するだけです。」\u003c/p>\n\u003cp>これはA2からA10までの9セルについて、空白ではないセルの数を返します。\u003c/p>\n\u003cp>複数の範囲を指定することもできます。\u003c/p>\n\u003cp>「この場合は、A列とC列の指定範囲をそれぞれ数えて、合計します。」\u003c/p>\n\u003ch3>2. 何がカウントされる？\u003c/h3>\n\u003cp>「ここが一番大事です。COUNTAは数字だけを数えるわけではありません。」\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>セルの内容\u003c/th>\n\u003cth>COUNTAで数える？\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>100\u003c/code>\u003c/td>\n\u003ctd>数える\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>田中\u003c/code>\u003c/td>\n\u003ctd>数える\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>2026/10/26\u003c/code>\u003c/td>\n\u003ctd>数える\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>TRUE\u003c/code>\u003c/td>\n\u003ctd>数える\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>0\u003c/code>\u003c/td>\n\u003ctd>数える\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>エラー値 \u003ccode>#N/A\u003c/code>\u003c/td>\n\u003ctd>数える\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>完全な空白セル\u003c/td>\n\u003ctd>数えない\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>数式 \u003ccode>=&quot;&quot;\u003c/code> の結果\u003c/td>\n\u003ctd>数える\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>スペースだけの文字列\u003c/td>\n\u003ctd>数える\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>「先輩、特に注意してほしいのは、\u003cstrong>見た目が空白でも、実際には何か入っているセルがある\u003c/strong>ことです。」\u003c/p>\n\u003cp>例えば、\u003c/p>\n\u003cp>この式は、A2が空白なら空文字列 \u003ccode>&quot;&quot;\u003c/code> を返します。\u003c/p>\n\u003cp>画面上は何も表示されませんが、数式が入っているセルなのでCOUNTAでは1件と数えられます。\u003c/p>\n\u003cp>「見た目が空白だからといって、必ず0件になるわけではありませんよ。」\u003c/p>\n\u003ch3>3. COUNT・COUNTA・COUNTBLANKの違い\u003c/h3>\n\u003cp>「先輩、名前が似ている関数を整理しましょう。」\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>関数\u003c/th>\n\u003cth>数える対象\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>COUNT\u003c/td>\n\u003ctd>数値が入ったセル\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>COUNTA\u003c/td>\n\u003ctd>空白ではないセル\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>COUNTBLANK\u003c/td>\n\u003ctd>空白セル\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>例えば、次のような範囲を考えてください。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>セル\u003c/th>\n\u003cth>内容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A1\u003c/td>\n\u003ctd>100\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A2\u003c/td>\n\u003ctd>田中\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A3\u003c/td>\n\u003ctd>空白\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A4\u003c/td>\n\u003ctd>200\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A5\u003c/td>\n\u003ctd>完了\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>この場合、\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>=COUNT(A1:A5)\u003c/code> → \u003cstrong>2\u003c/strong>\u003c/li>\n\u003cli>\u003ccode>=COUNTA(A1:A5)\u003c/code> → \u003cstrong>4\u003c/strong>\u003c/li>\n\u003cli>\u003ccode>=COUNTBLANK(A1:A5)\u003c/code> → \u003cstrong>1\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cp>「COUNTは数値だけ。COUNTAは文字も数値も。COUNTBLANKは空白を数える。この違いですね。」\u003c/p>\n\u003cp>なお、COUNTはExcel内部で数値として扱われる日付や時刻も数えます。\u003c/p>\n","C":"\u003ch2>C｜イメージ理解：出席簿の記入欄\u003c/h2>\u003cp>「先輩、COUNTAは出席簿の記入欄を確認する作業に似ています。」\u003c/p>\n\u003cp>例えば、5人分の提出確認欄があり、提出した人には何か記入されているとします。\u003c/p>\n\u003cp>「でも先輩、ここで気をつけてください。」\u003c/p>\n\u003cp>「COUNTAが分かるのは、あくまで\u003cstrong>セルに何か入っているかどうか\u003c/strong>です。」\u003c/p>\n\u003cp>「例えば提出確認欄に『未提出』と入力されていても、COUNTAはそれを1件として数えます。提出済みだけを数えたいなら、COUNTIF関数で『提出済』という条件を指定する必要があります。」\u003c/p>\n","D":"\u003ch2>D｜具体例：実際にCOUNTAを操作してみましょう\u003c/h2>\u003cp>「では先輩、セルの内容を変えながら、COUNTとCOUNTAの違いを確かめてみましょう。」\u003c/p>\n\u003cp>「先輩、特に『完全な空白』と『数式 \u003ccode>=&quot;&quot;\u003c/code>』を切り替えてみてください。見た目はどちらも空白なのに、COUNTAの結果が変わりますよね。」\u003c/p>\n\u003cp>「なお、COUNTBLANKは空文字列 \u003ccode>&quot;&quot;\u003c/code> を返す数式も空白として数えるため、COUNTAとCOUNTBLANKの結果を足しても、必ずしもセルの総数にはなりません。」\u003c/p>\n\u003ch3>実務例①：社員名簿の登録件数\u003c/h3>\n\u003cp>A列に社員名が入力されている場合、\u003c/p>\n\u003cp>「これで社員名が入力されているセルの数を数えられます。ただし、同じ社員が2回登録されていれば2件として数えます。」\u003c/p>\n\u003ch3>実務例②：銀行明細の入力件数\u003c/h3>\n\u003cp>「例えば、銀行明細の取引番号がA列に並んでいるとします。」\u003c/p>\n\u003cp>これで取引番号が入力されたセル数を確認できます。\u003c/p>\n\u003cp>「ただし、取引番号がない行や、数式だけが入った行があれば、実際の取引件数とは一致しない可能性があります。」\u003c/p>\n\u003ch3>実務例③：入力漏れを確認する\u003c/h3>\n\u003cp>「先輩、今度はCOUNTAとIFを組み合わせてみましょう。」\u003c/p>\n\u003cp>A2からD2までの4項目がすべて入力されているかを確認します。\u003c/p>\n\u003cp>「COUNTAの結果が4なら『入力完了』、4未満なら『未入力あり』です。」\u003c/p>\n\u003cp>ただし、\u003ccode>=&quot;&quot;\u003c/code> を返す数式もCOUNTAで数えられるので、見た目の空欄まで厳密に判定したい場合は別の方法が必要です。\u003c/p>\n","その他":"\u003ch2>理解確認：3問\u003c/h2>\u003ch2>30秒復習\u003c/h2>\u003cp>「先輩、最後に6つのポイントを整理します。」\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>何の関数？\u003c/strong> 空白ではないセルの数を数える関数。\u003c/li>\n\u003cli>\u003cstrong>一番重要なのは？\u003c/strong> 数値だけでなく、文字列も数えること。\u003c/li>\n\u003cli>\u003cstrong>なぜ便利？\u003c/strong> 名簿や入力データの登録件数を簡単に確認できるから。\u003c/li>\n\u003cli>\u003cstrong>どういう流れ？\u003c/strong> 範囲を指定 → 空白ではないセルを判定 → 個数を返す。\u003c/li>\n\u003cli>\u003cstrong>具体例は？\u003c/strong> 社員名簿の名前が入力されたセルを数える。\u003c/li>\n\u003cli>\u003cstrong>間違えやすいところは？\u003c/strong> \u003ccode>=&quot;&quot;\u003c/code>を返す数式やスペースも数えること。\u003c/li>\n\u003c/ol>\n\u003ch2>一文記憶\u003c/h2>\u003cp>\u003cstrong>COUNTAは「数字でも文字でも、空白ではないセルを数える」関数。\u003c/strong>\u003c/p>\n\u003cp>「先輩、これでVLOOKUP、XLOOKUP、IF、SUMIF、IFERROR、COUNTAの6つを学習しましたね。」\u003c/p>\n\u003cp>「特にCOUNTAは、COUNTやCOUNTBLANKと比較して覚えると、実務での使い分けがずっと簡単になります。見た目が空白でも数式が入っている場合があること、そこまで覚えておけば十分実践的ですよ。」\u003c/p>\n"},"prose":["# ⑥ COUNTA関数（カウントエー関数）","Excel関数｜データ集計｜COUNT・COUNTBLANKとの違い","## A｜要点：COUNTA関数とは？","「先輩、今回はCOUNTA関数ですね。ここまでSUMIFやIFERRORなどを勉強してきましたけど、今回はもっとシンプルで、しかも実務でよく使う関数です。」","**COUNTA関数とは、指定した範囲の中で、空白ではないセルの個数を数える関数です。**","例えば、社員名簿があったとします。","「5行あるのに、結果は4件ですね。どうしてか分かりますか？」","「そうです。A4が空白だからです。COUNTAは行数を数えるのではなく、**値が入っているセルの数を数える**んです。」","ただし、文字だけではなく、数値や日付、TRUE・FALSEなども数えます。","## B｜詳しい解説：COUNTAの仕組み","### 1. 基本の書き方","「先輩、基本的には数えたい範囲を指定するだけです。」","これはA2からA10までの9セルについて、空白ではないセルの数を返します。","複数の範囲を指定することもできます。","「この場合は、A列とC列の指定範囲をそれぞれ数えて、合計します。」","### 2. 何がカウントされる？","「ここが一番大事です。COUNTAは数字だけを数えるわけではありません。」","| セルの内容 | COUNTAで数える？ |\n|---|---|\n| `100` | 数える |\n| `田中` | 数える |\n| `2026/10/26` | 数える |\n| `TRUE` | 数える |\n| `0` | 数える |\n| エラー値 `#N/A` | 数える |\n| 完全な空白セル | 数えない |\n| 数式 `=\"\"` の結果 | 数える |\n| スペースだけの文字列 | 数える |","「先輩、特に注意してほしいのは、**見た目が空白でも、実際には何か入っているセルがある**ことです。」","例えば、","この式は、A2が空白なら空文字列 `\"\"` を返します。","画面上は何も表示されませんが、数式が入っているセルなのでCOUNTAでは1件と数えられます。","「見た目が空白だからといって、必ず0件になるわけではありませんよ。」","### 3. COUNT・COUNTA・COUNTBLANKの違い","「先輩、名前が似ている関数を整理しましょう。」","| 関数 | 数える対象 |\n|---|---|\n| COUNT | 数値が入ったセル |\n| COUNTA | 空白ではないセル |\n| COUNTBLANK | 空白セル |","例えば、次のような範囲を考えてください。","| セル | 内容 |\n|---|---|\n| A1 | 100 |\n| A2 | 田中 |\n| A3 | 空白 |\n| A4 | 200 |\n| A5 | 完了 |","この場合、","- `=COUNT(A1:A5)` → **2**\n- `=COUNTA(A1:A5)` → **4**\n- `=COUNTBLANK(A1:A5)` → **1**","「COUNTは数値だけ。COUNTAは文字も数値も。COUNTBLANKは空白を数える。この違いですね。」","なお、COUNTはExcel内部で数値として扱われる日付や時刻も数えます。","## C｜イメージ理解：出席簿の記入欄","「先輩、COUNTAは出席簿の記入欄を確認する作業に似ています。」","例えば、5人分の提出確認欄があり、提出した人には何か記入されているとします。","「でも先輩、ここで気をつけてください。」","「COUNTAが分かるのは、あくまで**セルに何か入っているかどうか**です。」","「例えば提出確認欄に『未提出』と入力されていても、COUNTAはそれを1件として数えます。提出済みだけを数えたいなら、COUNTIF関数で『提出済』という条件を指定する必要があります。」","## D｜具体例：実際にCOUNTAを操作してみましょう","「では先輩、セルの内容を変えながら、COUNTとCOUNTAの違いを確かめてみましょう。」","「先輩、特に『完全な空白』と『数式 `=\"\"`』を切り替えてみてください。見た目はどちらも空白なのに、COUNTAの結果が変わりますよね。」","「なお、COUNTBLANKは空文字列 `\"\"` を返す数式も空白として数えるため、COUNTAとCOUNTBLANKの結果を足しても、必ずしもセルの総数にはなりません。」","### 実務例①：社員名簿の登録件数","A列に社員名が入力されている場合、","「これで社員名が入力されているセルの数を数えられます。ただし、同じ社員が2回登録されていれば2件として数えます。」","### 実務例②：銀行明細の入力件数","「例えば、銀行明細の取引番号がA列に並んでいるとします。」","これで取引番号が入力されたセル数を確認できます。","「ただし、取引番号がない行や、数式だけが入った行があれば、実際の取引件数とは一致しない可能性があります。」","### 実務例③：入力漏れを確認する","「先輩、今度はCOUNTAとIFを組み合わせてみましょう。」","A2からD2までの4項目がすべて入力されているかを確認します。","「COUNTAの結果が4なら『入力完了』、4未満なら『未入力あり』です。」","ただし、`=\"\"` を返す数式もCOUNTAで数えられるので、見た目の空欄まで厳密に判定したい場合は別の方法が必要です。","## 理解確認：3問","## 30秒復習","「先輩、最後に6つのポイントを整理します。」","1. **何の関数？** 空白ではないセルの数を数える関数。\n2. **一番重要なのは？** 数値だけでなく、文字列も数えること。\n3. **なぜ便利？** 名簿や入力データの登録件数を簡単に確認できるから。\n4. **どういう流れ？** 範囲を指定 → 空白ではないセルを判定 → 個数を返す。\n5. **具体例は？** 社員名簿の名前が入力されたセルを数える。\n6. **間違えやすいところは？** `=\"\"`を返す数式やスペースも数えること。","## 一文記憶","**COUNTAは「数字でも文字でも、空白ではないセルを数える」関数。**","「先輩、これでVLOOKUP、XLOOKUP、IF、SUMIF、IFERROR、COUNTAの6つを学習しましたね。」","「特にCOUNTAは、COUNTやCOUNTBLANKと比較して覚えると、実務での使い分けがずっと簡単になります。見た目が空白でも数式が入っている場合があること、そこまで覚えておけば十分実践的ですよ。」"],"quizzes":[{"q":"COUNTA関数が数えるものはどれですか？","options":["数値が入ったセルだけ","空白ではないセル","空白セルだけ"],"correct":1,"explain":"COUNTAは文字列、数値、論理値、エラー値など、空白ではないセルを数えます。"},{"q":"セルに数式 =\"\" が入力され、見た目が空白の場合、COUNTAはどう扱いますか？","options":["数えない","1件として数える","エラーになる"],"correct":1,"explain":"数式が入力されているため、COUNTAでは数えられます。見た目が空白でも完全な空白セルとは異なります。"},{"q":"A1:A5に「100、田中、空白、200、完了」がある場合、COUNTAの結果は？","options":["2","3","4","5"],"correct":2,"explain":"100、田中、200、完了の4セルが空白ではないので、結果は4です。"}]},{"name":"LEFT・RIGHT・MID","original":"\u003cp># ⑦ LEFT・RIGHT・MID関数\u003c/p>\u003cp>&lt;text color=\"secondary\" size=\"sm\"&gt;Excel関数｜文字列操作｜文字の切り出し&lt;/text&gt;\u003c/p>\u003cp>「先輩、今回は3つまとめて覚えましょう。LEFT、RIGHT、MIDですね。」\u003c/p>\u003cp>「名前は違いますけど、実はどれも**文字列の一部分を取り出す関数**なんです。違うのは、どこから取り出すかだけですよ。」\u003c/p>\u003cp>## A｜要点：3つの関数の違い\u003c/p>\u003cp>&lt;box border radius=\"lg\" padding={3} gap={3}&gt;\u003cbr>  &lt;box gap={1}&gt;\u003cbr>    **元の文字列：ABCDEFG**\u003cbr>    &lt;row justify=\"center\" gap=\"3px\"&gt;\u003cbr>      {#each \"ABCDEFG\".split(\"\") as ch,i}\u003cbr>        &lt;box key={i} background=\"surface-secondary\" border radius=\"sm\" flex=\"1\" height=\"39px\" align=\"center\" justify=\"center\"&gt;\u003cbr>          &lt;text weight=\"medium\"&gt;{ch}&lt;/text&gt;\u003cbr>        &lt;/box&gt;\u003cbr>      {/each}\u003cbr>    &lt;/row&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;box gap={1}&gt;\u003cbr>    &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>      **LEFT（左から）**\u003cbr>      &lt;badge color=\"info\"&gt;ABC&lt;/badge&gt;\u003cbr>    &lt;/row&gt;\u003cbr>    &lt;row justify=\"center\" gap=\"3px\"&gt;\u003cbr>      {#each \"ABCDEFG\".split(\"\") as ch,i}\u003cbr>        &lt;box key={i} flex=\"1\" height=\"37px\" radius=\"sm\" background={i&lt;3?\"rgba(37,99,235,0.17)\":\"surface-secondary\"} border={{size:1,color:i&lt;3?\"info\":\"subtle\"}} align=\"center\" justify=\"center\"&gt;\u003cbr>          &lt;text weight={i&lt;3?\"semibold\":\"normal\"}&gt;{ch}&lt;/text&gt;\u003cbr>        &lt;/box&gt;\u003cbr>      {/each}\u003cbr>    &lt;/row&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;box gap={1}&gt;\u003cbr>    &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>      **RIGHT（右から）**\u003cbr>      &lt;badge color=\"success\"&gt;EFG&lt;/badge&gt;\u003cbr>    &lt;/row&gt;\u003cbr>    &lt;row justify=\"center\" gap=\"3px\"&gt;\u003cbr>      {#each \"ABCDEFG\".split(\"\") as ch,i}\u003cbr>        &lt;box key={i} flex=\"1\" height=\"37px\" radius=\"sm\" background={i&gt;=4?\"rgba(22,163,74,0.15)\":\"surface-secondary\"} border={{size:1,color:i&gt;=4?\"success\":\"subtle\"}} align=\"center\" justify=\"center\"&gt;\u003cbr>          &lt;text weight={i&gt;=4?\"semibold\":\"normal\"}&gt;{ch}&lt;/text&gt;\u003cbr>        &lt;/box&gt;\u003cbr>      {/each}\u003cbr>    &lt;/row&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;box gap={1}&gt;\u003cbr>    &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>      **MID（指定した位置から）**\u003cbr>      &lt;badge color=\"warning\"&gt;CDE&lt;/badge&gt;\u003cbr>    &lt;/row&gt;\u003cbr>    &lt;row justify=\"center\" gap=\"3px\"&gt;\u003cbr>      {#each \"ABCDEFG\".split(\"\") as ch,i}\u003cbr>        &lt;box key={i} flex=\"1\" height=\"37px\" radius=\"sm\" background={i&gt;=2&amp;&amp;i&lt;=4?\"rgba(217,119,6,0.15)\":\"surface-secondary\"} border={{size:1,color:i&gt;=2&amp;&amp;i&lt;=4?\"warning\":\"subtle\"}} align=\"center\" justify=\"center\"&gt;\u003cbr>          &lt;text weight={i&gt;=2&amp;&amp;i&lt;=4?\"semibold\":\"normal\"}&gt;{ch}&lt;/text&gt;\u003cbr>        &lt;/box&gt;\u003cbr>      {/each}\u003cbr>    &lt;/row&gt;\u003cbr>  &lt;/box&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>| 関数 | 取り出す位置 | 結果 |\u003cbr>|---|---|---|\u003cbr>| LEFT | 左から3文字 | ABC |\u003cbr>| RIGHT | 右から3文字 | EFG |\u003cbr>| MID | 左から3文字目を起点に3文字 | CDE |\u003c/p>\u003cp>「つまり、**LEFTは左端、RIGHTは右端、MIDは途中**。まずはこれを覚えれば大丈夫です。」\u003c/p>\u003cp>## B｜詳しい解説：それぞれの仕組み\u003c/p>\u003cp>### 1. LEFT関数\u003c/p>\u003cp>「先輩、LEFTは英語で『左』ですね。だから、文字列の左側から指定した文字数だけ取り出します。」\u003c/p>\u003cp>例えば、A2に「ABC12345」が入っているとします。\u003c/p>\u003cp>結果は **ABC** です。\u003c/p>\u003cp>「左から3文字を取り出すので、A、B、Cになります。4文字目以降は含まれません。」\u003c/p>\u003cp>### 2. RIGHT関数\u003c/p>\u003cp>「RIGHTは『右』です。こちらは右端から指定した文字数を取り出します。」\u003c/p>\u003cp>同じくA2に「ABC12345」がある場合、\u003c/p>\u003cp>結果は **12345** です。\u003c/p>\u003cp>「RIGHTは右から数えますけど、結果の文字の並び順が逆になるわけではありません。『54321』ではなく『12345』ですからね。」\u003c/p>\u003cp>### 3. MID関数\u003c/p>\u003cp>「さて先輩、ここが今回の本題です。MIDは途中から文字を取り出す関数ですが、LEFTやRIGHTより引数が1つ多いんです。」\u003c/p>\u003cp>例えば、\u003c/p>\u003cp>結果は **CDE** です。\u003c/p>\u003cp>「どうしてCDEになるのか、順番に考えましょう。」\u003c/p>\u003cp>&lt;box border radius=\"lg\" padding={3} gap={2}&gt;\u003cbr>  **MIDの位置の数え方**\u003c/p>\u003cp>  &lt;row gap=\"3px\" justify=\"center\"&gt;\u003cbr>    {#each \"ABCDEFG\".split(\"\") as ch,i}\u003cbr>      &lt;box flex=\"1\" align=\"center\" gap={1}&gt;\u003cbr>        &lt;text color=\"secondary\" size=\"xs\"&gt;{i+1}&lt;/text&gt;\u003cbr>        &lt;box width=\"100%\" height=\"39px\" radius=\"sm\" border={{size:1,color:i&gt;=2&amp;&amp;i&lt;=4?\"warning\":\"subtle\"}} background={i&gt;=2&amp;&amp;i&lt;=4?\"rgba(217,119,6,0.15)\":\"surface-secondary\"} align=\"center\" justify=\"center\"&gt;\u003cbr>          **{ch}**\u003cbr>        &lt;/box&gt;\u003cbr>      &lt;/box&gt;\u003cbr>    {/each}\u003cbr>  &lt;/row&gt;\u003cbr>  &lt;row align=\"center\" gap={2}&gt;\u003cbr>    &lt;icon name=\"map-pin\" color=\"warning\"/&gt;\u003cbr>    &lt;text size=\"sm\"&gt;開始位置は3 → Cから数え始める&lt;/text&gt;\u003cbr>  &lt;/row&gt;\u003cbr>  &lt;row align=\"center\" gap={2}&gt;\u003cbr>    &lt;icon name=\"move-horizontal\" color=\"warning\"/&gt;\u003cbr>    &lt;text size=\"sm\"&gt;文字数は3 → C・D・Eの3文字を取得&lt;/text&gt;\u003cbr>  &lt;/row&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>「先輩、MIDで特に間違えやすいのは、**開始位置と文字数を混同すること**です。」\u003c/p>\u003cp>`=MID(\"ABCDEFG\",3,3)` の2つの3は、それぞれ別の意味なんです。\u003c/p>\u003cp>最初の3は「3文字目から」、次の3は「3文字分」です。\u003c/p>\u003cp>### 4. 省略できる引数の違い\u003c/p>\u003cp>| 関数 | 文字数を省略した場合 |\u003cbr>|---|---|\u003cbr>| LEFT | 左から1文字 |\u003cbr>| RIGHT | 右から1文字 |\u003cbr>| MID | 省略できない |\u003c/p>\u003cp>例えば、`=LEFT(\"ABC\")`ならA、`=RIGHT(\"ABC\")`ならCが返ります。\u003c/p>\u003cp>「MIDだけは、開始位置と文字数の両方を指定してくださいね。」\u003c/p>\u003cp>## C｜イメージ理解：長い商品コードを切り分ける\u003c/p>\u003cp>「先輩、例えば会社で商品コードを管理するとしましょう。」\u003c/p>\u003cp>商品コードが `TOK-2026-015` という形式だったとします。\u003c/p>\u003cp>- `TOK`：地域コード\u003cbr>- `2026`：登録年\u003cbr>- `015`：商品番号\u003c/p>\u003cp>「こういう文字列から必要な部分だけを取り出したいときに、3つの関数が役立つんです。」\u003c/p>\u003cp>&lt;box border radius=\"lg\" padding={3} gap={2}&gt;\u003cbr>  &lt;row gap=\"3px\" justify=\"center\" align=\"center\"&gt;\u003cbr>    {#each [{v:\"TOK\",c:\"#2563eb\"},{v:\"-\",c:\"#64748b\"},{v:\"2026\",c:\"#d97706\"},{v:\"-\",c:\"#64748b\"},{v:\"015\",c:\"#16a34a\"}] as s}\u003cbr>      &lt;box flex={s.v===\"-\"?\"0 0 16px\":\"1\"} background={s.c+\"18\"} border={{size:1,color:s.c}} radius=\"md\" padding={{x:1,y:3}} align=\"center\"&gt;\u003cbr>        &lt;text weight=\"medium\" size=\"sm\"&gt;{s.v}&lt;/text&gt;\u003cbr>      &lt;/box&gt;\u003cbr>    {/each}\u003cbr>  &lt;/row&gt;\u003cbr>  &lt;grid columns={3} gap={2}&gt;\u003cbr>    &lt;grid-item&gt;\u003cbr>      &lt;box gap={1} align=\"center\"&gt;\u003cbr>        &lt;text size=\"xs\" color=\"secondary\"&gt;LEFT&lt;/text&gt;\u003cbr>        &lt;title color=\"info\"&gt;TOK&lt;/title&gt;\u003cbr>        &lt;caption&gt;地域&lt;/caption&gt;\u003cbr>      &lt;/box&gt;\u003cbr>    &lt;/grid-item&gt;\u003cbr>    &lt;grid-item&gt;\u003cbr>      &lt;box gap={1} align=\"center\"&gt;\u003cbr>        &lt;text size=\"xs\" color=\"secondary\"&gt;MID&lt;/text&gt;\u003cbr>        &lt;title color=\"warning\"&gt;2026&lt;/title&gt;\u003cbr>        &lt;caption&gt;登録年&lt;/caption&gt;\u003cbr>      &lt;/box&gt;\u003cbr>    &lt;/grid-item&gt;\u003cbr>    &lt;grid-item&gt;\u003cbr>      &lt;box gap={1} align=\"center\"&gt;\u003cbr>        &lt;text size=\"xs\" color=\"secondary\"&gt;RIGHT&lt;/text&gt;\u003cbr>        &lt;title color=\"success\"&gt;015&lt;/title&gt;\u003cbr>        &lt;caption&gt;商品番号&lt;/caption&gt;\u003cbr>      &lt;/box&gt;\u003cbr>    &lt;/grid-item&gt;\u003cbr>  &lt;/grid&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>A2に商品コードが入力されている場合、数式はこうなります。\u003c/p>\u003cp>結果：`TOK`\u003c/p>\u003cp>結果：`2026`\u003c/p>\u003cp>結果：`015`\u003c/p>\u003cp>「先輩、MIDの開始位置が5なのは、ハイフンも1文字として数えるからです。Tが1文字目、Oが2文字目、Kが3文字目、ハイフンが4文字目、2が5文字目ですね。」\u003c/p>\u003cp>「ただし、これは商品コードの形式が一定の場合に有効です。区切りの位置が毎回変わるなら、TEXTBEFOREやTEXTAFTERなどの関数も検討します。」\u003c/p>\u003cp>## D｜具体例：文字を切り出してみましょう\u003c/p>\u003cp>「では先輩、実際に文字数や開始位置を変更して、3つの関数の動きを確かめてみましょう。」\u003c/p>\u003cp>{@body const [source,setSource]=DIL.useState(\"ABC12345\")}\u003cbr>{@body const [fn,setFn]=DIL.useState(\"LEFT\")}\u003cbr>{@body const [start,setStart]=DIL.useState(4)}\u003cbr>{@body const [count,setCount]=DIL.useState(3)}\u003cbr>{@body const chars=Array.from(source)}\u003cbr>{@body const output=fn===\"LEFT\"?chars.slice(0,count).join(\"\"):fn===\"RIGHT\"?chars.slice(Math.max(0,chars.length-count)).join(\"\"):chars.slice(Math.max(0,start-1),Math.max(0,start-1)+count).join(\"\")}\u003cbr>{@body const formula=fn===\"MID\"?\"=MID(A2,\"+start+\",\"+count+\")\":\"=\"+fn+\"(A2,\"+count+\")\"}\u003cbr>&lt;box border radius=\"xl\" padding={3} gap={3}&gt;\u003cbr>  &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>    **文字列切り出しシミュレーター**\u003cbr>    &lt;badge&gt;操作できます&lt;/badge&gt;\u003cbr>  &lt;/row&gt;\u003cbr>  &lt;box gap={1}&gt;\u003cbr>    &lt;label&gt;① 元の文字列（A2）&lt;/label&gt;\u003cbr>    &lt;input value={source} onChange={setSource} placeholder=\"文字列を入力\"/&gt;\u003cbr>    &lt;row gap={1} wrap=\"wrap\"&gt;\u003cbr>      &lt;button size=\"xs\" color=\"secondary\" variant=\"outline\" onClick={()=&gt;setSource(\"ABC12345\")}&gt;ABC12345&lt;/button&gt;\u003cbr>      &lt;button size=\"xs\" color=\"secondary\" variant=\"outline\" onClick={()=&gt;setSource(\"TOK-2026-015\")}&gt;TOK-2026-015&lt;/button&gt;\u003cbr>      &lt;button size=\"xs\" color=\"secondary\" variant=\"outline\" onClick={()=&gt;setSource(\"和歌山営業所\")}&gt;和歌山営業所&lt;/button&gt;\u003cbr>    &lt;/row&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;box gap={1}&gt;\u003cbr>    &lt;label&gt;② 使用する関数&lt;/label&gt;\u003cbr>    &lt;radio-group direction=\"col\" value={fn} onChange={setFn}&gt;\u003cbr>      &lt;radio value=\"LEFT\"&gt;LEFT：左から取り出す&lt;/radio&gt;\u003cbr>      &lt;radio value=\"RIGHT\"&gt;RIGHT：右から取り出す&lt;/radio&gt;\u003cbr>      &lt;radio value=\"MID\"&gt;MID：指定した位置から取り出す&lt;/radio&gt;\u003cbr>    &lt;/radio-group&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  {#if fn===\"MID\"}\u003cbr>    &lt;box gap={1}&gt;\u003cbr>      &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>        &lt;label&gt;③ 開始位置&lt;/label&gt;\u003cbr>        &lt;text weight=\"medium\"&gt;{start}文字目&lt;/text&gt;\u003cbr>      &lt;/row&gt;\u003cbr>      &lt;slider min={1} max={Math.max(1,chars.length+2)} value={Math.min(start,Math.max(1,chars.length+2))} onChange={setStart}/&gt;\u003cbr>    &lt;/box&gt;\u003cbr>  {/if}\u003cbr>  &lt;box gap={1}&gt;\u003cbr>    &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>      &lt;label&gt;{fn===\"MID\"?\"④\":\"③\"} 取り出す文字数&lt;/label&gt;\u003cbr>      &lt;text weight=\"medium\"&gt;{count}文字&lt;/text&gt;\u003cbr>    &lt;/row&gt;\u003cbr>    &lt;slider min={0} max={Math.max(1,chars.length+2)} value={Math.min(count,Math.max(1,chars.length+2))} onChange={setCount}/&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;box gap={2}&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"xs\"&gt;文字の位置と切り出し範囲&lt;/text&gt;\u003cbr>    &lt;row gap=\"3px\" wrap=\"wrap\"&gt;\u003cbr>      {#each chars as ch,i}\u003cbr>        &lt;box key={i} width=\"34px\" align=\"center\" gap={1}&gt;\u003cbr>          &lt;text color=\"secondary\" size=\"3xs\"&gt;{i+1}&lt;/text&gt;\u003cbr>          &lt;box width=\"34px\" height=\"36px\" radius=\"sm\" border={{size:1,color:(fn===\"LEFT\"?i&lt;count:fn===\"RIGHT\"?i&gt;=chars.length-count:i&gt;=start-1&amp;&amp;i&lt;start-1+count)?\"success\":\"subtle\"}} background={(fn===\"LEFT\"?i&lt;count:fn===\"RIGHT\"?i&gt;=chars.length-count:i&gt;=start-1&amp;&amp;i&lt;start-1+count)?\"rgba(22,163,74,0.14)\":\"surface-secondary\"} align=\"center\" justify=\"center\"&gt;\u003cbr>            &lt;text weight=\"medium\" size=\"sm\"&gt;{ch===\" \"?\"␣\":ch}&lt;/text&gt;\u003cbr>          &lt;/box&gt;\u003cbr>        &lt;/box&gt;\u003cbr>      {/each}\u003cbr>    &lt;/row&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;box background=\"surface-secondary\" radius=\"lg\" padding={3} gap={2}&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"xs\"&gt;Excelの数式&lt;/text&gt;\u003cbr>    &lt;row justify=\"between\" align=\"center\" wrap=\"wrap\"&gt;\u003cbr>      &lt;text weight=\"medium\"&gt;{formula}&lt;/text&gt;\u003cbr>      &lt;button size=\"xs\" color=\"secondary\" variant=\"outline\" onClick={()=&gt;GenUI.copy(formula)}&gt;&lt;icon name=\"copy\" size=\"xs\"/&gt; コピー&lt;/button&gt;\u003cbr>    &lt;/row&gt;\u003cbr>    &lt;divider color=\"subtle\"/&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"xs\"&gt;切り出した結果&lt;/text&gt;\u003cbr>    &lt;title color=\"success\" size=\"2xl\"&gt;{output||\"（空文字列）\"}&lt;/title&gt;\u003cbr>    &lt;caption&gt;{fn===\"LEFT\"?\"左端から\"+count+\"文字を取得します。\":fn===\"RIGHT\"?\"右端から\"+count+\"文字を取得します。\":\"左から\"+start+\"文字目を開始位置として、\"+count+\"文字を取得します。\"}&lt;/caption&gt;\u003cbr>  &lt;/box&gt;\u003cbr>  &lt;button block color=\"secondary\" variant=\"outline\" onClick={()=&gt;{setSource(\"ABC12345\");setFn(\"LEFT\");setStart(4);setCount(3)}}&gt;初期値に戻す&lt;/button&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>「先輩、特にMIDを選んで、開始位置と文字数をそれぞれ変えてみてください。どちらを変えるかで結果が違うのが分かるはずです。」\u003c/p>\u003cp>### 実務例①：伝票番号から部署コードを取り出す\u003c/p>\u003cp>例えば、伝票番号が `ACC-2026-001` という形式なら、\u003c/p>\u003cp>結果は `ACC` です。\u003c/p>\u003cp>「先頭3文字が部署コードというルールなら、伝票番号から部署を分類できますね。」\u003c/p>\u003cp>### 実務例②：口座番号の末尾だけを表示する\u003c/p>\u003cp>例えば、A2に文字列として `1234567` が入力されている場合、\u003c/p>\u003cp>結果は `4567` です。\u003c/p>\u003cp>「ただし、LEFT・RIGHT・MIDは取り出した結果を文字列として返します。数字に見えても、数値とは限りません。」\u003c/p>\u003cp>### 実務例③：商品コードの年度を取り出す\u003c/p>\u003cp>A2に `TOK-2026-015` がある場合、\u003c/p>\u003cp>結果は `2026` です。\u003c/p>\u003cp>「ただし、この結果は文字列です。数値として計算したい場合は、VALUE関数などで変換できます。」\u003c/p>\u003cp>「こうすると、文字列の『2026』を数値の2026に変換できます。」\u003c/p>\u003cp>### 注意：文字数は半角・全角で変わる？\u003c/p>\u003cp>「先輩、ここも押さえておきましょう。」\u003c/p>\u003cp>LEFT・RIGHT・MIDでは、通常、全角の日本語も半角英数字もそれぞれ1文字として数えます。\u003c/p>\u003cp>例えば、\u003c/p>\u003cp>結果は **和歌** です。\u003c/p>\u003cp>「全角だから2文字分と数えるわけではありません。バイト数を基準に扱うLEFTB・RIGHTB・MIDBとは区別してくださいね。」\u003c/p>\u003cp>また、これらの関数は文字列を取り出すので、日付や数値の表示形式までそのまま維持するとは限りません。\u003c/p>\u003cp>## 理解確認：3問\u003c/p>\u003cp>{@body const qs=[{q:'=LEFT(\"ABCDEFG\",3) の結果は？',opts:[\"ABC\",\"EFG\",\"CDE\"],a:0,ex:\"LEFTは左端から指定した文字数を取得します。左から3文字なのでABCです。\"},{q:'=RIGHT(\"ABC12345\",4) の結果は？',opts:[\"ABC1\",\"2345\",\"5432\"],a:1,ex:\"RIGHTは右端から4文字を取得します。文字の並び順は逆になりません。\"},{q:'=MID(\"ABCDEFG\",3,2) の結果は？',opts:[\"ABC\",\"CD\",\"DE\"],a:1,ex:\"3文字目のCから2文字を取り出すため、CDです。開始位置と文字数を区別しましょう。\"}]}\u003cbr>{@body const [answers,setAnswers]=DIL.useState({})}\u003cbr>&lt;box border radius=\"lg\" padding={3} gap={3}&gt;\u003cbr>  {#each qs as q,i}\u003cbr>    &lt;box key={i} gap={2}&gt;\u003cbr>      **Q{i+1}. {q.q}**\u003cbr>      &lt;radio-group direction=\"col\" value={answers[i]===undefined?\"\":String(answers[i])} onChange={v=&gt;setAnswers(p=&gt;({...p,[i]:Number(v)}))}&gt;\u003cbr>        {#each q.opts as opt,j}\u003cbr>          &lt;radio value={String(j)}&gt;{opt}&lt;/radio&gt;\u003cbr>        {/each}\u003cbr>      &lt;/radio-group&gt;\u003cbr>      {#if answers[i]!==undefined}\u003cbr>        &lt;box background=\"surface-secondary\" padding={2} radius=\"md\" gap={1}&gt;\u003cbr>          &lt;row align=\"center\" gap={2}&gt;\u003cbr>            &lt;icon name={answers[i]===q.a?\"check-circle\":\"x-circle\"} color={answers[i]===q.a?\"success\":\"danger\"}/&gt;\u003cbr>            **{answers[i]===q.a?\"正解です！\":\"不正解です\"}**\u003cbr>          &lt;/row&gt;\u003cbr>          &lt;text size=\"sm\"&gt;正解：{q.opts[q.a]}。{q.ex}&lt;/text&gt;\u003cbr>        &lt;/box&gt;\u003cbr>      {/if}\u003cbr>    &lt;/box&gt;\u003cbr>    {#if i&lt;2}&lt;divider color=\"subtle\"/&gt;{/if}\u003cbr>  {/each}\u003cbr>  &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>    &lt;text color=\"secondary\" size=\"sm\"&gt;正解数：{qs.filter((q,i)=&gt;answers[i]===q.a).length} / 3&lt;/text&gt;\u003cbr>    &lt;button size=\"sm\" color=\"secondary\" variant=\"outline\" onClick={()=&gt;setAnswers({})}&gt;再挑戦&lt;/button&gt;\u003cbr>  &lt;/row&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>## 30秒復習\u003c/p>\u003cp>「先輩、最後に重要な6つを整理します。」\u003c/p>\u003cp>1. **LEFTとは？** 左端から指定した文字数を取り出す関数。\u003cbr>2. **RIGHTとは？** 右端から指定した文字数を取り出す関数。\u003cbr>3. **MIDとは？** 指定した開始位置から、指定した文字数を取り出す関数。\u003cbr>4. **基本構造は？** `LEFT(文字列,文字数)`、`RIGHT(文字列,文字数)`、`MID(文字列,開始位置,文字数)`。\u003cbr>5. **具体例は？** 商品コードから地域コード・年度・商品番号を切り出す。\u003cbr>6. **間違えやすいところは？** MIDの開始位置と文字数、区切り記号も1文字として数えること、結果が文字列になること。\u003c/p>\u003cp>## 一文記憶\u003c/p>\u003cp>**LEFTは左、RIGHTは右、MIDは途中から、指定した文字数を切り出す関数。**\u003c/p>\u003cp>「先輩、これでVLOOKUP、XLOOKUP、IF、SUMIF、IFERROR、COUNTAに続いて、LEFT・RIGHT・MIDの3つも学習しましたね。」\u003c/p>\u003cp>「今回は3つを別々に丸暗記する必要はありません。**どこから取り出すか**という共通の仕組みで理解しておけば、実際にExcelで使うときにも迷いにくくなりますよ。」\u003c/p>","originalText":"# ⑦ LEFT・RIGHT・MID関数\u003ctext color=\"secondary\" size=\"sm\">Excel関数｜文字列操作｜文字の切り出し\u003c/text>「先輩、今回は3つまとめて覚えましょう。LEFT、RIGHT、MIDですね。」「名前は違いますけど、実はどれも**文字列の一部分を取り出す関数**なんです。違うのは、どこから取り出すかだけですよ。」## A｜要点：3つの関数の違い\u003cbox border radius=\"lg\" padding={3} gap={3}>  \u003cbox gap={1}>    **元の文字列：ABCDEFG**    \u003crow justify=\"center\" gap=\"3px\">      {#each \"ABCDEFG\".split(\"\") as ch,i}        \u003cbox key={i} background=\"surface-secondary\" border radius=\"sm\" flex=\"1\" height=\"39px\" align=\"center\" justify=\"center\">          \u003ctext weight=\"medium\">{ch}\u003c/text>        \u003c/box>      {/each}    \u003c/row>  \u003c/box>  \u003cbox gap={1}>    \u003crow align=\"center\" justify=\"between\">      **LEFT（左から）**      \u003cbadge color=\"info\">ABC\u003c/badge>    \u003c/row>    \u003crow justify=\"center\" gap=\"3px\">      {#each \"ABCDEFG\".split(\"\") as ch,i}        \u003cbox key={i} flex=\"1\" height=\"37px\" radius=\"sm\" background={i\u003c3?\"rgba(37,99,235,0.17)\":\"surface-secondary\"} border={{size:1,color:i\u003c3?\"info\":\"subtle\"}} align=\"center\" justify=\"center\">          \u003ctext weight={i\u003c3?\"semibold\":\"normal\"}>{ch}\u003c/text>        \u003c/box>      {/each}    \u003c/row>  \u003c/box>  \u003cbox gap={1}>    \u003crow align=\"center\" justify=\"between\">      **RIGHT（右から）**      \u003cbadge color=\"success\">EFG\u003c/badge>    \u003c/row>    \u003crow justify=\"center\" gap=\"3px\">      {#each \"ABCDEFG\".split(\"\") as ch,i}        \u003cbox key={i} flex=\"1\" height=\"37px\" radius=\"sm\" background={i>=4?\"rgba(22,163,74,0.15)\":\"surface-secondary\"} border={{size:1,color:i>=4?\"success\":\"subtle\"}} align=\"center\" justify=\"center\">          \u003ctext weight={i>=4?\"semibold\":\"normal\"}>{ch}\u003c/text>        \u003c/box>      {/each}    \u003c/row>  \u003c/box>  \u003cbox gap={1}>    \u003crow align=\"center\" justify=\"between\">      **MID（指定した位置から）**      \u003cbadge color=\"warning\">CDE\u003c/badge>    \u003c/row>    \u003crow justify=\"center\" gap=\"3px\">      {#each \"ABCDEFG\".split(\"\") as ch,i}        \u003cbox key={i} flex=\"1\" height=\"37px\" radius=\"sm\" background={i>=2&&i\u003c=4?\"rgba(217,119,6,0.15)\":\"surface-secondary\"} border={{size:1,color:i>=2&&i\u003c=4?\"warning\":\"subtle\"}} align=\"center\" justify=\"center\">          \u003ctext weight={i>=2&&i\u003c=4?\"semibold\":\"normal\"}>{ch}\u003c/text>        \u003c/box>      {/each}    \u003c/row>  \u003c/box>\u003c/box>| 関数 | 取り出す位置 | 結果 ||---|---|---|| LEFT | 左から3文字 | ABC || RIGHT | 右から3文字 | EFG || MID | 左から3文字目を起点に3文字 | CDE |「つまり、**LEFTは左端、RIGHTは右端、MIDは途中**。まずはこれを覚えれば大丈夫です。」## B｜詳しい解説：それぞれの仕組み### 1. LEFT関数「先輩、LEFTは英語で『左』ですね。だから、文字列の左側から指定した文字数だけ取り出します。」例えば、A2に「ABC12345」が入っているとします。結果は **ABC** です。「左から3文字を取り出すので、A、B、Cになります。4文字目以降は含まれません。」### 2. RIGHT関数「RIGHTは『右』です。こちらは右端から指定した文字数を取り出します。」同じくA2に「ABC12345」がある場合、結果は **12345** です。「RIGHTは右から数えますけど、結果の文字の並び順が逆になるわけではありません。『54321』ではなく『12345』ですからね。」### 3. MID関数「さて先輩、ここが今回の本題です。MIDは途中から文字を取り出す関数ですが、LEFTやRIGHTより引数が1つ多いんです。」例えば、結果は **CDE** です。「どうしてCDEになるのか、順番に考えましょう。」\u003cbox border radius=\"lg\" padding={3} gap={2}>  **MIDの位置の数え方**  \u003crow gap=\"3px\" justify=\"center\">    {#each \"ABCDEFG\".split(\"\") as ch,i}      \u003cbox flex=\"1\" align=\"center\" gap={1}>        \u003ctext color=\"secondary\" size=\"xs\">{i+1}\u003c/text>        \u003cbox width=\"100%\" height=\"39px\" radius=\"sm\" border={{size:1,color:i>=2&&i\u003c=4?\"warning\":\"subtle\"}} background={i>=2&&i\u003c=4?\"rgba(217,119,6,0.15)\":\"surface-secondary\"} align=\"center\" justify=\"center\">          **{ch}**        \u003c/box>      \u003c/box>    {/each}  \u003c/row>  \u003crow align=\"center\" gap={2}>    \u003cicon name=\"map-pin\" color=\"warning\"/>    \u003ctext size=\"sm\">開始位置は3 → Cから数え始める\u003c/text>  \u003c/row>  \u003crow align=\"center\" gap={2}>    \u003cicon name=\"move-horizontal\" color=\"warning\"/>    \u003ctext size=\"sm\">文字数は3 → C・D・Eの3文字を取得\u003c/text>  \u003c/row>\u003c/box>「先輩、MIDで特に間違えやすいのは、**開始位置と文字数を混同すること**です。」`=MID(\"ABCDEFG\",3,3)` の2つの3は、それぞれ別の意味なんです。最初の3は「3文字目から」、次の3は「3文字分」です。### 4. 省略できる引数の違い| 関数 | 文字数を省略した場合 ||---|---|| LEFT | 左から1文字 || RIGHT | 右から1文字 || MID | 省略できない |例えば、`=LEFT(\"ABC\")`ならA、`=RIGHT(\"ABC\")`ならCが返ります。「MIDだけは、開始位置と文字数の両方を指定してくださいね。」## C｜イメージ理解：長い商品コードを切り分ける「先輩、例えば会社で商品コードを管理するとしましょう。」商品コードが `TOK-2026-015` という形式だったとします。- `TOK`：地域コード- `2026`：登録年- `015`：商品番号「こういう文字列から必要な部分だけを取り出したいときに、3つの関数が役立つんです。」\u003cbox border radius=\"lg\" padding={3} gap={2}>  \u003crow gap=\"3px\" justify=\"center\" align=\"center\">    {#each [{v:\"TOK\",c:\"#2563eb\"},{v:\"-\",c:\"#64748b\"},{v:\"2026\",c:\"#d97706\"},{v:\"-\",c:\"#64748b\"},{v:\"015\",c:\"#16a34a\"}] as s}      \u003cbox flex={s.v===\"-\"?\"0 0 16px\":\"1\"} background={s.c+\"18\"} border={{size:1,color:s.c}} radius=\"md\" padding={{x:1,y:3}} align=\"center\">        \u003ctext weight=\"medium\" size=\"sm\">{s.v}\u003c/text>      \u003c/box>    {/each}  \u003c/row>  \u003cgrid columns={3} gap={2}>    \u003cgrid-item>      \u003cbox gap={1} align=\"center\">        \u003ctext size=\"xs\" color=\"secondary\">LEFT\u003c/text>        \u003ctitle color=\"info\">TOK\u003c/title>        \u003ccaption>地域\u003c/caption>      \u003c/box>    \u003c/grid-item>    \u003cgrid-item>      \u003cbox gap={1} align=\"center\">        \u003ctext size=\"xs\" color=\"secondary\">MID\u003c/text>        \u003ctitle color=\"warning\">2026\u003c/title>        \u003ccaption>登録年\u003c/caption>      \u003c/box>    \u003c/grid-item>    \u003cgrid-item>      \u003cbox gap={1} align=\"center\">        \u003ctext size=\"xs\" color=\"secondary\">RIGHT\u003c/text>        \u003ctitle color=\"success\">015\u003c/title>        \u003ccaption>商品番号\u003c/caption>      \u003c/box>    \u003c/grid-item>  \u003c/grid>\u003c/box>A2に商品コードが入力されている場合、数式はこうなります。結果：`TOK`結果：`2026`結果：`015`「先輩、MIDの開始位置が5なのは、ハイフンも1文字として数えるからです。Tが1文字目、Oが2文字目、Kが3文字目、ハイフンが4文字目、2が5文字目ですね。」「ただし、これは商品コードの形式が一定の場合に有効です。区切りの位置が毎回変わるなら、TEXTBEFOREやTEXTAFTERなどの関数も検討します。」## D｜具体例：文字を切り出してみましょう「では先輩、実際に文字数や開始位置を変更して、3つの関数の動きを確かめてみましょう。」{@body const [source,setSource]=DIL.useState(\"ABC12345\")}{@body const [fn,setFn]=DIL.useState(\"LEFT\")}{@body const [start,setStart]=DIL.useState(4)}{@body const [count,setCount]=DIL.useState(3)}{@body const chars=Array.from(source)}{@body const output=fn===\"LEFT\"?chars.slice(0,count).join(\"\"):fn===\"RIGHT\"?chars.slice(Math.max(0,chars.length-count)).join(\"\"):chars.slice(Math.max(0,start-1),Math.max(0,start-1)+count).join(\"\")}{@body const formula=fn===\"MID\"?\"=MID(A2,\"+start+\",\"+count+\")\":\"=\"+fn+\"(A2,\"+count+\")\"}\u003cbox border radius=\"xl\" padding={3} gap={3}>  \u003crow align=\"center\" justify=\"between\">    **文字列切り出しシミュレーター**    \u003cbadge>操作できます\u003c/badge>  \u003c/row>  \u003cbox gap={1}>    \u003clabel>① 元の文字列（A2）\u003c/label>    \u003cinput value={source} onChange={setSource} placeholder=\"文字列を入力\"/>    \u003crow gap={1} wrap=\"wrap\">      \u003cbutton size=\"xs\" color=\"secondary\" variant=\"outline\" onClick={()=>setSource(\"ABC12345\")}>ABC12345\u003c/button>      \u003cbutton size=\"xs\" color=\"secondary\" variant=\"outline\" onClick={()=>setSource(\"TOK-2026-015\")}>TOK-2026-015\u003c/button>      \u003cbutton size=\"xs\" color=\"secondary\" variant=\"outline\" onClick={()=>setSource(\"和歌山営業所\")}>和歌山営業所\u003c/button>    \u003c/row>  \u003c/box>  \u003cbox gap={1}>    \u003clabel>② 使用する関数\u003c/label>    \u003cradio-group direction=\"col\" value={fn} onChange={setFn}>      \u003cradio value=\"LEFT\">LEFT：左から取り出す\u003c/radio>      \u003cradio value=\"RIGHT\">RIGHT：右から取り出す\u003c/radio>      \u003cradio value=\"MID\">MID：指定した位置から取り出す\u003c/radio>    \u003c/radio-group>  \u003c/box>  {#if fn===\"MID\"}    \u003cbox gap={1}>      \u003crow align=\"center\" justify=\"between\">        \u003clabel>③ 開始位置\u003c/label>        \u003ctext weight=\"medium\">{start}文字目\u003c/text>      \u003c/row>      \u003cslider min={1} max={Math.max(1,chars.length+2)} value={Math.min(start,Math.max(1,chars.length+2))} onChange={setStart}/>    \u003c/box>  {/if}  \u003cbox gap={1}>    \u003crow align=\"center\" justify=\"between\">      \u003clabel>{fn===\"MID\"?\"④\":\"③\"} 取り出す文字数\u003c/label>      \u003ctext weight=\"medium\">{count}文字\u003c/text>    \u003c/row>    \u003cslider min={0} max={Math.max(1,chars.length+2)} value={Math.min(count,Math.max(1,chars.length+2))} onChange={setCount}/>  \u003c/box>  \u003cbox gap={2}>    \u003ctext color=\"secondary\" size=\"xs\">文字の位置と切り出し範囲\u003c/text>    \u003crow gap=\"3px\" wrap=\"wrap\">      {#each chars as ch,i}        \u003cbox key={i} width=\"34px\" align=\"center\" gap={1}>          \u003ctext color=\"secondary\" size=\"3xs\">{i+1}\u003c/text>          \u003cbox width=\"34px\" height=\"36px\" radius=\"sm\" border={{size:1,color:(fn===\"LEFT\"?i\u003ccount:fn===\"RIGHT\"?i>=chars.length-count:i>=start-1&&i\u003cstart-1+count)?\"success\":\"subtle\"}} background={(fn===\"LEFT\"?i\u003ccount:fn===\"RIGHT\"?i>=chars.length-count:i>=start-1&&i\u003cstart-1+count)?\"rgba(22,163,74,0.14)\":\"surface-secondary\"} align=\"center\" justify=\"center\">            \u003ctext weight=\"medium\" size=\"sm\">{ch===\" \"?\"␣\":ch}\u003c/text>          \u003c/box>        \u003c/box>      {/each}    \u003c/row>  \u003c/box>  \u003cbox background=\"surface-secondary\" radius=\"lg\" padding={3} gap={2}>    \u003ctext color=\"secondary\" size=\"xs\">Excelの数式\u003c/text>    \u003crow justify=\"between\" align=\"center\" wrap=\"wrap\">      \u003ctext weight=\"medium\">{formula}\u003c/text>      \u003cbutton size=\"xs\" color=\"secondary\" variant=\"outline\" onClick={()=>GenUI.copy(formula)}>\u003cicon name=\"copy\" size=\"xs\"/> コピー\u003c/button>    \u003c/row>    \u003cdivider color=\"subtle\"/>    \u003ctext color=\"secondary\" size=\"xs\">切り出した結果\u003c/text>    \u003ctitle color=\"success\" size=\"2xl\">{output||\"（空文字列）\"}\u003c/title>    \u003ccaption>{fn===\"LEFT\"?\"左端から\"+count+\"文字を取得します。\":fn===\"RIGHT\"?\"右端から\"+count+\"文字を取得します。\":\"左から\"+start+\"文字目を開始位置として、\"+count+\"文字を取得します。\"}\u003c/caption>  \u003c/box>  \u003cbutton block color=\"secondary\" variant=\"outline\" onClick={()=>{setSource(\"ABC12345\");setFn(\"LEFT\");setStart(4);setCount(3)}}>初期値に戻す\u003c/button>\u003c/box>「先輩、特にMIDを選んで、開始位置と文字数をそれぞれ変えてみてください。どちらを変えるかで結果が違うのが分かるはずです。」### 実務例①：伝票番号から部署コードを取り出す例えば、伝票番号が `ACC-2026-001` という形式なら、結果は `ACC` です。「先頭3文字が部署コードというルールなら、伝票番号から部署を分類できますね。」### 実務例②：口座番号の末尾だけを表示する例えば、A2に文字列として `1234567` が入力されている場合、結果は `4567` です。「ただし、LEFT・RIGHT・MIDは取り出した結果を文字列として返します。数字に見えても、数値とは限りません。」### 実務例③：商品コードの年度を取り出すA2に `TOK-2026-015` がある場合、結果は `2026` です。「ただし、この結果は文字列です。数値として計算したい場合は、VALUE関数などで変換できます。」「こうすると、文字列の『2026』を数値の2026に変換できます。」### 注意：文字数は半角・全角で変わる？「先輩、ここも押さえておきましょう。」LEFT・RIGHT・MIDでは、通常、全角の日本語も半角英数字もそれぞれ1文字として数えます。例えば、結果は **和歌** です。「全角だから2文字分と数えるわけではありません。バイト数を基準に扱うLEFTB・RIGHTB・MIDBとは区別してくださいね。」また、これらの関数は文字列を取り出すので、日付や数値の表示形式までそのまま維持するとは限りません。## 理解確認：3問{@body const qs=[{q:'=LEFT(\"ABCDEFG\",3) の結果は？',opts:[\"ABC\",\"EFG\",\"CDE\"],a:0,ex:\"LEFTは左端から指定した文字数を取得します。左から3文字なのでABCです。\"},{q:'=RIGHT(\"ABC12345\",4) の結果は？',opts:[\"ABC1\",\"2345\",\"5432\"],a:1,ex:\"RIGHTは右端から4文字を取得します。文字の並び順は逆になりません。\"},{q:'=MID(\"ABCDEFG\",3,2) の結果は？',opts:[\"ABC\",\"CD\",\"DE\"],a:1,ex:\"3文字目のCから2文字を取り出すため、CDです。開始位置と文字数を区別しましょう。\"}]}{@body const [answers,setAnswers]=DIL.useState({})}\u003cbox border radius=\"lg\" padding={3} gap={3}>  {#each qs as q,i}    \u003cbox key={i} gap={2}>      **Q{i+1}. {q.q}**      \u003cradio-group direction=\"col\" value={answers[i]===undefined?\"\":String(answers[i])} onChange={v=>setAnswers(p=>({...p,[i]:Number(v)}))}>        {#each q.opts as opt,j}          \u003cradio value={String(j)}>{opt}\u003c/radio>        {/each}      \u003c/radio-group>      {#if answers[i]!==undefined}        \u003cbox background=\"surface-secondary\" padding={2} radius=\"md\" gap={1}>          \u003crow align=\"center\" gap={2}>            \u003cicon name={answers[i]===q.a?\"check-circle\":\"x-circle\"} color={answers[i]===q.a?\"success\":\"danger\"}/>            **{answers[i]===q.a?\"正解です！\":\"不正解です\"}**          \u003c/row>          \u003ctext size=\"sm\">正解：{q.opts[q.a]}。{q.ex}\u003c/text>        \u003c/box>      {/if}    \u003c/box>    {#if i\u003c2}\u003cdivider color=\"subtle\"/>{/if}  {/each}  \u003crow align=\"center\" justify=\"between\">    \u003ctext color=\"secondary\" size=\"sm\">正解数：{qs.filter((q,i)=>answers[i]===q.a).length} / 3\u003c/text>    \u003cbutton size=\"sm\" color=\"secondary\" variant=\"outline\" onClick={()=>setAnswers({})}>再挑戦\u003c/button>  \u003c/row>\u003c/box>## 30秒復習「先輩、最後に重要な6つを整理します。」1. **LEFTとは？** 左端から指定した文字数を取り出す関数。2. **RIGHTとは？** 右端から指定した文字数を取り出す関数。3. **MIDとは？** 指定した開始位置から、指定した文字数を取り出す関数。4. **基本構造は？** `LEFT(文字列,文字数)`、`RIGHT(文字列,文字数)`、`MID(文字列,開始位置,文字数)`。5. **具体例は？** 商品コードから地域コード・年度・商品番号を切り出す。6. **間違えやすいところは？** MIDの開始位置と文字数、区切り記号も1文字として数えること、結果が文字列になること。## 一文記憶**LEFTは左、RIGHTは右、MIDは途中から、指定した文字数を切り出す関数。**「先輩、これでVLOOKUP、XLOOKUP、IF、SUMIF、IFERROR、COUNTAに続いて、LEFT・RIGHT・MIDの3つも学習しましたね。」「今回は3つを別々に丸暗記する必要はありません。**どこから取り出すか**という共通の仕組みで理解しておけば、実際にExcelで使うときにも迷いにくくなりますよ。」","sections":{"A":"\u003ch1>⑦ LEFT・RIGHT・MID関数\u003c/h1>\n\u003cp class=\"muted\">Excel関数｜文字列操作｜文字の切り出し\u003c/p>\u003cp>「先輩、今回は3つまとめて覚えましょう。LEFT、RIGHT、MIDですね。」\u003c/p>\n\u003cp>「名前は違いますけど、実はどれも\u003cstrong>文字列の一部分を取り出す関数\u003c/strong>なんです。違うのは、どこから取り出すかだけですよ。」\u003c/p>\n\u003ch2>A｜要点：3つの関数の違い\u003c/h2>\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>関数\u003c/th>\n\u003cth>取り出す位置\u003c/th>\n\u003cth>結果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>LEFT\u003c/td>\n\u003ctd>左から3文字\u003c/td>\n\u003ctd>ABC\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RIGHT\u003c/td>\n\u003ctd>右から3文字\u003c/td>\n\u003ctd>EFG\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MID\u003c/td>\n\u003ctd>左から3文字目を起点に3文字\u003c/td>\n\u003ctd>CDE\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>「つまり、\u003cstrong>LEFTは左端、RIGHTは右端、MIDは途中\u003c/strong>。まずはこれを覚えれば大丈夫です。」\u003c/p>\n","B":"\u003ch2>B｜詳しい解説：それぞれの仕組み\u003c/h2>\u003ch3>1. LEFT関数\u003c/h3>\n\u003cp>「先輩、LEFTは英語で『左』ですね。だから、文字列の左側から指定した文字数だけ取り出します。」\u003c/p>\n\u003cp>例えば、A2に「ABC12345」が入っているとします。\u003c/p>\n\u003cp>結果は \u003cstrong>ABC\u003c/strong> です。\u003c/p>\n\u003cp>「左から3文字を取り出すので、A、B、Cになります。4文字目以降は含まれません。」\u003c/p>\n\u003ch3>2. RIGHT関数\u003c/h3>\n\u003cp>「RIGHTは『右』です。こちらは右端から指定した文字数を取り出します。」\u003c/p>\n\u003cp>同じくA2に「ABC12345」がある場合、\u003c/p>\n\u003cp>結果は \u003cstrong>12345\u003c/strong> です。\u003c/p>\n\u003cp>「RIGHTは右から数えますけど、結果の文字の並び順が逆になるわけではありません。『54321』ではなく『12345』ですからね。」\u003c/p>\n\u003ch3>3. MID関数\u003c/h3>\n\u003cp>「さて先輩、ここが今回の本題です。MIDは途中から文字を取り出す関数ですが、LEFTやRIGHTより引数が1つ多いんです。」\u003c/p>\n\u003cp>例えば、\u003c/p>\n\u003cp>結果は \u003cstrong>CDE\u003c/strong> です。\u003c/p>\n\u003cp>「どうしてCDEになるのか、順番に考えましょう。」\u003c/p>\n\u003cp>「先輩、MIDで特に間違えやすいのは、\u003cstrong>開始位置と文字数を混同すること\u003c/strong>です。」\u003c/p>\n\u003cp>\u003ccode>=MID(&quot;ABCDEFG&quot;,3,3)\u003c/code> の2つの3は、それぞれ別の意味なんです。\u003c/p>\n\u003cp>最初の3は「3文字目から」、次の3は「3文字分」です。\u003c/p>\n\u003ch3>4. 省略できる引数の違い\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>関数\u003c/th>\n\u003cth>文字数を省略した場合\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>LEFT\u003c/td>\n\u003ctd>左から1文字\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RIGHT\u003c/td>\n\u003ctd>右から1文字\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MID\u003c/td>\n\u003ctd>省略できない\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>例えば、\u003ccode>=LEFT(&quot;ABC&quot;)\u003c/code>ならA、\u003ccode>=RIGHT(&quot;ABC&quot;)\u003c/code>ならCが返ります。\u003c/p>\n\u003cp>「MIDだけは、開始位置と文字数の両方を指定してくださいね。」\u003c/p>\n","C":"\u003ch2>C｜イメージ理解：長い商品コードを切り分ける\u003c/h2>\u003cp>「先輩、例えば会社で商品コードを管理するとしましょう。」\u003c/p>\n\u003cp>商品コードが \u003ccode>TOK-2026-015\u003c/code> という形式だったとします。\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>TOK\u003c/code>：地域コード\u003c/li>\n\u003cli>\u003ccode>2026\u003c/code>：登録年\u003c/li>\n\u003cli>\u003ccode>015\u003c/code>：商品番号\u003c/li>\n\u003c/ul>\n\u003cp>「こういう文字列から必要な部分だけを取り出したいときに、3つの関数が役立つんです。」\u003c/p>\n\u003cp>A2に商品コードが入力されている場合、数式はこうなります。\u003c/p>\n\u003cp>結果：\u003ccode>TOK\u003c/code>\u003c/p>\n\u003cp>結果：\u003ccode>2026\u003c/code>\u003c/p>\n\u003cp>結果：\u003ccode>015\u003c/code>\u003c/p>\n\u003cp>「先輩、MIDの開始位置が5なのは、ハイフンも1文字として数えるからです。Tが1文字目、Oが2文字目、Kが3文字目、ハイフンが4文字目、2が5文字目ですね。」\u003c/p>\n\u003cp>「ただし、これは商品コードの形式が一定の場合に有効です。区切りの位置が毎回変わるなら、TEXTBEFOREやTEXTAFTERなどの関数も検討します。」\u003c/p>\n","D":"\u003ch2>D｜具体例：文字を切り出してみましょう\u003c/h2>\u003cp>「では先輩、実際に文字数や開始位置を変更して、3つの関数の動きを確かめてみましょう。」\u003c/p>\n\u003cp>「先輩、特にMIDを選んで、開始位置と文字数をそれぞれ変えてみてください。どちらを変えるかで結果が違うのが分かるはずです。」\u003c/p>\n\u003ch3>実務例①：伝票番号から部署コードを取り出す\u003c/h3>\n\u003cp>例えば、伝票番号が \u003ccode>ACC-2026-001\u003c/code> という形式なら、\u003c/p>\n\u003cp>結果は \u003ccode>ACC\u003c/code> です。\u003c/p>\n\u003cp>「先頭3文字が部署コードというルールなら、伝票番号から部署を分類できますね。」\u003c/p>\n\u003ch3>実務例②：口座番号の末尾だけを表示する\u003c/h3>\n\u003cp>例えば、A2に文字列として \u003ccode>1234567\u003c/code> が入力されている場合、\u003c/p>\n\u003cp>結果は \u003ccode>4567\u003c/code> です。\u003c/p>\n\u003cp>「ただし、LEFT・RIGHT・MIDは取り出した結果を文字列として返します。数字に見えても、数値とは限りません。」\u003c/p>\n\u003ch3>実務例③：商品コードの年度を取り出す\u003c/h3>\n\u003cp>A2に \u003ccode>TOK-2026-015\u003c/code> がある場合、\u003c/p>\n\u003cp>結果は \u003ccode>2026\u003c/code> です。\u003c/p>\n\u003cp>「ただし、この結果は文字列です。数値として計算したい場合は、VALUE関数などで変換できます。」\u003c/p>\n\u003cp>「こうすると、文字列の『2026』を数値の2026に変換できます。」\u003c/p>\n\u003ch3>注意：文字数は半角・全角で変わる？\u003c/h3>\n\u003cp>「先輩、ここも押さえておきましょう。」\u003c/p>\n\u003cp>LEFT・RIGHT・MIDでは、通常、全角の日本語も半角英数字もそれぞれ1文字として数えます。\u003c/p>\n\u003cp>例えば、\u003c/p>\n\u003cp>結果は \u003cstrong>和歌\u003c/strong> です。\u003c/p>\n\u003cp>「全角だから2文字分と数えるわけではありません。バイト数を基準に扱うLEFTB・RIGHTB・MIDBとは区別してくださいね。」\u003c/p>\n\u003cp>また、これらの関数は文字列を取り出すので、日付や数値の表示形式までそのまま維持するとは限りません。\u003c/p>\n","その他":"\u003ch2>理解確認：3問\u003c/h2>\u003ch2>30秒復習\u003c/h2>\u003cp>「先輩、最後に重要な6つを整理します。」\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>LEFTとは？\u003c/strong> 左端から指定した文字数を取り出す関数。\u003c/li>\n\u003cli>\u003cstrong>RIGHTとは？\u003c/strong> 右端から指定した文字数を取り出す関数。\u003c/li>\n\u003cli>\u003cstrong>MIDとは？\u003c/strong> 指定した開始位置から、指定した文字数を取り出す関数。\u003c/li>\n\u003cli>\u003cstrong>基本構造は？\u003c/strong> \u003ccode>LEFT(文字列,文字数)\u003c/code>、\u003ccode>RIGHT(文字列,文字数)\u003c/code>、\u003ccode>MID(文字列,開始位置,文字数)\u003c/code>。\u003c/li>\n\u003cli>\u003cstrong>具体例は？\u003c/strong> 商品コードから地域コード・年度・商品番号を切り出す。\u003c/li>\n\u003cli>\u003cstrong>間違えやすいところは？\u003c/strong> MIDの開始位置と文字数、区切り記号も1文字として数えること、結果が文字列になること。\u003c/li>\n\u003c/ol>\n\u003ch2>一文記憶\u003c/h2>\u003cp>\u003cstrong>LEFTは左、RIGHTは右、MIDは途中から、指定した文字数を切り出す関数。\u003c/strong>\u003c/p>\n\u003cp>「先輩、これでVLOOKUP、XLOOKUP、IF、SUMIF、IFERROR、COUNTAに続いて、LEFT・RIGHT・MIDの3つも学習しましたね。」\u003c/p>\n\u003cp>「今回は3つを別々に丸暗記する必要はありません。\u003cstrong>どこから取り出すか\u003c/strong>という共通の仕組みで理解しておけば、実際にExcelで使うときにも迷いにくくなりますよ。」\u003c/p>\n"},"prose":["# ⑦ LEFT・RIGHT・MID関数","Excel関数｜文字列操作｜文字の切り出し","「先輩、今回は3つまとめて覚えましょう。LEFT、RIGHT、MIDですね。」","「名前は違いますけど、実はどれも**文字列の一部分を取り出す関数**なんです。違うのは、どこから取り出すかだけですよ。」","## A｜要点：3つの関数の違い","| 関数 | 取り出す位置 | 結果 |\n|---|---|---|\n| LEFT | 左から3文字 | ABC |\n| RIGHT | 右から3文字 | EFG |\n| MID | 左から3文字目を起点に3文字 | CDE |","「つまり、**LEFTは左端、RIGHTは右端、MIDは途中**。まずはこれを覚えれば大丈夫です。」","## B｜詳しい解説：それぞれの仕組み","### 1. LEFT関数","「先輩、LEFTは英語で『左』ですね。だから、文字列の左側から指定した文字数だけ取り出します。」","例えば、A2に「ABC12345」が入っているとします。","結果は **ABC** です。","「左から3文字を取り出すので、A、B、Cになります。4文字目以降は含まれません。」","### 2. RIGHT関数","「RIGHTは『右』です。こちらは右端から指定した文字数を取り出します。」","同じくA2に「ABC12345」がある場合、","結果は **12345** です。","「RIGHTは右から数えますけど、結果の文字の並び順が逆になるわけではありません。『54321』ではなく『12345』ですからね。」","### 3. MID関数","「さて先輩、ここが今回の本題です。MIDは途中から文字を取り出す関数ですが、LEFTやRIGHTより引数が1つ多いんです。」","例えば、","結果は **CDE** です。","「どうしてCDEになるのか、順番に考えましょう。」","「先輩、MIDで特に間違えやすいのは、**開始位置と文字数を混同すること**です。」","`=MID(\"ABCDEFG\",3,3)` の2つの3は、それぞれ別の意味なんです。","最初の3は「3文字目から」、次の3は「3文字分」です。","### 4. 省略できる引数の違い","| 関数 | 文字数を省略した場合 |\n|---|---|\n| LEFT | 左から1文字 |\n| RIGHT | 右から1文字 |\n| MID | 省略できない |","例えば、`=LEFT(\"ABC\")`ならA、`=RIGHT(\"ABC\")`ならCが返ります。","「MIDだけは、開始位置と文字数の両方を指定してくださいね。」","## C｜イメージ理解：長い商品コードを切り分ける","「先輩、例えば会社で商品コードを管理するとしましょう。」","商品コードが `TOK-2026-015` という形式だったとします。","- `TOK`：地域コード\n- `2026`：登録年\n- `015`：商品番号","「こういう文字列から必要な部分だけを取り出したいときに、3つの関数が役立つんです。」","A2に商品コードが入力されている場合、数式はこうなります。","結果：`TOK`","結果：`2026`","結果：`015`","「先輩、MIDの開始位置が5なのは、ハイフンも1文字として数えるからです。Tが1文字目、Oが2文字目、Kが3文字目、ハイフンが4文字目、2が5文字目ですね。」","「ただし、これは商品コードの形式が一定の場合に有効です。区切りの位置が毎回変わるなら、TEXTBEFOREやTEXTAFTERなどの関数も検討します。」","## D｜具体例：文字を切り出してみましょう","「では先輩、実際に文字数や開始位置を変更して、3つの関数の動きを確かめてみましょう。」","「先輩、特にMIDを選んで、開始位置と文字数をそれぞれ変えてみてください。どちらを変えるかで結果が違うのが分かるはずです。」","### 実務例①：伝票番号から部署コードを取り出す","例えば、伝票番号が `ACC-2026-001` という形式なら、","結果は `ACC` です。","「先頭3文字が部署コードというルールなら、伝票番号から部署を分類できますね。」","### 実務例②：口座番号の末尾だけを表示する","例えば、A2に文字列として `1234567` が入力されている場合、","結果は `4567` です。","「ただし、LEFT・RIGHT・MIDは取り出した結果を文字列として返します。数字に見えても、数値とは限りません。」","### 実務例③：商品コードの年度を取り出す","A2に `TOK-2026-015` がある場合、","結果は `2026` です。","「ただし、この結果は文字列です。数値として計算したい場合は、VALUE関数などで変換できます。」","「こうすると、文字列の『2026』を数値の2026に変換できます。」","### 注意：文字数は半角・全角で変わる？","「先輩、ここも押さえておきましょう。」","LEFT・RIGHT・MIDでは、通常、全角の日本語も半角英数字もそれぞれ1文字として数えます。","例えば、","結果は **和歌** です。","「全角だから2文字分と数えるわけではありません。バイト数を基準に扱うLEFTB・RIGHTB・MIDBとは区別してくださいね。」","また、これらの関数は文字列を取り出すので、日付や数値の表示形式までそのまま維持するとは限りません。","## 理解確認：3問","## 30秒復習","「先輩、最後に重要な6つを整理します。」","1. **LEFTとは？** 左端から指定した文字数を取り出す関数。\n2. **RIGHTとは？** 右端から指定した文字数を取り出す関数。\n3. **MIDとは？** 指定した開始位置から、指定した文字数を取り出す関数。\n4. **基本構造は？** `LEFT(文字列,文字数)`、`RIGHT(文字列,文字数)`、`MID(文字列,開始位置,文字数)`。\n5. **具体例は？** 商品コードから地域コード・年度・商品番号を切り出す。\n6. **間違えやすいところは？** MIDの開始位置と文字数、区切り記号も1文字として数えること、結果が文字列になること。","## 一文記憶","**LEFTは左、RIGHTは右、MIDは途中から、指定した文字数を切り出す関数。**","「先輩、これでVLOOKUP、XLOOKUP、IF、SUMIF、IFERROR、COUNTAに続いて、LEFT・RIGHT・MIDの3つも学習しましたね。」","「今回は3つを別々に丸暗記する必要はありません。**どこから取り出すか**という共通の仕組みで理解しておけば、実際にExcelで使うときにも迷いにくくなりますよ。」"],"quizzes":[{"q":"=LEFT(\"ABCDEFG\",3) の結果は？","options":["ABC","EFG","CDE"],"correct":0,"explain":"LEFTは左端から指定した文字数を取得します。左から3文字なのでABCです。"},{"q":"=RIGHT(\"ABC12345\",4) の結果は？","options":["ABC1","2345","5432"],"correct":1,"explain":"RIGHTは右端から4文字を取得します。文字の並び順は逆になりません。"},{"q":"=MID(\"ABCDEFG\",3,2) の結果は？","options":["ABC","CD","DE"],"correct":1,"explain":"3文字目のCから2文字を取り出すため、CDです。開始位置と文字数を区別しましょう。"}]},{"name":"SUBTOTAL","original":"\u003cp># ⑧ SUBTOTAL関数（サブトータル関数）\u003c/p>\u003cp>&lt;text color=\"secondary\" size=\"sm\"&gt;Excel関数｜集計・小計｜フィルター・非表示行への対応&lt;/text&gt;\u003c/p>\u003cp>「先輩、今回はSUBTOTAL関数ですね。これは、SUM関数との違いを理解すると一気に使いやすくなりますよ。」\u003c/p>\u003cp>「例えば、Excelで売上一覧にフィルターをかけて、営業部のデータだけを表示したとします。ここで、**画面に表示されている営業部の売上だけを合計したい**場合、どうすればいいでしょう？」\u003c/p>\u003cp>「そんなときに役立つのがSUBTOTAL関数です。」\u003c/p>\u003cp>## A｜要点：SUBTOTAL関数とは？\u003c/p>\u003cp>**SUBTOTAL関数は、合計・平均・件数などの集計を行い、フィルターで除外された行を集計対象から外せる関数です。**\u003c/p>\u003cp>&lt;box border radius=\"lg\" padding={3} gap={3}&gt;\u003cbr>  **売上一覧の例**\u003c/p>\u003cp>  | 部署 | 売上 |\u003cbr>  |---|---:|\u003cbr>  | 営業部 | 10万円 |\u003cbr>  | 総務部 | 20万円 |\u003cbr>  | 営業部 | 15万円 |\u003cbr>  | 経理部 | 30万円 |\u003cbr>  | 営業部 | 5万円 |\u003c/p>\u003cp>  &lt;grid columns={2} gap={2}&gt;\u003cbr>    &lt;grid-item&gt;\u003cbr>      &lt;box background=\"surface-secondary\" radius=\"lg\" padding={3} gap={1}&gt;\u003cbr>        &lt;text color=\"secondary\" size=\"xs\"&gt;SUM関数&lt;/text&gt;\u003cbr>        &lt;title size=\"xl\" tabularNums&gt;80万円&lt;/title&gt;\u003cbr>        &lt;caption&gt;非表示行も含めて合計&lt;/caption&gt;\u003cbr>      &lt;/box&gt;\u003cbr>    &lt;/grid-item&gt;\u003cbr>    &lt;grid-item&gt;\u003cbr>      &lt;box background=\"rgba(22,163,74,0.08)\" radius=\"lg\" padding={3} gap={1}&gt;\u003cbr>        &lt;text color=\"secondary\" size=\"xs\"&gt;SUBTOTAL関数&lt;/text&gt;\u003cbr>        &lt;title color=\"success\" size=\"xl\" tabularNums&gt;30万円&lt;/title&gt;\u003cbr>        &lt;caption&gt;営業部だけをフィルター表示した場合&lt;/caption&gt;\u003cbr>      &lt;/box&gt;\u003cbr>    &lt;/grid-item&gt;\u003cbr>  &lt;/grid&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>「SUM関数は、フィルターで行が隠れても基本的にすべての数値を合計します。一方、SUBTOTALはフィルターで除外された行を集計しません。」\u003c/p>\u003cp>「ただし先輩、**手動で非表示にした行を除外するかどうかは、SUBTOTALの指定方法によって変わります。** ここが今回の重要ポイントです。」\u003c/p>\u003cp>## B｜詳しい解説：SUBTOTALの仕組み\u003c/p>\u003cp>### 1. 基本の書き方\u003c/p>\u003cp>| 引数 | 意味 |\u003cbr>|---|---|\u003cbr>| 集計方法 | 合計・平均・件数など、何を計算するか |\u003cbr>| 参照1 | 集計するセル範囲 |\u003cbr>| 参照2以降 | 必要に応じて追加する集計範囲 |\u003c/p>\u003cp>「先輩、SUMIFは『条件範囲・条件・合計範囲』でしたよね。でもSUBTOTALは、最初に**どんな集計をするかを番号で指定する**んです。」\u003c/p>\u003cp>例えば、\u003c/p>\u003cp>これはB2:B6の数値を合計します。\u003c/p>\u003cp>「この9がSUM、つまり合計を意味しています。」\u003c/p>\u003cp>### 2. 集計方法の番号\u003c/p>\u003cp>「SUBTOTALは合計だけの関数ではありません。番号を変えると、平均や件数も計算できます。」\u003c/p>\u003cp>| 集計内容 | 番号 | 番号 |\u003cbr>|---|---:|---:|\u003cbr>| AVERAGE（平均） | 1 | 101 |\u003cbr>| COUNT（数値の件数） | 2 | 102 |\u003cbr>| COUNTA（空白以外の件数） | 3 | 103 |\u003cbr>| MAX（最大値） | 4 | 104 |\u003cbr>| MIN（最小値） | 5 | 105 |\u003cbr>| PRODUCT（積） | 6 | 106 |\u003cbr>| STDEV.S（標本標準偏差） | 7 | 107 |\u003cbr>| STDEV.P（母標準偏差） | 8 | 108 |\u003cbr>| SUM（合計） | 9 | 109 |\u003cbr>| VAR.S（標本分散） | 10 | 110 |\u003cbr>| VAR.P（母分散） | 11 | 111 |\u003c/p>\u003cp>「では先輩、なぜ同じ集計に9と109のような2種類の番号があるのでしょう？」\u003c/p>\u003cp>### 3. 9と109の違いが最重要\u003c/p>\u003cp>&lt;box border radius=\"lg\" padding={3} gap={3}&gt;\u003cbr>  &lt;grid columns={2} gap={2}&gt;\u003cbr>    &lt;grid-item&gt;\u003cbr>      &lt;box border radius=\"md\" padding={3} gap={1}&gt;\u003cbr>        &lt;title size=\"xl\"&gt;9&lt;/title&gt;\u003cbr>        **SUM**\u003c/p>\u003cp>        &lt;text size=\"sm\"&gt;フィルターで除外された行は除く。手動で非表示にした行は含める。&lt;/text&gt;\u003cbr>      &lt;/box&gt;\u003cbr>    &lt;/grid-item&gt;\u003cbr>    &lt;grid-item&gt;\u003cbr>      &lt;box border radius=\"md\" padding={3} gap={1}&gt;\u003cbr>        &lt;title size=\"xl\" color=\"success\"&gt;109&lt;/title&gt;\u003cbr>        **SUM**\u003c/p>\u003cp>        &lt;text size=\"sm\"&gt;フィルターで除外された行も、手動で非表示にした行も除く。&lt;/text&gt;\u003cbr>      &lt;/box&gt;\u003cbr>    &lt;/grid-item&gt;\u003cbr>  &lt;/grid&gt;\u003cbr>  &lt;text size=\"sm\" color=\"secondary\"&gt;※ どちらも、フィルターで除外された行は集計しません。&lt;/text&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>「ここを整理しましょう。」\u003c/p>\u003cp>| 行の状態 | SUM | SUBTOTAL(9) | SUBTOTAL(109) |\u003cbr>|---|---|---|---|\u003cbr>| 表示中 | 含む | 含む | 含む |\u003cbr>| フィルターで除外 | 含む | 除外 | 除外 |\u003cbr>| 手動で非表示 | 含む | 含む | 除外 |\u003c/p>\u003cp>「つまり、**表示されている行だけを合計したいなら109**、と覚えると便利です。」\u003c/p>\u003cp>### 4. SUBTOTALのもう一つの特徴\u003c/p>\u003cp>「先輩、実はSUBTOTALには、もう一つ便利な仕組みがあります。」\u003c/p>\u003cp>**参照範囲内に別のSUBTOTAL関数がある場合、そのSUBTOTALの結果は二重集計されません。**\u003c/p>\u003cp>例えば、各部署の小計をSUBTOTALで求め、その下に全体の集計を置いた場合です。\u003c/p>\u003cp>「普通のSUMだと、小計と元データを両方足してしまうことがありますよね。SUBTOTALは、そのような二重計算を避けられるんです。」\u003c/p>\u003cp>ただし、通常のSUM関数で作った小計は自動的には除外されません。\u003c/p>\u003cp>## C｜イメージ理解：フィルター付きのレジ\u003c/p>\u003cp>「先輩、SUBTOTALは、商品一覧から今見えている商品だけを集計するレジのようなものです。」\u003c/p>\u003cp>&lt;box border radius=\"lg\" padding={3} gap={2}&gt;\u003cbr>  &lt;svg viewBox=\"0 0 330 208\" width=\"100%\"&gt;\u003cbr>    {#each [{label:\"営業部\",amount:\"10万円\",show:true},{label:\"総務部\",amount:\"20万円\",show:false},{label:\"営業部\",amount:\"15万円\",show:true},{label:\"経理部\",amount:\"30万円\",show:false},{label:\"営業部\",amount:\"5万円\",show:true}] as r,i}\u003cbr>      &lt;rect x=\"10\" y={8+i*32} width=\"310\" height=\"28\" rx=\"5\" fill={r.show?\"#16a34a\":\"#64748b\"} fillOpacity={r.show?\".12\":\".07\"} stroke={r.show?\"#16a34a\":\"#94a3b8\"} strokeOpacity={r.show?\"1\":\".4\"}/&gt;\u003cbr>      &lt;text x=\"28\" y={27+i*32} fontSize=\"12\" fill=\"currentColor\" opacity={r.show?\"1\":\".45\"}&gt;{r.label}&lt;/text&gt;\u003cbr>      &lt;text x=\"270\" y={27+i*32} textAnchor=\"end\" fontSize=\"13\" fontWeight={r.show?\"bold\":\"normal\"} fill=\"currentColor\" opacity={r.show?\"1\":\".45\"}&gt;{r.amount}&lt;/text&gt;\u003cbr>      {#if !r.show}\u003cbr>        &lt;path d={`M15 ${22+i*32} H315`} stroke=\"#94a3b8\" strokeOpacity=\".5\" strokeWidth=\"1\"/&gt;\u003cbr>      {/if}\u003cbr>    {/each}\u003cbr>    &lt;rect x=\"86\" y=\"175\" width=\"158\" height=\"30\" rx=\"8\" fill=\"#16a34a\" fillOpacity=\".14\" stroke=\"#16a34a\"/&gt;\u003cbr>    &lt;text x=\"165\" y=\"195\" textAnchor=\"middle\" fontSize=\"15\" fontWeight=\"bold\" fill=\"#16a34a\"&gt;表示分：30万円&lt;/text&gt;\u003cbr>  &lt;/svg&gt;\u003cbr>  &lt;caption&gt;営業部だけをフィルター表示すると、SUBTOTALは営業部の10万円・15万円・5万円を合計します。&lt;/caption&gt;\u003cbr>&lt;/box&gt;\u003c/p>\u003cp>「SUM関数は元の一覧全体を見ていますが、SUBTOTALはフィルターの状態を考慮するんです。」\u003c/p>\u003cp>## D｜具体例：実際に操作してみましょう\u003c/p>\u003cp>「では先輩、フィルターと手動非表示を切り替えて、SUM・SUBTOTAL(9)・SUBTOTAL(109)の違いを確認しましょう。」\u003c/p>\u003cp>{@body const rows=[{dept:\"営業部\",amount:100000},{dept:\"総務部\",amount:200000},{dept:\"営業部\",amount:150000},{dept:\"経理部\",amount:300000},{dept:\"営業部\",amount:50000}]}\u003cbr>{@body const [dept,setDept]=DIL.useState(\"all\")}\u003cbr>{@body const [hidden,setHidden]=DIL.useState([])}\u003cbr>{@body const [method,setMethod]=DIL.useState(\"109\")}\u003cbr>{@body const filtered=rows.map((r,i)=&gt;({...r,i,filtered:dept!==\"all\"&amp;&amp;r.dept!==dept,manual:hidden.includes(i)}))}\u003cbr>{@body const sum=rows.reduce((s,r)=&gt;s+r.amount,0)}\u003cbr>{@body const subtotal9=filtered.filter(r=&gt;!r.filtered).reduce((s,r)=&gt;s+r.amount,0)}\u003cbr>{@body const subtotal109=filtered.filter(r=&gt;!r.filtered&amp;&amp;!r.manual).reduce((s,r)=&gt;s+r.amount,0)}\u003cbr>{@body const current=method===\"9\"?subtotal9:subtotal109}\u003cbr>{@body const money=n=&gt;n.toLocaleString(\"ja-JP\")+\"円\"}\u003cbr>&lt;box border radius=\"xl\" padding={3} gap={3}&gt;\u003cbr>  &lt;row align=\"center\" justify=\"between\"&gt;\u003cbr>
